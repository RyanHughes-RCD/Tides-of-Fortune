:root {
  box-sizing: border-box;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --void: #1b4d6b;
  --ink: #2a1d17;
  --sail: #f4ecd8;
  --sail-2: #e6d8b8;
  --text: #2a1d17;
  --muted: #6b5847;
  --brass: #e0a93b;
  --brass-dk: #a8741f;
  --kelp: #3f7d4f;
  --signal: #c8463c;
  --sea: #3f9fd8;
  --dev: #7a5aa0;
  --hud: rgba(244, 236, 216, 0.94);
  --font: 'Pixeloid Sans', ui-rounded, system-ui, -apple-system, sans-serif;
  --mono: 'Pixeloid Mono', 'Pixeloid Sans', ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --void: #0f2c40; --sail: #24384a; --sail-2: #2f4a60; --text: #f4ecd8; --muted: #b8c4c8;
    --hud: rgba(30, 50, 66, 0.94); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --void: #0f2c40; --sail: #24384a; --sail-2: #2f4a60; --text: #f4ecd8; --muted: #b8c4c8;
  --hud: rgba(30, 50, 66, 0.94); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { background: var(--void); scroll-padding-top: env(safe-area-inset-top, 0px); }
body { background: var(--void); color: var(--text); font-family: var(--font); overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible, input:focus-visible + .track { outline: 3px solid var(--brass); outline-offset: 2px; }

#app { position: fixed; inset: 0; overflow: hidden; overflow: clip; }
#stage { position: absolute; inset: 0; }
#world { display: block; touch-action: none; image-rendering: pixelated; image-rendering: crisp-edges; }

img.px { image-rendering: pixelated; image-rendering: crisp-edges; display: inline-block; vertical-align: middle; height: 18px; width: auto; }
img.px.tiny { height: 14px; }
img.px.mid { height: 24px; }
img.px.big { height: 34px; }

/* ---- top HUD ---- */
.hud-top { position: absolute; top: calc(8px + var(--sat)); left: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 5; }
.res-row { display: flex; gap: 6px; flex-wrap: wrap; pointer-events: auto; }
.res { display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 7px; min-height: 36px; background: var(--hud); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 0 3px 0 var(--ink); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.res.bump { animation: bump .35s steps(3); }
@keyframes bump { 50% { transform: translateY(-3px); } }
#devBanner { pointer-events: none; align-self: flex-start; padding: 3px 10px; font-size: 13px; font-weight: 600; color: #fff; border: 2px solid var(--ink); border-radius: 4px;
  background: repeating-linear-gradient(-45deg, var(--dev) 0 8px, #5d4280 8px 16px); }
.skychip.ships { font-size: 14px; min-height: 32px; padding: 3px 11px 3px 7px; }
.skychip.ships img { height: 18px; }
.skychip.ships.ready { background: var(--brass); color: var(--ink); animation: nudge 1.2s steps(2) infinite; }
.skychip.ships .badge { display: inline-block; min-width: 20px; padding: 0 5px; border-radius: 999px; background: var(--ink); color: var(--sail); font-size: 12px; text-align: center; }
.fl-status.stack { flex-direction: column; align-items: flex-end; gap: 1px; }
.fl-status.stack small { color: var(--muted); font-size: 12px; font-weight: 600; }
.fl-status.stack > span { display: flex; align-items: center; gap: 4px; }
.fl-status.ready small { color: var(--ink); }
.empty-state { text-align: center; padding: 18px 10px; color: var(--muted); }
#cine { position: fixed; inset: 0; pointer-events: none; z-index: 40; display: none; }
body.cinematic #cine { display: block; pointer-events: auto; }
#cine i { position: absolute; left: 0; right: 0; height: 11vh; background: #000; animation: cineIn 1.2s ease-out both; }
#cine i:first-child { top: 0; } #cine i:last-child { bottom: 0; }
@keyframes cineIn { from { height: 0; } }
body.cinematic #nav, body.cinematic #sheet, body.cinematic #toasts { visibility: hidden; }
.rar { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 7px; border: 2px solid var(--ink); border-radius: 999px; }
.rar-common { background: #e3ddd0; color: var(--ink); } .rar-uncommon { background: #9fdc8a; color: var(--ink); }
.rar-rare { background: #8fc0f0; color: var(--ink); } .rar-veryRare { background: #c89af0; color: var(--ink); }
.rar-legendary { background: linear-gradient(90deg, #f2c94c, #f08f2c); color: var(--ink); box-shadow: 0 0 0 1px #fff6c0 inset; }
.hw-head { display: flex; align-items: center; gap: 12px; }
.hw-head .big-n { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
.card.hw { background: linear-gradient(160deg, rgba(255,154,60,.28), rgba(162,90,208,.18) 70%), var(--sail-2); }
.tiers { display: grid; gap: 8px; margin-top: 10px; }
.tier { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px; border: 2px solid var(--ink); border-radius: 10px; background: var(--sail); }
.tier b { font-size: 17px; } .tier small { grid-column: 1 / 3; color: var(--muted); font-size: 13px; line-height: 1.4; }
.tier .btn { margin: 0; min-height: 44px; }
.hw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 8px; }
.hw-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border: 2px solid var(--ink); border-radius: 10px; background: var(--sail); text-align: center; font-size: 13px; }
.hw-item.missing { opacity: .55; } .hw-item.missing img { filter: brightness(0) opacity(.45); }
.hw-item img { height: 40px; } .hw-item b { font-size: 13px; line-height: 1.2; }
.hw-item .btn { margin: 2px 0 0; min-height: 36px; padding: 4px 10px; font-size: 13px; }
.brewbox { display: flex; justify-content: center; gap: 8px; margin: 4px 0 8px; }
.brewbox img { height: 120px; image-rendering: pixelated; }
.brewbox img.px { height: 40px; }
.brewbox.brewing img { animation: brew .25s steps(2) infinite; }
@keyframes brew { 50% { transform: translateY(-3px) rotate(-2deg); } }
.reveal { text-align: center; } .reveal .prize { height: 72px; image-rendering: pixelated; margin: 6px auto; display: block; }
.reveal h2 { margin: 6px 0 4px; }
.offer .m-info span { white-space: normal; }
.batch { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.batch .btn { margin: 0; min-height: 44px; padding: 4px; font-size: 14px; }
.voyage { display: grid; grid-template-columns: auto auto auto; grid-template-rows: auto 4px; column-gap: 8px; row-gap: 3px; align-items: center; padding: 5px 10px; background: var(--hud); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 0 3px 0 var(--ink); font-size: 15px; }
.voyage .px { grid-row: 1 / 3; }
.voyage .v-time { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 4.5em; text-align: right; }
.voyage .v-bar { grid-column: 2 / 4; height: 4px; background: var(--sail-2); border-radius: 2px; overflow: hidden; }
.voyage .v-bar i { display: block; height: 100%; width: 0; background: var(--sea); }
.voyage.ready { background: var(--brass); color: var(--ink); animation: nudge 1.2s steps(2) infinite; }
.voyage.ready .v-bar i { background: var(--kelp); }
@keyframes nudge { 50% { transform: translateY(-2px); } }

/* ---- bottom nav ---- */
.dock-nav { position: absolute; left: 8px; right: 8px; bottom: calc(8px + var(--sab)); display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; z-index: 6; }
.dock-nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 60px; padding: 6px 2px; min-width: 0; background: var(--hud); border: 2px solid var(--ink); border-radius: 8px; box-shadow: 0 4px 0 var(--ink); font-size: 14px; font-weight: 600; }
.dock-nav button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.dock-nav button[aria-pressed="true"] { background: var(--brass); color: var(--ink); }
.dock-nav .ni img { height: 24px; }

/* ---- sheet ---- */
.sheet { position: absolute; left: 8px; right: 8px; bottom: calc(82px + var(--sab)); max-height: calc(100% - 82px - 70px - var(--sat) - var(--sab)); display: flex; flex-direction: column; background: var(--sail); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 5px 0 var(--ink); transform: translateY(calc(100% + 100px)); visibility: hidden; transition: transform .22s cubic-bezier(.2,.8,.2,1), visibility 0s .22s; z-index: 8; }
.sheet.open { transform: translateY(0); visibility: visible; transition: transform .22s cubic-bezier(.2,.8,.2,1); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px 16px; }
.sheet-head h2 { margin: 0; font-size: 24px; font-weight: 700; }
#sheetClose { width: 44px; height: 44px; border: 2px solid var(--ink); border-radius: 8px; background: var(--sail-2); font-size: 18px; font-weight: 700; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 12px 8px; }

.card { background: var(--sail-2); border: 2px solid var(--ink); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.card h3 { margin: 0; font-size: 19px; }
.ship-head { display: flex; align-items: center; gap: 10px; }
.ship-head > div { flex: 1; min-width: 0; }
.ship-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 8px; border: 2px solid var(--ink); border-radius: 999px; white-space: nowrap; }
.pill-idle { background: #cfe8d2; color: var(--ink); }
.pill-away { background: #cfe5f5; color: var(--ink); }
.pill-returned { background: var(--brass); color: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 4px; }
.stats.three { grid-template-columns: repeat(3, 1fr); }
.stats div { background: var(--sail); border-radius: 6px; padding: 6px 4px; text-align: center; }
.stats dt { font-size: 12px; color: var(--muted); }
.stats dd { margin: 0; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.label { margin: 14px 0 6px; font-size: 14px; color: var(--muted); }
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); grid-auto-flow: column; gap: 5px; }
.chip { min-width: 0; padding: 0; min-height: 44px; border: 2px solid var(--ink); border-radius: 8px; background: var(--sail); font-size: 16px; font-weight: 600; }
.chip[aria-checked="true"] { background: var(--sea); color: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
.estimate, .desc, .eta, .upg-delta, .cost { font-size: 15px; line-height: 1.45; margin: 10px 0; }
.warn { font-size: 14px; line-height: 1.4; margin: 8px 0; padding: 8px 10px; border-left: 4px solid var(--signal); background: rgba(200, 70, 60, .12); border-radius: 4px; }
.ok-text { color: var(--kelp); font-weight: 600; margin: 10px 0 0; }
.perk { color: var(--kelp); font-weight: 600; }
.perks { margin: 8px 0 0; padding-left: 18px; font-size: 15px; line-height: 1.5; color: var(--kelp); font-weight: 600; }
.card.decor.owned { border-color: var(--kelp); }
.card.decor.prestige { background: linear-gradient(160deg, rgba(224,169,59,.35), transparent 60%), var(--sail-2); }
.card.flash { animation: flashcard 1.2s steps(4) 1; }
@keyframes flashcard { 0%, 50% { box-shadow: 0 0 0 4px var(--brass); } 100% { box-shadow: none; } }
.note.version { text-align: center; opacity: .8; }
:root[data-theme="dark"] .ok-text { color: #8fd29c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ok-text { color: #8fd29c; } }
.note { font-size: 13px; color: var(--muted); line-height: 1.4; margin: 4px 2px 12px; }
.progress { height: 14px; border: 2px solid var(--ink); border-radius: 4px; background: var(--sail); overflow: hidden; margin-top: 12px; }
.progress i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--sea) 0 6px, #59bde0 6px 12px); }

.btn { display: block; width: 100%; min-height: 50px; margin-top: 10px; padding: 10px 14px; border: 2px solid var(--ink); border-radius: 10px; background: var(--sail); font-size: 17px; font-weight: 700; box-shadow: 0 4px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--brass); color: var(--ink); }
.btn.primary.glow { animation: nudge 1.2s steps(2) infinite; }
.btn.small { min-height: 44px; margin: 0; padding: 6px 8px; font-size: 14px; width: auto; box-shadow: 0 3px 0 var(--ink); }
.btn.dev { background: var(--dev); color: #fff; }
.btn.danger { background: transparent; color: var(--signal); border-color: var(--signal); box-shadow: none; }
.btn:disabled { opacity: .55; cursor: default; }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
.btn-grid .btn { font-size: 15px; }

.mrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 2px dashed rgba(42, 29, 23, .2); }
.mrow:last-child { border-bottom: 0; }
.m-info { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 14px; }
.m-info b { font-size: 17px; }
.m-info span { color: var(--muted); }
.m-btns { display: flex; gap: 6px; }

.pips { display: flex; gap: 6px; margin: 12px 0 0; }
.pips i { width: 26px; height: 10px; border: 2px solid var(--ink); border-radius: 2px; background: var(--sail); }
.pips i.on { background: var(--kelp); }

.devcard { border-style: dashed; }
.devcard.on { border-style: solid; border-color: var(--dev); box-shadow: inset 0 0 0 2px var(--dev); }
.switch { display: flex; gap: 12px; align-items: center; cursor: pointer; font-size: 16px; line-height: 1.35; }
.switch small { color: var(--muted); font-size: 13px; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.track { flex: none; width: 54px; height: 32px; border: 2px solid var(--ink); border-radius: 6px; background: var(--sail); position: relative; }
.knob { position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 3px; background: var(--ink); transition: left .12s steps(3); }
.switch input:checked + .track { background: var(--dev); }
.switch input:checked + .track .knob { left: 24px; background: #fff; }
.tests { list-style: none; padding: 0; margin: 12px 0 0; font-size: 13px; line-height: 1.5; }
.tests .pass::before { content: '■ '; color: var(--kelp); }
.tests .fail::before { content: '■ '; color: var(--signal); }

/* ---- reward modal ---- */
.modal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(15, 30, 45, .55); z-index: 20; padding: 20px; }
.modal[hidden] { display: none; }
.modal-card { width: min(360px, 100%); background: var(--sail); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 6px 0 var(--ink); padding: 18px; animation: pop .25s steps(4); }
@keyframes pop { from { transform: scale(.85); } }
.modal-card h2 { margin: 0; font-size: 26px; }
.modal-card .sub { margin: 2px 0 12px; color: var(--muted); }
.haul { list-style: none; padding: 0; margin: 0 0 8px; }
.haul li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 6px; background: var(--sail-2); border-radius: 8px; font-size: 17px; }
.haul li span { flex: 1; }
.haul li b { font-size: 22px; color: var(--kelp); font-variant-numeric: tabular-nums; }
.haul li.empty { color: var(--muted); }
.ev { margin: 6px 0; font-size: 15px; line-height: 1.4; padding-left: 10px; border-left: 4px solid var(--sea); }
.ev-storm, .ev-full { border-color: var(--signal); }
.ev-rare { border-color: #5bb8c8; font-weight: 600; }

/* ---- toasts ---- */
#toasts { position: absolute; left: 50%; bottom: calc(96px + var(--sab)); transform: translateX(-50%); display: flex; flex-direction: column-reverse; align-items: center; gap: 6px; z-index: 30; pointer-events: none; width: min(92%, 420px); }
.toast { background: var(--ink); color: #f4ecd8; padding: 10px 14px; border-radius: 8px; font-size: 15px; line-height: 1.35; text-align: center; box-shadow: 0 3px 0 rgba(0,0,0,.35); transition: opacity .4s, transform .4s; }
.toast.good { border-left: 5px solid #8fd29c; }
.toast.bad { border-left: 5px solid var(--signal); }
.toast.out { opacity: 0; transform: translateY(-8px); }


/* ---- Village and voyage update ---- */
.hints { list-style: none; margin: 8px 0 0; padding: 8px 10px; border-left: 4px solid var(--sea); background: rgba(63,159,216,.1); border-radius: 4px; font-size: 13px; line-height: 1.45; }
.hints li + li { margin-top: 4px; }
.tide { margin: 10px 0 0; padding: 8px 10px; border: 2px solid var(--brass); border-radius: 8px; background: rgba(224,169,59,.15); font-size: 14px; line-height: 1.4; }
[hidden] { display: none !important; } /* nothing may override hiding (this kept the update prompt stuck on) */
input, textarea, select, button { font-family: var(--font); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; margin: -2px 0 10px; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i, .zdot { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--ink); border-radius: 50%; vertical-align: -1px; margin-right: 4px; }
.z-near { background: #7cc8f0; } .z-outer { background: #2f5fa8; } .z-far { background: #8a5ac8; } .z-home { background: #6aad4a; }
.card.field { border-color: var(--kelp); }

/* ---- Phase 5 ---- */
.skychip.update { background: var(--brass); color: var(--ink); animation: nudge 1.2s steps(2) infinite; }
.slider { display: grid; grid-template-columns: 92px 1fr 34px; align-items: center; gap: 8px; margin: 8px 0; font-size: 15px; }
.slider input { width: 100%; accent-color: var(--sea); min-height: 32px; }
.slider b { text-align: right; font-variant-numeric: tabular-nums; }
#saveCode, #importCode { width: 100%; font: 12px/1.4 var(--mono); padding: 8px; border: 2px solid var(--ink); border-radius: 8px; background: var(--sail); color: var(--text); -webkit-user-select: text; user-select: text; resize: vertical; word-break: break-all; }
.filebtn { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* ---- Phase 4 ---- */
.chartwrap { border: 3px solid var(--ink); border-radius: 10px; overflow: hidden; margin-bottom: 10px; background: #eedfb6; }
#chart { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; image-rendering: pixelated; cursor: pointer; touch-action: manipulation; }
.regions { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.chip.region { flex: none; padding: 4px 10px; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.chip.region small { font-size: 10px; font-weight: 500; }
img.px.chest { height: 26px; }
.shiplog { margin: 8px 0; padding: 8px 10px; border: 2px dashed var(--muted); border-radius: 8px; }
.shiplog h3 { margin: 0 0 4px; font-size: 15px; }
.shiplog ul { margin: 0; padding-left: 16px; font-size: 14px; line-height: 1.4; }
.shiplog .log-kraken { color: #a11d2a; font-style: italic; }
:root[data-theme="dark"] .shiplog .log-kraken { color: #ff8f8f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .shiplog .log-kraken { color: #ff8f8f; } }
.shiplog .log-trophy, .shiplog .log-witch, .shiplog .log-landmark { font-weight: 700; }
.logbook p { margin: 0 0 8px; font-size: 14px; line-height: 1.4; }
.logbook.kraken p { font-style: italic; }
.chestbox { display: grid; place-items: center; padding: 6px 0 4px; }
.chestimg.small { height: 64px; } .chestimg.medium { height: 80px; } .chestimg.large { height: 104px; }
.chestimg.shake { animation: shake .6s steps(6); }
@keyframes shake { 20% { transform: translateX(-3px) rotate(-3deg); } 40% { transform: translateX(3px) rotate(3deg); } 60% { transform: translateX(-2px); } 80% { transform: translateX(2px) translateY(-3px); } }
.chestbox.open .chestimg { animation: pop .3s steps(3); }
.trophy { display: flex; gap: 10px; align-items: center; padding: 10px; margin: 8px 0; border: 3px solid var(--brass); border-radius: 10px; background: rgba(224,169,59,.15); }
.trophy p { margin: 2px 0 0; font-size: 14px; }
.trophy .lore { font-style: italic; color: var(--muted); }

/* ---- Village pass ---- */
.hud-row2 { display: flex; gap: 6px; align-items: center; pointer-events: none; flex-wrap: wrap; }
.skychip { pointer-events: auto; display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 6px; min-height: 28px; font-size: 13px; font-weight: 600; background: var(--hud); border: 2px solid var(--ink); border-radius: 999px; box-shadow: 0 2px 0 var(--ink); }
.place-search { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin-top: 8px; }
.place-search input { min-height: 44px; font: inherit; font-size: 16px; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 8px; background: var(--sail); color: var(--text); -webkit-user-select: text; user-select: text; min-width: 0; }
.place-search .btn { margin: 0; }
#devBanner { pointer-events: none; }

/* ---- Phase 3 ---- */
.dock-nav button { font-size: 12px; }
img.px.b-img { height: 34px; }
img.px.b-img.big { height: 56px; }
h3.group { margin: 14px 2px 6px; font-size: 16px; color: var(--muted); font-weight: 600; }
.builders { display: flex; align-items: center; gap: 6px; font-size: 15px; }
.amt { margin-left: 4px; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt small { font-size: 12px; color: var(--muted); font-weight: 500; }
.amt.full { color: var(--signal); }
.bt { color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; }
.btn-row.three { grid-template-columns: 1fr 1fr 1fr; }
.btn-row.three .btn { width: 100%; }
.rumor { border-color: var(--brass); }
.rumor h3 { display: flex; align-items: center; gap: 8px; }
.type.hot { box-shadow: inset 0 0 0 2px var(--brass); }
.type.hot small { color: inherit; font-weight: 700; }
.supplies { display: flex; gap: 10px; align-items: center; margin: 12px 0 4px; font-size: 15px; line-height: 1.35; cursor: pointer; }
.supplies small { color: var(--muted); font-size: 13px; }
.supplies input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.supplies input:checked + .track { background: var(--kelp); }
.supplies input:checked + .track .knob { left: 24px; background: #fff; }
.supplies.off { opacity: .6; cursor: default; }
.placebar { position: absolute; left: 8px; right: 8px; bottom: calc(82px + var(--sab)); z-index: 9; background: var(--sail); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 5px 0 var(--ink); padding: 12px; display: none; }
body.placing .placebar { display: block; }
body.placing .dock-nav { opacity: .4; pointer-events: none; }
.placebar p { margin: 0; }
#placeTitle { font-size: 19px; font-weight: 700; }
#placeHint { font-size: 15px; margin: 4px 0 2px; color: var(--kelp); min-height: 1.4em; }
#placeHint.bad { color: var(--signal); }
@media (min-width: 700px) { .placebar { left: 50%; right: auto; width: 600px; transform: translateX(-50%); } }

/* ---- Phase 2 ---- */
.stats.strip { grid-template-columns: repeat(7, 1fr); gap: 3px; margin: 8px 0 2px; }
.stats.strip div { padding: 4px 1px; }
.stats.strip dt { font-size: 10px; }
.stats.strip dd { font-size: 15px; }
.role { margin: 8px 0 0; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
@media (max-width: 480px) {
  .res-row { gap: 3px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 3px; }
  .res-row::-webkit-scrollbar { display: none; }
  .res { flex: none; gap: 3px; padding: 3px 5px 3px 4px; min-height: 32px; font-size: 13px; border-radius: 5px; box-shadow: 0 2px 0 var(--ink); }
  .res img.px { height: 13px; }
}
img.px.ship-img { height: 34px; }
img.px.ship-img.big { height: 52px; }
.voyage.all { grid-template-columns: auto auto auto; grid-template-rows: auto; }
.voyage.more { grid-template-columns: auto; grid-template-rows: auto; font-size: 14px; }
.fleet-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.fl-row { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--sail-2); border: 2px solid var(--ink); border-radius: 10px; text-align: left; min-height: 60px; }
.fl-row:active { transform: translateY(2px); }
.fl-img { width: 44px; display: grid; place-items: center; flex: none; }
.fl-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.fl-main b { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-main small { font-size: 13px; color: var(--muted); }
.mini-hull { height: 5px; width: 80%; background: var(--sail); border-radius: 3px; overflow: hidden; margin-top: 3px; }
.mini-hull i, .hull i { display: block; height: 100%; background: var(--kelp); }
.mini-hull.mid i, .hull.mid i { background: var(--brass); }
.mini-hull.bad i, .hull.bad i { background: var(--signal); }
.fl-status { font-size: 14px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 4px; }
.fl-status.ready { background: var(--brass); color: var(--ink); padding: 3px 8px; border: 2px solid var(--ink); border-radius: 999px; }
.fl-status.bad { color: var(--signal); }
.back { border: 0; background: none; font-size: 16px; font-weight: 600; padding: 6px 2px 10px; min-height: 44px; }
.hull { position: relative; height: 22px; margin-top: 12px; border: 2px solid var(--ink); border-radius: 5px; background: var(--sail); overflow: hidden; }
.hull span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,.5); z-index: 1; }
.stats.seven { grid-template-columns: repeat(4, 1fr); }
.stats.seven div:nth-child(n+5) { grid-column: span 1; }
.types { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.type { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 8px; background: var(--sail); font-size: 15px; font-weight: 600; text-align: left; position: relative; }
.type[aria-checked="true"] { background: var(--sea); color: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
.type:disabled { opacity: .5; }
.type small { display: block; font-size: 11px; font-weight: 500; line-height: 1.2; }
.type-desc { color: var(--muted); font-size: 14px; margin: 8px 0 10px; }
.estimate.risk { color: var(--muted); margin-top: -4px; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rename label { display: block; font-size: 14px; color: var(--muted); margin: 4px 0; }
.rename input { width: 100%; min-height: 48px; font: inherit; font-size: 18px; padding: 8px 12px; border: 2px solid var(--ink); border-radius: 8px; background: var(--sail); color: var(--text); -webkit-user-select: text; user-select: text; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
.seg button { min-height: 44px; border: 0; background: var(--sail-2); font-size: 16px; font-weight: 600; }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--sail); }
:root[data-theme="dark"] .seg button[aria-selected="true"] { background: var(--sail); color: var(--text); box-shadow: inset 0 0 0 2px var(--brass); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-selected="true"] { background: #f4ecd8; color: #2a1d17; } }
.card.build.locked { opacity: .78; }
.card.build .stats { margin-top: 8px; }
.lock { margin: 10px 0 0; font-size: 14px; padding: 8px 10px; border: 2px dashed var(--muted); border-radius: 8px; color: var(--muted); }
.cost { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.cost-item { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cost-item.short { color: var(--signal); }
.ship-pick { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; margin-bottom: 4px; -webkit-overflow-scrolling: touch; }
.ship-pick button { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 8px; min-width: 76px; border: 2px solid var(--ink); border-radius: 8px; background: var(--sail-2); font-size: 12px; font-weight: 600; }
.ship-pick button[aria-pressed="true"] { background: var(--brass); color: var(--ink); }
.ship-pick span { max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card.upg { padding: 10px 12px; }
.upg-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.upg-top h3 { font-size: 17px; }
.upg-top .desc { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.upg-top .pips { margin: 4px 0 0; flex: none; }
.upg-buy { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
.upg-buy .cost { font-size: 15px; }
/* The card never grows past the visible screen: the reward list scrolls and the button stays in reach.
   (A flex child needs min-height: 0 to shrink and scroll; dvh tracks iOS's moving toolbars.) */
.modal { padding: calc(12px + var(--sat)) 12px calc(12px + var(--sab)); }
.modal-card { display: flex; flex-direction: column; max-height: calc(100vh - 24px - var(--sat) - var(--sab)); max-height: calc(100dvh - 24px - var(--sat) - var(--sab)); }
.modal-card #modalBody { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-right: 2px; }
.modal-card #modalOk { flex: none; margin-top: 10px; }
.evs { max-height: 34vh; overflow-y: auto; }
.ev-win { border-color: var(--kelp); }

#boot { position: absolute; inset: 0; display: grid; place-items: center; background: var(--void); color: #f4ecd8; font-size: 20px; z-index: 50; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (min-width: 700px) {
  .dock-nav { left: 50%; right: auto; transform: translateX(-50%); width: 600px; }
  .sheet { left: 50%; right: auto; width: 600px; transform: translate(-50%, calc(100% + 100px)); }
  .sheet.open { transform: translate(-50%, 0); }
}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="world" aria-label="Your harbor village. Drag to look around, pinch or scroll to zoom, tap boats and buildings."></canvas></div>
  <header class="hud-top">
    <div class="res-row" id="resRow"></div>
    <div class="hud-row2"><button id="shipsBtn" class="skychip ships" aria-label="All ships"></button><button id="skyChip" class="skychip" aria-label="Sky and weather settings"></button><button id="updateBtn" class="skychip update" hidden>New version ready: tap to restart</button><div id="devBanner" hidden></div></div>
  </header>
  <nav class="dock-nav" id="nav">
    <button data-panel="fleet" data-icon="boat" aria-pressed="false"><span class="ni"></span>Fleet</button>
    <button data-panel="map" data-icon="map" aria-pressed="false"><span class="ni"></span>Map</button>
    <button data-panel="village" data-icon="house" aria-pressed="false"><span class="ni"></span>Village</button>
    <button data-panel="market" data-icon="crate" aria-pressed="false"><span class="ni"></span>Stores</button>
    <button data-panel="shipwright" data-icon="hammer" aria-pressed="false"><span class="ni"></span>Yard</button>
    <button data-panel="settings" data-icon="gear" aria-pressed="false"><span class="ni"></span>Options</button>
  </nav>
  <section id="sheet" class="sheet" aria-hidden="true">
    <header class="sheet-head"><h2 id="sheetTitle"></h2><button id="sheetClose" aria-label="Close panel">✕</button></header>
    <div id="sheetBody" class="sheet-body"></div>
  </section>
  <div id="placeBar" class="placebar" role="region" aria-label="Place building">
    <p id="placeTitle"></p><p id="placeHint" aria-live="polite"></p>
    <div class="btn-row"><button class="btn" id="placeCancel">Cancel</button><button class="btn primary" id="placeOk">Build here</button></div>
  </div>
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalBody">
      <div id="modalBody"></div>
      <button class="btn primary" id="modalOk">Stow the catch</button>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="cine" aria-hidden="true"><i></i><i></i></div>
  <div id="boot">Raising the sails…</div>
</div>
<script data-module="core.js">

  // Each year it rises in the harbor on October 31: a countdown in the water from three days before, ten hours
  // of slowly worsening water from 8 AM, then it breaches at 6 PM. Its eight eyes can be struck out one by one;
  // when the last goes it dies and its body floats in the harbor until next year's countdown, lootable once.
  // `start` (set only from developer mode) overrides the date so every stage can be tested.
  const KRAKEN = { eyes: 6, month: 10, day: 31, hour: 8, countdownDays: 3, riseHours: 10, painMs: 3200, deathMs: 10000,
    loot: { coins: 2500, relics: 8, pearls: 12, salvage: 6 } };
  const emptyKraken = () => ({ start: null, cycle: null, breachSeen: false, hits: Array(KRAKEN.eyes).fill(0), deadAt: null, looted: false, lighthouseDown: false });
  function krakenStart(state, now) {
    const k = state.kraken;
    if (k && Number.isFinite(k.start)) return k.start;
    return new Date(new Date(now).getFullYear(), KRAKEN.month - 1, KRAKEN.day, KRAKEN.hour).getTime();
  }
  // Where the event stands at `now`. phase: none | countdown | rising | emerged | dead.
  function krakenView(state, now) {
    const k = state.kraken || emptyKraken(), S = krakenStart(state, now), H = HOUR_MS;
    const v = { start: S, breachAt: S + KRAKEN.riseHours * H, hours: (now - S) / H, hits: k.hits.slice(), deadAt: k.deadAt, looted: k.looted, lighthouseDown: k.lighthouseDown, breachSeen: k.breachSeen };
    v.alive = k.hits.map(h => !h); v.eyesLeft = v.alive.filter(Boolean).length;

    monstersFought: { label: 'Monsters fought', kind: 'count' },
    cropsHarvested: { label: 'Harvests', kind: 'count' },

  // ---------- ships ----------
  function getShip(state, shipId) { return state.ships.find(s => s.id === shipId) || null; }

  function shipStats(ship) {
    const b = SHIP_CLASSES[ship.cls], u = ship.upgrades;
    return {
      name: b.name, tier: b.tier, blurb: b.blurb,
      speed: b.speed + (u.sails || 0),

      combat: b.combat + 3 * (u.cannons || 0),
      cargo: Math.round(b.cargo * (1 + 0.5 * (u.cargoHold || 0))),

      exploration: b.exploration + 2 * (u.scoutTower || 0),

    }

      add(r, 'coins', coins);

  }

  // Phase 4 finds. A separate random stream, so the base haul for a seed never changes.
  function extras(r, st, type, hours, seed, M) {

    if (M.candy > 0) {

    if (Rg.ore && r.items.ironOre) r.items.ironOre = Math.round(r.items.ironOre * Rg.ore);
    // keys: each family's key comes from a different kind of trip
    if (type === 'fishing') for (let h = 0; h < hours; h++) if (rng() < 0.025 * (1 + 0.5 * ring) * Math.min(1, hours - h)) put('sunkenKey', 1);
    if (type === 'combat') for (let i = 0; i < r.wins; i++) if (rng() < 0.3) put('pirateKey', 1);
    if (type === 'exploration') for (let h = 0; h < hours; h++) if (rng() < 0.03 * (1 + 0.5 * ring) * Math.min(1, hours - h)) put('lostKey', 1);
    // chests: only treasure trips find them
    if (type === 'treasure') {
      const p = 0.05 * (1 + 0.4 * ring) * (Rg.chest || 1) * (M.chestMult || 1);
      for (let h = 0; h < hours; h++) if (rng() < p * Math.min(1, hours - h)) {
        const fam = rng() < 0.6 ? Rg.family : FAMILIES[Math.floor(rng() * 3)];
        const u = rng(), big = 0.03 + 0.03 * ring + (hours >= 12 ? 0.03 : 0);
        put(`chest_${fam}_${u < big ? 'large' : u < big + 0.22 + 0.05 * ring ? 'medium' : 'small'}`, 1);
      }
    }
    if (type === 'fishing' && Rg.moonfish) for (let h = 0; h < hours; h++) if (rng() < Rg.moonfish * magicMult * Math.min(1, hours - h)) put('moonfish', 1);
    // ghost ships answer to magic more than to cannons
    if (Rg.ghosts && type === 'combat') {
      let wins = 0;
      for (let i = 0; i < Math.max(1, Math.round(hours / 6)); i++) {
        const E = (9 + ring * 2) * (0.8 + rng() * 0.4);
        const mine = (st.combat * 0.4 + st.magic * 1.6) * (M.charm ? 1.3 : 1) * (0.8 + rng() * 0.4);
        if (mine >= E) { wins++; put('salvage', 1 + Math.floor(rng() * 3)); }
        else { const d = Math.max(1, Math.round(st.hull * 0.2 * st.dmg * r.dm)); r.damage += d; r.events.push({ type: 'storm', text: `A ghost ship raked her with cold green fire (-${d} hull).` }); break; }
      }
      if (wins) r.events.push({ type: 'win', text: `Sent ${wins} ghost ship${wins > 1 ? 's' : ''} back to the deep.` });
      r.ghostWins = wins;
    }
    // sea monsters in the wildest waters
    if (Rg.monsters && rng() < Rg.monsters * Math.min(1.5, Math.max(0.3, hours / 8))) {
      const m = MONSTERS[Math.floor(rng() * MONSTERS.length)];
      const mine = (st.combat + st.magic + st.hull / 20) * (M.charm ? 1.3 : 1) * (0.8 + rng() * 0.4);
      const E = m.power * (0.85 + rng() * 0.3) + ring * 3;
      if (mine >= E) {
        put('essence', 2 + Math.floor(rng() * 3)); put('coins', 200 + Math.floor(rng() * 300));
        r.monster = { name: m.name, won: true };
        if (rng() < 0.2) r.trophy = m.trophy;
        r.events.push({ type: 'win', text: `Drove off ${m.name}!` });
      } else {
        const d = Math.max(1, Math.round(st.hull * 0.4 * st.dmg * r.dm));
        r.damage += d; r.monster = { name: m.name, won: false };
        r.events.push({ type: 'storm', text: `${m.name[0].toUpperCase() + m.name.slice(1)} rose from the deep. She escaped, badly hurt (-${d} hull).` });
      }
    }
    if (Rg.curse && type === 'treasure' && !M.charm && rng() < Rg.curse) { r.curse = true; r.events.push({ type: 'storm', text: 'She looted a cursed wreck. The crew is jumpy and slow.' }); }
    if (Rg.landmark && type === 'exploration' && rng() < 0.3) r.landmark = M.region;
    if (Rg.witch && rng() < 0.3) r.witch = true;
    if (rng() < 0.03 + ring * 0.04 + (Rg.kraken || 0)) r.lore = 'kraken';
    else if (rng() < 0.05) r.oddity = ODDITIES[Math.floor(rng() * ODDITIES.length)];
  }

  // Kept for Phase 1 callers and tests.
  function rollFishing(ship, hours, seed) { return rollExpedition(shipStats(ship), 'fishing', hours, seed); }

  // Monte Carlo preview with fixed seeds, so the numbers are stable on screen.
  const _estCache = new Map();
  function estimate(ship, type, hours, mods) {
    const st = shipStats(ship);
    const key = JSON.stringify([ship.cls, ship.upgrades, type, hours, mods || null]);
    if (_estCache.has(key)) return _estCache.get(key);
    const N = 80, tot = {}, out = { damage: 0, damageChance: 0, overflowChance: 0, winRate: 0, anyRare: {} };
    let fights = 0;
    for (let i = 1; i <= N; i++) {
      const r = rollExpedition(st, type, hours, i * 7919, mods);
      for (const [k, v] of Object.entries(r.items)) { tot[k] = (tot[k] || 0) + v; out.anyRare[k] = (out.anyRare[k] || 0) + 1; }
      out.damage += r.damage; if (r.damage > 0) out.damageChance++;
      if (Object.keys(r.items).some(k => CHESTS[k])) out.anyChest = (out.anyChest || 0) + 1;
      if (r.overflow > 0) out.overflowChance++;
      if (type === 'combat') { fights += r.wins + r.losses; out.winRate += r.wins; }
    }
    const res = {
      avg: Object.fromEntries(Object.entries(tot).map(([k, v]) => [k, v / N])),
      chance: Object.fromEntries(Object.entries(out.anyRare).map(([k, v]) => [k, v / N])),
      damage: out.damage / N, damageChance: out.damageChance / N, overflowChance: out.overflowChance / N, chestChance: (out.anyChest || 0) / N,
      winRate: fights ? out.winRate / fights : 0,
      capacity: st.cargo,
      durationMult: durationMult(st),
    };
    if (_estCache.size > 300) _estCache.clear();
    _estCache.set(key, res);
    return res;
  }
  // Phase 1 compatibility.
  function estimateFishing(ship, hours) {
    const e = estimate(ship, 'fishing', hours);
    return { fish: Math.round(e.avg.fish || 0), shell: Math.round(e.avg.shellfish || 0), rareChance: e.chance.rareFish || 0, storm: e.damageChance, capacity: e.capacity, overflow: e.overflowChance > 0.25 ? 1 : 0 };
  }

  function hourMs(state) { return state.settings.devMode ? state.settings.devSecondsPerHour * 1000 : HOUR_MS; }

  function sailBlock(state, ship, type, now) {
    if (expeditionForShip(state, ship.id)) return `${ship.name} is already at sea.`;
    const st = shipStats(ship);
    if (ship.hp < Math.ceil(st.hull * MIN_SAIL_HULL)) return `${ship.name} is too damaged to sail. Repair her first.`;
    if (type === 'combat' && typePower(st, 'combat') < 2) return 'She has no guns. Fit cannons at the Shipwright first.';
    return null;
  }

  function foodFor(hours) { return Math.ceil(hours / 4); }

  // Village bonuses applied to a trip at the moment it sails.
  const hasTrophy = (state, k) => !!(state.trophies && state.trophies[k] > 0);
  function tripMods(state, type, now, supplies, region = 'home', charm = false) {
    const rumor = rumorFor(state, now);
    const Rg = REGIONS[region] || REGIONS.home;
    const dec = decorBonus(state);
    let power = 1 + (dec.power[type] || 0);
    if (type === 'combat') power *= (1 + 0.1 * buildingLevel(state, 'weaponsmith')) * (hasTrophy(state, 'captainCutlass') ? 1.1 : 1);
    if (type === 'exploration') power *= (1 + 0.15 * buildingLevel(state, 'cartographer')) * (hasTrophy(state, 'goldenCompass') ? 1.1 : 1);
    let yld = rumor && rumor.type === type ? rumor.bonus : 1;
    if (supplies) yld *= 1.2;
    yld *= (Rg.yield && (Rg.yield[type] || Rg.yield.all)) || 1;
    if ((state.landmarks || []).includes(region)) yld *= 1.2;
    if (type === 'fishing' && hasTrophy(state, 'sirenPearl')) yld *= 1.1;
    yld *= 1 + (dec.yield[type] || 0);
    let damage = (supplies ? 0.7 : 1) * Rg.danger * (charm ? 0.5 : 1) * (hasTrophy(state, 'krakenScale') ? 0.9 : 1) * (1 - dec.damage);
    const m = { power: round3(power), yield: round3(yld), damage: round3(damage), region: REGIONS[region] ? region : 'home' };
    if (charm) m.charm = true;
    const chestMult = (hasTrophy(state, 'drownedCrown') ? 1.25 : 1) * (1 + dec.chest);
    if (chestMult !== 1) m.chestMult = round3(chestMult);
    if (dec.coins) m.coins = round3(1 + dec.coins);
    if (halloweenActive(state, now)) m.candy = round3(1 + dec.candy); // fixed at sailing, so reloading can't change it
    return m;
  }

  // ---------- regions ----------
  const revealed = (state, id) => (state.regions || ['home']).includes(id);
  function regionLock(state, id) {
    const Rg = REGIONS[id];
    if (!Rg) return 'Unknown waters.';
    if (revealed(state, id)) return null;
    if (Rg.ring > 1 && !REGION_ORDER.some(k => REGIONS[k].ring === Rg.ring - 1 && revealed(state, k))) return 'Chart a nearer region first.';
    for (const [b, lvl] of Object.entries(Rg.req || {})) if (buildingLevel(state, b) < lvl) return lvl > 1 ? `Needs a level ${lvl} ${BUILDINGS[b].name}.` : `Needs a ${BUILDINGS[b].name}.`;
    return null;
  }
  function revealRegion(state, id) {
    if (revealed(state, id)) return { ok: false, reason: 'Already charted.' };
    const lock = regionLock(state, id);
    if (lock) return { ok: false, reason: lock };
    const cost = REGIONS[id].cost;
    if (!canAfford(state, cost)) return { ok: false, reason: `Charting it takes ${cost.charts} sea charts.` };
    spend(state, cost);
    state.regions.push(id);
    return { ok: true };
  }
  function regionSailBlock(state, ship, id) {
    const Rg = REGIONS[id];
    if (!Rg || !revealed(state, id)) return 'Those waters aren’t charted yet.';
    if (shipStats(ship).exploration < Rg.minExplore) return `She needs ${Rg.minExplore} exploration to sail that far. A scouting tower helps.`;
    return null;
  }

  // ---------- chests ----------
  function openChest(state, id, seed) {
    const c = CHESTS[id];
    if (!c) return { ok: false, reason: 'Not a chest.' };
    if ((state.resources[id] || 0) < 1) return { ok: false, reason: 'You don’t have that chest.' };
    const z = CHEST_SIZES[c.size], key = KEY_OF[c.family];
    if (state.resources[key] < z.keys) return { ok: false, reason: `It needs ${z.keys} ${RESOURCES[key].name.toLowerCase()}${z.keys > 1 ? 's' : ''}. ${{ sunkenKey: 'Fishing', pirateKey: 'Pirate hunting', lostKey: 'Exploring' }[key]} turns them up.` };
    const rng = mulberry32((seed === undefined ? Math.floor(Math.random() * 4294967296) : seed) >>> 0);
    const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
    state.resources[id]--; state.resources[key] -= z.keys;
    const items = {};
    let coins = Math.round(ri(z.coins[0], z.coins[1]) * (c.family === 'pirate' ? 1.3 : 1));
    const jackpot = c.size === 'large' && rng() < 0.04;
    if (jackpot) coins *= 5;
    items.coins = coins;
    const table = CHEST_LOOT[c.family];
    for (let i = 0; i < z.rolls; i++) {
      const [k, a, b] = table[Math.floor(rng() * table.length)];
      const n = k.endsWith('Key') ? 1 : Math.max(1, Math.round(ri(a, b) * z.mult));
      items[k] = (items[k] || 0) + n;
    }
    let trophy = null;
    if (rng() < z.trophy) {
      const list = CHEST_TROPHIES[c.family];
      trophy = list[Math.floor(rng() * list.length)];
      state.trophies[trophy] = (state.trophies[trophy] || 0) + 1;
    }
    addItems(state, items);
    Stats.add(state, 'chestsOpened');
    return { ok: true, chest: id, items, trophy, jackpot, first: trophy ? state.trophies[trophy] === 1 : false };
  }

  // ---------- the Sea Witch ----------
  function craftCharm(state) {
    if (buildingLevel(state, 'seaWitch') < 1) return { ok: false, reason: 'Only the Sea Witch makes these.' };
    const cost = { essence: 2, relics: 1 };
    if (!canAfford(state, cost)) return { ok: false, reason: 'A charm takes 2 enchanted essence and 1 relic.' };
    spend(state, cost); state.resources.charm++;
    if (!state.discovered.includes('charm')) state.discovered.push('charm');
    return { ok: true };
  }
  function cleanse(state, shipId) {
    const ship = getShip(state, shipId);
    if (!ship || !ship.curse) return { ok: false, reason: 'No curse to lift.' };
    if (buildingLevel(state, 'seaWitch') < 1) return { ok: false, reason: 'Only the Sea Witch can lift a curse.' };
    if (state.resources.essence < 1) return { ok: false, reason: 'Lifting a curse takes 1 enchanted essence.' };
    state.resources.essence--; ship.curse = null;
    return { ok: true };
  }
  const trophyBonus = (state, k) => hasTrophy(state, k);
  const round3 = x => Math.round(x * 1000) / 1000;

  function dispatch(state, shipId, hours, now, seed, type = 'fishing', opts = {}) {
    const ship = getShip(state, shipId);
    if (!ship) return { ok: false, reason: 'No such ship.' };
    if (!DURATIONS.includes(hours)) return { ok: false, reason: 'Pick a listed duration.' };
    if (!TYPES[type]) return { ok: false, reason: 'Unknown expedition type.' };
    const block = sailBlock(state, ship, type, now);
    if (block) return { ok: false, reason: block };
    const region = opts.region || 'home';
    const rb = regionSailBlock(state, ship, region);
    if (rb) return { ok: false, reason: rb };
    const supplies = !!opts.supplies, charm = !!opts.charm;
    if (supplies && state.resources.food < foodFor(hours)) return { ok: false, reason: `Supplies for this trip need ${foodFor(hours)} preserved food.` };
    if (charm && state.resources.charm < 1) return { ok: false, reason: 'You have no warding charm.' };
    if (supplies) state.resources.food -= foodFor(hours);
    if (charm) state.resources.charm--;
    const st = shipStats(ship);
    const tripLen = REGIONS[region].dist * (hasTrophy(state, 'starChart') ? 0.9 : 1) * (1 - decorBonus(state).trip);
    const started = Stats.get(state, 'tripsStarted');
    const beginner = started < BEGINNER_TRIPS, firstEver = started === 0;
    const exp = {
      id: 'exp-' + state.nextId++,
      shipId, type, hours,
      startAt: now,
      endAt: now + (firstEver ? 60000 : Math.round(hours * hourMs(state) * durationMult(st) * tripLen)),
      seed: (seed === undefined ? Math.floor(Math.random() * 4294967296) : seed) >>> 0,
      dev: !!state.settings.devMode,
      stats: snapshot(st),
      mods: (() => { const m = tripMods(state, type, now, supplies, region, charm); if (beginner) { m.yield = round3(m.yield * 2); m.beginner = true; } return m; })(),
      supplies, region,
    };
    state.expeditions.push(exp);
    ship.lastTrip = { type, hours, region };
    Stats.add(state, 'tripsStarted');
    return { ok: true, exp };
  }
  function snapshot(st) {
    const { speed, hull, combat, cargo, fishing, exploration, magic, aff, dmg } = st;
    return { speed, hull, combat, cargo, fishing, exploration, magic, aff: { ...aff }, dmg };
  }

  function addItems(state, items) {
    for (const [k, v] of Object.entries(items)) {
      if (!(k in state.resources)) continue;
      if (k === 'coins') { earnCoins(state, v); continue; }
      state.resources[k] += v;
      if (v > 0 && !state.discovered.includes(k)) state.discovered.push(k);
    }
  }

  function claim(state, expId, now) {
    const exp = state.expeditions.find(e => e.id === expId);
    if (!exp) return { ok: false, reason: state.claimed.includes(expId) ? 'Already collected.' : 'No such expedition.' };
    if (now < exp.endAt) return { ok: false, reason: 'Still at sea.' };
    const ship = getShip(state, exp.shipId);
    const result = rollExpedition(exp.stats, exp.type, exp.hours, exp.seed, exp.mods);
    // Remove first, then credit: a second call can never find it again.
    state.expeditions = state.expeditions.filter(e => e.id !== expId);
    state.claimed.push(expId);
    if (state.claimed.length > 200) state.claimed = state.claimed.slice(-200);
    // Damage. A ship never sinks: at worst she limps home with 1 hull and half her hold.
    const before = ship.hp;
    ship.hp -= result.damage;
    if (ship.hp <= 0) {
      ship.hp = 1;
      for (const k of Object.keys(result.items)) if (k !== 'coins') { result.items[k] = Math.floor(result.items[k] / 2); if (!result.items[k]) delete result.items[k]; }
      result.events.push({ type: 'storm', text: 'She limped home barely afloat and dumped half the hold to stay up.' });
    }
    result.hullLost = before - ship.hp;
    // Bulk goods beyond the warehouse limit spoil on the quay.
    const cap = storageCap(state);
    result.spoiled = {};
    for (const k of BULK) {
      const n = result.items[k];
      if (!n) continue;
      const room = Math.max(0, cap - state.resources[k]);
      if (n > room) { result.spoiled[k] = n - room; result.items[k] = room; if (!room) delete result.items[k]; }
    }
    const sp = Object.entries(result.spoiled);
    if (sp.length) result.events.push({ type: 'full', text: `Storage full (${cap}): ${sp.map(([k, n]) => `${n} ${RESOURCES[k].name.toLowerCase()}`).join(', ')} spoiled on the quay. A bigger Warehouse holds more.` });
    addItems(state, result.items);
    // curses, discoveries, legends
    if (ship.curse) { ship.curse.trips--; if (ship.curse.trips <= 0) { ship.curse = null; result.events.push({ type: 'win', text: 'The curse on her has worn off.' }); } }
    if (result.curse) ship.curse = { trips: 3 };
    if (result.landmark && !state.landmarks.includes(result.landmark)) { state.landmarks.push(result.landmark); result.newLandmark = result.landmark; }
    else result.landmark = null;
    if ((result.witch || result.newLandmark === 'outer') && !state.flags.witchFound) { state.flags.witchFound = true; result.foundWitch = true; }
    if (result.lore === 'kraken') { result.krakenHint = KRAKEN_HINTS[Math.min(state.lore.kraken, KRAKEN_HINTS.length - 1)]; result.krakenRepeat = state.lore.kraken >= KRAKEN_HINTS.length; state.lore.kraken++; }
    if (result.trophy) { state.trophies[result.trophy] = (state.trophies[result.trophy] || 0) + 1; }
    if (result.monster) state.stats.monstersFought++;
    result.report = tripReport(result, exp);
    if (result.report.length) { state.reports.unshift({ at: now, ship: ship.name, region: exp.region || 'home', lines: result.report }); if (state.reports.length > 25) state.reports.length = 25; }
    state.stats.expeditions++;
    state.stats.fishCaught += (result.items.fish || 0) + (result.items.shellfish || 0) + (result.items.rareFish || 0);
    state.stats.piratesBeaten += result.wins;
    if (result.items.candy) Stats.add(state, 'candyFound', result.items.candy);
    state.log.unshift({ at: now, shipId: ship.id, type: exp.type, hours: exp.hours, items: result.items });
    if (state.log.length > 30) state.log.length = 30;
    return { ok: true, exp, ship, result };
  }

  // A short ship's log of anything out of the ordinary.
  const LOG_NAMES = { rareFish: ['rare catch', 'rare catches'], pearls: ['pearl', 'pearls'], relics: ['relic', 'relics'], charts: ['sea chart', 'sea charts'],
    sunkenKey: ['sunken key', 'sunken keys'], pirateKey: ['pirate key', 'pirate keys'], lostKey: ['lost key', 'lost keys'], moonfish: ['moonfish', 'moonfish'],
    salvage: ['spectral salvage', 'spectral salvage'], essence: ['enchanted essence', 'enchanted essence'], candy: ['candy', 'candy'] };
  function tripReport(r, exp) {
    const lines = [];
    const finds = [];
    for (const [k, [one, many]] of Object.entries(LOG_NAMES)) { const n = r.items[k]; if (n) finds.push(`${n} ${n === 1 ? one : many}`); }
    for (const id of Object.keys(CHESTS)) { const n = r.items[id]; if (n) finds.push(`${n > 1 ? n + ' ' : 'a '}${CHESTS[id].name.toLowerCase()}${n > 1 ? 's' : ''}`); }
    if (finds.length) lines.push({ kind: 'find', text: `Found ${finds.join(', ')}.` });
    if (r.trophy) lines.push({ kind: 'trophy', text: `Brought home the ${TROPHIES[r.trophy].name}!` });
    if (r.monster) lines.push({ kind: r.monster.won ? 'win' : 'danger', text: r.monster.won ? `Fought off ${r.monster.name}.` : `Fled from ${r.monster.name}.` });
    if (r.ghostWins) lines.push({ kind: 'win', text: `Beat ${r.ghostWins} ghost ship${r.ghostWins > 1 ? 's' : ''}.` });
    if (r.newLandmark) lines.push({ kind: 'landmark', text: `Discovered ${REGIONS[r.newLandmark].landmark}.` });
    if (r.foundWitch) lines.push({ kind: 'witch', text: 'A hut on stilts glowed beyond the reef. The Sea Witch will see you now.' });
    if (r.curse) lines.push({ kind: 'danger', text: 'Cursed for the next 3 trips.' });
    if (r.krakenHint) lines.push({ kind: 'kraken', text: r.krakenRepeat ? 'The kraken was seen again, its eight yellow eyes watching from the dark.' : r.krakenHint });
    if (r.oddity) lines.push({ kind: 'odd', text: r.oddity });
    if (exp.mods && exp.mods.beginner) lines.push({ kind: 'find', text: 'Beginner’s tide: this haul was doubled.' });
    return lines;
  }

  function claimAll(state, now) {
    const ready = state.expeditions.filter(e => now >= e.endAt).map(e => e.id);
    return ready.map(id => claim(state, id, now)).filter(r => r.ok);
  }

  function finishAllNow(state, now) {
    let n = 0;
    for (const e of state.expeditions) if (e.endAt > now) { e.endAt = now; n++; }
    for (const b of state.buildings) {
      if (b.pending && b.pending.endAt > now) { b.pending.endAt = now; n++; }
      if (b.job && b.job.done < b.job.qty) { b.job.startAt = now - b.job.qty * b.job.unitMs; n++; }
    }
    return n;
  }

  // ---------- repairs ----------
  function repairCost(ship, state) {
    const missing = shipStats(ship).hull - ship.hp;
    if (missing <= 0) return 0;
    const disc = state ? 1 - 0.2 * Math.max(0, buildingLevel(state, 'shipwright') - 1) : 1;
    return Math.ceil(missing * tierFactor(ship.cls) * disc);
  }
  function repairPlanks(ship) {
    const missing = shipStats(ship).hull - ship.hp;
    return missing <= 0 ? 0 : Math.ceil(missing / 10);
  }
  function repair(state, shipId, now) {
    const ship = getShip(state, shipId);
    if (!ship) return { ok: false, reason: 'No such ship.' };
    if (expeditionForShip(state, shipId)) return { ok: false, reason: `${ship.name} is at sea.` };
    const cost = repairCost(ship, state), planks = repairPlanks(ship);
    if (!cost) return { ok: false, reason: 'Hull is already sound.' };
    if (state.resources.coins < cost || state.resources.planks < planks) return { ok: false, reason: `Repairs need ${cost} coins and ${planks} planks.` };
    state.resources.coins -= cost;
    state.resources.planks -= planks;
    ship.hp = shipStats(ship).hull;
    return { ok: true, cost, planks };
  }

  // ---------- market ----------
  function sell(state, res, qty) {
    if (!SELLABLE.includes(res)) return { ok: false, reason: 'That can’t be sold.' };
    const have = state.resources[res];
