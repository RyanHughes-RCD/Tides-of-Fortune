<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b4d6b">
<title>Tides of Fortune</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Tides">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --void: #1b4d6b;
  --ink: #2a1d17;
  --sail: #f4ecd8;
  --sail-2: #e6d8b8;
  --text: #2a1d17;
  --muted: #6b5847;
  --brass: #e0a93b;
  --brass-dk: #a8741f;
  --kelp: #3f7d4f;
  --signal: #c8463c;
  --sea: #3f9fd8;
  --dev: #7a5aa0;
  --hud: rgba(244, 236, 216, 0.94);
  --font: 'Pixelify Sans', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --void: #0f2c40; --sail: #24384a; --sail-2: #2f4a60; --text: #f4ecd8; --muted: #b8c4c8;
    --hud: rgba(30, 50, 66, 0.94); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --void: #0f2c40; --sail: #24384a; --sail-2: #2f4a60; --text: #f4ecd8; --muted: #b8c4c8;
  --hud: rgba(30, 50, 66, 0.94); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { background: var(--void); scroll-padding-top: env(safe-area-inset-top, 0px); }
body { background: var(--void); color: var(--text); font-family: var(--font); overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible, input:focus-visible + .track { outline: 3px solid var(--brass); outline-offset: 2px; }

#app { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); overflow: hidden; overflow: clip; }
#stage { position: absolute; inset: 0; }
#world { display: block; touch-action: none; image-rendering: pixelated; image-rendering: crisp-edges; }

img.px { image-rendering: pixelated; image-rendering: crisp-edges; display: inline-block; vertical-align: middle; height: 18px; width: auto; }
img.px.tiny { height: 14px; }
img.px.mid { height: 24px; }
img.px.big { height: 34px; }

/* ---- top HUD ---- */
.hud-top { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 5; }
.res-row { display: flex; gap: 6px; flex-wrap: wrap; pointer-events: auto; }
.res { display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 7px; min-height: 36px; background: var(--hud); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 0 3px 0 var(--ink); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.res.bump { animation: bump .35s steps(3); }
@keyframes bump { 50% { transform: translateY(-3px); } }
#devBanner { pointer-events: none; align-self: flex-start; padding: 3px 10px; font-size: 13px; font-weight: 600; color: #fff; border: 2px solid var(--ink); border-radius: 4px;
  background: repeating-linear-gradient(-45deg, var(--dev) 0 8px, #5d4280 8px 16px); }
#voyages { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; pointer-events: auto; }
.voyage { display: grid; grid-template-columns: auto auto auto; grid-template-rows: auto 4px; column-gap: 8px; row-gap: 3px; align-items: center; padding: 5px 10px; background: var(--hud); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 0 3px 0 var(--ink); font-size: 15px; }
.voyage .px { grid-row: 1 / 3; }
.voyage .v-time { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 4.5em; text-align: right; }
.voyage .v-bar { grid-column: 2 / 4; height: 4px; background: var(--sail-2); border-radius: 2px; overflow: hidden; }
.voyage .v-bar i { display: block; height: 100%; width: 0; background: var(--sea); }
.voyage.ready { background: var(--brass); color: var(--ink); animation: nudge 1.2s steps(2) infinite; }
.voyage.ready .v-bar i { background: var(--kelp); }
@keyframes nudge { 50% { transform: translateY(-2px); } }

/* ---- bottom nav ---- */
.dock-nav { position: absolute; left: 8px; right: 8px; bottom: 8px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; z-index: 6; }
.dock-nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 60px; padding: 6px 2px; min-width: 0; background: var(--hud); border: 2px solid var(--ink); border-radius: 8px; box-shadow: 0 4px 0 var(--ink); font-size: 14px; font-weight: 600; }
.dock-nav button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.dock-nav button[aria-pressed="true"] { background: var(--brass); color: var(--ink); }
.dock-nav .ni img { height: 24px; }

/* ---- sheet ---- */
.sheet { position: absolute; left: 8px; right: 8px; bottom: 82px; max-height: calc(100% - 82px - 70px); display: flex; flex-direction: column; background: var(--sail); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 5px 0 var(--ink); transform: translateY(calc(100% + 100px)); visibility: hidden; transition: transform .22s cubic-bezier(.2,.8,.2,1), visibility 0s .22s; z-index: 8; }
.sheet.open { transform: translateY(0); visibility: visible; transition: transform .22s cubic-bezier(.2,.8,.2,1); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px 16px; }
.sheet-head h2 { margin: 0; font-size: 24px; font-weight: 700; }
#sheetClose { width: 44px; height: 44px; border: 2px solid var(--ink); border-radius: 8px; background: var(--sail-2); font-size: 18px; font-weight: 700; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 12px 8px; }

.card { background: var(--sail-2); border: 2px solid var(--ink); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.card h3 { margin: 0; font-size: 19px; }
.ship-head { display: flex; align-items: center; gap: 10px; }
.ship-head > div { flex: 1; min-width: 0; }
.ship-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 8px; border: 2px solid var(--ink); border-radius: 999px; white-space: nowrap; }
.pill-idle { background: #cfe8d2; color: var(--ink); }
.pill-away { background: #cfe5f5; color: var(--ink); }
.pill-returned { background: var(--brass); color: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 4px; }
.stats.three { grid-template-columns: repeat(3, 1fr); }
.stats div { background: var(--sail); border-radius: 6px; padding: 6px 4px; text-align: center; }
.stats dt { font-size: 12px; color: var(--muted); }
.stats dd { margin: 0; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.label { margin: 14px 0 6px; font-size: 14px; color: var(--muted); }
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); grid-auto-flow: column; gap: 5px; }
.chip { min-width: 0; padding: 0; min-height: 44px; border: 2px solid var(--ink); border-radius: 8px; background: var(--sail); font-size: 16px; font-weight: 600; }
.chip[aria-checked="true"] { background: var(--sea); color: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
.estimate, .desc, .eta, .upg-delta, .cost { font-size: 15px; line-height: 1.45; margin: 10px 0; }
.warn { font-size: 14px; line-height: 1.4; margin: 8px 0; padding: 8px 10px; border-left: 4px solid var(--signal); background: rgba(200, 70, 60, .12); border-radius: 4px; }
.ok-text { color: var(--kelp); font-weight: 600; margin: 10px 0 0; }
:root[data-theme="dark"] .ok-text { color: #8fd29c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ok-text { color: #8fd29c; } }
.note { font-size: 13px; color: var(--muted); line-height: 1.4; margin: 4px 2px 12px; }
.progress { height: 14px; border: 2px solid var(--ink); border-radius: 4px; background: var(--sail); overflow: hidden; margin-top: 12px; }
.progress i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--sea) 0 6px, #59bde0 6px 12px); }

.btn { display: block; width: 100%; min-height: 50px; margin-top: 10px; padding: 10px 14px; border: 2px solid var(--ink); border-radius: 10px; background: var(--sail); font-size: 17px; font-weight: 700; box-shadow: 0 4px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--brass); color: var(--ink); }
.btn.primary.glow { animation: nudge 1.2s steps(2) infinite; }
.btn.small { min-height: 44px; margin: 0; padding: 6px 8px; font-size: 14px; width: auto; box-shadow: 0 3px 0 var(--ink); }
.btn.dev { background: var(--dev); color: #fff; }
.btn.danger { background: transparent; color: var(--signal); border-color: var(--signal); box-shadow: none; }
.btn:disabled { opacity: .55; cursor: default; }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
.btn-grid .btn { font-size: 15px; }

.mrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 2px dashed rgba(42, 29, 23, .2); }
.mrow:last-child { border-bottom: 0; }
.m-info { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 14px; }
.m-info b { font-size: 17px; }
.m-info span { color: var(--muted); }
.m-btns { display: flex; gap: 6px; }

.pips { display: flex; gap: 6px; margin: 12px 0 0; }
.pips i { width: 26px; height: 10px; border: 2px solid var(--ink); border-radius: 2px; background: var(--sail); }
.pips i.on { background: var(--kelp); }

.devcard { border-style: dashed; }
.devcard.on { border-style: solid; border-color: var(--dev); box-shadow: inset 0 0 0 2px var(--dev); }
.switch { display: flex; gap: 12px; align-items: center; cursor: pointer; font-size: 16px; line-height: 1.35; }
.switch small { color: var(--muted); font-size: 13px; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.track { flex: none; width: 54px; height: 32px; border: 2px solid var(--ink); border-radius: 6px; background: var(--sail); position: relative; }
.knob { position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 3px; background: var(--ink); transition: left .12s steps(3); }
.switch input:checked + .track { background: var(--dev); }
.switch input:checked + .track .knob { left: 24px; background: #fff; }
.tests { list-style: none; padding: 0; margin: 12px 0 0; font-size: 13px; line-height: 1.5; }
.tests .pass::before { content: '■ '; color: var(--kelp); }
.tests .fail::before { content: '■ '; color: var(--signal); }

/* ---- reward modal ---- */
.modal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(15, 30, 45, .55); z-index: 20; padding: 20px; }
.modal[hidden] { display: none; }
.modal-card { width: min(360px, 100%); background: var(--sail); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 6px 0 var(--ink); padding: 18px; animation: pop .25s steps(4); }
@keyframes pop { from { transform: scale(.85); } }
.modal-card h2 { margin: 0; font-size: 26px; }
.modal-card .sub { margin: 2px 0 12px; color: var(--muted); }
.haul { list-style: none; padding: 0; margin: 0 0 8px; }
.haul li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 6px; background: var(--sail-2); border-radius: 8px; font-size: 17px; }
.haul li span { flex: 1; }
.haul li b { font-size: 22px; color: var(--kelp); font-variant-numeric: tabular-nums; }
.haul li.empty { color: var(--muted); }
.ev { margin: 6px 0; font-size: 15px; line-height: 1.4; padding-left: 10px; border-left: 4px solid var(--sea); }
.ev-storm, .ev-full { border-color: var(--signal); }
.ev-rare { border-color: #5bb8c8; font-weight: 600; }

/* ---- toasts ---- */
#toasts { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); display: flex; flex-direction: column-reverse; align-items: center; gap: 6px; z-index: 30; pointer-events: none; width: min(92%, 420px); }
.toast { background: var(--ink); color: #f4ecd8; padding: 10px 14px; border-radius: 8px; font-size: 15px; line-height: 1.35; text-align: center; box-shadow: 0 3px 0 rgba(0,0,0,.35); transition: opacity .4s, transform .4s; }
.toast.good { border-left: 5px solid #8fd29c; }
.toast.bad { border-left: 5px solid var(--signal); }
.toast.out { opacity: 0; transform: translateY(-8px); }


/* ---- Phase 5 ---- */
.skychip.update { background: var(--brass); color: var(--ink); animation: nudge 1.2s steps(2) infinite; }
.slider { display: grid; grid-template-columns: 92px 1fr 34px; align-items: center; gap: 8px; margin: 8px 0; font-size: 15px; }
.slider input { width: 100%; accent-color: var(--sea); min-height: 32px; }
.slider b { text-align: right; font-variant-numeric: tabular-nums; }
#saveCode, #importCode { width: 100%; font: 12px/1.4 ui-monospace, Menlo, monospace; padding: 8px; border: 2px solid var(--ink); border-radius: 8px; background: var(--sail); color: var(--text); -webkit-user-select: text; user-select: text; resize: vertical; word-break: break-all; }
.filebtn { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* ---- Phase 4 ---- */
.chartwrap { border: 3px solid var(--ink); border-radius: 10px; overflow: hidden; margin-bottom: 10px; background: #eedfb6; }
#chart { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; image-rendering: pixelated; cursor: pointer; touch-action: manipulation; }
.regions { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.chip.region { flex: none; padding: 4px 10px; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.chip.region small { font-size: 10px; font-weight: 500; }
img.px.chest { height: 26px; }
.shiplog { margin: 8px 0; padding: 8px 10px; border: 2px dashed var(--muted); border-radius: 8px; }
.shiplog h3 { margin: 0 0 4px; font-size: 15px; }
.shiplog ul { margin: 0; padding-left: 16px; font-size: 14px; line-height: 1.4; }
.shiplog .log-kraken { color: #a11d2a; font-style: italic; }
:root[data-theme="dark"] .shiplog .log-kraken { color: #ff8f8f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .shiplog .log-kraken { color: #ff8f8f; } }
.shiplog .log-trophy, .shiplog .log-witch, .shiplog .log-landmark { font-weight: 700; }
.logbook p { margin: 0 0 8px; font-size: 14px; line-height: 1.4; }
.logbook.kraken p { font-style: italic; }
.chestbox { display: grid; place-items: center; padding: 6px 0 4px; }
.chestimg.small { height: 64px; } .chestimg.medium { height: 80px; } .chestimg.large { height: 104px; }
.chestimg.shake { animation: shake .6s steps(6); }
@keyframes shake { 20% { transform: translateX(-3px) rotate(-3deg); } 40% { transform: translateX(3px) rotate(3deg); } 60% { transform: translateX(-2px); } 80% { transform: translateX(2px) translateY(-3px); } }
.chestbox.open .chestimg { animation: pop .3s steps(3); }
.trophy { display: flex; gap: 10px; align-items: center; padding: 10px; margin: 8px 0; border: 3px solid var(--brass); border-radius: 10px; background: rgba(224,169,59,.15); }
.trophy p { margin: 2px 0 0; font-size: 14px; }
.trophy .lore { font-style: italic; color: var(--muted); }

/* ---- Village pass ---- */
.hud-row2 { display: flex; gap: 6px; align-items: center; pointer-events: none; flex-wrap: wrap; }
.skychip { pointer-events: auto; display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 6px; min-height: 28px; font-size: 13px; font-weight: 600; background: var(--hud); border: 2px solid var(--ink); border-radius: 999px; box-shadow: 0 2px 0 var(--ink); }
.place-search { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin-top: 8px; }
.place-search input { min-height: 44px; font: inherit; font-size: 16px; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 8px; background: var(--sail); color: var(--text); -webkit-user-select: text; user-select: text; min-width: 0; }
.place-search .btn { margin: 0; }
#devBanner { pointer-events: none; }

/* ---- Phase 3 ---- */
.dock-nav button { font-size: 12px; }
img.px.b-img { height: 34px; }
img.px.b-img.big { height: 56px; }
h3.group { margin: 14px 2px 6px; font-size: 16px; color: var(--muted); font-weight: 600; }
.builders { display: flex; align-items: center; gap: 6px; font-size: 15px; }
.amt { margin-left: 4px; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt small { font-size: 12px; color: var(--muted); font-weight: 500; }
.amt.full { color: var(--signal); }
.bt { color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; }
.btn-row.three { grid-template-columns: 1fr 1fr 1fr; }
.btn-row.three .btn { width: 100%; }
.rumor { border-color: var(--brass); }
.rumor h3 { display: flex; align-items: center; gap: 8px; }
.type.hot { box-shadow: inset 0 0 0 2px var(--brass); }
.type.hot small { color: inherit; font-weight: 700; }
.supplies { display: flex; gap: 10px; align-items: center; margin: 12px 0 4px; font-size: 15px; line-height: 1.35; cursor: pointer; }
.supplies small { color: var(--muted); font-size: 13px; }
.supplies input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.supplies input:checked + .track { background: var(--kelp); }
.supplies input:checked + .track .knob { left: 24px; background: #fff; }
.supplies.off { opacity: .6; cursor: default; }
.placebar { position: absolute; left: 8px; right: 8px; bottom: 82px; z-index: 9; background: var(--sail); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 5px 0 var(--ink); padding: 12px; display: none; }
body.placing .placebar { display: block; }
body.placing .dock-nav { opacity: .4; pointer-events: none; }
.placebar p { margin: 0; }
#placeTitle { font-size: 19px; font-weight: 700; }
#placeHint { font-size: 15px; margin: 4px 0 2px; color: var(--kelp); min-height: 1.4em; }
#placeHint.bad { color: var(--signal); }
@media (min-width: 700px) { .placebar { left: 50%; right: auto; width: 600px; transform: translateX(-50%); } }

/* ---- Phase 2 ---- */
.stats.strip { grid-template-columns: repeat(7, 1fr); gap: 3px; margin: 8px 0 2px; }
.stats.strip div { padding: 4px 1px; }
.stats.strip dt { font-size: 10px; }
.stats.strip dd { font-size: 15px; }
.role { margin: 8px 0 0; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
@media (max-width: 480px) {
  .res-row { gap: 3px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 3px; }
  .res-row::-webkit-scrollbar { display: none; }
  .res { flex: none; gap: 3px; padding: 3px 5px 3px 4px; min-height: 32px; font-size: 13px; border-radius: 5px; box-shadow: 0 2px 0 var(--ink); }
  .res img.px { height: 13px; }
}
img.px.ship-img { height: 34px; }
img.px.ship-img.big { height: 52px; }
.voyage.all { grid-template-columns: auto auto auto; grid-template-rows: auto; }
.voyage.more { grid-template-columns: auto; grid-template-rows: auto; font-size: 14px; }
.fleet-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.fl-row { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--sail-2); border: 2px solid var(--ink); border-radius: 10px; text-align: left; min-height: 60px; }
.fl-row:active { transform: translateY(2px); }
.fl-img { width: 44px; display: grid; place-items: center; flex: none; }
.fl-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.fl-main b { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-main small { font-size: 13px; color: var(--muted); }
.mini-hull { height: 5px; width: 80%; background: var(--sail); border-radius: 3px; overflow: hidden; margin-top: 3px; }
.mini-hull i, .hull i { display: block; height: 100%; background: var(--kelp); }
.mini-hull.mid i, .hull.mid i { background: var(--brass); }
.mini-hull.bad i, .hull.bad i { background: var(--signal); }
.fl-status { font-size: 14px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 4px; }
.fl-status.ready { background: var(--brass); color: var(--ink); padding: 3px 8px; border: 2px solid var(--ink); border-radius: 999px; }
.fl-status.bad { color: var(--signal); }
.back { border: 0; background: none; font-size: 16px; font-weight: 600; padding: 6px 2px 10px; min-height: 44px; }
.hull { position: relative; height: 22px; margin-top: 12px; border: 2px solid var(--ink); border-radius: 5px; background: var(--sail); overflow: hidden; }
.hull span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,.5); z-index: 1; }
.stats.seven { grid-template-columns: repeat(4, 1fr); }
.stats.seven div:nth-child(n+5) { grid-column: span 1; }
.types { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.type { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 8px; background: var(--sail); font-size: 15px; font-weight: 600; text-align: left; position: relative; }
.type[aria-checked="true"] { background: var(--sea); color: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
.type:disabled { opacity: .5; }
.type small { display: block; font-size: 11px; font-weight: 500; line-height: 1.2; }
.type-desc { color: var(--muted); font-size: 14px; margin: 8px 0 10px; }
.estimate.risk { color: var(--muted); margin-top: -4px; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rename label { display: block; font-size: 14px; color: var(--muted); margin: 4px 0; }
.rename input { width: 100%; min-height: 48px; font: inherit; font-size: 18px; padding: 8px 12px; border: 2px solid var(--ink); border-radius: 8px; background: var(--sail); color: var(--text); -webkit-user-select: text; user-select: text; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
.seg button { min-height: 44px; border: 0; background: var(--sail-2); font-size: 16px; font-weight: 600; }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--sail); }
:root[data-theme="dark"] .seg button[aria-selected="true"] { background: var(--sail); color: var(--text); box-shadow: inset 0 0 0 2px var(--brass); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-selected="true"] { background: #f4ecd8; color: #2a1d17; } }
.card.build.locked { opacity: .78; }
.card.build .stats { margin-top: 8px; }
.lock { margin: 10px 0 0; font-size: 14px; padding: 8px 10px; border: 2px dashed var(--muted); border-radius: 8px; color: var(--muted); }
.cost { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.cost-item { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cost-item.short { color: var(--signal); }
.ship-pick { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; margin-bottom: 4px; -webkit-overflow-scrolling: touch; }
.ship-pick button { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 8px; min-width: 76px; border: 2px solid var(--ink); border-radius: 8px; background: var(--sail-2); font-size: 12px; font-weight: 600; }
.ship-pick button[aria-pressed="true"] { background: var(--brass); color: var(--ink); }
.ship-pick span { max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card.upg { padding: 10px 12px; }
.upg-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.upg-top h3 { font-size: 17px; }
.upg-top .desc { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.upg-top .pips { margin: 4px 0 0; flex: none; }
.upg-buy { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
.upg-buy .cost { font-size: 15px; }
.modal-card { max-height: calc(100% - 20px); display: flex; flex-direction: column; }
.modal-card #modalBody { overflow-y: auto; }
.evs { max-height: 34vh; overflow-y: auto; }
.ev-win { border-color: var(--kelp); }

#boot { position: absolute; inset: 0; display: grid; place-items: center; background: var(--void); color: #f4ecd8; font-size: 20px; z-index: 50; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (min-width: 700px) {
  .dock-nav { left: 50%; right: auto; transform: translateX(-50%); width: 600px; }
  .sheet { left: 50%; right: auto; width: 600px; transform: translate(-50%, calc(100% + 100px)); }
  .sheet.open { transform: translate(-50%, 0); }
}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="world" aria-label="Your harbor village. Drag to look around, pinch or scroll to zoom, tap boats and buildings."></canvas></div>
  <header class="hud-top">
    <div class="res-row" id="resRow"></div>
    <div class="hud-row2"><button id="skyChip" class="skychip" aria-label="Sky and weather settings"></button><button id="updateBtn" class="skychip update" hidden>New version ready: tap to restart</button><div id="devBanner" hidden></div></div>
    <div id="voyages"></div>
  </header>
  <nav class="dock-nav" id="nav">
    <button data-panel="fleet" data-icon="boat" aria-pressed="false"><span class="ni"></span>Fleet</button>
    <button data-panel="map" data-icon="map" aria-pressed="false"><span class="ni"></span>Map</button>
    <button data-panel="village" data-icon="house" aria-pressed="false"><span class="ni"></span>Village</button>
    <button data-panel="market" data-icon="crate" aria-pressed="false"><span class="ni"></span>Stores</button>
    <button data-panel="shipwright" data-icon="hammer" aria-pressed="false"><span class="ni"></span>Yard</button>
    <button data-panel="settings" data-icon="gear" aria-pressed="false"><span class="ni"></span>Options</button>
  </nav>
  <section id="sheet" class="sheet" aria-hidden="true">
    <header class="sheet-head"><h2 id="sheetTitle"></h2><button id="sheetClose" aria-label="Close panel">✕</button></header>
    <div id="sheetBody" class="sheet-body"></div>
  </section>
  <div id="placeBar" class="placebar" role="region" aria-label="Place building">
    <p id="placeTitle"></p><p id="placeHint" aria-live="polite"></p>
    <div class="btn-row"><button class="btn" id="placeCancel">Cancel</button><button class="btn primary" id="placeOk">Build here</button></div>
  </div>
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalBody">
      <div id="modalBody"></div>
      <button class="btn primary" id="modalOk">Stow the catch</button>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="boot">Raising the sails…</div>
</div>
<script data-module="core.js">

  // ======================= Phase 4: the wider sea =======================

  const FAMILY_NAME = { sunken: 'sunken treasure', pirate: 'pirate treasure', lost: 'lost' };
