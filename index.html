  function upgradeBuilding(state, id, now) {
    const b = getBuilding(state, id);
    if (!b) return { ok: false, reason: 'No such building.' };
    const block = upgradeBlock(state, b);
    if (block) return { ok: false, reason: block };
    const cost = buildCost(b.type, b.level + 1);
    if (!canAfford(state, cost)) return { ok: false, reason: 'Not enough resources.' };
    spend(state, cost);
    b.pending = { toLevel: b.level + 1, startAt: now, endAt: now + buildMs(state, b.level + 1) };
    return { ok: true, building: b };
  }

  // ---------- production ----------
  function recipeSpeed(level) { return 1 + 0.5 * (level - 1); }
  const BATCH_PER_LEVEL = 25;
  function maxBatch(b) { return BATCH_PER_LEVEL * Math.max(1, b.level); }
  // How many a batch could make right now: limited by inputs, the building's batch size and room in storage.
  function batchLimit(state, b) {
    const rc = BUILDINGS[b.type].recipe;
    if (!rc) return 0;
    let n = maxBatch(b);
    for (const [k, v] of Object.entries(rc.in)) n = Math.min(n, Math.floor(state.resources[k] / v));
    if (BULK.includes(rc.out)) n = Math.min(n, Math.max(0, storageCap(state) - state.resources[rc.out]));
    return Math.max(0, n);
  }

  function queueJob(state, id, qty, now) {
    const b = getBuilding(state, id);
    if (!b) return { ok: false, reason: 'No such building.' };
    const rc = BUILDINGS[b.type].recipe;
    if (!rc) return { ok: false, reason: 'This building doesn’t make anything.' };
    if (b.level < 1) return { ok: false, reason: 'Still under construction.' };
    settleProduction(state, now);
    if (b.job) return { ok: false, reason: 'Already working on a batch.' };
    const n = Math.min(Math.floor(Number(qty) || 0), batchLimit(state, b));
    if (n < 1) return { ok: false, reason: BULK.includes(rc.out) && state.resources[rc.out] >= storageCap(state) ? `Storage for ${RESOURCES[rc.out].name.toLowerCase()} is full.` : `Not enough ${Object.keys(rc.in).map(k => RESOURCES[k].name.toLowerCase()).join(' or ')}.` };
    for (const [k, v] of Object.entries(rc.in)) state.resources[k] -= v * n;
    b.job = { out: rc.out, per: { ...rc.in }, qty: n, done: 0, startAt: now, unitMs: Math.max(1, Math.round(rc.hours * hourMs(state) / recipeSpeed(b.level))) };
    return { ok: true, qty: n };
  }

  function cancelJob(state, id, now) {
    const b = getBuilding(state, id);
    if (!b || !b.job) return { ok: false, reason: 'Nothing to cancel.' };
    settleProduction(state, now);
    if (!b.job) return { ok: false, reason: 'That batch just finished.' };
    const left = b.job.qty - b.job.done;
    for (const [k, v] of Object.entries(b.job.per)) state.resources[k] += v * left;
    b.job = null;
    return { ok: true, refunded: left };
  }

  // Credits finished units since last time. Safe to call any number of times.
  function settleProduction(state, now) {
    const out = [];
    for (const b of state.buildings) {
      const j = b.job;
      if (!j) continue;
      const made = Math.min(j.qty, Math.max(0, Math.floor((now - j.startAt) / j.unitMs)));
      const fresh = made - j.done;
      if (fresh > 0) {
        state.resources[j.out] += fresh;
        if (!state.discovered.includes(j.out)) state.discovered.push(j.out);
        j.done = made;
      }
      if (j.done >= j.qty) { out.push({ building: b, out: j.out, qty: j.qty }); b.job = null; }
    }
    return out;
  }

  function settleBuildings(state, now) {
    const done = [];
    for (const b of state.buildings) {
      if (b.pending && now >= b.pending.endAt) {
        b.level = b.pending.toLevel;
        b.pending = null;
        done.push(b);
      }
    }
    return done;
  }

  function settle(state, now) {
    return { built: settleBuildings(state, now), produced: settleProduction(state, now), pumpkins: settlePumpkins(state, now), kraken: settleKraken(state, now) };
  }

  // ---------- refined goods ----------
  // Planks, rope and iron sell at any shop (the Stores or a Trading Post) for REFINED_PRICE each.
  function sellRefined(state, res, qty) {
    if (!REFINED.includes(res)) return { ok: false, reason: 'Only planks, rope and iron sell here.' };
    const n = Math.min(state.resources[res], Math.max(0, Math.floor(Number(qty) || 0)));
    if (n < 1) return { ok: false, reason: `No ${RESOURCES[res].name.toLowerCase()} to sell.` };
    state.resources[res] -= n;
    earnCoins(state, n * REFINED_PRICE);
    return { ok: true, qty: n, coins: n * REFINED_PRICE };
  }

  // ---------- trading post ----------
  function trade(state, side, res, qty) {
    if (buildingLevel(state, 'tradingPost') < 1) return { ok: false, reason: 'Build a Trading Post first.' };
    if (side === 'sell' && REFINED.includes(res)) return sellRefined(state, res, qty);
    if (!TRADE[side] || !TRADE[side][res]) return { ok: false, reason: 'Not traded here.' };
    const price = tradePrice(state, side, res);
    let n = Math.floor(qty);
    if (side === 'buy') {
      n = Math.min(n, Math.floor(state.resources.coins / price), Math.max(0, storageCap(state) - state.resources[res]));
      if (n < 1) return { ok: false, reason: state.resources[res] >= storageCap(state) ? 'Storage is full.' : 'Not enough coins.' };
      state.resources.coins -= n * price; state.resources[res] += n;
      if (!state.discovered.includes(res)) state.discovered.push(res);
      return { ok: true, qty: n, coins: n * price };
    }
    n = Math.min(n, state.resources[res]);
    if (n < 1) return { ok: false, reason: `No ${RESOURCES[res].name.toLowerCase()} to sell.` };
    state.resources[res] -= n; earnCoins(state, n * price);
    return { ok: true, qty: n, coins: n * price };
  }

  // ---------- tavern rumors ----------
  const RUMORS = {
    fishing: 'Mackerel are running thick off the north reef.',
    treasure: 'A merchant swears a wreck surfaced in last night’s storm.',
    combat: 'A pirate crew was seen drunk and careless in the next cove.',
    exploration: 'An old sailor sketched an island nobody has charted.',
  };
  function rumorFor(state, now) {
    const lvl = buildingLevel(state, 'tavern');
    if (lvl < 1) return null;
    const day = Math.floor(now / 86400000);
    const types = Object.keys(TYPES);
    const type = types[mulberry32(day * 2654435761)() * types.length | 0];
    const kr = state.lore && state.lore.kraken >= 2 && day % 3 === 0;
    const text = kr ? 'Nobody will sail past the Deep at night. They say something red down there has eyes like eight yellow lanterns.' : RUMORS[type];
    return { type, bonus: round3(1.2 + 0.1 * (lvl - 1)), text, day, kraken: kr };
  }

  // ---------- saving ----------
  const MIGRATIONS = {
    // v0: the hypothetical pre-release format {coins, fish, boat:{cargoLevel}}.
    0: s => ({
      version: 1,
      createdAt: s.createdAt,
      resources: { coins: s.coins, fish: s.fish, shellfish: 0, rareFish: 0 },
      ships: [{ id: 'ship-1', cls: 'skiff', name: 'Little Gull', upgrades: { cargoHold: (s.boat && s.boat.cargoLevel) || 0 }, berth: 0 }],
      expeditions: [], claimed: [], log: [], stats: {}, settings: {}, nextId: 1,
    }),
    // v1 → v2: new resources, full upgrade set, hull points, typed expeditions with stat snapshots.
    1: s => {
      const out = JSON.parse(JSON.stringify(s));
      out.version = 2;
      out.resources = { pearls: 0, relics: 0, charts: 0, ...(s.resources || {}) };
      out.discovered = [...ALWAYS_SHOWN];
      out.ships = (s.ships || []).map((sh, i) => {
        const ship = { ...sh, upgrades: { ...emptyUpgrades(), ...(sh.upgrades || {}) }, berth: Number.isInteger(sh.berth) ? sh.berth : i, lastTrip: { type: 'fishing', hours: 1 } };
        if (SHIP_CLASSES[ship.cls]) ship.hp = shipStats(ship).hull;
        return ship;
      });
      const byId = Object.fromEntries(out.ships.map(x => [x.id, x]));
      out.expeditions = (s.expeditions || []).map(e => ({ ...e, type: 'fishing', stats: byId[e.shipId] && SHIP_CLASSES[byId[e.shipId].cls] ? snapshot(shipStats(byId[e.shipId])) : undefined }));
      out.nextShipId = out.ships.length + 1;
      return out;
    },
    // v2 → v3: village buildings, new goods, trip modifiers. Existing players get the market,
    // the shipwright and a pile of timber to start building with.
    2: s => {
      const out = JSON.parse(JSON.stringify(s));
      out.version = 3;
      out.resources = { timber: 0, hemp: 0, ironOre: 0, planks: 0, rope: 0, iron: 0, food: 0, ...(s.resources || {}) };
      out.resources.timber += 30;
      out.buildings = START_BUILDINGS.map((b, i) => ({ id: 'b-' + (i + 1), type: b.type, gx: b.gx, gy: b.gy, level: 1, pending: null, job: null }));
      out.nextBuildingId = out.buildings.length + 1;
      out.expeditions = (s.expeditions || []).map(e => ({ ...e, mods: { ...NO_MODS }, supplies: false }));
      return out;
    },
    // v3 → v4: the wider sea. Everyone starts with home waters charted.
    3: s => {
      const out = JSON.parse(JSON.stringify(s));
      out.version = 4;
      out.regions = ['home']; out.landmarks = []; out.lore = { kraken: 0 }; out.trophies = {}; out.flags = { witchFound: false }; out.reports = [];
      out.expeditions = (s.expeditions || []).map(e => ({ ...e, region: 'home', mods: { ...(e.mods || NO_MODS), region: 'home' } }));
      return out;
    },
    // v4 → v5: decorations.
    4: s => {
      const out = JSON.parse(JSON.stringify(s));
      out.version = 5;
      out.decor = []; out.nextDecorId = 1;
      return out;
    },
    // v5 → v6: Halloween (candy, the cauldron, a stash of won decorations, ghost visits).
    5: s => {
      const out = JSON.parse(JSON.stringify(s));
      out.version = 6;
      out.decorInv = {}; out.halloween = emptyHalloween();
      out.resources = { candy: 0, ...(s.resources || {}) };
      return out;
    },
  };

  function migrate(s) {
    if (!s || typeof s !== 'object') throw new Error('Save is not an object.');
    let v = s.version;
    if (v === undefined && 'coins' in s) v = 0;
    if (!Number.isInteger(v)) throw new Error('Save has no version.');
    if (v > SAVE_VERSION) throw new Error(`Save is from a newer version (${v}).`);
    while (v < SAVE_VERSION) {
      const m = MIGRATIONS[v];
      if (!m) throw new Error(`No migration from version ${v}.`);
      s = m(s); v = s.version;
    }
    return s;
  }

  function validMods(m) {
    return m && ['power', 'yield', 'damage'].every(k => Number.isFinite(m[k]) && m[k] > 0 && m[k] < 5);
  }
  function validStats(x) {
    return x && typeof x === 'object' && ['speed', 'hull', 'combat', 'cargo', 'fishing', 'exploration', 'magic'].every(k => Number.isFinite(x[k]))
      && x.aff && typeof x.aff === 'object' && Number.isFinite(x.dmg);
  }

  function sanitize(raw, now) {
    const s = newGame(now);
    s.ships = [];
    s.createdAt = Number.isFinite(raw.createdAt) ? raw.createdAt : now;
    s.updatedAt = Number.isFinite(raw.updatedAt) ? raw.updatedAt : now;
    for (const k of Object.keys(RESOURCES)) {
      const v = Number(raw.resources && raw.resources[k]);
      s.resources[k] = Number.isFinite(v) && v >= 0 ? Math.floor(v) : 0;
    }
    s.discovered = [...new Set([...ALWAYS_SHOWN, ...(Array.isArray(raw.discovered) ? raw.discovered.filter(k => k in RESOURCES) : []),
      ...Object.keys(RESOURCES).filter(k => s.resources[k] > 0)])];
    if (!Array.isArray(raw.ships)) throw new Error('Save has no ships.');
    const usedBerths = new Set(), usedIds = new Set();
    for (const sh of raw.ships) {
      if (!sh || typeof sh.id !== 'string' || !SHIP_CLASSES[sh.cls] || usedIds.has(sh.id) || s.ships.length >= MAX_SHIPS) continue;
      usedIds.add(sh.id);
      const up = emptyUpgrades();
      for (const k of UPGRADE_KEYS) up[k] = clampInt(sh.upgrades && sh.upgrades[k], 0, UPGRADES[k].maxLevel);
      const ship = { id: sh.id, cls: sh.cls, name: String(sh.name || SHIP_CLASSES[sh.cls].name).slice(0, 24), upgrades: up, berth: clampInt(sh.berth, 0, MAX_SHIPS - 1), hp: 0, lastTrip: { type: SHIP_CLASSES[sh.cls].role, hours: 1 } };
      if (usedBerths.has(ship.berth)) { for (let i = 0; i < MAX_SHIPS; i++) if (!usedBerths.has(i)) { ship.berth = i; break; } }
      usedBerths.add(ship.berth);
      const max = shipStats(ship).hull;
      ship.hp = sh.hp === undefined ? max : clampInt(sh.hp, 1, max);
      if (sh.lastTrip && TYPES[sh.lastTrip.type] && DURATIONS.includes(sh.lastTrip.hours)) ship.lastTrip = { type: sh.lastTrip.type, hours: sh.lastTrip.hours, region: REGIONS[sh.lastTrip.region] ? sh.lastTrip.region : 'home' };
      if (sh.curse && Number.isFinite(sh.curse.trips) && sh.curse.trips > 0) ship.curse = { trips: clampInt(sh.curse.trips, 1, 9) };
      s.ships.push(ship);
    }
    if (!s.ships.length) throw new Error('Save has no valid ships.');
    const shipById = Object.fromEntries(s.ships.map(x => [x.id, x]));
    s.claimed = Array.isArray(raw.claimed) ? raw.claimed.filter(x => typeof x === 'string').slice(-200) : [];
    const claimedSet = new Set(s.claimed);
    const seenShip = new Set();
    s.expeditions = (Array.isArray(raw.expeditions) ? raw.expeditions : [])
      .filter(e => e && typeof e.id === 'string' && shipById[e.shipId] && DURATIONS.includes(e.hours)
        && Number.isFinite(e.startAt) && Number.isFinite(e.endAt) && !claimedSet.has(e.id))
      .filter(e => (seenShip.has(e.shipId) ? false : (seenShip.add(e.shipId), true)))
      .map(e => ({
        id: e.id, shipId: e.shipId, type: TYPES[e.type] ? e.type : 'fishing', hours: e.hours, startAt: e.startAt, endAt: e.endAt,
        seed: (Number(e.seed) >>> 0), dev: !!e.dev,
        stats: validStats(e.stats) ? snapshot({ ...e.stats, aff: { fishing: 1, treasure: 1, combat: 1, exploration: 1, ...e.stats.aff } }) : snapshot(shipStats(shipById[e.shipId])),
        mods: validMods(e.mods) ? { power: e.mods.power, yield: e.mods.yield, damage: e.mods.damage, region: REGIONS[e.mods.region] ? e.mods.region : 'home',
          ...(e.mods.charm ? { charm: true } : {}), ...(e.mods.beginner ? { beginner: true } : {}), ...(Number.isFinite(e.mods.chestMult) ? { chestMult: e.mods.chestMult } : {}), ...(Number.isFinite(e.mods.coins) && e.mods.coins > 0 && e.mods.coins < 2 ? { coins: e.mods.coins } : {}), ...(Number.isFinite(e.mods.candy) && e.mods.candy >= 1 && e.mods.candy <= 1 + HALLOWEEN.candyCap ? { candy: e.mods.candy } : {}) } : { ...NO_MODS, region: 'home' },
        supplies: !!e.supplies, region: REGIONS[e.region] ? e.region : 'home',
      }));
    s.log = Array.isArray(raw.log) ? raw.log.filter(x => x && typeof x === 'object').slice(0, 30) : [];
    s.regions = ['home', ...new Set((Array.isArray(raw.regions) ? raw.regions : []).filter(k => REGIONS[k] && k !== 'home'))];
    s.landmarks = [...new Set((Array.isArray(raw.landmarks) ? raw.landmarks : []).filter(k => REGIONS[k] && REGIONS[k].landmark))];
    s.lore = { kraken: clampInt(raw.lore && raw.lore.kraken, 0, 999) };
    s.trophies = {};
    for (const k of Object.keys(TROPHIES)) { const n = clampInt(raw.trophies && raw.trophies[k], 0, 999); if (n) s.trophies[k] = n; }
    s.flags = { witchFound: !!(raw.flags && raw.flags.witchFound) };
    s.reports = Array.isArray(raw.reports) ? raw.reports.filter(x => x && Array.isArray(x.lines)).slice(0, 25) : [];
    // buildings
    s.buildings = [];
    const seenType = new Set(), seenBid = new Set();
    for (const b of (Array.isArray(raw.buildings) ? raw.buildings : [])) {
      if (!b || typeof b.id !== 'string' || !BUILDINGS[b.type] || BUILDINGS[b.type].locked || seenType.has(b.type) || seenBid.has(b.id)) continue;
      if (b.type === 'seaWitch' && !(raw.flags && raw.flags.witchFound)) continue;
      const nb = { id: b.id, type: b.type, gx: clampInt(b.gx, BUILD_MIN, MAP_SIZE - 1), gy: clampInt(b.gy, BUILD_MIN, MAP_SIZE - 1), level: clampInt(b.level, 0, BUILDING_MAX_LEVEL), pending: null, job: null };
      const f = footprint(nb.type, nb.gx, nb.gy);
      // the hut grew to 3x3 in 1.5.4: it neither knocks out nor is knocked out by neighbours here; fitBuilding moves it below
      if (nb.type !== 'seaWitch' && s.buildings.some(o => o.type !== 'seaWitch' && overlaps(f, footprint(o.type, o.gx, o.gy)))) continue;
      const p = b.pending;
      if (p && Number.isFinite(p.endAt) && Number.isInteger(p.toLevel) && p.toLevel === nb.level + 1 && p.toLevel <= BUILDING_MAX_LEVEL)
        nb.pending = { toLevel: p.toLevel, startAt: Number.isFinite(p.startAt) ? p.startAt : p.endAt, endAt: p.endAt };
      if (nb.level === 0 && !nb.pending) continue; // an unfinished site with no work order is dropped
      const j = b.job, rc = BUILDINGS[nb.type].recipe;
      if (j && rc && j.out === rc.out && Number.isFinite(j.startAt) && Number.isFinite(j.unitMs) && j.unitMs > 0) {
        const qty = clampInt(j.qty, 1, 1000);
        nb.job = { out: rc.out, per: { ...rc.in }, qty, done: clampInt(j.done, 0, qty), startAt: j.startAt, unitMs: j.unitMs };
      }
      seenType.add(nb.type); seenBid.add(nb.id);
      s.buildings.push(nb);
    }
    for (const sb of START_BUILDINGS) if (!seenType.has(sb.type)) {
      const f = footprint(sb.type, sb.gx, sb.gy);
      if (!s.buildings.some(o => overlaps(f, footprint(o.type, o.gx, o.gy)))) s.buildings.push({ id: 'b-x' + sb.type, type: sb.type, gx: sb.gx, gy: sb.gy, level: 1, pending: null, job: null });
    }
    let maxB = 0;
    for (const b of s.buildings) { const n = parseInt(b.id.replace('b-', ''), 10); if (Number.isFinite(n)) maxB = Math.max(maxB, n); }
    s.nextBuildingId = Math.max(clampInt(raw.nextBuildingId, 1, 1e9), maxB + 1);
    // decorations: one of each, placed ones on the map and clear of everything else
    s.decor = [];
    const seenDecor = new Set();
    for (const d of (Array.isArray(raw.decor) ? raw.decor : [])) {
      if (!d || typeof d.id !== 'string' || !DECOR[d.type] || seenDecor.has(d.type) || s.decor.some(x => x.id === d.id)) continue;
      if (DECOR[d.type].multi && s.decor.filter(x => x.type === d.type).length >= DECOR_COPIES) continue;
      if (DECOR[d.type].hw && s.decor.filter(x => DECOR[x.type].hw).length >= 200) continue;
      const nd = { id: d.id, type: d.type, gx: null, gy: null };
      if (DECOR[d.type].variants) nd.v = clampInt(d.v, 0, DECOR[d.type].variants - 1);
      if (!DECOR[d.type].fixed) {
        if (!Number.isInteger(d.gx) || !Number.isInteger(d.gy)) continue;
        nd.gx = clampInt(d.gx, BUILD_MIN, MAP_SIZE - 1); nd.gy = clampInt(d.gy, BUILD_MIN, MAP_SIZE - 1);
        const f = footprint(nd.type, nd.gx, nd.gy);
        if (placedThings(s).some(o => o.type !== 'seaWitch' && overlaps(f, footprint(o.type, o.gx, o.gy)))) continue;
      }
      if (!DECOR[d.type].hw && !DECOR[d.type].multi) seenDecor.add(d.type);
      s.decor.push(nd);
    }
    let maxD = 0;
    for (const d of s.decor) { const n = parseInt(d.id.replace('d-', ''), 10); if (Number.isFinite(n)) maxD = Math.max(maxD, n); }
    s.nextDecorId = Math.max(clampInt(raw.nextDecorId, 1, 1e9), maxD + 1);
    fitBuilding(s, 'seaWitch'); // the map's own terrain is checked again once the world is up
    s.decorInv = {};
    for (const k of HW_DECOR) { const n = clampInt(raw.decorInv && raw.decorInv[k], 0, 999); if (n) s.decorInv[k] = n; }
    { // 1.7: the kraken's yearly record
      const rk = raw.kraken || {}, K = s.kraken = emptyKraken();
      K.start = Number.isFinite(rk.start) ? rk.start : null; K.cycle = Number.isFinite(rk.cycle) ? rk.cycle : null;
      K.breachSeen = !!rk.breachSeen; K.looted = !!rk.looted; K.lighthouseDown = !!rk.lighthouseDown;
      K.hits = Array.from({ length: KRAKEN.eyes }, (_, i) => (Array.isArray(rk.hits) && Number.isFinite(rk.hits[i]) && rk.hits[i] > 0 ? rk.hits[i] : 0));
      K.deadAt = Number.isFinite(rk.deadAt) && K.hits.every(Boolean) ? rk.deadAt : null;
    }
    const rh = raw.halloween || {}, H = s.halloween;
    H.brewSeq = clampInt(rh.brewSeq, 0, 1e9);
    const lb = rh.lastBrew;
    if (lb && Number.isInteger(lb.id) && CAULDRON.tiers[lb.tier] && RARITY[lb.rarity]) {
      const items = {};
      for (const [k, v] of Object.entries(lb.items || {})) if (k in RESOURCES) items[k] = clampInt(v, 0, 1e6);
      H.lastBrew = { id: lb.id, tier: lb.tier, at: Number.isFinite(lb.at) ? lb.at : now, seen: !!lb.seen, rarity: lb.rarity, items, decor: DECOR[lb.decor] && DECOR[lb.decor].hw ? lb.decor : null };
      H.brewSeq = Math.max(H.brewSeq, lb.id);
    }
    H.popped = Array.isArray(rh.popped) ? rh.popped.filter(x => typeof x === 'string').slice(-40) : [];
    H.pops = Array.isArray(rh.pops) ? rh.pops.filter(Number.isFinite).slice(-HALLOWEEN.ghost.maxPerHour) : [];
    H.nextShipAt = Number.isFinite(rh.nextShipAt) ? rh.nextShipAt : null;
    // a timer further out than one cycle (a clock change) is pulled back, so it can't stall or be skipped
    H.pumpkinAt = Number.isFinite(rh.pumpkinAt) ? Math.min(rh.pumpkinAt, now + HALLOWEEN.pumpkin.hours * HOUR_MS) : null;
    const sh = rh.ship;
    if (sh && typeof sh.id === 'string' && Number.isFinite(sh.arriveAt) && Number.isFinite(sh.leaveAt) && Array.isArray(sh.offers))
      H.ship = { id: sh.id, arriveAt: sh.arriveAt, leaveAt: Math.min(sh.leaveAt, sh.arriveAt + HALLOWEEN.ship.stayMin * 60000),
        offers: sh.offers.filter(o => o && GHOST_TRADES.some(t => t.id === o.id)).slice(0, 6).map(o => ({ id: o.id, done: !!o.done })) };
    for (const k of Object.keys(STAT_DEFS)) {
      const v = Number(raw.stats && raw.stats[k]);
      s.stats[k] = Number.isFinite(v) && v >= 0 ? Math.floor(v) : 0;
    }
    s.stats.maxCoins = Math.max(s.stats.maxCoins, s.resources.coins);
    if (!(raw.stats && Number.isFinite(raw.stats.tripsStarted))) s.stats.tripsStarted = s.stats.expeditions + (Array.isArray(raw.expeditions) ? raw.expeditions.length : 0) + (raw.version < 4 || s.stats.expeditions > 0 ? BEGINNER_TRIPS : 0);
    const cr = raw.crops;
    s.crops = cr && Number.isFinite(cr.plantedAt) && Number.isFinite(cr.readyAt) && cr.readyAt >= cr.plantedAt ? { plantedAt: cr.plantedAt, readyAt: cr.readyAt } : null;
    s.settings.devMode = !!(raw.settings && raw.settings.devMode);
    const sp = raw.settings && raw.settings.devSecondsPerHour;
    s.settings.devSecondsPerHour = DEV_SPEEDS.includes(sp) ? sp : 2;
    const au = (raw.settings && raw.settings.audio) || {};
    const vol = (v, d) => (Number.isFinite(v) ? Math.min(1, Math.max(0, v)) : d);
    s.settings.audio = { music: vol(au.music, 0.45), sfx: vol(au.sfx, 0.8), ambience: vol(au.ambience, 0.25) };
    s.settings.batterySaver = !!(raw.settings && raw.settings.batterySaver);
    s.settings.eventOverride = ['on', 'off'].includes(raw.settings && raw.settings.eventOverride) ? raw.settings.eventOverride : 'auto';
    const sk = (raw.settings && raw.settings.sky) || {};
    const pl = sk.place;
    s.settings.sky = {
      time: SKY_TIMES.includes(sk.time) ? sk.time : 'live',
      weather: SKY_WEATHER.includes(sk.weather) ? sk.weather : 'live',
      place: pl && Number.isFinite(pl.lat) && Number.isFinite(pl.lon) && Math.abs(pl.lat) <= 90 && Math.abs(pl.lon) <= 180
        ? { lat: pl.lat, lon: pl.lon, name: String(pl.name || '').slice(0, 60) } : null,
    };
    let maxId = 0;
    for (const id of [...s.claimed, ...s.expeditions.map(e => e.id)]) {
      const n = parseInt(String(id).replace('exp-', ''), 10);
      if (Number.isFinite(n)) maxId = Math.max(maxId, n);
    }
    s.nextId = Math.max(clampInt(raw.nextId, 1, 1e12), maxId + 1);
    let maxShip = 0;
    for (const sh of s.ships) { const n = parseInt(sh.id.replace('ship-', ''), 10); if (Number.isFinite(n)) maxShip = Math.max(maxShip, n); }
    s.nextShipId = Math.max(clampInt(raw.nextShipId, 1, 1e9), maxShip + 1);
    return s;
  }

  function loadGame(storage, now) {
    const errors = [];
    for (const key of [SAVE_KEY, BACKUP_KEY]) {
      let raw;
      try { raw = storage.getItem(key); } catch (e) { errors.push(`${key}: ${e.message}`); continue; }

        const parsed = JSON.parse(raw);
        const inner = parsed && parsed.format === 'tof' ? parsed.state : parsed;
        const state = sanitize(migrate(inner), now);
        return { state, source: key === SAVE_KEY ? 'save' : 'backup', errors };
      } catch (e) {
        errors.push(`${key}: ${e.message}`);
      }
    }
    return { state: newGame(now), source: 'new', errors };
  }

  function saveGame(storage, state, now) {
    try {
      state.updatedAt = now;
      const raw = JSON.stringify({ format: 'tof', savedAt: now, state });
      const prev = storage.getItem(SAVE_KEY);
      if (prev && prev !== raw) storage.setItem(BACKUP_KEY, prev);
      storage.setItem(SAVE_KEY, raw);
      return true;
    } catch (e) {
      return false;
    }
  }

  // ---------- backup codes ----------
  // A save as one copy-pasteable line: "TOF-SAVE:" + base64 of the JSON.
  const CODE_PREFIX = 'TOF-SAVE:';
  function b64encode(str) {
    if (typeof TextEncoder !== 'undefined' && typeof btoa === 'function') { let bin = ''; for (const b of new TextEncoder().encode(str)) bin += String.fromCharCode(b); return btoa(bin); }
    return Buffer.from(str, 'utf8').toString('base64');
  }
  function b64decode(b64) {
    if (typeof TextDecoder !== 'undefined' && typeof atob === 'function') { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }
    return Buffer.from(b64, 'base64').toString('utf8');
  }
  function exportSave(state, now) { return CODE_PREFIX + b64encode(JSON.stringify({ format: 'tof', savedAt: now, state })); }
  function importSave(code, now) {
    try {
      let txt = String(code || '').trim();
      if (txt.startsWith(CODE_PREFIX)) txt = b64decode(txt.slice(CODE_PREFIX.length).replace(/\s+/g, ''));
      const parsed = JSON.parse(txt);
      const inner = parsed && parsed.format === 'tof' ? parsed.state : parsed;
      return { ok: true, state: sanitize(migrate(inner), now) };
    } catch (e) {
      return { ok: false, reason: 'That doesn’t look like a Tides of Fortune save.' };
    }
  }

  function resetSave(storage) {
    try { storage.removeItem(SAVE_KEY); storage.removeItem(BACKUP_KEY); } catch (e) { /* ignore */ }
  }

  return {
    SAVE_VERSION, SAVE_KEY, BACKUP_KEY, HOUR_MS, DURATIONS, DEV_SPEEDS, MAX_SHIPS, MIN_SAIL_HULL,
    RESOURCES, SELLABLE, ALWAYS_SHOWN, BULK, TYPES, SHIP_CLASSES, CLASS_ORDER, UPGRADES, UPGRADE_KEYS,
    BUILDINGS, BUILDING_ORDER, BUILD_HOURS, MAX_BUILDERS, MAP_SIZE, BUILD_MIN, SKY_TIMES, SKY_WEATHER, BUILDING_MAX_LEVEL, TRADE, START_BUILDINGS,
    getBuilding, buildingOfType, buildingLevel, buildersBusy, storageCap, sellPrice, tradePrice, buildCost, buildHours, footprint,
    buildLock, placeCheck, placeBuilding, upgradeBlock, upgradeBuilding, recipeSpeed, maxBatch, queueJob, cancelJob,
    settleProduction, settleBuildings, settle, trade, rumorFor, tripMods, foodFor, upgradeGate, repairPlanks,
    NON_CARGO, FAMILIES, SIZES, CHESTS, KEY_OF, CHEST_SIZES, TROPHIES, MONSTERS, KRAKEN_HINTS, REGIONS, REGION_ORDER,
    regionLock, revealRegion, regionSailBlock, openChest, craftCharm, cleanse, trophyBonus, tripReport,
    newGame, getShip, shipStats, typePower, durationMult, shipStatus, expeditionForShip,
    classLock, buildShip, renameShip, addShip,
    rollExpedition, rollFishing, estimate, estimateFishing, hourMs, sailBlock, dispatch, claim, claimAll, finishAllNow,
    repairCost, repair, sell, sellAll, canAfford, upgradeCost, buyUpgrade,
    migrate, sanitize, loadGame, saveGame, resetSave, mulberry32, exportSave, importSave,

    HALLOWEEN, CAULDRON, GHOST_TRADES, HW_DECOR, RARITY, REFINED, REFINED_PRICE, halloweenActive, candyMult, brew, brewSeen, popGhost, settleGhostShip, ghostTrade, KRAKEN, krakenView, krakenStart, settleKraken, strikeEye, lootKraken, emptyKraken, ghostBoost, ghostFinalHour, halloweenEndsAt, pumpkinStatus, harvestPumpkins, settlePumpkins, stowDecor, sellRefined, batchLimit, BATCH_PER_LEVEL,

// ============================================================

function runTofTests(TOF) {

  });

  test('dispatch uses absolute timestamps and blocks double sailing', () => {
    const s = veteran(T0);

    eq(r.exp.endAt, T0 + 4 * H, 'endAt');
    eq(TOF.shipStatus(s, 'ship-1', T0 + 1), 'away', 'away');
    eq(TOF.shipStatus(s, 'ship-1', T0 + 4 * H), 'returned', 'returned');

    ok(!TOF.dispatch(s, 'ship-1', 3, T0, 1).ok, 'odd duration rejected');

  test('claim credits inventory exactly once', () => {

    const c = TOF.claim(s, exp.id, T0 + 2 * H);
    ok(c.ok, 'claim ok');
    for (const k of ['fish', 'shellfish', 'rareFish']) eq(s.resources[k], before[k] + (c.result.items[k] || 0), k);
    const after = JSON.stringify(s.resources);
    const again = TOF.claim(s, exp.id, T0 + 3 * H);
    ok(!again.ok, 'second claim rejected');
    eq(again.reason, 'Already collected.', 'reason');
    eq(JSON.stringify(s.resources), after, 'resources unchanged');
    eq(TOF.shipStatus(s, 'ship-1', T0 + 3 * H), 'idle', 'ship free again');

  test('rewards are deterministic per seed and respect cargo', () => {
    const ship = veteran(T0).ships[0];

    eq(JSON.stringify(a), JSON.stringify(b), 'same seed same result');
    for (let seed = 0; seed < 300; seed++) {
      const r = TOF.rollFishing(ship, 24, seed);
      const total = Object.entries(r.items).filter(([k]) => !TOF.NON_CARGO.has(k)).reduce((x, [, y]) => x + y, 0);
      ok(total <= r.capacity, 'within capacity');
      for (const v of Object.values(r.items)) ok(Number.isInteger(v) && v > 0, 'positive ints');
    }
  });

  test('longer trips pay more in total and find rares more often', () => {
    const ship = { id: 'x', cls: 'skiff', upgrades: { cargoHold: 3 } };
    let f1 = 0, f8 = 0, r1 = 0, r24 = 0;
    for (let seed = 0; seed < 400; seed++) {
      f1 += TOF.rollFishing(ship, 1, seed).items.fish || 0;
      f8 += TOF.rollFishing(ship, 8, seed).items.fish || 0;
      r1 += TOF.rollFishing(ship, 1, seed).items.rareFish || 0;
      r24 += TOF.rollFishing(ship, 24, seed).items.rareFish || 0;
    }

    ok(!TOF.buyUpgrade(s, 'ship-1', 'cargoHold').ok, 'max level');
    eq(TOF.shipStats(s.ships[0]).cargo, 150, 'final capacity');

// ============================================================
// art.js — procedural pixel art. Everything is drawn pixel by
// pixel into a Pix buffer (no anti-aliasing), so edges stay crisp.
// ============================================================
const Art = (() => {
  'use strict';
  const HW = 16, HH = 8;

  const _cc = new Map();
  function C(hex) {
    if (Array.isArray(hex)) return hex;
    let c = _cc.get(hex);

    let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul((s | 0) + 1, 982451653);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  class Pix {
    constructor(w, h) { this.w = w; this.h = h; this.d = new Uint8ClampedArray(w * h * 4); }
    set(x, y, c, a = 255) {

      if (!c || x < 0 || y < 0 || x >= this.w || y >= this.h) return;
      c = C(c);

      if (a >= 255) { d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255; return; }

      d[i + 3] = o * 255;
    }
    a(x, y) { return (x < 0 || y < 0 || x >= this.w || y >= this.h) ? 0 : this.d[(y * this.w + x) * 4 + 3]; }

      const fn = typeof fill === 'function';
      for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) {
        const dx = x + 0.5 - cx, dy = y + 0.5 - cy;

      for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++) {

      x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;

    ink: '#2a1d17',
    grassA: '#5fa043', grassB: '#6aad4a', grassC: '#78b952', grassHi: '#93cc63', grassDk: '#4b8636', flower1: '#f2e27a', flower2: '#f4f0e8', flower3: '#e58ea8',

    sand1: '#e6d29a', sand2: '#dcc58a', sand3: '#efdfae',
    soil1: '#8a5a36', soil2: '#7a4d2d', crop1: '#86b84a', crop2: '#a7cf5c',

  function drawBlock(p, tx, ty, o) {
    const { fw, fd, wall, roof } = o;
    const z0 = o.z0 || 0;
    const G0 = corners(tx, ty, fw, fd);
    const up = (q, h) => [q[0], q[1] - h];
    const G = { t: up(G0.t, z0), r: up(G0.r, z0), b: up(G0.b, z0), l: up(G0.l, z0) };
    const U = { t: up(G.t, wall), r: up(G.r, wall), b: up(G.b, wall), l: up(G.l, wall) };
    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const hsh = o.seed || 1;
    const found = o.found || 2;

    const feats = [];
    const Ll = G.b[0] - G.l[0], Lr = G.r[0] - G.b[0];
    const addWindows = (face, L, skipC) => {
      const n = Math.max(1, Math.floor(L / 12));
      for (let i = 0; i < n; i++) {
        const c = (i + 0.5) * L / n;
        if (skipC !== undefined && Math.abs(c - skipC) < 7) continue;
        if (wall < 9) continue;
        feats.push({ face, x0: c - 2, x1: c + 2, z0: Math.round(wall * 0.45), z1: Math.round(wall * 0.45) + 4, kind: 'win' });
        if (wall >= 20) feats.push({ face, x0: c - 2, x1: c + 2, z0: wall - 7, z1: wall - 3, kind: 'win' });
      }
    };
    const doorW = o.bigDoor ? 10 : 5, doorH = o.bigDoor ? Math.min(11, wall - 2) : Math.min(8, wall - 2);
    const doorFace = o.door || 'R', doorL = doorFace === 'R' ? Lr : Ll, doorC = doorL * (o.doorAt || 0.5);
    if (!o.noDoor) feats.push({ face: doorFace, x0: doorC - doorW / 2, x1: doorC + doorW / 2, z0: found - 1, z1: doorH + found - 2, kind: o.forge ? 'forge' : 'door' });
    addWindows('L', Ll, !o.noDoor && doorFace === 'L' ? doorC : undefined);
    if (!o.noRightWindows) addWindows('R', Lr, !o.noDoor && doorFace === 'R' ? doorC : undefined);

    const featColor = (f, sx, z) => {
      const edge = sx - f.x0 < 1 || f.x1 - sx < 1 || z - f.z0 < 1 || f.z1 - z < 1;
      if (f.kind === 'forge') {
        if (edge && z > f.z0 + 0.5) return '#3a2a1e';
        return z < f.z0 + 3 ? (hash(sx | 0, z | 0, 5) < 0.5 ? '#ff9a3c' : '#ffd27a') : '#2a1d17';
      }
      if (f.kind === 'door') {
        if (edge && z > f.z0 + 0.5) return '#4a2f1c';
        if (Math.abs(sx - (f.x1 - 1.5)) < 0.6 && Math.abs(z - (f.z0 + f.z1) * 0.5) < 0.6) return '#e0b44a';
        return ((sx | 0) % 2 === 0) ? '#6b4428' : '#5d3b22';
      }
      if (o.shutters && (sx - f.x0 < 1.2 || f.x1 - sx < 1.2)) return '#3f6fb0';
      if (edge) return '#4a2f1c';
      return (z > f.z1 - 2 && sx < f.x0 + 2) ? '#fff2b8' : '#f2c75c';
    };
    const face = (P, Q, k, fc) => {
      const L = Q[0] - P[0], slope = (Q[1] - P[1]) / L;
      return (x, y) => {
        const sx = x + 0.5 - P[0], z = (P[1] + sx * slope) - (y + 0.5);
        for (const f of feats) if (f.face === fc && sx >= f.x0 && sx <= f.x1 && z >= f.z0 && z <= f.z1) { const c = C(featColor(f, sx, z)); return k < 1 ? shade(c, 0.88) : c; }
        if (z < found) return shade(hash(sx >> 2, z | 0, 7) < 0.5 ? '#77736c' : '#6a665f', k);
        if (o.trim && z > wall - 1.6) return shade(o.trim, k);
        return wallColor(o.mat, sx, z, L, wall, k, hsh + (fc === 'R' ? 3 : 0));
      };
    };
    p.poly([G.l, G.b, U.b, U.l], face(G.l, G.b, 1.0, 'L'));
    p.poly([G.b, G.r, U.r, U.b], face(G.b, G.r, 0.78, 'R'));

    const rows = Math.max(3, Math.round(roof / 2.5));
    const roofFn = (E0, R0, base, k, slopeSign = 0.5) => (x, y) => {
      const yE = E0[1] + (x + 0.5 - E0[0]) * slopeSign, yR = R0[1] + (x + 0.5 - R0[0]) * slopeSign;
      const t = (yE - (y + 0.5)) / Math.max(1, yE - yR);
      const row = Math.floor(t * rows);
      if (t < 0.1) return shade(base, k * 0.62);
      if (((x + row * 3) % 6) === 0) return shade(base, k * 0.78);
      if (((t * rows) % 1) < 0.28) return shade(base, k * 0.86);
      return shade(base, k * (0.95 + 0.1 * t));
    };
    let ridgeA, ridgeB;
    if (o.roofStyle === 'hip') {
      const ctr = [(U.t[0] + U.b[0]) / 2, (U.t[1] + U.b[1]) / 2];
      const ext = Math.max(0, (fw - fd)) * 0.5;
      const A = up([ctr[0] - ext * HW, ctr[1] - ext * HH], roof), B = up([ctr[0] + ext * HW, ctr[1] + ext * HH], roof);
      ridgeA = A; ridgeB = B;
      p.poly([U.t, U.r, B, A], roofFn(U.t, A, o.roofC, 1.12));
      p.poly([U.t, U.l, A], roofFn(U.t, A, o.roofC, 1.05, -0.5));
      p.poly([U.r, U.b, B], roofFn(U.b, B, o.roofC, 0.84, -0.5));
      p.poly([U.l, U.b, B, A], roofFn(U.l, A, o.roofC, 1.0));
      if (A[0] !== B[0]) p.line(A[0], A[1], B[0], B[1], shade(o.roofC, 0.6));
    } else {
      const RA = up(mid(U.t, U.l), roof), RB = up(mid(U.r, U.b), roof);
      ridgeA = RA; ridgeB = RB;
      p.poly([U.t, U.r, RB, RA], roofFn(U.t, RA, o.roofC, 1.12));
      const Lg = U.r[0] - U.b[0];
      p.poly([U.b, U.r, RB], (x, y) => {
        const sx = x + 0.5 - U.b[0];
        const gc = [Lg / 2, roof * 0.45];
        const z = (U.b[1] - sx * 0.5) - (y + 0.5);
        if (roof >= 8 && Math.abs(sx - gc[0]) < 2.2 && Math.abs(z - gc[1]) < 2.2) return Math.abs(sx - gc[0]) < 1.2 && Math.abs(z - gc[1]) < 1.2 ? '#f2c75c' : '#4a2f1c';
        return wallColor(o.mat === 'stone' ? 'stone' : o.mat === 'plaster' ? 'plaster-g' : 'wood', sx, z + wall, Lg, 999, 0.86, hsh + 9);
      });
      p.poly([U.l, U.b, RB, RA], roofFn(U.l, RA, o.roofC, 1.0));
      p.line(RA[0], RA[1], RB[0], RB[1], o.ridgeC || shade(o.roofC, 0.6));
    }
    const smoke = [];
    if (o.chimney) {
      const c = [ridgeA[0] + (ridgeB[0] - ridgeA[0]) * 0.28, ridgeA[1] + (ridgeB[1] - ridgeA[1]) * 0.28 + 4];
      const cx = Math.round(c[0]), cy = Math.round(c[1]);
      const big = o.bigChimney ? 1 : 0, hgt = o.bigChimney ? 14 : 9;
      p.rect(cx - 2 - big, cy - hgt + 2, 2 + big, hgt, '#a39d92'); p.rect(cx, cy - hgt + 2, 2 + big, hgt, '#878177');
      p.rect(cx - 3 - big, cy - hgt + 1, 6 + big * 2, 2, '#5f5a53');
      smoke.push([cx, cy - hgt]);
    }
    if (o.flag) {
      const fx = Math.round(ridgeB[0]), fy = Math.round(ridgeB[1]);
      p.rect(fx, fy - 13, 1, 13, '#3b3d40'); p.set(fx, fy - 14, '#e0b44a');
      p.rect(fx + 1, fy - 13, 6, 2, o.flag); p.rect(fx + 1, fy - 11, 4, 2, o.flag); p.rect(fx + 1, fy - 13, 1, 4, shade(o.flag, 0.75));
    }
    if (o.awning) {
      const pt = (sx, z) => [G.b[0] + sx, G.b[1] - sx * 0.5 - z];
      const zA = Math.round(wall * 0.78);
      const A = pt(1, zA), B = pt(Lr - 1, zA);
      const D = [A[0] + 6, A[1] + 7], Cc = [B[0] + 6, B[1] + 7];
      p.poly([A, B, Cc, D], (x) => (((x - A[0]) / 4 | 0) % 2 ? o.awning[0] : o.awning[1]));
      for (let i = 0; i < 3; i++) {
        const q = pt(4 + i * (Lr - 8) / 2, 3);
        p.rect(q[0] + 2, q[1] - 1, 5, 3, '#7c5131');
        p.rect(q[0] + 3, q[1] - 2, 3, 1, i === 1 ? '#e58a6a' : '#9cc3d6');
      }
    }
    if (o.sign) {
      const sx = Ll * 0.78, z = wall * 0.7;
      const q = [G.l[0] + sx, G.l[1] + sx * 0.5 - z];
      p.rect(q[0] - 1, q[1] - 1, 1, 4, '#4a2f1c');
      p.rect(q[0] - 5, q[1] + 1, 6, 5, '#e0b44a'); p.rect(q[0] - 4, q[1] + 2, 4, 3, o.sign);
    }
    return { smoke, top: Math.min(ridgeA[1], ridgeB[1]) };
  }

  // Classic single-block building (decorative cottages, chapel).
  function building(o) {
    const { fw, fd, wall, roof } = o;
    const top = wall + roof + 18;
    const W = (fw + fd) * HW + 12, H = (fw + fd) * HH + top + 8;
    const p = new Pix(W, H);
    const tx = 1 + fd * HW, ty = top;
    const res = drawBlock(p, tx, ty, o);
    const G = corners(tx, ty, fw, fd);
    p.outline(PAL.ink);
    const sh = [G.b, G.r, [G.r[0] + 5, G.r[1] + 2.5], [G.b[0] + 5, G.b[1] + 2.5]];
    p.poly(sh, (x, y) => (p.a(x, y) ? null : '#1d3a1a'), 70);
    const s = sprite(p, G.b[0], G.b[1]);
    s.smoke = res.smoke.map(([x, y]) => [x - G.b[0], y - G.b[1]]);
    s.hauntInfo = { tx, ty, fw, fd, wall };
    return s;
  }

  // ---------------------------------------------------------- props
  function tree(kind, seed) {
    const p = new Pix(20, 28);
    const cx = 10;
    if (kind === 'pine') {
      p.rect(cx - 1, 21, 2, 4, '#6b4428');
      for (let i = 0; i < 4; i++) {
        const yT = 3 + i * 4, yB = 10 + i * 4, hw = 3 + i * 1.6;
        p.poly([[cx, yT], [cx + hw + 0.5, yB], [cx - hw - 0.5, yB]], (x, y) => {
          const n = hash(x, y, seed);
          if (x < cx - 0.5 && n < 0.5) return '#4f9a4e';
          return n < 0.15 ? '#2c5e33' : '#3b7a40';
        });
      }
    } else if (kind === 'bush') {
      p.circle(cx, 21, 4.5, '#3f7d3c'); p.circle(cx - 2, 20, 3.5, (x, y) => (hash(x, y, seed) < 0.3 ? '#5da24b' : '#4b8f45'));
      if (seed % 3 === 0) { p.set(cx - 2, 19, PAL.flower3); p.set(cx + 2, 21, PAL.flower3); }
    } else {
      p.rect(cx - 1, 17, 3, 8, '#6b4428'); p.rect(cx + 1, 17, 1, 8, '#55351f');
      const big = kind === 'oak';
      const r = big ? 8 : 6.5, cy = big ? 10 : 12;
      p.circle(cx, cy + 1, r, '#2f6a35');
      p.circle(cx - 1, cy, r - 1, (x, y) => (hash(x, y, seed) < 0.18 ? '#3a7b3c' : '#4a9445'));
      p.circle(cx - 3, cy - 3, r * 0.45, (x, y) => (hash(x, y, seed + 1) < 0.25 ? '#4a9445' : '#69b356'));
      if (hash(seed, 1, 2) < 0.3) { p.set(cx + 2, cy - 1, '#d9483b'); p.set(cx - 4, cy + 2, '#d9483b'); }
    }
    p.outline(PAL.ink);
    p.ellipse(cx, 25, 6, 2, '#1d3a1a', 60);
    return sprite(p, cx, 25);
  }

  function lighthouse() {
    const p = new Pix(26, 60);
    const cx = 13, base = 52;
    p.rect(cx - 9, base - 2, 18, 6, '#8d8f8c'); p.rect(cx - 9, base - 2, 18, 1, '#b4b6b0'); p.rect(cx + 2, base - 1, 7, 5, '#767876');
    for (let y = base - 3; y >= 18; y--) {
      const t = (base - 3 - y) / (base - 21);
      const hw = 6.5 - t * 2;
      const band = Math.floor((base - 3 - y) / 7) % 2;
      for (let x = Math.round(cx - hw); x < Math.round(cx + hw); x++) {
        const k = x < cx - hw * 0.3 ? 1.08 : x > cx + hw * 0.35 ? 0.78 : 0.95;
        p.set(x, y, shade(band ? '#efe9df' : '#c8463c', k));
      }
    }
    p.rect(cx - 2, base - 9, 3, 6, '#4a2f1c');
    p.rect(cx - 6, 16, 12, 2, '#3b3d40'); p.rect(cx - 6, 15, 12, 1, '#5a5d61');
    p.rect(cx - 4, 9, 8, 6, '#ffe48a'); p.rect(cx - 4, 9, 1, 6, '#3b3d40'); p.rect(cx + 3, 9, 1, 6, '#3b3d40'); p.rect(cx - 1, 9, 1, 6, '#c9a64a');
    p.poly([[cx, 2], [cx + 5.5, 9], [cx - 5.5, 9]], (x) => (x < cx ? '#d0504a' : '#a83b35'));
    p.rect(cx, 0, 1, 3, '#3b3d40');
    p.outline(PAL.ink);
    return sprite(p, cx, base + 2);
  }

  function rock(seed) {
    const p = new Pix(14, 10);
    p.ellipse(7, 6, 6, 3.5, '#767876');

  function ship(dir, o, seed = 1) {
    const L = o.L, B = o.B, hullH = o.hullH || 4;
    const maxH = Math.max(...o.masts.map(m => m.h)) + 5;
    const W = Math.ceil(2 * (L + B)) + 16, H = Math.ceil(maxH + (L + B) + 14);
    const p = new Pix(W, H);
    const cx = Math.floor(W / 2), cy = Math.floor(maxH + (L + B) / 2 + 6);
    const pr = (a, b, h) => [cx + dir * (a - b), cy + dir * (a + b) / 2 - h];
    const tpl = o.shape === 'flat' ? HULL_FLAT : HULL_POINTED;
    const hullAt = (sa, sb, h) => tpl.map(([a, b]) => pr(a * L * sa, b * B * sb, h));
    // hull, stacked from the waterline up
    for (let h = 0; h < hullH; h++) {
      const k = 0.86 + h * (0.14 / Math.max(1, hullH - 1));
      p.poly(hullAt(k, k, h), h === 0 ? o.hull[0] : h <= hullH / 2 ? o.hull[1] : o.hull[2]);
    }
    p.poly(hullAt(1, 1, hullH), o.rim);
    p.poly(hullAt(0.84, 0.72, hullH), (x, y) => (y % 2 ? '#c8925a' : '#bb8550'));
    const bvis = B * dir; // the side facing the viewer
    if (o.cannons) for (let i = 0; i < o.cannons; i++) {
      const a = L * (-0.55 + 1.1 * (i + 0.5) / o.cannons);
      const q = pr(a, bvis * 0.97, hullH - 2);
      p.rect(q[0], q[1], 2, 1, '#14100c'); p.set(q[0] - 1, q[1], '#e0b44a');
    }
    const box = (a0, a1, bw, h0, h1, side, top) => {
      for (let h = h0; h < h1; h++) p.poly([pr(a0, -bw, h), pr(a1, -bw, h), pr(a1, bw, h), pr(a0, bw, h)], side);
      p.poly([pr(a0, -bw, h1), pr(a1, -bw, h1), pr(a1, bw, h1), pr(a0, bw, h1)], top);
    };
    if (o.castle) box(o.castle.from * L * 0.88, o.castle.to * L, B * 0.82, hullH, hullH + o.castle.h, o.hull[2], o.rim);
    if (o.cabin) {
      box(o.cabin.a0, o.cabin.a1, B * 0.5, hullH, hullH + o.cabin.h, '#e8e2d5', '#c8463c');
      const w = pr((o.cabin.a0 + o.cabin.a1) / 2, bvis * 0.5, hullH + o.cabin.h - 3);
      p.rect(w[0] - 1, w[1], 3, 2, '#3b4b5e');
    }
    if (o.crates) for (let i = 0; i < o.crates; i++) {
      const q = pr(-L * 0.45 + i * 3.2, (i % 2 ? 1 : -1) * B * 0.25, hullH + 1);
      p.rect(q[0] - 2, q[1] - 2, 4, 3, '#7c5131'); p.rect(q[0] - 1, q[1] - 3, 2, 1, i % 2 ? '#e0b44a' : '#9cc3d6');
    }
    if (o.nets) for (let a = -L * 0.85; a < -L * 0.35; a += 1) for (let b = -B * 0.6; b < B * 0.6; b += 1) {
      if ((Math.round(a) + Math.round(b)) % 2 === 0) { const q = pr(a, b, hullH + 1); p.set(q[0], q[1], '#4f8f5a'); }
    }
    // masts and sails, far to near
    const masts = [...o.masts].sort((m1, m2) => dir * (m1.a - m2.a));
    const sc = o.sailC || ['#f6efdc', '#ece2c8', '#d8ccb0'];
    for (const m of masts) {
      const base = pr(m.a, 0, hullH), top = pr(m.a, 0, m.h);
      p.rect(base[0], top[1], 2, base[1] - top[1], '#5e3b22');
      if (m.rig === 'gaff') {
        p.poly([pr(m.a - 0.5, 0, m.h - 3), pr(m.a + m.boom * 0.8, 0, m.h - 8), pr(m.a + m.boom, 0, hullH + 4), pr(m.a - 0.5, 0, hullH + 4)],
          (x, y) => (y % 4 === 0 ? sc[2] : (dir * (x - base[0]) < -5 ? sc[0] : sc[1])));
      } else if (m.rig === 'square') {
        const lo = hullH + 6, hi = m.h - 2, n = m.sails, band = (hi - lo) / n;
        for (let k = 0; k < n; k++) {
          const b0 = lo + k * band + 1, b1 = lo + (k + 1) * band - 1, w = m.w * (1 - k * 0.12);
          p.poly([pr(m.a, -w, b1), pr(m.a, w, b1), pr(m.a, w, b0), pr(m.a, -w, b0)], (x, y) => {
            const t = (x - (base[0] - w)) / (2 * w);
            if (m.stripe && Math.floor(t * 6) % 2 === 1) return m.stripe;
            return y % 3 === 0 ? sc[2] : t < 0.45 ? sc[0] : sc[1];
          });
          const y0 = pr(m.a, -w, b1), y1 = pr(m.a, w, b1);
          p.line(y0[0], y0[1], y1[0], y1[1], '#5e3b22');
        }
      } else if (m.rig === 'lateen') {
        p.poly([pr(m.a + 7, 0, hullH + 5), pr(m.a - 9, 0, m.h), pr(m.a - 6, 0, hullH + 5)], (x, y) => {
          if (o.cross && Math.abs(y - (pr(m.a, 0, (hullH + m.h) / 2)[1])) < 1.5) return o.cross;
          return y % 4 === 0 ? sc[2] : sc[0];
        });
        const y0 = pr(m.a + 8, 0, hullH + 4), y1 = pr(m.a - 10, 0, m.h + 1);
        p.line(y0[0], y0[1], y1[0], y1[1], '#5e3b22');
      }
    }
    if (o.jib) {
      const fm = o.masts.reduce((x, y) => (y.a > x.a ? y : x));
      p.poly([pr(fm.a + 0.8, 0, fm.h - 2), pr(L * 0.95, 0, hullH + 2), pr(fm.a + 1.5, 0, hullH + 3)], (x, y) => (y % 4 === 0 ? sc[2] : sc[1]));
    }
    if (o.crane) {
      const b0 = pr(L * 0.45, 0, hullH), b1 = pr(L * 0.45, 0, hullH + 16), tip = pr(L * 0.95, 0, hullH + 18);
      p.rect(b0[0], b1[1], 2, b0[1] - b1[1], '#e0b44a');
      p.line(b1[0], b1[1], tip[0], tip[1], '#e0b44a');
      p.line(tip[0], tip[1], tip[0], tip[1] + 9, '#3b3d40');
      p.rect(tip[0] - 1, tip[1] + 9, 3, 2, '#3b3d40');
    }
    const tallest = o.masts.reduce((x, y) => (y.h > x.h ? y : x));
    const fq = pr(tallest.a, 0, tallest.h);
    p.rect(dir > 0 ? fq[0] - 3 : fq[0] + 2, fq[1], 3, 2, o.flag);
    if (o.glow) for (let i = 0; i < 26; i++) {
      const x = Math.floor(hash(i, seed, 41) * W), y = Math.floor(hash(i, seed, 42) * (cy - 4));
      if (p.a(x, y)) p.set(x, y, '#e8f8ff');
    }
    p.outline(PAL.ink);
    const s = sprite(p, cx, cy);
    s.top = maxH; s.len = L + B;
    return s;
  }

  function cropURL(s) {
    let x0 = s.w, y0 = s.h, x1 = 0, y1 = 0;
    for (let y = 0; y < s.h; y++) for (let x = 0; x < s.w; x++) if (s.hit[y * s.w + x]) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    const c = document.createElement('canvas'); c.width = x1 - x0 + 3; c.height = y1 - y0 + 3;
    c.getContext('2d').drawImage(s.canvas, x0 - 1, y0 - 1, c.width, c.height, 0, 0, c.width, c.height);
    return c.toDataURL();
  }

  function ripple(frame, len = 18) {
    const W = Math.ceil(len * 2.2) + 6, p = new Pix(W, 16);
    const r = len + frame, ry = len * 0.38 + frame * 0.4;
    for (let a = 0; a < Math.PI * 2; a += 0.03) {
      const x = W / 2 + Math.cos(a) * r, y = 8 + Math.sin(a) * ry;
      if (Math.sin(a) > -0.2) p.set(x, y, '#cdeefc', 200);
    }
    return sprite(p, Math.floor(W / 2), 8);
  }

  function crop(stage) {
    const p = new Pix(34, 22), ox = 1, oy = 8;
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
      const u = (i + 0.5) / 4, v = (j + 0.5) / 4;
      const x = Math.round(ox + 16 + (u - v) * 16), y = Math.round(oy + (u + v) * 8);
      if (stage === 0) { p.set(x, y, '#5a3a20'); p.set(x + 1, y, '#6aa04a'); continue; }
      const h = [0, 3, 6, 8][stage];
      for (let k = 0; k < h; k++) p.set(x + (k > 4 && (i + j) % 2 ? 1 : 0), y - k, stage === 3 ? (k > h - 3 ? '#e8c050' : '#c9a040') : (k > h - 2 ? '#8fd060' : '#5fa043'));
      p.set(x - 1, y - Math.floor(h / 2), stage === 3 ? '#c9a040' : '#4b8636');
      if (stage === 3) { p.set(x, y - h, '#f2d870'); p.set(x + 1, y - h + 1, '#e8c050'); }
    }

  // ======================= Village pass: props, compositions, lighthouse =======================
  const GLOW = new Set(['#f2c75c', '#fff2b8', '#ffe48a', '#ff9a3c', '#ffd27a', '#fff6c8', '#ff7a5c', '#7ae0c8', '#a8f060', '#c87aff', '#d8ffb0'].map(h => C(h).join(',')));
  // Copy of a sprite holding only its light-emitting pixels (windows, lamps, forges), for night lighting.
  function emissive(p) {

      const d = p.d, j = i * 4;

  }

  // --- props: each draws at ground point q = [x, y] in the composite canvas ---
  const PROPS = {
    logs(p, q) {
      const ends = [[0, 0], [4, 0], [8, 0], [2, -3], [6, -3], [4, -6]];
      for (const [dx, dy] of ends) {
        const cx = q[0] + dx - 4, cy = q[1] + dy - 3;
        p.rect(cx - 6, cy - 1, 6, 3, '#7c5131');
        p.circle(cx + 0.5, cy + 0.5, 2.2, '#8a5a33'); p.circle(cx + 0.5, cy + 0.5, 1.3, '#e8c48a'); p.set(cx, cy, '#b0864f');
      }
    },
    planks(p, q) {
      for (let i = 0; i < 3; i++) p.poly([[q[0] - 7, q[1] - 2 - i * 2], [q[0] + 1, q[1] + 2 - i * 2], [q[0] + 7, q[1] - 1 - i * 2], [q[0] - 1, q[1] - 5 - i * 2]], i % 2 ? '#c8925a' : '#b07a47');
    },
    crates(p, q, o = {}) {
      const n = o.n || 2;
      const cube = (x, y) => { p.poly([[x - 4, y - 2], [x, y], [x, y - 5], [x - 4, y - 7]], '#a06c40'); p.poly([[x, y], [x + 4, y - 2], [x + 4, y - 7], [x, y - 5]], '#7c5131'); p.poly([[x - 4, y - 7], [x, y - 5], [x + 4, y - 7], [x, y - 9]], '#c08a55'); p.line(x - 3, y - 5, x - 1, y - 2, '#7c5131'); };
      cube(q[0], q[1]); if (n > 1) cube(q[0] + 6, q[1] - 2); if (n > 2) cube(q[0] + 3, q[1] - 7);
    },
    barrels(p, q, o = {}) {
      const n = o.n || 2;
      for (let i = 0; i < n; i++) {
        const x = q[0] + i * 5 - (n - 1) * 2.5, y = q[1] - (i % 2) * 2;
        p.rect(x - 2, y - 7, 5, 7, '#a06c40'); p.rect(x + 1, y - 7, 2, 7, '#7c5131');
        p.rect(x - 2, y - 5, 5, 1, '#5f5a53'); p.rect(x - 2, y - 2, 5, 1, '#5f5a53');
        p.ellipse(x + 0.5, y - 7, 2.6, 1.2, '#c08a55');

    },
    sacks(p, q) {
      for (const [dx, dy] of [[-3, 0], [3, 0], [0, -4]]) { p.ellipse(q[0] + dx, q[1] + dy - 3, 3.2, 3, '#d8c49a'); p.set(q[0] + dx - 1, q[1] + dy - 5, '#efe0b9'); p.rect(q[0] + dx - 1, q[1] + dy - 7, 2, 1, '#a08860'); }
    },
    coil(p, q) {

    },
    ropewalk(p, q, o = {}) {
      const len = o.len || 3, pts = [];
      for (let i = 0; i <= len; i++) { const x = q[0] + i * HW * 0.9, y = q[1] + i * HH * 0.9; p.rect(x, y - 9, 1, 9, '#5e3b22'); p.rect(x - 1, y - 10, 3, 1, '#7c5131'); pts.push([x, y - 8]); }
      for (let i = 0; i < pts.length - 1; i++) { p.line(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1] + 1, '#d9b16a'); p.line(pts[i][0], pts[i][1] + 2, pts[i + 1][0], pts[i + 1][1] + 3, '#c9a05a'); }
    },
    rack(p, q) {

      p.line(q[0] - 6, q[1] - 11, q[0] + 6, q[1] - 8, '#7c5131');
      for (let i = 0; i < 4; i++) { const x = q[0] - 4 + i * 3, y = q[1] - 10 + i * 0.75; p.rect(x, y, 2, 4, i % 2 ? '#8aa4b8' : '#a9bccb'); p.set(x, y + 4, '#5a7184'); }
    },
    anvil(p, q) {

    },
    cannon(p, q) {
      p.poly([[q[0] - 5, q[1] - 1], [q[0] + 3, q[1] + 3], [q[0] + 5, q[1] + 1], [q[0] - 3, q[1] - 3]], '#7c5131');
      p.circle(q[0] - 3, q[1] + 1, 1.8, '#5e3b22'); p.circle(q[0] + 4, q[1] + 3, 1.8, '#5e3b22');
      p.poly([[q[0] - 4, q[1] - 6], [q[0] + 7, q[1] - 1], [q[0] + 7, q[1] + 1], [q[0] - 4, q[1] - 3]], '#3b3d40');
      p.ellipse(q[0] + 7, q[1], 1.2, 1.5, '#14100c'); p.line(q[0] - 3, q[1] - 6, q[0] + 5, q[1] - 2, '#6e7780');

        for (let i = -3; i <= 3; i++) { const a = i * L / 3.6; const bx = q[0] + a, by = q[1] + a * 0.5 - 4; for (let t = 0; t <= Math.PI; t += 0.15) p.set(bx - Math.cos(t) * 4, by - Math.sin(t) * 6 + Math.cos(t) * 2, '#c08a55'); }
      } else {
        const Bm = L * 0.38, pr = (a, b, h) => [q[0] + (a - b), q[1] + (a + b) / 2 - 4 - h];
        for (let h = 0; h <= 4; h++) { const k = 0.86 + h * 0.035; p.poly(HULL_POINTED.map(([a, b]) => pr(a * L * k, b * Bm * k, h)), h === 0 ? '#4a2e1a' : h < 3 ? '#6e4627' : '#8a5a33'); }
        p.poly(HULL_POINTED.map(([a, b]) => pr(a * L, b * Bm, 5)), '#b07a45');
        p.poly(HULL_POINTED.map(([a, b]) => pr(a * L * 0.8, b * Bm * 0.65, 5)), (x, y) => (y % 2 ? '#c8925a' : '#bb8550'));

    },
    slipway(p, q, o = {}) {
      const L = o.len || 2.2;
      const a = [q[0], q[1]], b = [q[0] + L * HW, q[1] + L * HH];
      p.poly([[a[0] - 6, a[1] - 3], [b[0] - 6, b[1] - 3], [b[0] + 6, b[1] + 3], [a[0] + 6, a[1] + 3]], (x, y) => ((x + y * 2) % 5 === 0 ? '#7c5131' : '#a06c40'));
      PROPS.boat(p, [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 - 1], { len: L * HW * 0.45, ribs: !o.hull });
    },
    crane(p, q) {
      p.rect(q[0], q[1] - 26, 2, 26, '#5e3b22'); p.rect(q[0] - 2, q[1] - 2, 6, 2, '#7c5131');
      p.line(q[0] + 1, q[1] - 25, q[0] + 14, q[1] - 21, '#7c5131'); p.line(q[0] + 1, q[1] - 18, q[0] + 9, q[1] - 22, '#7c5131');
      p.line(q[0] + 14, q[1] - 21, q[0] + 14, q[1] - 12, '#3b3d40'); p.rect(q[0] + 12, q[1] - 12, 5, 4, '#a06c40');
    },
    table(p, q) {
      p.poly([[q[0] - 5, q[1] - 5], [q[0], q[1] - 3], [q[0] + 5, q[1] - 5], [q[0], q[1] - 7]], '#a06c40');
      p.rect(q[0] - 1, q[1] - 3, 2, 3, '#5e3b22');
      p.rect(q[0] - 8, q[1] - 2, 4, 1, '#7c5131'); p.rect(q[0] + 4, q[1] - 2, 4, 1, '#7c5131');

    umbrella(p, q, o = {}) {

    },
    telescope(p, q) {

      p.poly([[q[0] - 4, q[1] - 6], [q[0] + 6, q[1] - 12], [q[0] + 7, q[1] - 10], [q[0] - 3, q[1] - 4]], '#c9a64a'); p.set(q[0] + 7, q[1] - 11, '#9cc3d6');
    },
    stall(p, q, o = {}) {

      p.poly([[q[0] - 9, q[1] - 12], [q[0] + 9, q[1] - 3], [q[0] + 9, q[1] - 8], [q[0] - 9, q[1] - 17]], (x) => (((x - q[0] + 9) / 3 | 0) % 2 ? c : '#f4ecd8'));
      p.poly([[q[0] - 6, q[1] - 4], [q[0] + 6, q[1] + 2], [q[0] + 6, q[1] - 1], [q[0] - 6, q[1] - 7]], '#a06c40');
      for (let i = 0; i < 3; i++) p.rect(q[0] - 4 + i * 4, q[1] - 6 + i * 2, 2, 1, i === 1 ? '#e58a6a' : '#9cc3d6');
    },
    flagpole(p, q, o = {}) {
      p.rect(q[0], q[1] - 30, 1, 30, '#3b3d40'); p.set(q[0], q[1] - 31, '#e0b44a');
      p.rect(q[0] + 1, q[1] - 30, 8, 3, o.c || '#c8463c'); p.rect(q[0] + 1, q[1] - 27, 6, 2, o.c || '#c8463c'); p.rect(q[0] + 1, q[1] - 30, 1, 5, shade(o.c || '#c8463c', 0.75));
    },
    lantern(p, q) { p.rect(q[0], q[1] - 13, 1, 13, '#3b3d40'); p.rect(q[0] - 1, q[1] - 16, 3, 3, '#ffe48a'); p.rect(q[0] - 2, q[1] - 17, 5, 1, '#3b3d40'); },
    fence(p, q, o = {}) {
      const n = o.n || 3, dir = o.dir || 1;
      for (let i = 0; i <= n; i++) { const x = q[0] + i * 6 * dir, y = q[1] + i * 3; p.rect(x, y - 5, 1, 5, '#7c5131'); }
      p.line(q[0], q[1] - 4, q[0] + n * 6 * dir, q[1] + n * 3 - 4, '#a06c40'); p.line(q[0], q[1] - 2, q[0] + n * 6 * dir, q[1] + n * 3 - 2, '#a06c40');
    },
    flowers(p, q) { for (let i = 0; i < 8; i++) p.set(q[0] + (i % 4) * 2 - 3, q[1] - 1 - (i >> 2) * 2, ['#f2e27a', '#e58ea8', '#f4f0e8'][i % 3]); p.rect(q[0] - 4, q[1], 8, 1, '#4b8636'); },
    signpost(p, q, o = {}) { p.rect(q[0], q[1] - 12, 1, 12, '#5e3b22'); p.rect(q[0] - 5, q[1] - 12, 11, 5, '#e0b44a'); p.rect(q[0] - 4, q[1] - 11, 9, 3, o.c || '#7c5131'); },
    globe(p, q) { p.rect(q[0], q[1] - 4, 1, 4, '#5e3b22'); p.circle(q[0] + 0.5, q[1] - 7, 3.2, '#3f9fd8'); p.set(q[0] - 1, q[1] - 8, '#6aad4a'); p.set(q[0] + 1, q[1] - 6, '#6aad4a'); p.set(q[0], q[1] - 9, '#6aad4a'); },
    witchPot(p, q) { p.ellipse(q[0], q[1] - 3, 4.5, 3, '#2f3236'); p.ellipse(q[0], q[1] - 5, 3.5, 1.3, '#59d1a0'); p.set(q[0] - 1, q[1] - 7, '#9be3e8'); },
    // --- the witch's hut (1.5.4: twice the size, its roof coiling up like a spiral hill) ---
    stilts(p, q, o) {
      const up = (u, v) => [q[0] + (u - v) * HW, q[1] + (u + v) * HH], posts = [[0, o.fd], [o.fw / 2, o.fd], [o.fw, o.fd], [o.fw, o.fd / 2], [o.fw, 0]];
      // cross braces on the two faces we can see
      for (let i = 0; i < 4; i++) { if (i === 1) continue; const a = up(...posts[i]), b = up(...posts[i + 1]); p.line(a[0], a[1] - o.h + 1, b[0], b[1] - 1, '#3a2416'); p.line(a[0], a[1] - 1, b[0], b[1] - o.h + 1, '#3a2416'); }
      for (const [u, v] of posts) { const c = up(u, v); p.rect(c[0] - 1, c[1] - o.h, 3, o.h + 1, '#4a2f1c'); p.rect(c[0] - 1, c[1] - o.h, 1, o.h + 1, '#5e3b22'); p.set(c[0], c[1] + 1, '#2a1d17'); }
    },
    stairs(p, q, o) {
      // wooden steps from the door down to the ground, heading out along +u
      const n = 6, x0 = q[0] - 4, y0 = q[1] - o.h, dx = 12 / n, dy = (o.h + 6) / n;
      for (let i = n - 1; i >= 0; i--) { const x = x0 + i * dx, y = y0 + i * dy; p.poly([[x, y], [x + 8, y - 4], [x + 10, y - 3], [x + 2, y + 1]], i % 2 ? '#8a5a33' : '#9c6a3d'); p.rect(x + 2, y + 1, 1, dy + 1, '#5e3b22'); }
      p.line(x0 + 1, y0 - 7, x0 + 13, y0 + o.h - 2, '#5e3b22'); p.rect(x0 + 12, y0 + o.h - 2, 1, 6, '#4a2f1c'); p.rect(x0, y0 - 7, 1, 6, '#4a2f1c');
    },
    curlRoof(p, q, o) {
      // Rises out of the roof row by row from its widest point (y0, half-width w0), using the roof's own
      // face shades and shingle courses so the two read as one, then the tip rolls over into a big coil.
      const ax = q[0], y0 = q[1] - o.z, c = o.c || '#5a3f7a', H = o.H, rows = 2.5;
      const cx = t => ax + 2 * Math.sin(t * Math.PI) - 4 * t * t * t, wid = t => 2.8 + (o.w0 - 2.8) * Math.pow(1 - t, o.p);
      const tile = (x, y, k) => { // the same pattern drawBlock lays on roofs
        const f = (y0 - y) / rows, row = Math.floor(f);
        if (((x + row * 3) % 6 + 6) % 6 === 0) return shade(c, k * 0.78);
        if ((f % 1) < 0.28) return shade(c, k * 0.86);

      };

        const t = (y0 - y) / H, x = cx(t), w = wid(t);
        for (let i = Math.round(x - w); i < Math.round(x + w); i++) p.set(i, y, tile(i, y, i < x ? 1.0 : 0.84));
      }
      let x = cx(1), y = y0 - H, th = Math.atan2(-H * 0.02, cx(1) - cx(0.98)), phi = 0;
      const R0 = 11, PHI = 3.3 * Math.PI, ds = 0.35, lit = shade(c, 1.0), mid = shade(c, 0.9), dim = shade(c, 0.78);
      while (phi < PHI) {
        const r = R0 * Math.exp(-0.17 * phi), w = 2.8 - 1.7 * (phi / PHI), px = x, py = y;
        p.circle(px, py, w, (xx, yy) => { const d = (xx - px) + (yy - py); return d < -0.8 ? lit : d < 0.8 ? mid : dim; });
        th -= ds / r; phi += ds / r; x += Math.cos(th) * ds; y += Math.sin(th) * ds;
      }

    },
    stovepipe(p, q, o) {
      const x = q[0], y = q[1] - o.z;
      p.rect(x, y - 6, 3, 7, '#3b3d40'); p.rect(x + 1, y - 10, 3, 5, '#46494d'); p.rect(x + 2, y - 13, 3, 4, '#3b3d40'); p.rect(x + 1, y - 14, 5, 1, '#2a2c30');
      return { smoke: [[x + 3, y - 15]] }; // the world puffs smoke from here like any chimney
    },

  function yardColor(kind, x, y) {
    const n = hash(x, y, 33);
    if (kind === 'cobble') { const row = (y / 3) | 0, off = (row & 1) * 3; if (y % 3 === 0 || (x + off) % 6 === 0) return '#7a756d'; return hash((x + off) / 6 | 0, row, 3) < 0.5 ? '#aaa69e' : '#9b968e'; }
    if (kind === 'planks') return (x + 2 * y) % 7 === 0 ? '#6e4627' : n < 0.5 ? '#a8774a' : '#9a6a40';
    if (kind === 'sawdust') return n < 0.3 ? '#c9a46a' : n < 0.6 ? '#b8935c' : '#9a7048';
    if (kind === 'grass') return null;
    return n < 0.25 ? '#8a6640' : n < 0.7 ? '#9a7450' : '#a8825c';
  }

  function composeBuilding(type, level) {
    const spec = COMP[type](level);
    const [fw, fd] = { tavern: [3, 3], seaWitch: [3, 3], dockyard: [3, 2], warehouse: [3, 2], ropemaker: [3, 2], shipwright: [2, 3] }[type] || [2, 2];
    let maxH = 0;
    for (const it of spec.items) if (!it.prop) maxH = Math.max(maxH, (it.z0 || 0) + it.wall + it.roof + (it.flag ? 16 : 0) + (it.chimney ? 14 : 0)); else if (it.o && it.o.top) maxH = Math.max(maxH, it.o.top);
    maxH = Math.max(maxH + 8, 40);
    const W = (fw + fd) * HW + 20, H = (fw + fd) * HH + maxH + 8;
    const p = new Pix(W, H);
    const tx = 6 + fd * HW, ty = maxH;
    const pt = (u, v) => [tx + (u - v) * HW, ty + (u + v) * HH];
    const items = spec.items.map(it => ({ ...it, depth: it.prop ? (it.o && it.o.late ? 100 : it.u + it.v) : it.late ? 99 : it.u + it.fw * 0.5 + it.v + it.fd * 0.5 + 0.5 }));
    items.sort((a, b) => a.depth - b.depth);
    const smoke = [];
    for (const it of items) {
      if (it.prop) { const r = PROPS[it.prop](p, pt(it.u, it.v), it.o); if (r && r.smoke) smoke.push(...r.smoke); }
      else { const r = drawBlock(p, ...pt(it.u, it.v), it); smoke.push(...r.smoke); }
    }
    p.outline(PAL.ink);
    const G = { t: pt(0, 0), r: pt(fw, 0), b: pt(fw, fd), l: pt(0, fd) };
    const inset = (q, c) => [q[0] + (c[0] - q[0]) * 0.04, q[1] + (c[1] - q[1]) * 0.04];
    const ctr = pt(fw / 2, fd / 2);
    p.poly([inset(G.t, ctr), inset(G.r, ctr), inset(G.b, ctr), inset(G.l, ctr)], (x, y) => (p.a(x, y) ? null : yardColor(spec.yard, x, y)));
    const s = sprite(p, G.b[0], G.b[1]);
    s.smoke = smoke.map(([x, y]) => [x - G.b[0], y - G.b[1]]);
    s.emit = emissive(p);
    const main = spec.items.find(it => !it.prop);
    if (main) { const q = pt(main.u, main.v); s.hauntInfo = { tx: q[0], ty: q[1], fw: main.fw, fd: main.fd, wall: main.wall }; }
    return s;
  }

  // --- the lighthouse on its rocky islet ---
  // The islet grew a second lobe up the bay (along -gx, so it stays clear of the shipping lanes) where
  // the keeper's shack stands once built. o.snow swaps the grass for snow; the layout never changes.
  function lighthouseIslet(o = {}) {
    const W = 156, H = 140, p = new Pix(W, H);
    const cx = 92, gy = 104; // islet top surface centre (under the tower)
    const lx = cx - 38, ly = gy - 19; // the shack lobe
    const R = (a) => 1 + 0.18 * Math.sin(a * 3 + 1) + 0.1 * Math.sin(a * 5 + 2);
    const R2 = (a) => 1 + 0.14 * Math.sin(a * 4 + 3) + 0.08 * Math.sin(a * 7);
    const blob = (rx, ry, dy, x0 = cx, y0 = gy, f = R) => { const pts = []; for (let a = 0; a < Math.PI * 2; a += 0.15) pts.push([x0 + Math.cos(a) * rx * f(a), y0 + dy + Math.sin(a) * ry * f(a)]); return pts; };
    const lobes = [[46, 21, cx, gy, R], [31, 15, lx, ly, R2]];

<script data-module="sky.js">
// ============================================================
// sky.js — time of day from the device clock, and weather.
// Live weather comes from Open-Meteo (free, no key) wherever the page
// may reach the network: a normal browser or the iOS app. Inside a
// sandbox that blocks outside requests it falls back to a simulated
// forecast that follows the season. Players can also pick a look.
// ============================================================
const Sky = (() => {
  'use strict';
  const CACHE_KEY = 'tidesOfFortune.weather';
  const CACHE_MS = 30 * 60 * 1000;
  const KINDS = ['sunny', 'rainy', 'snowy', 'foggy'];
  let settings = { time: 'live', weather: 'live', place: null };
  let live = null;            // { kind, intensity, storm, cloudy, code, temp, sunrise, sunset, place, at }
  let status = { state: 'idle', text: '' };
  let listeners = [];

  const clamp01 = x => Math.max(0, Math.min(1, x));
  const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };

  function fromWmo(code) {
    if (code === 0 || code === 1) return { kind: 'sunny', intensity: 0, cloudy: false };
    if (code === 2 || code === 3) return { kind: 'sunny', intensity: 0, cloudy: true };
    if (code === 45 || code === 48) return { kind: 'foggy', intensity: code === 48 ? 1 : 0.8 };
    if (code >= 51 && code <= 57) return { kind: 'rainy', intensity: 0.35 };
    if (code === 61 || code === 80) return { kind: 'rainy', intensity: 0.5 };
    if (code === 63 || code === 81 || code === 66) return { kind: 'rainy', intensity: 0.75 };
    if (code === 65 || code === 82 || code === 67) return { kind: 'rainy', intensity: 1 };
    if (code === 71 || code === 85 || code === 77) return { kind: 'snowy', intensity: 0.5 };
    if (code === 73) return { kind: 'snowy', intensity: 0.75 };
    if (code === 75 || code === 86) return { kind: 'snowy', intensity: 1 };
    if (code >= 95) return { kind: 'rainy', intensity: 1, storm: true };

  }

  function simulated(now, lat) {
    const d = new Date(now);
    let m = d.getMonth();
    if (lat !== undefined && lat < 0) m = (m + 6) % 12;
    const season = [0, 0, 1, 1, 1, 2, 2, 2, 3, 3, 3, 0][m]; // winter, spring, summer, autumn
    const w = [[0.35, 0.22, 0.3, 0.13], [0.55, 0.3, 0.02, 0.13], [0.78, 0.17, 0, 0.05], [0.47, 0.33, 0.04, 0.16]][season];

    const x = r();
    let acc = 0, kind = 'sunny';
    for (let i = 0; i < 4; i++) { acc += w[i]; if (x < acc) { kind = KINDS[i]; break; } }

  }

  // Sunrise/sunset in local hours: live data if we have it, else a seasonal estimate.
  function sunTimes(now) {
    if (live && Number.isFinite(live.sunrise) && Number.isFinite(live.sunset) && now - live.at < 36 * 3600000) return [live.sunrise, live.sunset];

    });
  }

  async function refresh(force) {
    if (settings.weather !== 'live') { status = { state: 'manual', text: '' }; emit(); return; }
    const now = Date.now();
    const cached = readCache();
    if (!force && cached && now - cached.data.at < CACHE_MS) { live = cached.data; status = { state: 'ok', text: '' }; emit(); return; }
    if (!settings.place) { status = { state: 'noplace', text: 'Choose a location to follow its live weather.' }; emit(); return; }
    status = { state: 'loading', text: 'Checking the weather…' }; emit();
    try {
      const { lat, lon, name } = settings.place;
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lon.toFixed(3)}&current=weather_code,temperature_2m&daily=sunrise,sunset&timezone=auto&forecast_days=1`;
      live = parseForecast(await getJSON(url), name, Date.now());
      writeCache(live);
      status = { state: 'ok', text: '' };
    } catch (e) {
      status = { state: 'unavailable', text: 'Live weather isn’t reachable from here, so the sky follows a simulated forecast. It works in a normal browser or the iOS app.' };
    }
    emit();
  }

  async function useMyLocation() {
    try {
      const p = await position();
      return { ok: true, place: { lat: p.lat, lon: p.lon, name: 'Your location' } };
    } catch (e) { return { ok: false, reason: e.message }; }
  }

  async function searchPlace(q) {
    try {
      const j = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`);
      const r = j && j.results && j.results[0];
      if (!r) return { ok: false, reason: 'No place by that name.' };
      return { ok: true, place: { lat: r.latitude, lon: r.longitude, name: [r.name, r.admin1, r.country_code].filter(Boolean).join(', ') } };
    } catch (e) { return { ok: false, reason: 'Place search needs live network access, which this page doesn’t have here.' }; }
  }

  function configure(sky) {
    const before = JSON.stringify(settings);
    settings = { time: 'live', weather: 'live', place: null, ...(sky || {}) };
    if (before !== JSON.stringify(settings)) refresh(false);
  }

  return {
    KINDS, current, configure, refresh, useMyLocation, searchPlace, fromWmo, simulated, parseForecast,
    get status() { return status; }, get live() { return live; },
    onStatus: f => listeners.push(f), _setFetch: f => { fetchImpl = f; },
  };
})();

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function unlock() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
    musicBus = ctx.createGain(); sfxBus = ctx.createGain(); ambBus = ctx.createGain();
    for (const b of [musicBus, sfxBus, ambBus]) b.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    applyVolumes();

    startMusic();
  }
  function setVolumes(v) { vol = { ...vol, ...v }; applyVolumes(); }
  function applyVolumes() {
    if (!ctx) return;
    const t = ctx.currentTime;
    musicBus.gain.setTargetAtTime(vol.music * 0.5, t, 0.1);
    sfxBus.gain.setTargetAtTime(vol.sfx * 0.7, t, 0.05);
    // sea sounds sit far under everything else: squared slider (2% is near silence), low ceiling
    ambBus.gain.setTargetAtTime(vol.ambience * vol.ambience * 0.12, t, 0.2);
  }

  // ---------- building blocks ----------
  function tone(freq, { type = 'sine', dur = 0.15, gain = 0.3, attack = 0.004, slide = 0, when = 0, bus = sfxBus, release } = {}) {
    if (!ctx) return;
    const t = ctx.currentTime + when, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (release || dur));
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + (release || dur) + 0.05);
  }
  function noise({ dur = 0.3, gain = 0.3, freq = 1200, q = 0.8, type = 'bandpass', when = 0, attack = 0.01, sweep = 0 } = {}) {
    if (!ctx) return;
    const t = ctx.currentTime + when, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (sweep) f.frequency.exponentialRampToValueAtTime(freq * sweep, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }

  // ---------- effects ----------
  const SFX = {
    tap: () => tone(880, { type: 'triangle', dur: 0.04, gain: 0.08 }),
    coins: () => { tone(1320, { type: 'square', dur: 0.08, gain: 0.05 }); tone(1760, { type: 'square', dur: 0.14, gain: 0.05, when: 0.07 }); },
    sail: () => { noise({ dur: 0.9, gain: 0.18, freq: 500, sweep: 3, attack: 0.25 }); tone(196, { type: 'sawtooth', dur: 0.7, gain: 0.04, attack: 0.1, when: 0.1 }); },
    bell: () => { for (const [f, g] of [[784, 0.18], [1568, 0.06], [2352, 0.03]]) tone(f, { dur: 1.6, gain: g }); tone(784, { dur: 1.6, gain: 0.12, when: 0.35 }); },
    chestShake: () => { for (let i = 0; i < 4; i++) noise({ dur: 0.08, gain: 0.2, freq: 300 + i * 80, q: 3, when: i * 0.13 }); },
    chestOpen: () => { noise({ dur: 0.4, gain: 0.15, freq: 220, q: 6, sweep: 2 }); [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, { type: 'triangle', dur: 0.3, gain: 0.08, when: 0.25 + i * 0.07 })); },
    trophy: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, { type: 'triangle', dur: 0.5, gain: 0.1, when: i * 0.11 })),
    build: () => { for (let i = 0; i < 3; i++) { noise({ dur: 0.06, gain: 0.25, freq: 900, q: 1.5, when: i * 0.18 }); tone(140, { dur: 0.07, gain: 0.12, when: i * 0.18 }); } },
    success: () => [523, 659, 784].forEach((f, i) => tone(f, { type: 'triangle', dur: 0.25, gain: 0.08, when: i * 0.08 })),
    error: () => tone(160, { type: 'square', dur: 0.18, gain: 0.05, slide: 0.8 }),
    kraken: () => { tone(55, { type: 'sawtooth', dur: 2.5, gain: 0.07, attack: 0.8, slide: 0.85 }); tone(58, { type: 'sine', dur: 2.5, gain: 0.1, attack: 0.8 }); },
    splash: () => noise({ dur: 0.5, gain: 0.2, freq: 1500, sweep: 0.3, type: 'lowpass', q: 0.5 }),
    thunder: () => { if (vol.ambience > 0.05) noise({ dur: 2.2, gain: 0.35 * vol.ambience, freq: 180, type: 'lowpass', q: 0.3, attack: 0.05, sweep: 0.6 }); },
  };
  function play(name) { if (ctx && SFX[name] && vol.sfx > 0) SFX[name](); }

  // ---------- music: an original tune in D dorian, 6/8 ----------
  // [midi note or 0 for rest, length in eighths]; 4 phrases of 2 bars each.
  const MELODY = [
    [69, 2], [74, 1], [74, 2], [72, 1], [69, 2], [67, 1], [65, 3],
    [67, 2], [69, 1], [67, 2], [65, 1], [64, 2], [62, 1], [64, 3],
    [69, 2], [74, 1], [74, 2], [76, 1], [77, 2], [76, 1], [74, 3],
    [72, 2], [69, 1], [67, 2], [64, 1], [62, 6],
  ];
  const ROOTS = [38, 38, 36, 33, 38, 41, 36, 38]; // one per bar
  const seq = [];
  { let t = 0; for (const [n, l] of MELODY) { seq.push({ n, t, l }); t += l; } }
  const LOOP = 48; // eighths
  let night = false;

  function startMusic() { if (musicOn || !ctx) return; musicOn = true; nextNote = ctx.currentTime + 0.3; step = 0; timer = setInterval(schedule, 60); }
  function schedule() {
    if (!ctx || vol.music <= 0) return;
    const eighth = night ? 0.42 : 0.24;
    while (nextNote < ctx.currentTime + 0.25) {
      const pos = step % LOOP, bar = Math.floor(pos / 6), when = nextNote - ctx.currentTime;
      for (const e of seq) if (e.t === pos && e.n) {
        if (night && (e.t / 2) % 2 === 1) continue; // sparser at night
        tone(mtof(e.n + (night ? -12 : 0)), { type: night ? 'sine' : 'triangle', dur: e.l * eighth * 0.9, release: e.l * eighth * (night ? 1.6 : 0.95), gain: night ? 0.09 : 0.11, attack: night ? 0.04 : 0.006, when, bus: musicBus });
      }
      if (!night && pos % 3 === 0) {
        const root = ROOTS[bar], n = pos % 6 === 0 ? root : root + 7;
        tone(mtof(n), { type: 'sine', dur: eighth * 2.5, gain: 0.13, attack: 0.01, when, bus: musicBus });
      }
      if (night && pos % 12 === 0) tone(mtof(ROOTS[bar] + 12), { type: 'sine', dur: eighth * 10, release: eighth * 12, gain: 0.05, attack: 0.8, when, bus: musicBus });
      nextNote += eighth; step++;
    }
  }

  // ---------- ambience: waves always, rain when it rains ----------
  function loopNoise(freq, type) {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; s.loop = true; f.type = type; f.frequency.value = freq; g.gain.value = 0;
    s.connect(f); f.connect(g); g.connect(ambBus); s.start();
    return { g, f };
  }
  function startAmbience() {
    waves = loopNoise(300, 'lowpass');
    rain = loopNoise(3500, 'highpass');
  }
  let lastThunder = 0;
  function update(sky, t) {
    if (!ctx || !waves) return;
    night = sky.dark > 0.6;
    const now = ctx.currentTime;
    const swell = 0.16 + 0.1 * Math.sin(t * 0.55) + 0.04 * Math.sin(t * 1.7);
    waves.g.gain.setTargetAtTime(Math.max(0, swell), now, 0.3);
    const w = sky.weather, r = w.kind === 'rainy' ? 0.08 + 0.16 * w.intensity : 0;
    rain.g.gain.setTargetAtTime(r, now, 0.8);
  }
  function thunder(flash) { if (flash && ctx && ctx.currentTime - lastThunder > 3) { lastThunder = ctx.currentTime; setTimeout(() => play('thunder'), 400 + Math.random() * 900); } }

  return { unlock, play, setVolumes, update, thunder, get ready() { return !!ctx; } };
})();

<script data-module="pwa.js">
// ============================================================
// pwa.js — the home-screen app. Registers the service worker that
// keeps the game on the phone for offline play, notices when a new
// version is ready, and asks the browser to keep the save safe.
// Does nothing inside claude.ai or when opened as a local file.
// ============================================================
const PWA = (() => {
  'use strict';
  const host = location.hostname;
  const sandboxed = location.protocol === 'file:' || /(^|\.)claude\.ai$|claudeusercontent|anthropic/.test(host);
  const standalone = () => window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let waiting = null, onUpdate = () => {}, persisted = null;

  // cb(true) shows the restart prompt, cb(false) hides it.
  async function init(cb) {
    onUpdate = cb || onUpdate;
    if (sandboxed || !('serviceWorker' in navigator)) return;
    try {
      const reg = await navigator.serviceWorker.register('./sw.js');
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        waiting = null; onUpdate(false);
        if (!reloading) { reloading = true; try { sessionStorage.setItem('tof-updated', '1'); } catch (e) { /* ignore */ } location.reload(); }
      });
      // An update downloaded in an earlier session is applied right away at launch, before play
      // starts, so the prompt never lingers from one session to the next.
      if (reg.waiting && navigator.serviceWorker.controller) { reg.waiting.postMessage('skipWaiting'); return; }
      const watch = w => w && w.addEventListener('statechange', () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller) { waiting = w; onUpdate(true); }
        if (w.state === 'redundant' || w.state === 'activated') { if (waiting === w) waiting = null; onUpdate(!!waiting); }
      });
      reg.addEventListener('updatefound', () => watch(reg.installing));
      const check = () => reg.update().catch(() => {});
      setInterval(check, 30 * 60 * 1000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
    } catch (e) { /* offline support is a bonus; the game still runs */ }
  }
  function justUpdated() { try { const v = sessionStorage.getItem('tof-updated'); sessionStorage.removeItem('tof-updated'); return !!v; } catch (e) { return false; } }

  function applyUpdate() { if (waiting) waiting.postMessage('skipWaiting'); }

  async function persist() {
    try {
      if (!navigator.storage || !navigator.storage.persist) return (persisted = null);
      persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
    } catch (e) { persisted = null; }
    return persisted;
  }

  return { init, applyUpdate, justUpdated, persist, standalone, isIOS, sandboxed, get hasUpdate() { return !!waiting; }, get persisted() { return persisted; } };
})();

</script>
<script data-module="world.js">
// ============================================================
// world.js — the isometric village. Owns the canvas, camera,
// pan / pinch / wheel input, depth-sorted sprites and ambient life.
// Game rules never live here: it reads state and reports taps.
// ============================================================
const World = (() => {
  'use strict';
  const { Pix, PAL, C, hash } = Art;
  const HW = 16, HH = 8, N = TOF.MAP_SIZE;
  const T = { GRASS: 0, ROAD: 1, SAND: 2, WATER: 3, DOCK: 4, ROCK: 5, FIELD: 6 };

  // ---------- coordinates ----------

  // ---------- map layout ----------

  // land added in the village pass; earlier coordinates are unchanged so saves keep their layout.
  const COAST = [16, 16, 17, 16, 16, 15, 15, 16, 15, 15, 15, 14, 14, 14, 14, 14, 14, 14, 14, 14,
    14, 14, 14, 15, 15, 14, 14, 13, 13, 14, 14, 14,

    15, 16, 17, 18, 19, 19, 18, 17];
