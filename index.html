  // WMO weather interpretation codes -> one of our four looks.
  function fromWmo(code) {
    if (code === 0 || code === 1) return { kind: 'sunny', intensity: 0, cloudy: false };
    if (code === 2 || code === 3) return { kind: 'sunny', intensity: 0, cloudy: true };
    if (code === 45 || code === 48) return { kind: 'foggy', intensity: code === 48 ? 1 : 0.8 };
    if (code >= 51 && code <= 57) return { kind: 'rainy', intensity: 0.35 };
    if (code === 61 || code === 80) return { kind: 'rainy', intensity: 0.5 };
    if (code === 63 || code === 81 || code === 66) return { kind: 'rainy', intensity: 0.75 };
    if (code === 65 || code === 82 || code === 67) return { kind: 'rainy', intensity: 1 };
    if (code === 71 || code === 85 || code === 77) return { kind: 'snowy', intensity: 0.5 };
    if (code === 73) return { kind: 'snowy', intensity: 0.75 };
    if (code === 75 || code === 86) return { kind: 'snowy', intensity: 1 };

    const d = new Date(now);

    if (lat !== undefined && lat < 0) m = (m + 6) % 12;
    const season = [0, 0, 1, 1, 1, 2, 2, 2, 3, 3, 3, 0][m]; // winter, spring, summer, autumn
    const w = [[0.35, 0.22, 0.3, 0.13], [0.55, 0.3, 0.02, 0.13], [0.78, 0.17, 0, 0.05], [0.47, 0.33, 0.04, 0.16]][season];
    const r = TOF.mulberry32(Math.floor(now / (3 * 3600000)) * 7919 + 13);
    const x = r();
    let acc = 0, kind = 'sunny';
    for (let i = 0; i < 4; i++) { acc += w[i]; if (x < acc) { kind = KINDS[i]; break; } }
    const intensity = kind === 'sunny' ? 0 : 0.45 + r() * 0.55;
    return { kind, intensity, storm: kind === 'rainy' && r() < 0.15, cloudy: kind === 'sunny' && r() < 0.35 };
  }

  // Sunrise/sunset in local hours: live data if we have it, else a seasonal estimate.
  function sunTimes(now) {
    if (live && Number.isFinite(live.sunrise) && Number.isFinite(live.sunset) && now - live.at < 36 * 3600000) return [live.sunrise, live.sunset];
    const d = new Date(now), start = new Date(d.getFullYear(), 0, 0);
    const doy = Math.floor((d - start) / 86400000);
    let len = 12 + 3.2 * Math.sin(2 * Math.PI * (doy - 80) / 365);
    if (settings.place && settings.place.lat < 0) len = 24 - len;
    const noon = 12.8;
    return [noon - len / 2, noon + len / 2];
  }

  function hourOf(now) {
    const [sr, ss] = sunTimes(now);
    switch (settings.time) {
      case 'dawn': return sr + 0.25;
      case 'day': return 13;
      case 'dusk': return ss - 0.25;
      case 'night': return 23.5;
      default: { const d = new Date(now); return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600; }
    }
  }

  function weatherNow(now) {
    if (settings.weather !== 'live') {
      const k = settings.weather;
      return { kind: k, intensity: k === 'sunny' ? 0 : 0.85, storm: false, cloudy: false, source: 'manual' };
    }
    if (live && now - live.at < 3 * CACHE_MS) return { ...live, source: 'live' };
    return { ...simulated(now, settings.place ? settings.place.lat : undefined), source: 'sim' };
  }

  // Everything the renderer needs for this frame.
  function current(now) {
    const [sr, ss] = sunTimes(now);
    const h = hourOf(now);
    const day = smooth(sr - 0.8, sr + 0.4, h) * (1 - smooth(ss - 0.4, ss + 0.8, h));
    const dark = 1 - day;
    const warm = clamp01(1 - Math.abs(h - sr) / 1.1) + clamp01(1 - Math.abs(h - ss) / 1.1);
    const w = weatherNow(now);
    let tint = mix([255, 255, 255], [66, 82, 148], dark * 0.86);
    // golden hour: strong warm light around sunrise and sunset
    tint = mix(tint, [255, 168, 112], clamp01(warm) * 0.62 * (1 - dark * 0.35));
    // Weather dims the light on top of the time of day (multiplied, so night stays night).
    const wTint = { rainy: [168, 178, 196], snowy: [214, 224, 240], foggy: [222, 226, 232], sunny: [236, 236, 242] }[w.kind];
    const wk = w.kind === 'sunny' ? (w.cloudy ? 1 : 0) : 0.35 + 0.45 * w.intensity;
    const wt = mix([255, 255, 255], wTint, wk);
    tint = tint.map((c, i) => Math.round(c * wt[i] / 255));
    const lights = clamp01(dark * 1.25 + (w.kind === 'rainy' || w.kind === 'foggy' ? 0.15 * w.intensity : 0));
    const phase = dark > 0.85 ? 'night' : day > 0.9 ? 'day' : h < 12 ? 'dawn' : 'dusk';
    return { hour: h, sunrise: sr, sunset: ss, dark, warm: clamp01(warm), tint, lights, phase, weather: w };
  }

  // ---------- live data ----------
  function readCache() { try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); return c && c.data ? c : null; } catch (e) { return null; } }
  function writeCache(data) { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ data })); } catch (e) { /* ignore */ } }

  async function getJSON(url, ms = 8000) {
    if (!fetchImpl) throw new Error('No network access.');
    const ctl = typeof AbortController === 'function' ? new AbortController() : null;
    const t = ctl ? setTimeout(() => ctl.abort(), ms) : null;
    try {
      const r = await fetchImpl(url, ctl ? { signal: ctl.signal } : undefined);
      if (!r.ok) throw new Error('Weather service answered ' + r.status);
      return await r.json();
    } finally { if (t) clearTimeout(t); }
  }
  const hhmm = s => { const m = /T(\d\d):(\d\d)/.exec(s || ''); return m ? +m[1] + +m[2] / 60 : NaN; };

  function parseForecast(j, place, now) {
    if (!j || !j.current || !Number.isFinite(j.current.weather_code)) throw new Error('Unexpected weather data.');
    const w = fromWmo(j.current.weather_code);
    return { ...w, storm: !!w.storm, code: j.current.weather_code, temp: j.current.temperature_2m,
      sunrise: hhmm(j.daily && j.daily.sunrise && j.daily.sunrise[0]), sunset: hhmm(j.daily && j.daily.sunset && j.daily.sunset[0]),
      place: place || '', at: now };
  }

  function position() {
    return new Promise((res, rej) => {
      if (!navigator.geolocation) return rej(new Error('This device can’t share its location.'));
      navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lon: p.coords.longitude }), e => rej(new Error(e.code === 1 ? 'Location permission was declined.' : 'Couldn’t get your location.')), { timeout: 9000, maximumAge: 3600000 });
    });
  }

  async function refresh(force) {
    if (settings.weather !== 'live') { status = { state: 'manual', text: '' }; emit(); return; }
    const now = Date.now();
    const cached = readCache();
    if (!force && cached && now - cached.data.at < CACHE_MS) { live = cached.data; status = { state: 'ok', text: '' }; emit(); return; }
    if (!settings.place) { status = { state: 'noplace', text: 'Choose a location to follow its live weather.' }; emit(); return; }
    status = { state: 'loading', text: 'Checking the weather…' }; emit();
    try {
      const { lat, lon, name } = settings.place;
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lon.toFixed(3)}&current=weather_code,temperature_2m&daily=sunrise,sunset&timezone=auto&forecast_days=1`;
      live = parseForecast(await getJSON(url), name, Date.now());
      writeCache(live);
      status = { state: 'ok', text: '' };
    } catch (e) {
      status = { state: 'unavailable', text: 'Live weather isn’t reachable from here, so the sky follows a simulated forecast. It works in a normal browser or the iOS app.' };
    }
    emit();
  }

  async function useMyLocation() {
    try {
      const p = await position();
      return { ok: true, place: { lat: p.lat, lon: p.lon, name: 'Your location' } };
    } catch (e) { return { ok: false, reason: e.message }; }
  }

  async function searchPlace(q) {
    try {
      const j = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`);
      const r = j && j.results && j.results[0];
      if (!r) return { ok: false, reason: 'No place by that name.' };
      return { ok: true, place: { lat: r.latitude, lon: r.longitude, name: [r.name, r.admin1, r.country_code].filter(Boolean).join(', ') } };
    } catch (e) { return { ok: false, reason: 'Place search needs live network access, which this page doesn’t have here.' }; }
  }

  function configure(sky) {
    const before = JSON.stringify(settings);
    settings = { time: 'live', weather: 'live', place: null, ...(sky || {}) };
    if (before !== JSON.stringify(settings)) refresh(false);
  }

  return {
    KINDS, current, configure, refresh, useMyLocation, searchPlace, fromWmo, simulated, parseForecast,
    get status() { return status; }, get live() { return live; },
    onStatus: f => listeners.push(f), _setFetch: f => { fetchImpl = f; },
  };
})();

</script>
<script data-module="audio.js">
// ============================================================
// audio.js — every sound is synthesized with Web Audio: no files to
// download, so it works offline. Browsers only allow sound after a
// tap, so nothing plays until the player first touches the screen.
// ============================================================
const Sound = (() => {
  'use strict';
  let ctx = null, master, musicBus, sfxBus, ambBus, noiseBuf = null;
  let vol = { music: 0.45, sfx: 0.8, ambience: 0.5 };
  let musicOn = false, nextNote = 0, step = 0, timer = null;
  let waves = null, rain = null;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function unlock() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
    musicBus = ctx.createGain(); sfxBus = ctx.createGain(); ambBus = ctx.createGain();
    for (const b of [musicBus, sfxBus, ambBus]) b.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    applyVolumes();
    startAmbience();
    startMusic();
  }
  function setVolumes(v) { vol = { ...vol, ...v }; applyVolumes(); }
  function applyVolumes() {
    if (!ctx) return;
    const t = ctx.currentTime;
    musicBus.gain.setTargetAtTime(vol.music * 0.5, t, 0.1);
    sfxBus.gain.setTargetAtTime(vol.sfx * 0.7, t, 0.05);
    ambBus.gain.setTargetAtTime(vol.ambience * 0.6, t, 0.2);
  }

  // ---------- building blocks ----------
  function tone(freq, { type = 'sine', dur = 0.15, gain = 0.3, attack = 0.004, slide = 0, when = 0, bus = sfxBus, release } = {}) {
    if (!ctx) return;
    const t = ctx.currentTime + when, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (release || dur));
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + (release || dur) + 0.05);
  }
  function noise({ dur = 0.3, gain = 0.3, freq = 1200, q = 0.8, type = 'bandpass', when = 0, attack = 0.01, sweep = 0 } = {}) {
    if (!ctx) return;
    const t = ctx.currentTime + when, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (sweep) f.frequency.exponentialRampToValueAtTime(freq * sweep, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }

  // ---------- effects ----------
  const SFX = {
    tap: () => tone(880, { type: 'triangle', dur: 0.04, gain: 0.08 }),
    coins: () => { tone(1320, { type: 'square', dur: 0.08, gain: 0.05 }); tone(1760, { type: 'square', dur: 0.14, gain: 0.05, when: 0.07 }); },
    sail: () => { noise({ dur: 0.9, gain: 0.18, freq: 500, sweep: 3, attack: 0.25 }); tone(196, { type: 'sawtooth', dur: 0.7, gain: 0.04, attack: 0.1, when: 0.1 }); },
    bell: () => { for (const [f, g] of [[784, 0.18], [1568, 0.06], [2352, 0.03]]) tone(f, { dur: 1.6, gain: g }); tone(784, { dur: 1.6, gain: 0.12, when: 0.35 }); },
    chestShake: () => { for (let i = 0; i < 4; i++) noise({ dur: 0.08, gain: 0.2, freq: 300 + i * 80, q: 3, when: i * 0.13 }); },
    chestOpen: () => { noise({ dur: 0.4, gain: 0.15, freq: 220, q: 6, sweep: 2 }); [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, { type: 'triangle', dur: 0.3, gain: 0.08, when: 0.25 + i * 0.07 })); },
    trophy: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, { type: 'triangle', dur: 0.5, gain: 0.1, when: i * 0.11 })),
    build: () => { for (let i = 0; i < 3; i++) { noise({ dur: 0.06, gain: 0.25, freq: 900, q: 1.5, when: i * 0.18 }); tone(140, { dur: 0.07, gain: 0.12, when: i * 0.18 }); } },
    success: () => [523, 659, 784].forEach((f, i) => tone(f, { type: 'triangle', dur: 0.25, gain: 0.08, when: i * 0.08 })),
    error: () => tone(160, { type: 'square', dur: 0.18, gain: 0.05, slide: 0.8 }),
    kraken: () => { tone(55, { type: 'sawtooth', dur: 2.5, gain: 0.07, attack: 0.8, slide: 0.85 }); tone(58, { type: 'sine', dur: 2.5, gain: 0.1, attack: 0.8 }); },
    splash: () => noise({ dur: 0.5, gain: 0.2, freq: 1500, sweep: 0.3, type: 'lowpass', q: 0.5 }),
    thunder: () => { noise({ dur: 2.2, gain: 0.35, freq: 180, type: 'lowpass', q: 0.3, attack: 0.05, sweep: 0.6 }); },
  };
  function play(name) { if (ctx && SFX[name] && vol.sfx > 0) SFX[name](); }

  // ---------- music: an original tune in D dorian, 6/8 ----------
  // [midi note or 0 for rest, length in eighths]; 4 phrases of 2 bars each.
  const MELODY = [
    [69, 2], [74, 1], [74, 2], [72, 1], [69, 2], [67, 1], [65, 3],
    [67, 2], [69, 1], [67, 2], [65, 1], [64, 2], [62, 1], [64, 3],
    [69, 2], [74, 1], [74, 2], [76, 1], [77, 2], [76, 1], [74, 3],
    [72, 2], [69, 1], [67, 2], [64, 1], [62, 6],
  ];
  const ROOTS = [38, 38, 36, 33, 38, 41, 36, 38]; // one per bar
  const seq = [];
  { let t = 0; for (const [n, l] of MELODY) { seq.push({ n, t, l }); t += l; } }
  const LOOP = 48; // eighths
  let night = false;

  function startMusic() { if (musicOn || !ctx) return; musicOn = true; nextNote = ctx.currentTime + 0.3; step = 0; timer = setInterval(schedule, 60); }
  function schedule() {
    if (!ctx || vol.music <= 0) return;
    const eighth = night ? 0.42 : 0.24;
    while (nextNote < ctx.currentTime + 0.25) {
      const pos = step % LOOP, bar = Math.floor(pos / 6), when = nextNote - ctx.currentTime;
      for (const e of seq) if (e.t === pos && e.n) {
        if (night && (e.t / 2) % 2 === 1) continue; // sparser at night
        tone(mtof(e.n + (night ? -12 : 0)), { type: night ? 'sine' : 'triangle', dur: e.l * eighth * 0.9, release: e.l * eighth * (night ? 1.6 : 0.95), gain: night ? 0.09 : 0.11, attack: night ? 0.04 : 0.006, when, bus: musicBus });
      }
      if (!night && pos % 3 === 0) {
        const root = ROOTS[bar], n = pos % 6 === 0 ? root : root + 7;
        tone(mtof(n), { type: 'sine', dur: eighth * 2.5, gain: 0.13, attack: 0.01, when, bus: musicBus });
      }
      if (night && pos % 12 === 0) tone(mtof(ROOTS[bar] + 12), { type: 'sine', dur: eighth * 10, release: eighth * 12, gain: 0.05, attack: 0.8, when, bus: musicBus });
      nextNote += eighth; step++;
    }
  }

  // ---------- ambience: waves always, rain when it rains ----------
  function loopNoise(freq, type) {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; s.loop = true; f.type = type; f.frequency.value = freq; g.gain.value = 0;
    s.connect(f); f.connect(g); g.connect(ambBus); s.start();
    return { g, f };
  }
  function startAmbience() {
    waves = loopNoise(420, 'lowpass');
    rain = loopNoise(3500, 'highpass');
  }
  let lastThunder = 0;
  function update(sky, t) {
    if (!ctx || !waves) return;
    night = sky.dark > 0.6;
    const now = ctx.currentTime;
    const swell = 0.2 + 0.14 * Math.sin(t * 0.55) + 0.06 * Math.sin(t * 1.7);
    waves.g.gain.setTargetAtTime(Math.max(0.03, swell), now, 0.3);
    const w = sky.weather, r = w.kind === 'rainy' ? 0.12 + 0.25 * w.intensity : 0;
    rain.g.gain.setTargetAtTime(r, now, 0.8);
  }
  function thunder(flash) { if (flash && ctx && ctx.currentTime - lastThunder > 3) { lastThunder = ctx.currentTime; setTimeout(() => play('thunder'), 400 + Math.random() * 900); } }

  return { unlock, play, setVolumes, update, thunder, get ready() { return !!ctx; } };
})();

<script data-module="pwa.js">
// ============================================================
// pwa.js — the home-screen app. Registers the service worker that
// keeps the game on the phone for offline play, notices when a new
// version is ready, and asks the browser to keep the save safe.
// Does nothing inside claude.ai or when opened as a local file.
// ============================================================
const PWA = (() => {
  'use strict';
  const host = location.hostname;
  const sandboxed = location.protocol === 'file:' || /(^|\.)claude\.ai$|claudeusercontent|anthropic/.test(host);
  const standalone = () => window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let waiting = null, onUpdate = () => {}, persisted = null;

  async function init(cb) {
    onUpdate = cb || onUpdate;
    if (sandboxed || !('serviceWorker' in navigator)) return;
    try {
      const reg = await navigator.serviceWorker.register('./sw.js');
      const found = w => { waiting = w; onUpdate(); };
      const track = w => w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) found(w); });
      if (reg.waiting && navigator.serviceWorker.controller) found(reg.waiting);
      reg.addEventListener('updatefound', () => track(reg.installing));
      const check = () => reg.update().catch(() => {});
      setInterval(check, 30 * 60 * 1000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloading) { reloading = true; location.reload(); } });
    } catch (e) { /* offline support is a bonus; the game still runs */ }
  }

  function applyUpdate() { if (waiting) waiting.postMessage('skipWaiting'); }

  async function persist() {
    try {
      if (!navigator.storage || !navigator.storage.persist) return (persisted = null);
      persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
    } catch (e) { persisted = null; }
    return persisted;
  }

  return { init, applyUpdate, persist, standalone, isIOS, sandboxed, get hasUpdate() { return !!waiting; }, get persisted() { return persisted; } };
})();

</script>
<script data-module="world.js">
// ============================================================
// world.js — the isometric village. Owns the canvas, camera,
// pan / pinch / wheel input, depth-sorted sprites and ambient life.
// Game rules never live here: it reads state and reports taps.
// ============================================================
const World = (() => {
  'use strict';
  const { Pix, PAL, C, hash } = Art;
  const HW = 16, HH = 8, N = 40, EDGE = 18;
  const T = { GRASS: 0, ROAD: 1, SAND: 2, WATER: 3, DOCK: 4, ROCK: 5, FIELD: 6 };

  // ---------- coordinates ----------
  const isoTop = (gx, gy) => ({ x: (gx - gy) * HW, y: (gx + gy) * HH });
  const tileCenter = (gx, gy) => ({ x: (gx - gy) * HW, y: (gx + gy) * HH + HH });

  // ---------- map layout ----------
  // Coastline: for rows gy>=8, water starts at column COAST[gy-8]. Rows 28+ are the southern
  // land added in the village pass; earlier coordinates are unchanged so saves keep their layout.
  const COAST = [16, 16, 17, 16, 16, 15, 15, 16, 15, 15, 15, 14, 14, 14, 14, 14, 14, 14, 14, 14,
    14, 14, 14, 15, 15, 14, 14, 13, 13, 14, 14, 14];
  const coastAt = gy => COAST[Math.max(0, Math.min(gy - 8, COAST.length - 1))];
  function isWater(gx, gy) {
    if (gy <= 4) return gx >= 22;
    if (gy === 5) return gx >= 21;
    if (gy === 6) return gx >= 20;
    if (gy === 7) return gx >= 18;
    return gx >= coastAt(gy);
  }
  // Five jetties, two berths each (berth index b -> jetty b>>1, side b&1). A jetty is built
  // the moment the fleet needs it. Ships sail out along their berth's row.
  const DOCK_LEN = 5;
  const DOCKS = [11, 15, 23, 27, 31].map((row, i) => ({ i, row, x0: coastAt(row), x1: coastAt(row) + DOCK_LEN - 1 }));
  const BERTHS = [];
  for (const d of DOCKS) for (const side of [-1, 1]) BERTHS.push({ gx: d.x0 + 3, gy: d.row + side, lane: d.row + side, dock: d.i });
  const ISLET = { gx: 28, gy: 19 }; // well out in the bay, clear of the jetties and their lanes
  // Decorative homes. Working buildings live in the save and are drawn by syncBuildings().
  const BUILDINGS = [
    { key: 'chapel', gx: 3, gy: 1, fw: 3, fd: 2, name: 'Chapel' },
    { key: 'houseRed', gx: 6, gy: 2, fw: 2, fd: 2, name: 'Cottage' },
    { key: 'houseBlue', gx: 11, gy: 2, fw: 2, fd: 2, name: 'Cottage' },
    { key: 'housePurple', gx: 14, gy: 1, fw: 2, fd: 2, name: 'Cottage' },
    { key: 'houseGreen', gx: 10, gy: 8, fw: 2, fd: 2, name: 'Cottage' },
    { key: 'houseOrange', gx: 2, gy: 14, fw: 2, fd: 2, name: 'Cottage' },
    { key: 'houseTeal', gx: 10, gy: 14, fw: 2, fd: 2, name: 'Cottage' },
    { key: 'houseRed', gx: 5, gy: 19, fw: 2, fd: 2, name: 'Cottage' },
    { key: 'houseBlue', gx: 10, gy: 19, fw: 2, fd: 2, name: 'Cottage' },
  ];

  const map = [];
  let blocked = [];
  function buildMap() {
    for (let gy = 0; gy < N; gy++) { map[gy] = []; for (let gx = 0; gx < N; gx++) map[gy][gx] = isWater(gx, gy) ? T.WATER : T.GRASS; }
    const set = (gx, gy, t) => { if (gx >= 0 && gy >= 0 && gx < N && gy < N) map[gy][gx] = t; };
    const land = (gx, gy) => gx >= 0 && gy >= 0 && gx < N && gy < N && map[gy][gx] !== T.WATER;
    // sand beaches
    for (let gy = 0; gy < N; gy++) for (let gx = 0; gx < N; gx++) {
      if (map[gy][gx] !== T.GRASS) continue;
      const nearWater = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => { const x = gx + dx, y = gy + dy; return x >= 0 && y >= 0 && x < N && y < N && map[y][x] === T.WATER; });
      if (nearWater) map[gy][gx] = T.SAND;
    }
    // roads

  // distance-to-land per water tile (for shallow/deep tint)
  let waterDist = [];

    waterDist = map.map(r => r.map(t => (t === T.WATER ? 99 : 0)));
    const q = [];
    for (let gy = 0; gy < N; gy++) for (let gx = 0; gx < N; gx++) if (waterDist[gy][gx] === 0) q.push([gx, gy]);

      const [gx, gy] = q.shift();

        if (x < 0 || y < 0 || x >= N || y >= N) continue;

  function landColor(t, X, Y, gx, gy, u, v) {
    switch (t) {
      case T.GRASS: case T.SAND: {
        if (t === T.SAND) { const n = hash(X, Y, 4); return n < 0.15 ? PAL.sand2 : n < 0.9 ? PAL.sand1 : PAL.sand3; }

  let groundCanvas = null, snowCanvas = null, waterCanvases = [], dockLayers = [];

  function populate() {

})();

// ============================================================
// app.js — wires storage, rules (TOF), world and DOM together.
// ============================================================
const App = (() => {
  'use strict';
  function makeStorage() {
    try {
      const k = '__tof_probe';

      const m = new Map();

  function boot() {

  }
  function save() { if (TOF.saveGame(store.s, state, now())) lastSaved = now(); }

    place(type, gx, gy) { return done(TOF.placeBuilding(state, type, gx, gy, now(), World.terrainCheck), 'placed'); },
    upgradeBuilding(id) { return done(TOF.upgradeBuilding(state, id, now()), 'bupgrade'); },

    claim(expId) { return done(TOF.claim(state, expId, now()), 'claimed'); },
    claimAll() { const rs = TOF.claimAll(state, now()); if (rs.length) commit('claimed', rs); return rs; },
    sell(res, qty) { return done(TOF.sell(state, res, qty)); },
    sellAll() { return done(TOF.sellAll(state)); },
    buyUpgrade(shipId, key) { return done(TOF.buyUpgrade(state, shipId, key), 'upgraded'); },

    openChest(id) { return done(TOF.openChest(state, id), 'chest'); },
    craftCharm() { return done(TOF.craftCharm(state), 'charm'); },
    cleanse(shipId) { return done(TOF.cleanse(state, shipId), 'cleanse'); },
    repair(shipId) { return done(TOF.repair(state, shipId, now()), 'repaired'); },
    rename(shipId, name) { return done(TOF.renameShip(state, shipId, name)); },
    setDev(on) { state.settings.devMode = !!on; commit(); },
    setSky(patch) { state.settings.sky = { ...state.settings.sky, ...patch }; Sky.configure(state.settings.sky); commit('sky'); },
    setDevSpeed(n) { state.settings.devSecondsPerHour = n; commit(); },
    finishAll() { const n = TOF.finishAllNow(state, now()); commit(); return n; },
    grant(items) {

    reset() { TOF.resetSave(store.s); state = TOF.newGame(now()); commit('reset'); },
    setAudio(v) { state.settings.audio = { ...state.settings.audio, ...v }; Sound.setVolumes(state.settings.audio); save(); },

})();

    for (const ship of state.ships) {
      const st = TOF.shipStats(ship), status = TOF.shipStatus(state, ship.id, now), exp = TOF.expeditionForShip(state, ship.id);
      const right = status === 'away'
        ? `<span class="fl-status">${icon(TYPE_ICON[exp.type], 'tiny')} <b data-timer="${exp.id}"></b></span>`
        : status === 'returned' ? `<span class="fl-status ready">Back!</span>`
          : ship.hp < st.hull * TOF.MIN_SAIL_HULL ? `<span class="fl-status bad">Needs repair</span>` : `<span class="fl-status">In harbor</span>`;
      const f = ship.hp / st.hull;
      html += `<li><button class="fl-row" data-act="openship" data-ship="${ship.id}">
        <span class="fl-img">${shipImg(ship.cls)}</span>
        <span class="fl-main"><b>${esc(ship.name)}</b><small>${st.name}</small><span class="mini-hull ${f < TOF.MIN_SAIL_HULL ? 'bad' : f < 0.6 ? 'mid' : ''}"><i style="width:${(f * 100).toFixed(0)}%"></i></span></span>
        ${right}</button></li>`;
    }
    html += `</ul><p class="note">${state.ships.length} of ${TOF.MAX_SHIPS} berths in use. New hulls are built at the Shipwright.</p>`;
    return html;
  }

  function estimateText(est, type) {
    const a = est.avg;
    const list = (keys) => keys.filter(k => a[k] >= 0.05).map(k => `<b>${num(a[k])}</b> ${resName(k)}`).join(', ');
    let line;
    if (type === 'fishing') line = `Typical haul: ${list(['fish', 'shellfish']) || 'very little'}. A rare catch on <b>${pct(est.chance.rareFish || 0)}</b> of trips.`;
    else if (type === 'treasure') line = `Typical haul: ${list(['coins', 'pearls']) || 'very little'}. A relic on <b>${pct(est.chance.relics || 0)}</b> of trips.`;
    else if (type === 'combat') line = `Typical bounty: <b>${num(a.coins || 0)}</b> coins. Wins <b>${pct(est.winRate)}</b> of fights.`;
    else line = `Typical haul: ${list(['charts', 'coins']) || 'very little'}.`;
    const risk = est.damageChance > 0
      ? `Hull damage on <b>${pct(est.damageChance)}</b> of trips, about <b>${num(est.damage / Math.max(est.damageChance, 0.01))}</b> hull when it happens.`
      : 'No real danger.';
    const ch = est.chestChance || 0;
    const finds = [];
    if (ch > 0.01) finds.push(`a chest on <b>${pct(Math.min(0.99, ch))}</b>`);
    for (const k of ['sunkenKey', 'pirateKey', 'lostKey', 'moonfish', 'salvage']) if ((est.chance[k] || 0) > 0.01) finds.push(`${resName(k)} on <b>${pct(est.chance[k])}</b>`);
    const extra = finds.length ? `<p class="estimate risk">Rare finds: ${finds.join(', ')} of trips.</p>` : '';
    return `<p class="estimate">${line}</p>${extra}<p class="estimate risk">${risk}</p>`;
  }

  function renderShipDetail(state, now, ship) {
    const st = TOF.shipStats(ship), status = TOF.shipStatus(state, ship.id, now), exp = TOF.expeditionForShip(state, ship.id);
    const pill = { idle: 'In harbor', away: TOF.TYPES[exp ? exp.type : 'fishing'].name, returned: 'Back with a haul' }[status];
    let html = `<button class="back" data-act="back">‹ All ships</button>
      <article class="card ship">
        <header class="ship-head">${shipImg(ship.cls, 'big')}<div><h3>${esc(ship.name)}</h3><p>${st.name}. ${st.blurb}</p></div><span class="pill pill-${status}">${pill}</span></header>
        ${hullBar(ship, st)}
        ${ship.curse ? `<p class="warn">Cursed: weaker for ${ship.curse.trips} more trip${ship.curse.trips > 1 ? 's' : ''}. ${TOF.buildingLevel(state, 'seaWitch') ? `<button class="btn small" data-act="cleanse" data-ship="${ship.id}">Lift it (1 essence)</button>` : 'The Sea Witch could lift it.'}</p>` : ''}
        ${statGrid(st)}`;
    const repairCost = TOF.repairCost(ship, state);
    if (status === 'idle') {
      if (repairCost) {
        const rc = TOF.repairCost(ship, state), rp = TOF.repairPlanks(ship);
        const can = state.resources.coins >= rc && state.resources.planks >= rp;
        html += `<button class="btn" data-act="repair" data-ship="${ship.id}" ${can ? '' : 'disabled'}>${icon('wrench', 'tiny')} Repair: ${rc} coins + ${rp} ${unit('planks', rp)}</button>`;
        if (!can && state.resources.planks < rp) html += `<p class="note">Repairs need planks: build a Sawmill, or buy timber at a Trading Post.</p>`;
      }
      const plan = planFor(ship);
      if (TOF.sailBlock(state, ship, plan.type, now) && plan.type === 'combat' && TOF.typePower(st, 'combat') < 2) plan.type = 'fishing';
      const rumor = TOF.rumorFor(state, now);
      html += `<p class="label">Expedition</p><div class="types">${Object.entries(TOF.TYPES).map(([k, t]) => {
        const blocked = k === 'combat' && TOF.typePower(st, 'combat') < 2;
        const hot = rumor && rumor.type === k;
        return `<button class="type ${hot ? 'hot' : ''}" role="radio" aria-checked="${plan.type === k}" data-act="type" data-ship="${ship.id}" data-type="${k}" ${blocked ? 'disabled' : ''}>${icon(TYPE_ICON[k], 'mid')}<span>${t.name}${blocked ? '<small>Needs cannons</small>' : hot ? `<small>Rumor +${Math.round((rumor.bonus - 1) * 100)}%</small>` : ''}</span></button>`;
      }).join('')}</div>
      <p class="desc type-desc">${TOF.TYPES[plan.type].desc}</p>
      <p class="label">Where</p><div class="regions">${state.regions.map(id => {
        const Rg = TOF.REGIONS[id], lock = TOF.regionSailBlock(state, ship, id);
        return `<button class="chip region" role="radio" aria-checked="${plan.region === id}" data-act="region" data-ship="${ship.id}" data-r="${id}" ${lock ? 'disabled' : ''}>${esc(Rg.name)}${lock ? `<small>Needs ${Rg.minExplore} explore</small>` : ''}</button>`;
      }).join('')}</div>
      ${state.regions.length < 2 ? `<p class="note">Chart new waters on the Sea chart tab with sea charts.</p>` : ''}
      <div class="chips" role="radiogroup">${TOF.DURATIONS.map(d => `<button class="chip" role="radio" aria-checked="${d === plan.hours}" data-act="hours" data-ship="${ship.id}" data-h="${d}">${d}h</button>`).join('')}</div>`;
      const need = TOF.foodFor(plan.hours), haveFood = state.resources.food >= need;
      if (!haveFood) ui.supplies[ship.id] = false;
      const sup = !!ui.supplies[ship.id];
      html += `<label class="supplies ${haveFood ? '' : 'off'}"><input type="checkbox" data-act="supplies" data-ship="${ship.id}" ${sup ? 'checked' : ''} ${haveFood ? '' : 'disabled'}>
        <span class="track"><span class="knob"></span></span><span>${icon('food', 'tiny')} <b>Pack supplies</b> (${need} preserved food, you have ${state.resources.food})<br><small>${haveFood ? '+20% haul, 30% less hull damage.' : 'A Fishmonger turns fish into preserved food.'}</small></span></label>`;
      const charms = state.resources.charm || 0;
      if (!charms) ui.charm[ship.id] = false;
      const chm = !!ui.charm[ship.id];
      if (charms || state.discovered.includes('charm')) html += `<label class="supplies ${charms ? '' : 'off'}"><input type="checkbox" data-act="charm" data-ship="${ship.id}" ${chm ? 'checked' : ''} ${charms ? '' : 'disabled'}>
        <span class="track"><span class="knob"></span></span><span>${icon('charm', 'tiny')} <b>Carry a warding charm</b> (you have ${charms})<br><small>Half the hull damage, no curses, +30% against ghosts and monsters.</small></span></label>`;
      const est = TOF.estimate(ship, plan.type, plan.hours, TOF.tripMods(state, plan.type, now, sup, plan.region, chm));
      est.durationMult *= TOF.REGIONS[plan.region].dist * (TOF.trophyBonus(state, 'starChart') ? 0.9 : 1);
      html += estimateText(est, plan.type);
      if (est.overflowChance > 0.3) html += `<p class="warn">The hold (${est.capacity}) fills up on ${pct(est.overflowChance)} of these trips. Try a shorter trip or a bigger hold.</p>`;
      const block = TOF.sailBlock(state, ship, plan.type, now);
      const ms = plan.hours * TOF.hourMs(state) * est.durationMult;
      html += block ? `<p class="warn">${esc(block)}</p>` : `<button class="btn primary" data-act="sail" data-ship="${ship.id}">Set sail, back in ${span(ms)}</button>`;
    } else if (status === 'away') {
      html += `<div class="progress"><i data-bar="${exp.id}"></i></div>
        <p class="eta">${icon(TYPE_ICON[exp.type], 'tiny')} ${exp.hours}-hour ${TOF.TYPES[exp.type].name.toLowerCase()} trip in ${esc(TOF.REGIONS[exp.region || 'home'].name)}. Back in <b data-timer="${exp.id}"></b>${exp.dev ? ' (developer trip)' : `, around ${clock(exp.endAt)}`}.</p>
        ${state.settings.devMode ? `<button class="btn dev" data-act="finish">Finish all trips now (developer)</button>` : ''}`;
    } else {
      html += `<button class="btn primary glow" data-act="claim" data-exp="${exp.id}">Collect the haul</button>`;
    }
    html += `</article>
      ${ui.renaming === ship.id
        ? `<div class="rename"><label for="renameInput">New name</label><input id="renameInput" maxlength="24" value="${esc(ship.name)}" autocomplete="off"><div class="btn-row"><button class="btn primary" data-act="dorename" data-ship="${ship.id}">Save name</button><button class="btn" data-act="cancelrename">Cancel</button></div></div>`
        : `<div class="btn-row"><button class="btn" data-act="goupgrade" data-ship="${ship.id}">Upgrades</button><button class="btn" data-act="rename" data-ship="${ship.id}">Rename</button></div>`}`;
    return html;
  }

  // ---------- stores ----------
  const GROUPS = [['Catch', ['fish', 'shellfish', 'rareFish']], ['Treasure', ['pearls', 'relics', 'charts']], ['Raw materials', ['timber', 'hemp', 'ironOre']], ['Goods', ['planks', 'rope', 'iron', 'food']], ['Magic', ['moonfish', 'essence', 'salvage', 'charm']], ['Keys', ['sunkenKey', 'pirateKey', 'lostKey']]];
  function renderMarket(state) {
    const cap = TOF.storageCap(state), mkt = TOF.buildingLevel(state, 'market');
    let html = `<p class="note">Bulk goods hold up to <b>${cap}</b> each. ${TOF.buildingLevel(state, 'warehouse') ? '' : 'A Warehouse raises the limit. '}Coins, rare catch, pearls, relics and charts have no limit.</p>`;
    for (const [title, keys] of GROUPS) {
      const shown = keys.filter(k => state.discovered.includes(k));
      if (!shown.length) continue;
      html += `<h3 class="group">${title}</h3><div class="card">` + shown.map(r => {
        const n = state.resources[r], bulk = TOF.BULK.includes(r), sellable = TOF.SELLABLE.includes(r);
        const full = bulk && n >= cap;
        const btns = sellable ? `<div class="m-btns"><button class="btn small" data-act="sell" data-res="${r}" data-q="10" ${n ? '' : 'disabled'}>Sell 10</button><button class="btn small" data-act="sell" data-res="${r}" data-q="${n}" ${n ? '' : 'disabled'}>Sell all</button></div>` : '';
        const sub = sellable ? `${TOF.sellPrice(state, r)} coins each` : TOF.TRADE.sell[r] ? 'Trading Post buys' : TOF.TRADE.buy[r] ? 'Trading Post sells' : 'Not for sale';
        return `<div class="mrow">${icon(r, 'mid')}<div class="m-info"><b>${TOF.RESOURCES[r].name} <span class="amt ${full ? 'full' : ''}">${n}${bulk ? `<small>/${cap}</small>` : ''}</span></b><span>${sub}</span></div>${btns}</div>`;
      }).join('') + `</div>`;
    }
    const chests = Object.keys(TOF.CHESTS).filter(k => state.resources[k] > 0);
    if (chests.length) {
      html += `<h3 class="group">Chests</h3><div class="card">` + chests.map(k => {
        const c = TOF.CHESTS[k], z = TOF.CHEST_SIZES[c.size], key = TOF.KEY_OF[c.family], have = state.resources[key];
        return `<div class="mrow">${icon(k, 'chest')}<div class="m-info"><b>${c.name} <span class="amt">${state.resources[k]}</span></b><span>Opens with ${z.keys} ${resName(key)}${z.keys > 1 ? 's' : ''} (you have ${have})</span></div>
          <div class="m-btns"><button class="btn small ${have >= z.keys ? 'primary' : ''}" data-act="chest" data-c="${k}">Open</button></div></div>`;
      }).join('') + `</div>`;
    }
    const tro = Object.keys(TOF.TROPHIES).filter(k => state.trophies[k]);
    if (tro.length) html += `<h3 class="group">Trophies</h3><div class="card">` + tro.map(k => `<div class="mrow">${icon(k, 'mid')}<div class="m-info"><b>${TOF.TROPHIES[k].name}${state.trophies[k] > 1 ? ` <span class="amt">×${state.trophies[k]}</span>` : ''}</b><span>${TOF.TROPHIES[k].bonus}</span></div></div>`).join('') + `</div>`;
    const total = ['fish', 'shellfish'].reduce((a, r) => a + state.resources[r] * TOF.sellPrice(state, r), 0);
    html += `<button class="btn primary" data-act="sellall" ${total ? '' : 'disabled'}>Sell fish and shellfish for ${total} coins</button>
      <p class="note">Fish Market level ${mkt}${mkt > 1 ? `: prices +${Math.round((mkt - 1) * 15)}%` : ''}. The bulk sale skips rare catch, pearls and relics; upgrades need them.</p>`;
    return html;
  }

  // ---------- village ----------
  function buildTime(state, h) { return span(h * TOF.hourMs(state)); }
  function bStatus(b, now) {
    if (b.pending) return `<span class="fl-status">${icon('hammer', 'tiny')} <b data-btimer="${b.id}">${fmt(b.pending.endAt - now)}</b></span>`;
    if (b.job) return `<span class="fl-status">${icon(b.job.out, 'tiny')} ${b.job.done}/${b.job.qty}</span>`;
    return '';
  }
  function renderVillage(state, now) {
    if (ui.building && TOF.getBuilding(state, ui.building)) return renderBuildingDetail(state, now, TOF.getBuilding(state, ui.building));
    ui.building = null;
    const busy = TOF.buildersBusy(state);
    let html = `<p class="note builders">${icon('hammer', 'tiny')} Builders: <b>${TOF.MAX_BUILDERS - busy} of ${TOF.MAX_BUILDERS}</b> free</p><ul class="fleet-list">`;
    for (const b of state.buildings) {
      html += `<li><button class="fl-row" data-act="openb" data-b="${b.id}"><span class="fl-img">${bImg(b.type, b.level)}</span>
        <span class="fl-main"><b>${bName(b.type)}</b><small>${b.level ? `Level ${b.level}` : 'Under construction'}${b.pending && b.level ? `, upgrading to ${b.pending.toLevel}` : ''}</small></span>${bStatus(b, now)}</button></li>`;
    }
    html += `</ul><h3 class="group">Construct</h3>`;
    for (const type of TOF.BUILDING_ORDER) {
      const d = TOF.BUILDINGS[type];
      if (d.prebuilt || TOF.buildingOfType(state, type)) continue;
      const lock = TOF.buildLock(state, type);
      const cost = d.costs[0];
      const afford = cost && TOF.canAfford(state, cost);
      let btn;
      if (lock) btn = `<p class="lock">${esc(lock)}</p>`;
      else if (busy >= TOF.MAX_BUILDERS) btn = `<p class="lock">Both builders are busy.</p>`;
      else btn = `<button class="btn ${afford ? 'primary' : ''}" data-act="place" data-type="${type}" ${afford ? '' : 'disabled'}>${afford ? 'Choose a spot' : `Need ${missingText(state, cost)}`}</button>`;
      html += `<article class="card build ${lock ? 'locked' : ''}"><header class="ship-head">${bImg(type, 1, 'big')}<div><h3>${d.name}</h3><p>${d.desc}</p></div></header>
        ${cost ? `<p class="cost">Cost: ${costText(state, cost)} <span class="bt">${icon('hammer', 'tiny')} ${buildTime(state, TOF.buildHours(1))}</span></p>` : ''}${btn}</article>`;
    }
    return html;
  }

  function effectText(state, b, lvl) {
    switch (b.type) {
      case 'market': return lvl > 1 ? `Sale prices +${(lvl - 1) * 15}%.` : 'Standard prices.';
      case 'shipwright': return lvl > 1 ? `Repairs cost ${(lvl - 1) * 20}% fewer coins.` : 'Standard repair costs.';
      case 'dockyard': return ['', 'Builds tier 2 hulls (cog, trawler).', 'Builds tier 3 hulls (schooner, brigantine, barge).', 'Builds every hull, including the galleon, caravel and frigate.'][lvl];
      case 'warehouse': return `Storage limit ${300 + 250 * lvl} per good.`;
      case 'weaponsmith': return `+${lvl * 10}% pirate-hunting power for every ship.`;
      case 'cartographer': return `+${lvl * 15}% exploration power for every ship.`;
      case 'tavern': return `Rumored trips pay +${Math.round((0.2 + 0.1 * (lvl - 1)) * 100)}%.`;
      case 'tradingPost': return 'Buy 5% cheaper and sell 5% dearer per level above 1.';
      default: {
        const rc = TOF.BUILDINGS[b.type].recipe;
        if (rc) return `${Object.entries(rc.in).map(([k, v]) => `${v} ${resName(k)}`).join(' + ')} make 1 ${unit(rc.out, 1)}, ${span(rc.hours * TOF.hourMs(state) / TOF.recipeSpeed(lvl))} each, up to ${10 * lvl} per batch.`;
        return '';
      }
    }
  }
  const GATE_OF = Object.fromEntries(Object.entries(TOF.UPGRADES).filter(([, u]) => u.gate).map(([k, u]) => [u.gate, u.name.toLowerCase()]));

  function renderBuildingDetail(state, now, b) {
    const d = TOF.BUILDINGS[b.type];
    let html = `<button class="back" data-act="bback">‹ Village</button>
      <article class="card"><header class="ship-head">${bImg(b.type, b.level, 'big')}<div><h3>${d.name}</h3><p>${d.desc}</p></div></header>
      <div class="pips">${Array.from({ length: TOF.BUILDING_MAX_LEVEL }, (_, i) => `<i class="${i < b.level ? 'on' : ''}"></i>`).join('')}</div>
      ${b.level ? `<p class="desc"><b>Level ${b.level}:</b> ${effectText(state, b, b.level)}${GATE_OF[b.type] ? ` Allows ${GATE_OF[b.type]} levels 2 and 3.` : ''}</p>` : ''}`;
    if (b.pending) {
      html += `<div class="progress"><i data-bbar="${b.id}"></i></div><p class="eta">${b.level ? `Upgrading to level ${b.pending.toLevel}` : 'Under construction'}. Done in <b data-btimer="${b.id}"></b>.</p>
        ${state.settings.devMode ? `<button class="btn dev" data-act="finish">Finish now (developer)</button>` : ''}`;
    }
    html += `</article>`;
    if (b.level >= 1) {
      const rc = d.recipe;
      if (rc) {
        html += `<article class="card"><h3>Production</h3><p class="desc">${effectText(state, b, b.level)}</p>`;
        if (b.job) {
          const j = b.job;
          html += `<div class="progress"><i data-jbar="${b.id}"></i></div><p class="eta">${icon(j.out, 'tiny')} <b data-jcount="${b.id}">${j.done}</b> of ${j.qty} ${resName(j.out)} made. Batch done in <b data-jtimer="${b.id}"></b>.</p>
            <button class="btn" data-act="canceljob" data-b="${b.id}">Stop and refund the rest</button>`;
        } else {
          let can = TOF.maxBatch(b);
          for (const [k, v] of Object.entries(rc.in)) can = Math.min(can, Math.floor(state.resources[k] / v));
          const have = Object.entries(rc.in).map(([k]) => `${state.resources[k]} ${resName(k)}`).join(', ');
          html += `<p class="desc">You have ${have}.</p><div class="btn-row three">
            <button class="btn small" data-act="job" data-b="${b.id}" data-q="1" ${can >= 1 ? '' : 'disabled'}>Make 1</button>
            <button class="btn small" data-act="job" data-b="${b.id}" data-q="5" ${can > 5 ? '' : 'disabled'}>Make 5</button>
            <button class="btn small primary" data-act="job" data-b="${b.id}" data-q="${can}" ${can >= 1 ? '' : 'disabled'}>Make all${can ? ` (${can})` : ''}</button></div>`;
        }
        html += `</article>`;
      }
      if (b.type === 'tradingPost') {
        html += `<article class="card"><h3>Buy</h3>${Object.keys(TOF.TRADE.buy).map(r => `<div class="mrow">${icon(r, 'mid')}<div class="m-info"><b>${TOF.RESOURCES[r].name}</b><span>${TOF.tradePrice(state, 'buy', r)} coins each, you have ${state.resources[r]}</span></div>
          <div class="m-btns"><button class="btn small" data-act="trade" data-side="buy" data-res="${r}" data-q="10">Buy 10</button><button class="btn small" data-act="trade" data-side="buy" data-res="${r}" data-q="50">Buy 50</button></div></div>`).join('')}</article>
          <article class="card"><h3>Sell</h3>${Object.keys(TOF.TRADE.sell).filter(r => state.discovered.includes(r)).map(r => `<div class="mrow">${icon(r, 'mid')}<div class="m-info"><b>${TOF.RESOURCES[r].name}</b><span>${TOF.tradePrice(state, 'sell', r)} coins each, you have ${state.resources[r]}</span></div>
          <div class="m-btns"><button class="btn small" data-act="trade" data-side="sell" data-res="${r}" data-q="10" ${state.resources[r] ? '' : 'disabled'}>Sell 10</button><button class="btn small" data-act="trade" data-side="sell" data-res="${r}" data-q="${state.resources[r]}" ${state.resources[r] ? '' : 'disabled'}>Sell all</button></div></div>`).join('') || '<p class="note">Make planks, rope, iron or food to sell them here.</p>'}</article>`;
      }
      if (b.type === 'seaWitch') {
        const cursed = state.ships.filter(x => x.curse);
        html += `<article class="card"><h3>${icon('charm', 'mid')} Warding charms</h3><p class="desc">A charm halves hull damage on one trip, wards off curses, and gives +30% against ghosts and monsters. Costs 2 enchanted essence and 1 relic. You have ${state.resources.charm}.</p>
          <button class="btn ${TOF.canAfford(state, { essence: 2, relics: 1 }) ? 'primary' : ''}" data-act="charmcraft" ${TOF.canAfford(state, { essence: 2, relics: 1 }) ? '' : 'disabled'}>Make a charm</button>
          ${cursed.length ? `<h3 style="margin-top:12px">Cursed ships</h3>${cursed.map(x => `<div class="mrow"><span class="fl-img">${shipImg(x.cls)}</span><div class="m-info"><b>${esc(x.name)}</b><span>${x.curse.trips} trip${x.curse.trips > 1 ? 's' : ''} left</span></div><div class="m-btns"><button class="btn small" data-act="cleanse" data-ship="${x.id}" ${state.resources.essence ? '' : 'disabled'}>Lift (1 essence)</button></div></div>`).join('')}` : ''}</article>`;
      }
      if (b.type === 'tavern') {
        const rm = TOF.rumorFor(state, now);
        html += `<article class="card rumor"><h3>${icon(TYPE_ICON[rm.type], 'mid')} Today’s rumor</h3><p class="desc">“${esc(rm.text)}”</p><p class="desc"><b>${TOF.TYPES[rm.type].name}</b> trips that set out today pay <b>+${Math.round((rm.bonus - 1) * 100)}%</b>. A new rumor goes round tomorrow.</p></article>`;
      }
      if (b.type === 'market') html += `<button class="btn" data-act="gostores">Open the stores</button>`;
      if (b.type === 'shipwright') html += `<button class="btn" data-act="goshipwright">Open the Shipwright</button>`;
    }
    if (b.level >= 1 && !b.pending) {
      if (b.level >= TOF.BUILDING_MAX_LEVEL) html += `<p class="ok-text">Fully upgraded.</p>`;
      else {
        const cost = TOF.buildCost(b.type, b.level + 1), block = TOF.upgradeBlock(state, b), afford = TOF.canAfford(state, cost);
        html += `<article class="card"><h3>Upgrade to level ${b.level + 1}</h3><p class="desc">${effectText(state, b, b.level + 1)}</p>
          <p class="cost">Cost: ${costText(state, cost)} <span class="bt">${icon('hammer', 'tiny')} ${buildTime(state, TOF.buildHours(b.level + 1))}</span></p>
          ${block ? `<p class="lock">${esc(block)}</p>` : `<button class="btn ${afford ? 'primary' : ''}" data-act="bupgrade" data-b="${b.id}" ${afford ? '' : 'disabled'}>${afford ? `Upgrade to level ${b.level + 1}` : `Need ${missingText(state, cost)}`}</button>`}</article>`;
      }
    }
    html += `<button class="btn" data-act="showb" data-b="${b.id}">Show in the village</button>`;
    return html;
  }

  // ---------- placement bar ----------
  function beginPlacing(type) {
    closePanel();
    document.body.classList.add('placing');
    $('#placeTitle').textContent = `Place the ${bName(type)}`;
    World.startPlacing(type);
  }
  function onPlaceChange(p) {
    $('#placeHint').textContent = p.reason || 'Looks good. Tap elsewhere to move it.';
    $('#placeHint').classList.toggle('bad', !!p.reason);
    $('#placeOk').disabled = !!p.reason;
  }
  function endPlacing() { World.stopPlacing(); document.body.classList.remove('placing'); }

  // ---------- shipwright ----------
  function costText(state, cost) {
    return Object.entries(cost).map(([k, v]) => `<span class="cost-item ${state.resources[k] >= v ? '' : 'short'}">${icon(k, 'tiny')} ${v}</span>`).join(' ');
  }
  function missingText(state, cost) {
    return Object.entries(cost).filter(([k, v]) => state.resources[k] < v).map(([k, v]) => `${v - state.resources[k]} more ${k === 'coins' ? 'coins' : resName(k)}`).join(' and ');
  }
  function renderShipwright(state, now) {
    const tabs = `<div class="seg" role="tablist"><button role="tab" aria-selected="${ui.swTab === 'build'}" data-act="swtab" data-tab="build">Build ships</button><button role="tab" aria-selected="${ui.swTab === 'upgrade'}" data-act="swtab" data-tab="upgrade">Upgrades</button></div>`;
    return tabs + (ui.swTab === 'build' ? renderBuild(state) : renderUpgrades(state, now));
  }
  function renderBuild(state) {
    let html = `<p class="note">${state.ships.length} of ${TOF.MAX_SHIPS} berths in use.</p>`;
    for (const cls of TOF.CLASS_ORDER) {
      const c = TOF.SHIP_CLASSES[cls], st = TOF.shipStats({ cls, upgrades: {} });
      const owned = state.ships.filter(s => s.cls === cls).length;
      const lock = TOF.classLock(state, cls);
      const afford = TOF.canAfford(state, c.cost);
      const btn = lock ? `<p class="lock">${esc(lock)}</p>`
        : `<button class="btn ${afford ? 'primary' : ''}" data-act="build" data-cls="${cls}" ${afford ? '' : 'disabled'}>${afford ? `Build a ${c.name.split(' ').pop().toLowerCase()}` : `Need ${missingText(state, c.cost)}`}</button>`;
      html += `<article class="card build ${lock ? 'locked' : ''}">
        <header class="ship-head">${shipImg(cls, 'big')}<div><h3>${c.name}</h3><p>${c.blurb}${owned ? ` You have ${owned}.` : ''}</p></div></header>
        <p class="role">${icon(TYPE_ICON[c.role], 'tiny')} Best at ${TOF.TYPES[c.role].name.toLowerCase()}</p>
        ${statGrid(st, true)}
        <p class="cost">Cost: ${costText(state, c.cost)}</p>${btn}</article>`;
    }
    return html;
  }
  function renderUpgrades(state, now) {
    if (!ui.swShip || !TOF.getShip(state, ui.swShip)) ui.swShip = state.ships[0].id;
    const ship = TOF.getShip(state, ui.swShip), st = TOF.shipStats(ship);
    const atSea = !!TOF.expeditionForShip(state, ship.id);
    let html = `<div class="ship-pick">${state.ships.map(s => `<button data-act="swship" data-ship="${s.id}" aria-pressed="${s.id === ship.id}">${shipImg(s.cls)}<span>${esc(s.name)}</span></button>`).join('')}</div>
      <article class="card"><header class="ship-head">${shipImg(ship.cls, 'big')}<div><h3>${esc(ship.name)}</h3><p>${st.name}</p></div></header>${statGrid(st)}</article>`;
    if (atSea) html += `<p class="warn">${esc(ship.name)} is at sea. Upgrades are fitted when she’s back in harbor.</p>`;
    for (const key of TOF.UPGRADE_KEYS) {
      const u = TOF.UPGRADES[key], lvl = ship.upgrades[key], cost = TOF.upgradeCost(ship, key);
      const afford = cost && TOF.canAfford(state, cost);
      const gate = cost ? TOF.upgradeGate(state, ship, key) : null;
      html += `<div class="card upg"><div class="upg-top"><div><h3>${u.name}</h3><p class="desc">${u.effect}</p></div>
        <div class="pips">${Array.from({ length: u.maxLevel }, (_, i) => `<i class="${i < lvl ? 'on' : ''}"></i>`).join('')}</div></div>
        ${!cost ? '<p class="ok-text">Fully upgraded.</p>' : gate ? `<p class="lock">${esc(gate)}</p>` : `<div class="upg-buy"><span class="cost">${costText(state, cost)}</span>
          <button class="btn small ${afford && !atSea ? 'primary' : ''}" data-act="upgrade" data-ship="${ship.id}" data-key="${key}" ${afford && !atSea ? '' : 'disabled'}>Fit level ${lvl + 1}</button></div>`}</div>`;
    }
    return html;
  }

  // ---------- sea chart ----------
  function regionPerks(Rg) {
    const out = [];
    for (const [k, v] of Object.entries(Rg.yield || {})) out.push(k === 'all' ? `everything pays +${Math.round((v - 1) * 100)}%` : `${TOF.TYPES[k].name.toLowerCase()} pays +${Math.round((v - 1) * 100)}%`);
    if (Rg.raw) out.push('double timber and hemp');
    if (Rg.ore) out.push('far more iron ore');
    if (Rg.chest) out.push(`chests turn up ${Rg.chest}× as often`);
    if (Rg.moonfish) out.push('moonfish in the nets');
    if (Rg.ghosts) out.push('ghost ships (magic beats cannons)');
    if (Rg.monsters) out.push('sea monsters');
    if (Rg.curse) out.push('cursed wrecks');
    return out;
  }
  function renderMap(state) {
    const sel = TOF.REGIONS[ui.mapSel] ? ui.mapSel : 'home', Rg = TOF.REGIONS[sel], known = state.regions.includes(sel);
    let html = `<div class="chartwrap"><canvas id="chart" aria-label="Sea chart. Tap a region."></canvas></div>`;
    const perks = regionPerks(Rg);
    const lock = known ? null : TOF.regionLock(state, sel);
    html += `<article class="card"><header class="ship-head"><div><h3>${known ? esc(Rg.name) : 'Uncharted waters'}</h3><p>${RING[Rg.ring]}${Rg.ring ? `, trips take ${Math.round((Rg.dist - 1) * 100)}% longer, ${Rg.danger >= 1.6 ? 'very dangerous' : Rg.danger > 1.1 ? 'risky' : 'calm'}` : ''}</p></div></header>
      <p class="desc">${known ? esc(Rg.desc) : `Sailors talk about ${esc(Rg.name)}: ${esc(Rg.desc.toLowerCase())}`}</p>
      ${perks.length ? `<p class="desc"><b>Out here:</b> ${perks.join(', ')}.</p>` : ''}
      ${Rg.minExplore ? `<p class="desc">Ships need <b>${Rg.minExplore}</b> exploration to sail here.</p>` : ''}
      ${Rg.landmark ? `<p class="desc">${state.landmarks.includes(sel) ? `${icon('compass', 'tiny')} <b>${esc(Rg.landmark)}</b> found: trips here pay +20%.` : known ? 'Something worth finding is out here. Exploring may reveal it.' : ''}</p>` : ''}
      ${known ? (sel === 'home' ? '' : `<button class="btn primary" data-act="planhere" data-r="${sel}">Send a ship here</button>`)
        : lock ? `<p class="lock">${esc(lock)}</p>` : `<button class="btn ${state.resources.charts >= Rg.cost.charts ? 'primary' : ''}" data-act="reveal" data-r="${sel}" ${state.resources.charts >= Rg.cost.charts ? '' : 'disabled'}>Chart it for ${Rg.cost.charts} sea charts (you have ${state.resources.charts})</button>`}
    </article>`;
    if (state.reports.length) html += `<h3 class="group">Ship’s log</h3><div class="card logbook">${state.reports.slice(0, 8).map(r => `<p><b>${esc(r.ship)}</b>, ${esc(TOF.REGIONS[r.region] ? TOF.REGIONS[r.region].name : '')}: ${r.lines.map(l => esc(l.text)).join(' ')}</p>`).join('')}</div>`;
    const lore = state.lore.kraken;
    if (lore) html += `<h3 class="group">Sightings in the deep</h3><div class="card logbook kraken">${TOF.KRAKEN_HINTS.slice(0, Math.min(lore, TOF.KRAKEN_HINTS.length)).map((h, i) => `<p><b>${i + 1}.</b> ${esc(h)}</p>`).join('')}${lore < TOF.KRAKEN_HINTS.length ? '<p class="note">The farther you sail, the more you’ll hear.</p>' : ''}</div>`;
    return html;
  }
  function drawMap() {
    const c = document.getElementById('chart'); if (!c) return;
    Art.drawChart(c, App.state, ui.mapSel, 0);
    c.onclick = e => {
      const r = c.getBoundingClientRect();
      const id = Art.chartPick((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
      if (id) { ui.mapSel = id; refreshPanel(); }
    };
  }

  // ---------- chests ----------
  function showChest(id) {
    const c = TOF.CHESTS[id], z = TOF.CHEST_SIZES[c.size], key = TOF.KEY_OF[c.family], have = App.state.resources[key];
    $('#modalBody').innerHTML = `<div class="chestbox"><img class="px chestimg ${c.size}" src="${Art.chestURL(c.family, c.size, false)}" alt=""></div>
      <h2>${c.name}</h2><p class="sub">Needs ${z.keys} ${resName(key)}${z.keys > 1 ? 's' : ''}. You have ${have}.</p>
      <button class="btn ${have >= z.keys ? 'primary' : ''}" data-act="dochest" data-c="${id}" ${have >= z.keys ? '' : 'disabled'}>${have >= z.keys ? 'Open it' : `${{ sunkenKey: 'Fishing', pirateKey: 'Pirate hunting', lostKey: 'Exploring' }[key]} turns up these keys`}</button>`;
    $('#modalOk').textContent = 'Close';
    $('#modalOk').classList.remove('primary');
    $('#modal').hidden = false;
  }
  function doChest(id) {
    const c = TOF.CHESTS[id];
    const img = document.querySelector('.chestimg');
    if (img) img.classList.add('shake');
    Sound.play('chestShake');
    setTimeout(() => {
      const r = App.openChest(id);
      if (!r.ok) { toast(r.reason, 'bad'); return; }
      Sound.play('chestOpen'); if (r.trophy) setTimeout(() => Sound.play('trophy'), 450);
      const list = Object.entries(r.items).map(([k, v]) => `<li>${icon(k, 'mid')}<span>${TOF.RESOURCES[k].name}</span><b>+${v}</b></li>`).join('');
      $('#modalBody').innerHTML = `<div class="chestbox open"><img class="px chestimg ${c.size}" src="${Art.chestURL(c.family, c.size, true)}" alt=""></div>
        <h2>${r.jackpot ? 'Mother lode!' : c.name}</h2><ul class="haul">${list}</ul>
        ${r.trophy ? `<div class="trophy">${icon(r.trophy, 'big')}<div><b>${TOF.TROPHIES[r.trophy].name}</b><p>${TOF.TROPHIES[r.trophy].bonus}${r.first ? '' : ' (already on your shelf: a spare)'}</p>${TOF.TROPHIES[r.trophy].lore ? `<p class="lore">${esc(TOF.TROPHIES[r.trophy].lore)}</p>` : ''}</div></div>` : ''}
        ${App.state.resources[id] > 0 ? `<button class="btn" data-act="chestagain" data-c="${id}">Open another (${App.state.resources[id]} left)</button>` : ''}`;
      $('#modalOk').textContent = 'Stow the loot';
      $('#modalOk').classList.add('primary');
    }, 650);
  }

  // ---------- sky ----------
  const WLABEL = { sunny: 'Clear', rainy: 'Rain', snowy: 'Snow', foggy: 'Fog' };
  let lastChip = '';
  function renderSkyChip() {
    const sk = World.sky; if (!sk) return;
    const w = sk.weather;
    const ico = w.kind === 'sunny' ? (sk.dark > 0.6 ? 'moon' : 'sun') : { rainy: 'rain', snowy: 'snow', foggy: 'fog' }[w.kind];
    const label = `${w.kind === 'sunny' && w.cloudy ? 'Cloudy' : w.storm ? 'Storm' : WLABEL[w.kind]}, ${clock(Date.now())}`;
    const key = ico + label;
    if (key === lastChip) return;
    lastChip = key;
    $('#skyChip').innerHTML = `${icon(ico, 'tiny')}<span>${label}</span>`;
  }
  function renderSkySettings(state) {
    const sk = state.settings.sky, st = Sky.status, w = World.sky ? World.sky.weather : null;
    const seg = (act, list, cur, labels) => `<div class="chips">${list.map(v => `<button class="chip" role="radio" aria-checked="${v === cur}" data-act="${act}" data-v="${v}">${labels[v]}</button>`).join('')}</div>`;
    let line = '';
    if (sk.weather === 'live') {
      if (st.state === 'ok' && Sky.live) line = `Live: <b>${WLABEL[Sky.live.kind]}${Number.isFinite(Sky.live.temp) ? `, ${Math.round(Sky.live.temp)}°` : ''}</b> in ${esc(Sky.live.place || 'your area')}, checked at ${clock(Sky.live.at)}.`;
      else if (st.state === 'loading') line = 'Checking the weather…';
      else line = `${esc(st.text || 'Live weather isn’t connected yet.')}${w && w.source === 'sim' ? ` Right now the simulated sky shows <b>${WLABEL[w.kind].toLowerCase()}</b>.` : ''}`;
    }
    return `<section class="card">
      <h3>Sky and weather</h3>
      <p class="label">Weather</p>${seg('skyw', TOF.SKY_WEATHER, sk.weather, { live: 'Live', sunny: 'Clear', rainy: 'Rain', snowy: 'Snow', foggy: 'Fog' })}
      ${line ? `<p class="desc">${line}</p>` : ''}
      ${sk.weather === 'live' ? `<p class="label">Location${sk.place ? `: <b>${esc(sk.place.name)}</b>` : ''}</p>
        <div class="btn-row"><button class="btn small" data-act="skyloc">Use my location</button><button class="btn small" data-act="skyrefresh">Check now</button></div>
        <div class="place-search"><input id="placeInput" placeholder="Or type a town or city" autocomplete="off" maxlength="60"><button class="btn small" data-act="skysearch">Find</button></div>` : ''}
      <p class="label">Time of day</p>${seg('skyt', TOF.SKY_TIMES, sk.time, { live: 'Clock', dawn: 'Dawn', day: 'Day', dusk: 'Dusk', night: 'Night' })}
      <p class="note">${sk.time === 'live' ? `Follows this device’s clock: sunrise about ${fmtHour(World.sky.sunrise)}, sunset about ${fmtHour(World.sky.sunset)}.` : 'Fixed for now. Choose Clock to follow real time again.'}</p>
    </section>`;
  }
  const fmtHour = h => { const d = new Date(); d.setHours(Math.floor(h), Math.round((h % 1) * 60), 0, 0); return clock(d.getTime()); };

  // ---------- settings ----------
  function renderSettings(state) {
    const s = state.settings;
    const tests = ui.testResults ? `<ul class="tests">${ui.testResults.map(t => `<li class="${t.ok ? 'pass' : 'fail'}">${t.ok ? 'Pass' : 'Fail'}: ${esc(t.name)}${t.err ? ` (${esc(t.err)})` : ''}</li>`).join('')}</ul>
      <p class="${ui.testResults.every(t => t.ok) ? 'ok-text' : 'warn'}">${ui.testResults.filter(t => t.ok).length} of ${ui.testResults.length} tests passed.</p>` : '';
    const au = s.audio;
    const slider = (k, label) => `<label class="slider"><span>${label}</span><input type="range" min="0" max="100" step="5" value="${Math.round(au[k] * 100)}" data-act="vol" data-k="${k}" aria-label="${label} volume"><b>${Math.round(au[k] * 100)}</b></label>`;
    const sound = `<section class="card"><h3>Sound</h3>${slider('music', 'Music')}${slider('sfx', 'Effects')}${slider('ambience', 'Sea sounds')}
      <p class="note">${Sound.ready ? 'On an iPhone, the ring/silent switch has to be on ring to hear the game.' : 'Sound starts after your first tap. On an iPhone, the ring/silent switch has to be on ring.'}</p>
      <label class="switch"><input type="checkbox" data-act="battery" ${s.batterySaver ? 'checked' : ''}><span class="track"><span class="knob"></span></span><span><b>Battery saver</b><br><small>Draws the harbor at half the frame rate with lighter rain and snow.</small></span></label></section>`;
    const backup = `<section class="card"><h3>Save backup</h3>
      <p class="desc">Copy your harbor as a save code to keep it safe, or to move it to another phone or to the home-screen app.</p>
      <div class="btn-row"><button class="btn small" data-act="copysave">Copy save code</button>${PWA.sandboxed && location.protocol !== 'file:' ? '' : '<button class="btn small" data-act="dlsave">Download save file</button>'}</div>
      ${ui.showCode ? `<textarea id="saveCode" readonly rows="3" aria-label="Your save code">${esc(App.exportCode())}</textarea><p class="note">Select all of it and copy it somewhere safe, such as Notes.</p>` : ''}
      <p class="label">Load a save</p>
      <textarea id="importCode" rows="3" placeholder="Paste a save code here" aria-label="Save code to load"></textarea>
      <div class="btn-row"><button class="btn small ${ui.importArmed ? 'danger' : ''}" data-act="importsave">${ui.importArmed ? 'Tap again: replace this harbor' : 'Load this save'}</button><label class="btn small filebtn">Choose a save file<input type="file" id="importFile" accept=".txt,.json,text/plain,application/json"></label></div>
      ${PWA.sandboxed ? '' : `<p class="note">${PWA.persisted ? 'This browser has promised to keep your save.' : 'Tip: back up now and then. Clearing website data in Settings deletes the save.'}</p>`}</section>`;
    const install = PWA.standalone() || PWA.sandboxed ? '' : `<section class="card"><h3>Install on this phone</h3><p class="desc">${PWA.isIOS ? 'Tap the <b>Share</b> button in Safari, then <b>Add to Home Screen</b>. The game gets its own icon and plays offline.' : 'Open your browser menu and choose <b>Install app</b> or <b>Add to Home screen</b>. The game gets its own icon and plays offline.'}</p></section>`;
    return renderSkySettings(state) + sound + backup + install + `<section class="card devcard ${s.devMode ? 'on' : ''}">
        <label class="switch"><input type="checkbox" data-act="dev" ${s.devMode ? 'checked' : ''}><span class="track"><span class="knob"></span></span><span><b>Developer mode</b><br><small>Trips started while this is on finish in seconds. Trips already at sea keep their timer.</small></span></label>
        ${s.devMode ? `<p class="label">One in-game hour lasts</p>
          <div class="chips">${TOF.DEV_SPEEDS.map(n => `<button class="chip" role="radio" aria-checked="${n === s.devSecondsPerHour}" data-act="speed" data-n="${n}">${n} s</button>`).join('')}</div>
          <div class="btn-grid">
            <button class="btn dev" data-act="finish">Finish all trips now</button>
            <button class="btn dev" data-act="grant" data-grant="coins">Add 1,000 coins</button>
            <button class="btn dev" data-act="grant" data-grant="mats">Add 5 of each rare find</button>
            <button class="btn dev" data-act="grant" data-grant="raw">Add raw materials</button>
            <button class="btn dev" data-act="grant" data-grant="goods">Add planks, rope, iron, food</button>
