  // ---------- actions ----------
  function onSheetClick(e) {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const a = b.dataset.act, st = App.state, id = b.dataset.ship;
    const ship = id ? TOF.getShip(st, id) : null;
    const say = (r, okText) => toast(r.ok ? okText : r.reason, r.ok ? 'good' : 'bad');
    switch (a) {
      case 'openship': ui.fleetShip = id; refreshPanel(true); World.focusShip(id); break;
      case 'back': ui.fleetShip = null; refreshPanel(true); break;
      case 'type': planFor(ship).type = b.dataset.type; refreshPanel(); break;
      case 'hours': planFor(ship).hours = +b.dataset.h; refreshPanel(); break;
      case 'region': planFor(ship).region = b.dataset.r; ui.pendingRegion = null; refreshPanel(); break;
      case 'sail': {
        const p = planFor(ship), r = App.dispatch(id, p.hours, p.type, { supplies: !!ui.supplies[id], charm: !!ui.charm[id], region: p.region });
        if (r.ok) ui.pendingRegion = null;
        if (!r.ok) toast(r.reason, 'bad');
        else { Sound.play('sail'); toast(`${ship.name} set out ${{ fishing: 'fishing', treasure: 'treasure hunting', combat: 'to hunt pirates', exploration: 'exploring' }[p.type]}.`); ui.fleetShip = null; closePanel(); World.focusShip(id); }
        break;
      }
      case 'repeatall': {
        let n = 0;
        for (const s of st.ships) if (TOF.shipStatus(st, s.id, App.now()) === 'idle' && App.dispatch(s.id, s.lastTrip.hours, s.lastTrip.type).ok) n++;
        toast(`${n} ship${n > 1 ? 's' : ''} set sail.`, 'good'); closePanel();
        break;
      }
      case 'claim': collect(b.dataset.exp); break;
      case 'claimall': collectAll(); break;
      case 'repair': { const r = App.repair(id); say(r, `${ship.name} is patched up (${r.cost} coins, ${r.planks} ${unit('planks', r.planks)}).`); break; }
      case 'rename': ui.renaming = id; refreshPanel(); { const i = document.getElementById('renameInput'); if (i) { i.focus(); i.select(); } } break;
      case 'dorename': { const i = document.getElementById('renameInput'); const r = App.rename(id, i ? i.value : ''); ui.renaming = null; say(r, 'Renamed.'); if (r.ok) refreshPanel(); break; }
      case 'cancelrename': ui.renaming = null; refreshPanel(); break;
      case 'goupgrade': openPanel('shipwright', { tab: 'upgrade', ship: id }); break;
      case 'chest': showChest(b.dataset.c); break;
      case 'charmcraft': { const r = App.craftCharm(); say(r, 'The witch hands you a warm, humming charm.'); break; }
      case 'cleanse': { const r = App.cleanse(id); say(r, `The curse on ${ship ? ship.name : 'her'} lifts like fog.`); break; }
      case 'mapsel': ui.mapSel = b.dataset.r; refreshPanel(); break;
      case 'reveal': { const r = App.revealRegion(b.dataset.r); say(r, `${TOF.REGIONS[b.dataset.r].name} is on the chart.`); break; }
      case 'planhere': ui.pendingRegion = b.dataset.r; openPanel('fleet'); toast(`Pick a ship for ${TOF.REGIONS[b.dataset.r].name}.`); break;
      case 'openb': ui.building = b.dataset.b; refreshPanel(true); World.focusBuilding(b.dataset.b); break;
      case 'bback': ui.building = null; refreshPanel(true); break;
      case 'place': beginPlacing(b.dataset.type); break;
      case 'vtab': ui.vTab = b.dataset.tab; refreshPanel(true); break;
      case 'brew': brewIt(b.dataset.tier); break;
      case 'brewshow': { const lb = st.halloween.lastBrew; if (lb) { closePanel(); showBrew(lb); $('#modal').hidden = false; } break; }
      case 'gocauldron': closePanel(); World.focusCauldron(); break;
      case 'goship': closePanel(); World.focusGhostShip(); break;
      case 'kdbg': closePanel(); App.krakenDebug(b.dataset.c); World.kraken.struck(false); World.kraken.forceBuild(); World.kraken.focus(); break;
      case 'kpause': { const d = World.kraken.dbg; if (d.paused) { d.lost += Date.now() - d.pausedAt; d.paused = false; } else { d.pausedAt = Date.now() - d.lost; d.paused = true; } refreshPanel(); break; }
      case 'krig': World.kraken.dbg.rig = !World.kraken.dbg.rig; refreshPanel(); break;
      case 'pumpkins': { const r = App.harvestPumpkins(); say(r, r.ok ? `Harvested the pumpkins: +${r.food} preserved food.` : ''); if (r.ok) Sound.play('coins'); break; }
      case 'gtrade': { const r = App.ghostTrade(b.dataset.o); say(r, r.ok ? `The ghostly crew hands over ${Object.entries(r.offer.get).map(([k, v]) => `${v} ${resName(k)}`).join(', ')}.` : ''); if (r.ok) Sound.play('coins'); break; }
      case 'drepaint': { const r = App.repaintDecor(b.dataset.d); if (!r.ok) toast(r.reason, 'bad'); else Sound.play('tap'); break; }
      case 'dstow': { const r = App.stowDecor(b.dataset.d); say(r, r.ok ? `${TOF.DECOR[r.decor.type].name} packed away.` : ''); if (r.ok) ui.hwDecor = null; refreshPanel(); break; }
      case 'sellref': { const r = App.sellRefined(b.dataset.res, +b.dataset.q); say(r, `Sold ${r.qty} ${resName(b.dataset.res)} for ${r.coins} coins (${TOF.REFINED_PRICE} each).`); if (r.ok) Sound.play('coins'); break; }
      case 'evt': App.setEvent(b.dataset.v); toast(`Halloween event: ${{ auto: 'by date', on: 'forced on', off: 'forced off' }[b.dataset.v]}.`); break;
      case 'dplace': beginPlacing(b.dataset.type); break;
      case 'dbuy': { const r = App.buyDecor(b.dataset.type); say(r, `${TOF.DECOR[b.dataset.type].name} built. ${TOF.DECOR[b.dataset.type].effect}`); if (r.ok) Sound.play('success'); break; }
      case 'dmove': { const d = st.decor.find(x => x.id === b.dataset.d); if (d) beginPlacing(d.type, d.id); break; }
      case 'dshow': closePanel(); World.focusDecor(b.dataset.d); break;
      case 'bupgrade': { const r = App.upgradeBuilding(b.dataset.b); say(r, `Builders started on the ${r.ok ? bName(r.building.type) : ''}.`); break; }
      case 'job': { const r = App.queueJob(b.dataset.b, +b.dataset.q); say(r, `Started making ${r.qty} ${unit(TOF.BUILDINGS[TOF.getBuilding(App.state, b.dataset.b).type].recipe.out, r.qty)}.`); break; }
      case 'canceljob': { const r = App.cancelJob(b.dataset.b); say(r, `Stopped. Inputs for ${r.refunded} unmade unit${r.refunded === 1 ? '' : 's'} refunded.`); break; }
      case 'trade': { const r = App.trade(b.dataset.side, b.dataset.res, +b.dataset.q); say(r, `${b.dataset.side === 'buy' ? 'Bought' : 'Sold'} ${r.qty} ${resName(b.dataset.res)} for ${r.coins} coins.`); break; }
      case 'showb': closePanel(); World.focusBuilding(b.dataset.b); break;
      case 'moveb': { const bb = TOF.getBuilding(st, b.dataset.b); if (bb) beginPlacing(bb.type, bb.id); break; }
      case 'harvest': harvestField(); break;
      case 'gostores': openPanel('market'); break;
      case 'goshipwright': openPanel('shipwright'); break;
      case 'swtab': ui.swTab = b.dataset.tab; refreshPanel(true); break;
      case 'swship': ui.swShip = id; refreshPanel(); break;
      case 'build': {
        const r = App.buildShip(b.dataset.cls);
        if (r.ok) { toast(`${r.ship.name} slides down the slipway.`, 'good'); World.focusShip(r.ship.id); }
        else toast(r.reason, 'bad');
        break;
      }
      case 'upgrade': { const r = App.buyUpgrade(id, b.dataset.key); say(r, `${TOF.UPGRADES[b.dataset.key].name} fitted, level ${r.level}.`); break; }
      case 'finish': { const n = App.finishAll(); toast(n ? `${n} trip${n > 1 ? 's' : ''} finished.` : 'No trips at sea.'); break; }
      case 'sell': { const r = App.sell(b.dataset.res, +b.dataset.q); say(r, `Sold ${r.sold} for ${r.coins} coins.`); break; }
      case 'sellall': { const r = App.sellAll(); say(r, `Sold ${r.sold} catch for ${r.coins} coins.`); break; }
      case 'speed': App.setDevSpeed(+b.dataset.n); break;
      case 'copysave': {
        const code = App.exportCode();
        const done2 = okc => { ui.showCode = !okc; refreshPanel(); toast(okc ? 'Save code copied. Keep it somewhere safe.' : 'Copy the code below by hand.', okc ? 'good' : ''); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(() => done2(true), () => done2(false)); else done2(false);
        break;
      }
      case 'dlsave': {
        const blob = new Blob([App.exportCode()], { type: 'text/plain' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `tides-of-fortune-${new Date().toISOString().slice(0, 10)}.txt`; document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        break;
      }
      case 'importsave': {
        const code = (document.getElementById('importCode') || {}).value || '';
        if (!code.trim()) { toast('Paste a save code first.', 'bad'); break; }
        if (!ui.importArmed) { ui.importArmed = true; ui.pendingCode = code; refreshPanel(); document.getElementById('importCode').value = code; break; }
        const r = App.importCode(ui.pendingCode || code); ui.importArmed = false; ui.pendingCode = null;
        if (r.ok) { toast('Save loaded. Welcome back, captain.', 'good'); closePanel(); } else toast(r.reason, 'bad');
        break;
      }
      case 'skyw': App.setSky({ weather: b.dataset.v }); lastChip = ''; break;
      case 'skyt': App.setSky({ time: b.dataset.v }); lastChip = ''; break;
      case 'skyrefresh': Sky.refresh(true); break;
      case 'skyloc': Sky.useMyLocation().then(r => { if (r.ok) { App.setSky({ place: r.place }); Sky.refresh(true); toast('Following the weather where you are.', 'good'); } else toast(r.reason, 'bad'); }); break;
      case 'skysearch': {
        const q = (document.getElementById('placeInput') || {}).value || '';
        if (!q.trim()) { toast('Type a place name first.'); break; }
        Sky.searchPlace(q.trim()).then(r => { if (r.ok) { App.setSky({ place: r.place }); Sky.refresh(true); toast(`Following the weather in ${r.place.name}.`, 'good'); } else toast(r.reason, 'bad'); });
        break;
      }
      case 'grant': App.grant(b.dataset.grant === 'candy' ? { candy: 100 } : b.dataset.grant === 'coins' ? { coins: 1000 } : b.dataset.grant === 'raw' ? { timber: 100, hemp: 60, ironOre: 60, fish: 60 } : b.dataset.grant === 'goods' ? { planks: 60, rope: 40, iron: 40, food: 20 } : { shellfish: 10, rareFish: 5, pearls: 5, relics: 5, charts: 5 }); break;
      case 'tests': ui.testResults = App.runTests(); refreshPanel(); break;
      case 'reset':
        if (!ui.resetArmed) { ui.resetArmed = true; refreshPanel(); }
        else { App.reset(); ui.resetArmed = false; ui.plan = {}; toast('Progress erased. A fresh harbor awaits.'); }
        break;
    }
  }
  function onSheetChange(e) {
    if (e.target.dataset.act === 'battery') { App.setBattery(e.target.checked); return; }
    if (e.target.id === 'importFile' && e.target.files && e.target.files[0]) {
      e.target.files[0].text().then(txt => { const ta = document.getElementById('importCode'); if (ta) ta.value = txt.trim(); ui.importArmed = false; toast('Save file read. Tap “Load this save” twice to use it.'); });
      return;
    }
    if (e.target.dataset.act === 'charm') { ui.charm[e.target.dataset.ship] = e.target.checked; refreshPanel(); return; }
    if (e.target.dataset.act === 'supplies') { ui.supplies[e.target.dataset.ship] = e.target.checked; refreshPanel(); return; }
    if (e.target.dataset.act === 'dev') { App.setDev(e.target.checked); toast(e.target.checked ? 'Developer mode on.' : 'Developer mode off.'); }
  }

  function collect(expId) {
    const r = App.claim(expId);
    if (!r.ok) { toast(r.reason, 'bad'); return; }
    showReward([r]);
  }
  function collectAll() {
    const rs = App.claimAll();
    if (!rs.length) { toast('No ships are back yet.'); return; }
    showReward(rs);
  }

  function showReward(rs) {
    const tot = {};
    for (const r of rs) for (const [k, v] of Object.entries(r.result.items)) tot[k] = (tot[k] || 0) + v;
    const order = Object.keys(TOF.RESOURCES);
    const items = order.filter(k => tot[k]);
    const list = items.length
      ? items.map(k => `<li>${icon(k, 'mid')}<span>${TOF.RESOURCES[k].name}</span><b>+${tot[k]}</b></li>`).join('')
      : '<li class="empty">Nothing worth keeping this time.</li>';
    const evs = rs.flatMap(r => {
      const pre = rs.length > 1 ? `<b>${esc(r.ship.name)}:</b> ` : '';
      return r.result.events.map(e => `<p class="ev ev-${e.type}">${pre}${esc(e.text)}</p>`);
    }).join('');
    const one = rs[0];
    const title = rs.length > 1 ? `${rs.length} ships are home` : `${esc(one.ship.name)} is home`;
    const sub = rs.length > 1 ? 'Combined haul' : `${durLong(one.exp.hours)} ${TOF.TYPES[one.exp.type].name.toLowerCase()} trip`;
    const logs = rs.flatMap(r => (r.result.report || []).map(l => `<li class="log-${l.kind}">${rs.length > 1 ? `<b>${esc(r.ship.name)}:</b> ` : ''}${esc(l.text)}</li>`)).join('');
    const where = rs.length === 1 && one.exp.region && one.exp.region !== 'home' ? ` in ${esc(TOF.REGIONS[one.exp.region].name)}` : '';
    $('#modalBody').innerHTML = `<h2>${title}</h2><p class="sub">${sub}${where}</p><ul class="haul">${list}</ul>${logs ? `<div class="shiplog"><h3>Ship’s log</h3><ul>${logs}</ul></div>` : ''}<div class="evs">${evs}</div>`;
    $('#modal').hidden = false;
    $('#modalOk').focus();
    Sound.play('coins');
    if (rs.some(r => r.result.trophy)) setTimeout(() => Sound.play('trophy'), 300);
    if (rs.some(r => r.result.krakenHint)) setTimeout(() => Sound.play('kraken'), 500);
  }

  function toast(text, kind = '') {
    if (kind === 'bad') Sound.play('error');
    const t = el('div', { class: `toast ${kind}`, role: 'status' }, esc(text));
    $('#toasts').appendChild(t);
    setTimeout(() => t.classList.add('out'), 2600);
    setTimeout(() => t.remove(), 3100);
    while ($('#toasts').children.length > 2) $('#toasts').firstChild.remove();
  }

  const FLAVOR = ['A fisher family lives here.', 'Someone inside is mending nets.', 'It smells like fresh bread.', 'A cat watches you from the window.', 'Laundry flaps on a line out back.'];
  function onWorldTap(o) {
    const st = App.state, now = App.now();
    if (o.kind === 'ship') {
      const status = TOF.shipStatus(st, o.shipId, now);
      if (status === 'returned') collect(TOF.expeditionForShip(st, o.shipId).id);
      else openPanel('fleet', { ship: o.shipId });
      return;
    }
    const info = o.info || {};
    if (info.bId) { openPanel('village', { building: info.bId }); return; }
    if (o.kind === 'krakenEye') {
      const r = App.strikeEye(o.eye);
      if (r.ok) { Sound.play('kraken'); toast(r.dead ? 'The last eye bursts. The Unseen convulses…' : `A harpoon finds its eye! ${r.left} left.`, 'good'); } else toast(r.reason);
      return;
    }
    if (o.kind === 'krakenBody') {
      const r = App.lootKraken();
      if (r.ok) { Sound.play('coins'); toast(`Crews strip the carcass: ${Object.entries(r.items).map(([k, v]) => `${v} ${resName(k)}`).join(', ')}.`, 'good'); } else toast(r.reason);
      return;
    }
    if (o.kind === 'ghost') {
      const r = App.popGhost(o.ghostId);
      Sound.play(r.ok && r.candy ? 'coins' : 'splash');
      const who = r.big ? 'The Big Ghost' : 'The ghost', late = r.finalHour ? ' The graveyard spirits are generous in the last hour!' : '';
      toast(r.ok ? (r.candy ? `Pop! ${who} giggles and leaves ${r.candy} candy behind.${late}` : `Pop! ${who} giggles. (The ghosts have given all they can this hour.)`) : 'Pop!', r.ok && r.candy ? 'good' : '');
      return;
    }
    if (info.cauldron) { openPanel('halloween', { focus: 'cauldron' }); return; }
    if (info.ghostShip) { openPanel('halloween', { focus: 'ship' }); return; }
    if (info.dId) {
      const d = st.decor.find(x => x.id === info.dId);
      // 1.6: a ripe Pumpkin Patch is picked with a tap; otherwise it opens like any Halloween piece
      if (d && d.type === 'hwPumpkinPatch' && TOF.pumpkinStatus(st, Date.now()).ready) {
        const r = App.harvestPumpkins();
        if (r.ok) { Sound.play('coins'); toast(`Harvested the pumpkins: +${r.food} preserved food. More in ${TOF.HALLOWEEN.pumpkin.hours} hours.`, 'good'); } else toast(r.reason, 'bad');
        return;
      }
      if (d && TOF.DECOR[d.type].hw) { openPanel('halloween', { decor: d.id, focus: 'sel' }); return; } if (d) openPanel('village', { decor: d.type, sel: d.id }); return;
    }
    if (info.crop) { harvestField(); return; }
    if (info.action) openPanel(info.action);
    else if (info.future) toast(info.future);
    else if (info.name) toast(`${info.name}. ${FLAVOR[Math.floor(Math.random() * FLAVOR.length)]}`);
  }

  function init() {
    // the breach takes the screen: menus close, letterbox bars slide in, nothing can be tapped until it ends
    World.kraken.setHooks({
      start: () => { closePanel(); $('#modal').hidden = true; document.body.classList.add('cinematic'); },
      end: () => { document.body.classList.remove('cinematic'); App.krakenSeen(); toast('The Unseen has risen. Strike its eyes!', 'bad'); },
      strike: () => {},
    });
    for (const n of ['coin', 'fish', 'shellfish', 'rareFish', 'pearls', 'relics', 'charts', 'boat', 'hammer', 'gear', 'market', 'chest', 'cannon', 'compass', 'wrench', 'timber', 'planks', 'hemp', 'rope', 'ironOre', 'iron', 'food', 'house', 'crate', 'sun', 'moon', 'rain', 'snow', 'fog', 'sunkenKey', 'pirateKey', 'lostKey', 'moonfish', 'essence', 'salvage', 'charm', 'map', 'candy', ...Object.keys(TOF.TROPHIES)]) ICON[n] = Art.iconURL(n);
    for (const [k, c] of Object.entries(TOF.CHESTS)) ICON[k] = Art.chestURL(c.family, c.size, false);
    $('#modalBody').addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
      if (b.dataset.act === 'dochest') doChest(b.dataset.c);
      if (b.dataset.act === 'chestagain') showChest(b.dataset.c);
    });
    $('#skyChip').addEventListener('click', () => openPanel('settings'));
    Sky.onStatus(() => { if (ui.panel === 'settings') refreshPanel(); renderSkyChip(); });
    $('#placeCancel').addEventListener('click', () => { const pl = World.placing, m = pl && pl.movingId, dec = pl && TOF.DECOR[pl.type]; endPlacing(); if (dec && dec.hw) openPanel('halloween', { focus: 'collection' }); else openPanel('village', dec ? { decor: pl.type } : m ? { building: m } : {}); });
    $('#placeOk').addEventListener('click', () => {
      const p = World.placing; if (!p) return;
      const dec = TOF.DECOR[p.type];
      if (p.movingId) {
        const id = p.movingId, r = dec ? App.moveDecor(id, p.gx, p.gy) : App.move(id, p.gx, p.gy);
        if (!r.ok) { toast(r.reason, 'bad'); return; }
        endPlacing(); Sound.play('build'); toast(dec ? `${dec.name} moved.` : `The ${bName(p.type)} has moved.`, 'good');
        return;
      }
      if (dec) {
        const r = App.placeDecor(p.type, p.gx, p.gy);
        if (!r.ok) { toast(r.reason, 'bad'); return; }
        endPlacing(); Sound.play('success'); toast(dec.hw ? `${dec.name} placed. Candy bonus now +${Math.round(TOF.decorBonus(App.state).candy * 100)}%.` : `${dec.name} added. ${dec.effect}`, 'good');
        return;
      }
      const r = App.place(p.type, p.gx, p.gy);
      if (!r.ok) { toast(r.reason, 'bad'); return; }
      endPlacing(); Sound.play('build');
      toast(`Builders are raising the ${bName(p.type)}.`, 'good');
    });
    ICON.coins = ICON.coin;
    document.querySelectorAll('#nav button').forEach(b => {
      b.querySelector('.ni').innerHTML = icon(b.dataset.icon);
      b.addEventListener('click', () => (ui.panel === b.dataset.panel ? closePanel() : openPanel(b.dataset.panel)));
    });
    $('#sheetClose').addEventListener('click', closePanel);
    $('#sheetBody').addEventListener('click', onSheetClick);
    $('#sheetBody').addEventListener('change', onSheetChange);
    $('#sheetBody').addEventListener('input', e => {
      if (e.target.dataset.act !== 'vol') return;
      const v = +e.target.value / 100; App.setAudio({ [e.target.dataset.k]: v });
      const out = e.target.parentElement.querySelector('b'); if (out) out.textContent = Math.round(v * 100);
    });
    // soft click on any button; first touch also wakes up the audio
    document.addEventListener('pointerdown', () => Sound.unlock(), { passive: true });
    // the page itself never scrolls (iOS nudges it when the keyboard opens); panels scroll inside
    const unscroll = () => { if (window.scrollY || window.scrollX || document.documentElement.scrollTop) window.scrollTo(0, 0); for (const n of [document.body, document.documentElement, $('#app')]) if (n.scrollTop) n.scrollTop = 0; };
    window.addEventListener('scroll', unscroll, { passive: true });
    $('#app').addEventListener('scroll', unscroll, { passive: true }); $('#stage').addEventListener('scroll', unscroll, { passive: true });
    document.addEventListener('focusout', () => setTimeout(unscroll, 50));
    document.addEventListener('click', e => { if (e.target.closest('button, .chip, label.switch, label.supplies')) Sound.play('tap'); });
    $('#updateBtn').addEventListener('click', () => { App.save(); PWA.applyUpdate(); });
    $('#sheetBody').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'renameInput') { const b = document.querySelector('[data-act="dorename"]'); if (b) b.click(); } });
    $('#resRow').addEventListener('click', e => { const b = e.target.closest('.res'); if (b) openPanel(b.dataset.res === 'candy' ? 'halloween' : ['coins', 'charts'].includes(b.dataset.res) ? 'shipwright' : 'market'); });
    $('#shipsBtn').addEventListener('click', () => (ui.panel === 'fleet' && !ui.fleetShip ? closePanel() : openPanel('fleet')));
    $('#modalOk').addEventListener('click', () => {
      $('#modal').hidden = true; $('#modalOk').textContent = 'Stow the catch'; $('#modalOk').classList.add('primary');
      if (ui.brewToSee) { App.brewSeen(ui.brewToSee); ui.brewToSee = null; openPanel('halloween', { focus: 'cauldron' }); }
      refresh();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#modal').hidden) $('#modal').hidden = true; else closePanel(); } });
  }

  const showBrewAgain = () => { const lb = App.state.halloween.lastBrew; if (lb && !lb.seen && $('#modal').hidden) { showBrew(lb); $('#modal').hidden = false; } };
  return { showBrewAgain, init, refresh, tick, toast, onWorldTap, openPanel, renderVoyages, onPlaceChange, refreshPanel, renderSkyChip };
})();

// ============================================================
// boot + main loop
// ============================================================
(function main() {
  'use strict';
  App.boot();
  Sky.configure(App.state.settings.sky);
  Sound.setVolumes(App.state.settings.audio);
  UI.init();
  World.init(document.getElementById('world'), o => UI.onWorldTap(o), () => App.state, p => UI.onPlaceChange(p));
  if (TOF.fitBuilding(App.state, 'seaWitch', World.terrainCheck)) { World.syncBuildings(App.state); App.save(); }
  const t0 = Date.now();
  const offline = TOF.settle(App.state, t0);
  App.save();
  World.setLowPower(App.state.settings.batterySaver);
  PWA.init(show => { document.getElementById('updateBtn').hidden = !show; });
  if (PWA.justUpdated()) setTimeout(() => UI.toast(`Updated to version ${TOF.GAME_VERSION}: decorations and a bigger harbor view.`, 'good'), 600);
  if (!PWA.sandboxed) document.addEventListener('pointerdown', function once() { document.removeEventListener('pointerdown', once); PWA.persist(); });
  World.syncBuildings(App.state);
  World.syncDecor(App.state);
  World.syncDocks(App.state, false);
  World.syncShips(App.state, t0, false);
  UI.refresh();

  const st = App.state;
  // a brew the app closed on before it was revealed: show it now (it was paid for and granted already)
  if (st.halloween.lastBrew && !st.halloween.lastBrew.seen) setTimeout(() => UI.showBrewAgain(), 900);
  const back = st.ships.filter(s => TOF.shipStatus(st, s.id, t0) === 'returned');
  if (App.loadInfo.source === 'new') UI.toast('Welcome to the harbor. Tap your boat to send it out.');
  else if (back.length) UI.toast(`${back.length > 1 ? back.length + ' ships' : back[0].name} came home while you were away.`);
  else if (offline.built.length || offline.produced.length) UI.toast(`While you were away: ${[...offline.built.map(b => `the ${TOF.BUILDINGS[b.type].name} was finished`), ...offline.produced.map(p => `${p.qty} ${TOF.RESOURCES[p.out].name.toLowerCase()} made`)].join(', ')}.`, 'good');
  else if (App.loadInfo.source === 'backup') UI.toast('Your last save was damaged, so the previous one was restored.', 'bad');

  const lastStatus = new Map(st.ships.map(s => [s.id, TOF.shipStatus(st, s.id, t0)]));
  App.on((type, data) => {
    const now = App.now();
    if (type === 'tickjob') { UI.refresh(); return; }
    World.syncBuildings(App.state);
    World.syncDecor(App.state);
    World.syncGhostShip(App.state);
    if (World.syncDocks(App.state, type === 'built')) { UI.toast('Builders ran out a new jetty for the growing fleet.', 'good'); Sound.play('splash'); }
    if (type === 'settled' && data.built.length) Sound.play('success');
    if (type === 'settled') {
      for (const b of data.built) UI.toast(b.level === 1 ? `The ${TOF.BUILDINGS[b.type].name} is open.` : `The ${TOF.BUILDINGS[b.type].name} reached level ${b.level}.`, 'good');
      for (const p of data.produced) UI.toast(`Batch done: ${p.qty} ${TOF.RESOURCES[p.out].name.toLowerCase()}.`, 'good');
    }
    World.syncShips(App.state, now, type !== 'reset', type === 'built' ? data.ship.id : null);
    lastStatus.clear();
    for (const s of App.state.ships) lastStatus.set(s.id, TOF.shipStatus(App.state, s.id, now));
    UI.refresh();
  });

  let prev = performance.now(), acc = 0, frameFlip = false;
  function step(t) {
    const dt = Math.max(0, Math.min(0.05, (t - prev) / 1000)); prev = Math.max(prev, t);
    acc += dt;
    if (acc > 0.25) {
      acc = 0;
      const now = App.now();
      const backNow = [];
      for (const s of App.state.ships) {
        const status = TOF.shipStatus(App.state, s.id, now);
        if (status !== lastStatus.get(s.id)) { if (status === 'returned') backNow.push(s.name); lastStatus.set(s.id, status); }
      }
      if (backNow.length) {
        Sound.play('bell');
        UI.toast(backNow.length > 1 ? `${backNow.length} ships are back in harbor.` : `${backNow[0]} is back in harbor. Tap her to collect.`, 'good');
        World.syncShips(App.state, now, true);
        UI.refresh();
      } else if (UI.tick(now)) UI.renderVoyages();
      App.settle();
      UI.renderSkyChip();
    }
    World.update(dt);
    frameFlip = !frameFlip;
    if (!App.state.settings.batterySaver || frameFlip) World.render();
  }
  // A frame that throws must never stop the next one: the world would freeze while the menus still work.
  let loopErr = false;
  function loop(t) {
    try { step(t); } catch (e) { if (!loopErr) { loopErr = true; console.error('Frame error (the game keeps running):', e); } }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  document.addEventListener('visibilitychange', () => { if (document.hidden) App.save(); });
  window.addEventListener('pagehide', () => App.save());
  const boot = document.getElementById('boot'); if (boot) boot.remove();
})();

</script>
</body>
</html>
