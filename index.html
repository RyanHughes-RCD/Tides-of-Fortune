    blacksmith:   { name: 'Blacksmith',   size: [2, 2], desc: 'Smelts iron ore into iron.', recipe: { in: { ironOre: 2 }, out: 'iron', hours: 1 / 15 }, costs: [{ coins: 150, timber: 15, ironOre: 10 }, { coins: 400, planks: 20, ironOre: 20 }, { coins: 1000, planks: 30, iron: 20 }] },
    fishmonger:   { name: 'Fishmonger',   size: [2, 2], desc: 'Salts fish into preserved food, packed as expedition supplies.', recipe: { in: { fish: 3 }, out: 'food', hours: 1 / 60 }, costs: [{ coins: 120, timber: 10, fish: 20 }, { coins: 350, planks: 15 }, { coins: 900, planks: 30, rope: 10 }] },
    weaponsmith:  { name: 'Weaponsmith',  size: [2, 2], requires: 'blacksmith', desc: 'Casts guns. +10% pirate-hunting power per level for every ship.', costs: [{ coins: 400, planks: 20, iron: 10 }, { coins: 900, planks: 30, iron: 30 }, { coins: 2000, planks: 50, iron: 60 }] },
    tavern:       { name: 'Tavern',       size: [3, 3], desc: 'Sailors trade rumors. Each day one expedition type pays 20% more, plus 10% per level.', costs: [{ coins: 200, timber: 20 }, { coins: 500, planks: 20, food: 10 }, { coins: 1200, planks: 40, food: 30 }] },
    tradingPost:  { name: 'Trading Post', size: [2, 2], desc: 'Buy timber, hemp and ore. Sell planks, rope, iron and food. Better prices each level.', costs: [{ coins: 250, timber: 20 }, { coins: 600, planks: 20 }, { coins: 1500, planks: 40, rope: 20 }] },
    cartographer: { name: 'Cartographer', size: [2, 2], desc: 'Draws better maps. +15% exploration power per level for every ship.', costs: [{ coins: 300, planks: 10, charts: 2 }, { coins: 700, planks: 20, charts: 4 }, { coins: 1600, planks: 40, charts: 8 }] },
    seaWitch:     { name: 'Sea Witch’s Hut', size: [2, 2], secret: true, desc: 'Brews moonfish into enchanted essence, makes warding charms and lifts curses. Needed for magic lure levels 2 and 3.', recipe: { in: { moonfish: 2 }, out: 'essence', hours: 1 / 10 }, costs: [{ coins: 800, planks: 30, moonfish: 2 }, { coins: 1500, planks: 50, essence: 5 }, { coins: 3000, planks: 80, essence: 15, relics: 3 }] },
  };
  const BUILDING_ORDER = Object.keys(BUILDINGS);
  const BUILD_HOURS = [0.25, 1, 4];
  const MAX_BUILDERS = 2;
  const MAP_SIZE = 40;
  const SKY_TIMES = ['live', 'dawn', 'day', 'dusk', 'night'];
  const SKY_WEATHER = ['live', 'sunny', 'rainy', 'snowy', 'foggy'];
  const BUILDING_MAX_LEVEL = 3;
  // Sell prices stay at or below the raw inputs' buy price at every level, so buy-process-sell never profits.
  const TRADE = { buy: { timber: 4, hemp: 4, ironOre: 8 }, sell: { planks: 7, rope: 7, iron: 13, food: 5 } };
  const START_BUILDINGS = [{ type: 'shipwright', gx: 13, gy: 7 }, { type: 'market', gx: 12, gy: 12 }];

  const UPGRADE_KEYS = Object.keys(UPGRADES);

  const SHIP_NAMES = ['Little Gull', 'Saltwhistle', 'Merry Kelp', 'Brine Song', 'Tidecutter', 'Old Barnacle', 'Dawn Heron', 'Cormorant', 'Silver Wake', 'Morning Star', 'Stormpetrel', 'Driftwood', 'Sea Lantern', 'Gannet', 'Low Tide'];

  // ---------- helpers ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const clampInt = (v, lo, hi) => {
    const n = Math.floor(Number(v));
    return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : lo;
  };
  const tierFactor = cls => 1 + 0.5 * (SHIP_CLASSES[cls].tier - 1);
  const emptyUpgrades = () => Object.fromEntries(UPGRADE_KEYS.map(k => [k, 0]));

  // ---------- new game ----------
  function newGame(now) {
    const s = {
      version: SAVE_VERSION,
      createdAt: now,
      updatedAt: now,
      resources: Object.fromEntries(Object.keys(RESOURCES).map(k => [k, 0])),
      discovered: [...ALWAYS_SHOWN],
      ships: [],
      expeditions: [],
      claimed: [],
      log: [],
      stats: { expeditions: 0, fishCaught: 0, coinsEarned: 0, shipsBuilt: 0, piratesBeaten: 0, chestsOpened: 0, monstersFought: 0 },
      settings: { devMode: false, devSecondsPerHour: 2, sky: { time: 'live', weather: 'live', place: null }, audio: { music: 0.45, sfx: 0.8, ambience: 0.5 }, batterySaver: false },
      nextId: 1,
      nextShipId: 1,
      buildings: [],
      nextBuildingId: 1,
      regions: ['home'], landmarks: [], lore: { kraken: 0 }, trophies: {}, flags: { witchFound: false }, reports: [],
    };
    s.resources.coins = 20;
    s.resources.timber = 30;
    for (const b of START_BUILDINGS) s.buildings.push({ id: 'b-' + s.nextBuildingId++, type: b.type, gx: b.gx, gy: b.gy, level: 1, pending: null, job: null });
    addShip(s, 'skiff', 'Little Gull');
    return s;
  }

  // ---------- ships ----------
  function getShip(state, shipId) { return state.ships.find(s => s.id === shipId) || null; }

  function shipStats(ship) {
    const b = SHIP_CLASSES[ship.cls], u = ship.upgrades;
    return {
      name: b.name, tier: b.tier, blurb: b.blurb,
      speed: b.speed + (u.sails || 0),
      hull: Math.round(b.hull * (1 + 0.3 * (u.reinforcedHull || 0))),
      combat: b.combat + 3 * (u.cannons || 0),
      cargo: Math.round(b.cargo * (1 + 0.5 * (u.cargoHold || 0))),
      fishing: b.fishing + 2 * (u.magicLures || 0),
      exploration: b.exploration + 2 * (u.scoutTower || 0),
      magic: b.magic + (u.magicLures || 0),
      aff: { fishing: 1, treasure: 1, combat: 1, exploration: 1, ...(b.aff || {}) },
      dmg: b.dmg || 1,
      ...(ship.curse ? curseStats(b, u) : {}),
    };
  }
  // A cursed ship sails at three quarters of her strength until the curse wears off or is lifted.
  function curseStats(b, u) {
    return {
      cursed: true,
      speed: Math.max(1, b.speed + (u.sails || 0) - 1),
      combat: Math.floor((b.combat + 3 * (u.cannons || 0)) * 0.75),
      fishing: Math.max(1, Math.floor((b.fishing + 2 * (u.magicLures || 0)) * 0.75)),
      exploration: Math.max(1, Math.floor((b.exploration + 2 * (u.scoutTower || 0)) * 0.75)),
    };
  }

  function typePower(st, type) {
    if (type === 'fishing') return st.fishing * st.aff.fishing;
    if (type === 'treasure') return (st.exploration * 0.5 + st.magic * 0.5 + 3) * st.aff.treasure;
    if (type === 'combat') return (st.combat + st.magic * 0.3) * st.aff.combat;
    return (st.exploration + st.speed * 0.3) * st.aff.exploration;
  }

  function durationMult(st) { return Math.min(1.08, Math.max(0.7, 1 - (st.speed - 3) * 0.04)); }

  function expeditionForShip(state, shipId) { return state.expeditions.find(e => e.shipId === shipId) || null; }

  // 'idle' | 'away' | 'returned'
  function shipStatus(state, shipId, now) {
    const e = expeditionForShip(state, shipId);
    if (!e) return 'idle';
    return now >= e.endAt ? 'returned' : 'away';
  }

  function freeBerth(state) {
    const used = new Set(state.ships.map(s => s.berth));
    for (let i = 0; i < MAX_SHIPS; i++) if (!used.has(i)) return i;
    return -1;
  }

  function addShip(state, cls, name) {
    const berth = freeBerth(state);
    if (berth < 0) return null;
    const used = new Set(state.ships.map(s => s.name));
    const nm = name || SHIP_NAMES.find(n => !used.has(n)) || `${SHIP_CLASSES[cls].name} ${state.nextShipId}`;
    const ship = { id: 'ship-' + state.nextShipId++, cls, name: nm, upgrades: emptyUpgrades(), berth, hp: 0, lastTrip: { type: SHIP_CLASSES[cls].role, hours: 1 } };
    ship.hp = shipStats(ship).hull;
    state.ships.push(ship);
    return ship;
  }

  function classLock(state, cls) {
    if (state.ships.length >= MAX_SHIPS) return 'The harbor has room for 10 ships.';
    const cost = SHIP_CLASSES[cls].cost;
    const need = Object.keys(cost).filter(k => k !== 'coins' && !state.discovered.includes(k));
    const tier = SHIP_CLASSES[cls].tier;
    const dockNeed = tier <= 1 ? 0 : Math.min(3, tier - 1);
    if (buildingLevel(state, 'dockyard') < dockNeed) return dockNeed === 1 ? 'Build a Dockyard first.' : `Needs a level ${dockNeed} Dockyard.`;
    if (need.length) {
      const how = { charts: 'explore to find sea charts', pearls: 'hunt treasure to find pearls', relics: 'hunt treasure or pirates to find relics', rareFish: 'fish to land a rare catch', shellfish: 'go fishing for shellfish', planks: 'build a Sawmill for planks', rope: 'build a Ropemaker for rope', iron: 'build a Blacksmith for iron', timber: 'explore for timber', hemp: 'explore for hemp', ironOre: 'hunt treasure or pirates for iron ore' };
      return 'First ' + need.map(k => how[k] || k).join(', then ') + '.';
    }
    return null;
  }

  function buildShip(state, cls) {
    if (!SHIP_CLASSES[cls]) return { ok: false, reason: 'Unknown ship.' };
    if (state.ships.length >= MAX_SHIPS) return { ok: false, reason: 'The harbor has room for 10 ships.' };
    const lock = classLock(state, cls);
    if (lock) return { ok: false, reason: lock };
    const cost = SHIP_CLASSES[cls].cost;
    if (!canAfford(state, cost)) return { ok: false, reason: 'Not enough resources.' };
    spend(state, cost);
    const ship = addShip(state, cls);
    state.stats.shipsBuilt++;
    return { ok: true, ship };
  }

  function renameShip(state, shipId, name) {
    const ship = getShip(state, shipId);
    const nm = String(name || '').trim().slice(0, 24);
    if (!ship || !nm) return { ok: false, reason: 'Give her a name.' };
    ship.name = nm;
    return { ok: true };
  }

  // ---------- expedition outcomes (deterministic per seed) ----------
  function newResult(mods) { return { items: {}, events: [], damage: 0, overflow: 0, capacity: 0, wins: 0, losses: 0, y: mods.yield, dm: mods.damage }; }
  const add = (r, k, n) => { n = Math.round(n * r.y); if (n > 0) r.items[k] = (r.items[k] || 0) + n; };
  const NO_MODS = { power: 1, yield: 1, damage: 1 };

  function hazard(rng, r, st, hours, base, label) {
    const chance = Math.min(0.35, base * Math.sqrt(hours));
    if (rng() < chance) {
      const dmg = Math.max(1, Math.round(st.hull * (0.08 + rng() * 0.17) * st.dmg * r.dm));
      r.damage += dmg;
      r.events.push({ type: 'storm', text: `${label} (-${dmg} hull)` });
      return true;
    }
    return false;
  }

  function capCargo(r, st, order) {
    let room = st.cargo;
    for (const k of order) {
      if (!r.items[k]) continue;
      const t = Math.min(r.items[k], room);
      room -= t; r.overflow += r.items[k] - t;
      if (t) r.items[k] = t; else delete r.items[k];
    }
    r.capacity = st.cargo;
    if (r.overflow > 0) r.events.push({ type: 'full', text: `Hold full: ${r.overflow} left behind.` });
  }

  function rollExpedition(st, type, hours, seed, mods) {
    const M = { ...NO_MODS, ...(mods || {}) };
    const rng = mulberry32(seed >>> 0);
    const r = newResult(M);
    const P = typePower(st, type) * M.power;
    const magicMult = 1 + st.magic * 0.1;
    const lg = Math.log2(hours);

    if (type === 'fishing') {
      const rarePerHour = (0.02 + 0.01 * lg) * magicMult;
      let fish = 0, shell = 0, rare = 0;
      for (let h = 0; h < hours; h++) {
        fish += P * (0.7 + rng() * 0.6);
        if (rng() < 0.35) shell += 1 + Math.floor(rng() * 3);
        if (rng() < rarePerHour) rare++;
      }
      fish = Math.round(fish * (1 + 0.05 * lg));
      if (rng() < Math.min(0.3, 0.04 * Math.sqrt(hours))) {
        const lf = Math.round(fish * 0.3), ls = Math.round(shell * 0.3);
        fish -= lf; shell -= ls;
        const dmg = Math.max(1, Math.round(st.hull * (0.05 + rng() * 0.1) * st.dmg * r.dm));
        r.damage += dmg;
        r.events.push({ type: 'storm', text: `Rough seas: ${lf + ls} catch washed overboard (-${dmg} hull).` });
      }
      add(r, 'rareFish', rare); add(r, 'shellfish', shell); add(r, 'fish', fish);
      capCargo(r, st, ['rareFish', 'shellfish', 'fish']);
      if (r.items.rareFish) r.events.push({ type: 'rare', text: r.items.rareFish > 1 ? `Hauled up ${r.items.rareFish} rare catches!` : 'Something strange shimmered in the nets…' });
    }

    else if (type === 'treasure') {
      let coins = 0, pearls = 0, relics = 0;
      const pearlP = Math.min(0.6, 0.06 * P / 3);
      const relicP = (0.01 + 0.005 * lg) * (1 + P / 12) * magicMult;
      for (let h = 0; h < hours; h++) {
        coins += P * (2 + rng() * 3);
        if (rng() < pearlP) pearls++;
        if (rng() < relicP) relics++;
      }
      hazard(rng, r, st, hours, 0.06, 'Scraped a reef');
      let ore = 0;
      for (let h = 0; h < hours; h++) if (rng() < 0.5) ore += 1 + Math.floor(rng() * 3);
      add(r, 'relics', relics); add(r, 'pearls', pearls); add(r, 'ironOre', ore);
      capCargo(r, st, ['relics', 'pearls', 'ironOre']);
      add(r, 'coins', coins * (1 + 0.04 * lg));
      if (r.items.relics) r.events.push({ type: 'rare', text: `Recovered ${r.items.relics > 1 ? r.items.relics + ' relics' : 'an old relic'} from a wreck.` });
    }

    else if (type === 'combat') {
      const encounters = Math.max(1, Math.round(hours / 2));
      let coins = 0, relics = 0, dmg = 0;
      for (let i = 0; i < encounters; i++) {
        const E = (3 + 1.2 * Math.pow(hours, 0.6)) * (0.7 + rng() * 0.6);
        const mine = P * (0.8 + rng() * 0.4);
        if (mine >= E) {
          r.wins++;
          coins += 30 + E * 12;
          if (rng() < 0.08 * magicMult) relics++;
          dmg += E * 0.3 * rng();
        } else {
          r.losses++;
          dmg += E * (1.2 + rng());
          break; // the crew retreats after a lost fight
        }
      }
      r.damage += Math.round(dmg * st.dmg * r.dm);
      let ore = 0;
      for (let i = 0; i < r.wins; i++) ore += 2 + Math.floor(rng() * 3);
      add(r, 'relics', relics); add(r, 'ironOre', ore);
      capCargo(r, st, ['relics', 'ironOre']);
      add(r, 'coins', coins);
      if (r.wins) r.events.push({ type: 'win', text: `Beat ${r.wins} pirate crew${r.wins > 1 ? 's' : ''}.` });
      if (r.losses) r.events.push({ type: 'storm', text: 'Outgunned! She broke off the hunt and ran for home.' });
      if (r.items.relics) r.events.push({ type: 'rare', text: 'Seized a relic from a pirate captain.' });
    }

    else { // exploration
      let charts = 0, coins = 0, relics = 0;
      const chartP = Math.min(0.5, 0.04 * P);
      for (let h = 0; h < hours; h++) {
        coins += P * (0.6 + rng() * 0.8);
        if (rng() < chartP) charts++;
        if (rng() < 0.004 * magicMult * (1 + lg)) relics++;
      }
      hazard(rng, r, st, hours, 0.04, 'Caught in a squall');
      let timber = 0, hemp = 0;
      for (let h = 0; h < hours; h++) {
        timber += 1.5 + P * (0.4 + rng() * 0.6);
        if (rng() < 0.35) hemp += 1 + Math.floor(rng() * 3);
      }
      add(r, 'charts', charts); add(r, 'relics', relics); add(r, 'hemp', hemp); add(r, 'timber', timber);
      capCargo(r, st, ['charts', 'relics', 'hemp', 'timber']);
      add(r, 'coins', coins);
      if (r.items.charts) {
        const sights = ['a hidden cove', 'a reef with no name', 'a whale road', 'smoke on a far island', 'a channel through the shoals', 'an abandoned watchtower'];
        r.events.push({ type: 'rare', text: `Charted ${sights[Math.floor(rng() * sights.length)]}.` });
      }
    }
    extras(r, st, type, hours, seed, M);
    return r;
  }

  // Phase 4 finds. A separate random stream, so the base haul for a seed never changes.
  function extras(r, st, type, hours, seed, M) {
    const Rg = REGIONS[M.region] || REGIONS.home;
    const rng = mulberry32((seed ^ 0xA5A5A5A5) >>> 0);
    const ring = Rg.ring, magicMult = 1 + st.magic * 0.1;
    const put = (k, n) => { if (n > 0) r.items[k] = (r.items[k] || 0) + n; };
    if (Rg.raw) for (const k of ['timber', 'hemp']) if (r.items[k]) r.items[k] = Math.round(r.items[k] * Rg.raw);
    if (Rg.ore && r.items.ironOre) r.items.ironOre = Math.round(r.items.ironOre * Rg.ore);
    // keys: each family's key comes from a different kind of trip
    if (type === 'fishing') for (let h = 0; h < hours; h++) if (rng() < 0.025 * (1 + 0.5 * ring)) put('sunkenKey', 1);
    if (type === 'combat') for (let i = 0; i < r.wins; i++) if (rng() < 0.3) put('pirateKey', 1);
    if (type === 'exploration') for (let h = 0; h < hours; h++) if (rng() < 0.03 * (1 + 0.5 * ring)) put('lostKey', 1);
    // chests: only treasure trips find them
    if (type === 'treasure') {
      const p = 0.05 * (1 + 0.4 * ring) * (Rg.chest || 1) * (M.chestMult || 1);
      for (let h = 0; h < hours; h++) if (rng() < p) {
        const fam = rng() < 0.6 ? Rg.family : FAMILIES[Math.floor(rng() * 3)];
        const u = rng(), big = 0.03 + 0.03 * ring + (hours >= 12 ? 0.03 : 0);
        put(`chest_${fam}_${u < big ? 'large' : u < big + 0.22 + 0.05 * ring ? 'medium' : 'small'}`, 1);
      }
    }
    if (type === 'fishing' && Rg.moonfish) for (let h = 0; h < hours; h++) if (rng() < Rg.moonfish * magicMult) put('moonfish', 1);
    // ghost ships answer to magic more than to cannons
    if (Rg.ghosts && type === 'combat') {
      let wins = 0;
      for (let i = 0; i < Math.max(1, Math.round(hours / 6)); i++) {
        const E = (9 + ring * 2) * (0.8 + rng() * 0.4);
        const mine = (st.combat * 0.4 + st.magic * 1.6) * (M.charm ? 1.3 : 1) * (0.8 + rng() * 0.4);
        if (mine >= E) { wins++; put('salvage', 1 + Math.floor(rng() * 3)); }
        else { const d = Math.max(1, Math.round(st.hull * 0.2 * st.dmg * r.dm)); r.damage += d; r.events.push({ type: 'storm', text: `A ghost ship raked her with cold green fire (-${d} hull).` }); break; }
      }
      if (wins) r.events.push({ type: 'win', text: `Sent ${wins} ghost ship${wins > 1 ? 's' : ''} back to the deep.` });
      r.ghostWins = wins;
    }
    // sea monsters in the wildest waters
    if (Rg.monsters && rng() < Rg.monsters * Math.min(1.5, Math.max(0.3, hours / 8))) {
      const m = MONSTERS[Math.floor(rng() * MONSTERS.length)];
      const mine = (st.combat + st.magic + st.hull / 20) * (M.charm ? 1.3 : 1) * (0.8 + rng() * 0.4);
      const E = m.power * (0.85 + rng() * 0.3) + ring * 3;
      if (mine >= E) {
        put('essence', 2 + Math.floor(rng() * 3)); put('coins', 200 + Math.floor(rng() * 300));
        r.monster = { name: m.name, won: true };
        if (rng() < 0.2) r.trophy = m.trophy;
        r.events.push({ type: 'win', text: `Drove off ${m.name}!` });
      } else {
        const d = Math.max(1, Math.round(st.hull * 0.4 * st.dmg * r.dm));
        r.damage += d; r.monster = { name: m.name, won: false };
        r.events.push({ type: 'storm', text: `${m.name[0].toUpperCase() + m.name.slice(1)} rose from the deep. She escaped, badly hurt (-${d} hull).` });
      }
    }
    if (Rg.curse && type === 'treasure' && !M.charm && rng() < Rg.curse) { r.curse = true; r.events.push({ type: 'storm', text: 'She looted a cursed wreck. The crew is jumpy and slow.' }); }
    if (Rg.landmark && type === 'exploration' && rng() < 0.3) r.landmark = M.region;
    if (Rg.witch && rng() < 0.3) r.witch = true;
    if (rng() < 0.03 + ring * 0.04 + (Rg.kraken || 0)) r.lore = 'kraken';
    else if (rng() < 0.05) r.oddity = ODDITIES[Math.floor(rng() * ODDITIES.length)];
  }

  // Kept for Phase 1 callers and tests.
  function rollFishing(ship, hours, seed) { return rollExpedition(shipStats(ship), 'fishing', hours, seed); }

  // Monte Carlo preview with fixed seeds, so the numbers are stable on screen.
  const _estCache = new Map();
  function estimate(ship, type, hours, mods) {
    const st = shipStats(ship);
    const key = JSON.stringify([ship.cls, ship.upgrades, type, hours, mods || null]);
    if (_estCache.has(key)) return _estCache.get(key);
    const N = 80, tot = {}, out = { damage: 0, damageChance: 0, overflowChance: 0, winRate: 0, anyRare: {} };
    let fights = 0;
    for (let i = 1; i <= N; i++) {
      const r = rollExpedition(st, type, hours, i * 7919, mods);
      for (const [k, v] of Object.entries(r.items)) { tot[k] = (tot[k] || 0) + v; out.anyRare[k] = (out.anyRare[k] || 0) + 1; }
      out.damage += r.damage; if (r.damage > 0) out.damageChance++;
      if (Object.keys(r.items).some(k => CHESTS[k])) out.anyChest = (out.anyChest || 0) + 1;
      if (r.overflow > 0) out.overflowChance++;
      if (type === 'combat') { fights += r.wins + r.losses; out.winRate += r.wins; }
    }
    const res = {
      avg: Object.fromEntries(Object.entries(tot).map(([k, v]) => [k, v / N])),
      chance: Object.fromEntries(Object.entries(out.anyRare).map(([k, v]) => [k, v / N])),
      damage: out.damage / N, damageChance: out.damageChance / N, overflowChance: out.overflowChance / N, chestChance: (out.anyChest || 0) / N,
      winRate: fights ? out.winRate / fights : 0,
      capacity: st.cargo,
      durationMult: durationMult(st),
    };
    if (_estCache.size > 300) _estCache.clear();
    _estCache.set(key, res);
    return res;
  }
  // Phase 1 compatibility.
  function estimateFishing(ship, hours) {
    const e = estimate(ship, 'fishing', hours);
    return { fish: Math.round(e.avg.fish || 0), shell: Math.round(e.avg.shellfish || 0), rareChance: e.chance.rareFish || 0, storm: e.damageChance, capacity: e.capacity, overflow: e.overflowChance > 0.25 ? 1 : 0 };
  }

  function hourMs(state) { return state.settings.devMode ? state.settings.devSecondsPerHour * 1000 : HOUR_MS; }

  function sailBlock(state, ship, type, now) {
    if (expeditionForShip(state, ship.id)) return `${ship.name} is already at sea.`;
    const st = shipStats(ship);
    if (ship.hp < Math.ceil(st.hull * MIN_SAIL_HULL)) return `${ship.name} is too damaged to sail. Repair her first.`;
    if (type === 'combat' && typePower(st, 'combat') < 2) return 'She has no guns. Fit cannons at the Shipwright first.';
    return null;
  }

  function foodFor(hours) { return Math.ceil(hours / 4); }

  // Village bonuses applied to a trip at the moment it sails.
  const hasTrophy = (state, k) => !!(state.trophies && state.trophies[k] > 0);
  function tripMods(state, type, now, supplies, region = 'home', charm = false) {
    const rumor = rumorFor(state, now);
    const Rg = REGIONS[region] || REGIONS.home;
    let power = 1;
    if (type === 'combat') power *= (1 + 0.1 * buildingLevel(state, 'weaponsmith')) * (hasTrophy(state, 'captainCutlass') ? 1.1 : 1);
    if (type === 'exploration') power *= (1 + 0.15 * buildingLevel(state, 'cartographer')) * (hasTrophy(state, 'goldenCompass') ? 1.1 : 1);
    let yld = rumor && rumor.type === type ? rumor.bonus : 1;
    if (supplies) yld *= 1.2;
    yld *= (Rg.yield && (Rg.yield[type] || Rg.yield.all)) || 1;
    if ((state.landmarks || []).includes(region)) yld *= 1.2;
    if (type === 'fishing' && hasTrophy(state, 'sirenPearl')) yld *= 1.1;
    let damage = (supplies ? 0.7 : 1) * Rg.danger * (charm ? 0.5 : 1) * (hasTrophy(state, 'krakenScale') ? 0.9 : 1);
    const m = { power: round3(power), yield: round3(yld), damage: round3(damage), region: REGIONS[region] ? region : 'home' };
    if (charm) m.charm = true;
    if (hasTrophy(state, 'drownedCrown')) m.chestMult = 1.25;
    return m;
  }

  // ---------- regions ----------
  const revealed = (state, id) => (state.regions || ['home']).includes(id);
  function regionLock(state, id) {
    const Rg = REGIONS[id];
    if (!Rg) return 'Unknown waters.';
    if (revealed(state, id)) return null;
    if (Rg.ring > 1 && !REGION_ORDER.some(k => REGIONS[k].ring === Rg.ring - 1 && revealed(state, k))) return 'Chart a nearer region first.';
    for (const [b, lvl] of Object.entries(Rg.req || {})) if (buildingLevel(state, b) < lvl) return lvl > 1 ? `Needs a level ${lvl} ${BUILDINGS[b].name}.` : `Needs a ${BUILDINGS[b].name}.`;
    return null;
  }
  function revealRegion(state, id) {
    if (revealed(state, id)) return { ok: false, reason: 'Already charted.' };
    const lock = regionLock(state, id);
    if (lock) return { ok: false, reason: lock };
    const cost = REGIONS[id].cost;
    if (!canAfford(state, cost)) return { ok: false, reason: `Charting it takes ${cost.charts} sea charts.` };
    spend(state, cost);
    state.regions.push(id);
    return { ok: true };
  }
  function regionSailBlock(state, ship, id) {
    const Rg = REGIONS[id];
    if (!Rg || !revealed(state, id)) return 'Those waters aren’t charted yet.';
    if (shipStats(ship).exploration < Rg.minExplore) return `She needs ${Rg.minExplore} exploration to sail that far. A scouting tower helps.`;
    return null;
  }

  // ---------- chests ----------
  function openChest(state, id, seed) {
    const c = CHESTS[id];
    if (!c) return { ok: false, reason: 'Not a chest.' };
    if ((state.resources[id] || 0) < 1) return { ok: false, reason: 'You don’t have that chest.' };
    const z = CHEST_SIZES[c.size], key = KEY_OF[c.family];
    if (state.resources[key] < z.keys) return { ok: false, reason: `It needs ${z.keys} ${RESOURCES[key].name.toLowerCase()}${z.keys > 1 ? 's' : ''}. ${{ sunkenKey: 'Fishing', pirateKey: 'Pirate hunting', lostKey: 'Exploring' }[key]} turns them up.` };
    const rng = mulberry32((seed === undefined ? Math.floor(Math.random() * 4294967296) : seed) >>> 0);
    const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
    state.resources[id]--; state.resources[key] -= z.keys;
    const items = {};
    let coins = Math.round(ri(z.coins[0], z.coins[1]) * (c.family === 'pirate' ? 1.3 : 1));
    const jackpot = c.size === 'large' && rng() < 0.04;
    if (jackpot) coins *= 5;
    items.coins = coins;
    const table = CHEST_LOOT[c.family];
    for (let i = 0; i < z.rolls; i++) {
      const [k, a, b] = table[Math.floor(rng() * table.length)];
      const n = k.endsWith('Key') ? 1 : Math.max(1, Math.round(ri(a, b) * z.mult));
      items[k] = (items[k] || 0) + n;
    }
    let trophy = null;
    if (rng() < z.trophy) {
      const list = CHEST_TROPHIES[c.family];
      trophy = list[Math.floor(rng() * list.length)];
      state.trophies[trophy] = (state.trophies[trophy] || 0) + 1;
    }
    addItems(state, items);
    state.stats.chestsOpened++;
    state.stats.coinsEarned += coins;
    return { ok: true, chest: id, items, trophy, jackpot, first: trophy ? state.trophies[trophy] === 1 : false };
  }

  // ---------- the Sea Witch ----------
  function craftCharm(state) {
    if (buildingLevel(state, 'seaWitch') < 1) return { ok: false, reason: 'Only the Sea Witch makes these.' };
    const cost = { essence: 2, relics: 1 };
    if (!canAfford(state, cost)) return { ok: false, reason: 'A charm takes 2 enchanted essence and 1 relic.' };
    spend(state, cost); state.resources.charm++;
    if (!state.discovered.includes('charm')) state.discovered.push('charm');
    return { ok: true };
  }
  function cleanse(state, shipId) {
    const ship = getShip(state, shipId);
    if (!ship || !ship.curse) return { ok: false, reason: 'No curse to lift.' };
    if (buildingLevel(state, 'seaWitch') < 1) return { ok: false, reason: 'Only the Sea Witch can lift a curse.' };
    if (state.resources.essence < 1) return { ok: false, reason: 'Lifting a curse takes 1 enchanted essence.' };
    state.resources.essence--; ship.curse = null;
    return { ok: true };
  }
  const trophyBonus = (state, k) => hasTrophy(state, k);
  const round3 = x => Math.round(x * 1000) / 1000;

  function dispatch(state, shipId, hours, now, seed, type = 'fishing', opts = {}) {
    const ship = getShip(state, shipId);
    if (!ship) return { ok: false, reason: 'No such ship.' };
    if (!DURATIONS.includes(hours)) return { ok: false, reason: 'Pick a listed duration.' };
    if (!TYPES[type]) return { ok: false, reason: 'Unknown expedition type.' };
    const block = sailBlock(state, ship, type, now);
    if (block) return { ok: false, reason: block };
    const region = opts.region || 'home';
    const rb = regionSailBlock(state, ship, region);
    if (rb) return { ok: false, reason: rb };
    const supplies = !!opts.supplies, charm = !!opts.charm;
    if (supplies && state.resources.food < foodFor(hours)) return { ok: false, reason: `Supplies for this trip need ${foodFor(hours)} preserved food.` };
    if (charm && state.resources.charm < 1) return { ok: false, reason: 'You have no warding charm.' };
    if (supplies) state.resources.food -= foodFor(hours);
    if (charm) state.resources.charm--;
    const st = shipStats(ship);
    const tripLen = REGIONS[region].dist * (hasTrophy(state, 'starChart') ? 0.9 : 1);
    const exp = {
      id: 'exp-' + state.nextId++,
      shipId, type, hours,
      startAt: now,
      endAt: now + Math.round(hours * hourMs(state) * durationMult(st) * tripLen),
      seed: (seed === undefined ? Math.floor(Math.random() * 4294967296) : seed) >>> 0,
      dev: !!state.settings.devMode,
      stats: snapshot(st),
      mods: tripMods(state, type, now, supplies, region, charm),
      supplies, region,
    };
    state.expeditions.push(exp);
    ship.lastTrip = { type, hours, region };
    return { ok: true, exp };
  }
  function snapshot(st) {
    const { speed, hull, combat, cargo, fishing, exploration, magic, aff, dmg } = st;
    return { speed, hull, combat, cargo, fishing, exploration, magic, aff: { ...aff }, dmg };
  }

  function addItems(state, items) {
    for (const [k, v] of Object.entries(items)) {
      if (!(k in state.resources)) continue;
      state.resources[k] += v;
      if (v > 0 && !state.discovered.includes(k)) state.discovered.push(k);
    }
  }

  function claim(state, expId, now) {
    const exp = state.expeditions.find(e => e.id === expId);
    if (!exp) return { ok: false, reason: state.claimed.includes(expId) ? 'Already collected.' : 'No such expedition.' };
    if (now < exp.endAt) return { ok: false, reason: 'Still at sea.' };
    const ship = getShip(state, exp.shipId);
    const result = rollExpedition(exp.stats, exp.type, exp.hours, exp.seed, exp.mods);
    // Remove first, then credit: a second call can never find it again.
    state.expeditions = state.expeditions.filter(e => e.id !== expId);
    state.claimed.push(expId);
    if (state.claimed.length > 200) state.claimed = state.claimed.slice(-200);
    // Damage. A ship never sinks: at worst she limps home with 1 hull and half her hold.
    const before = ship.hp;
    ship.hp -= result.damage;
    if (ship.hp <= 0) {
      ship.hp = 1;
      for (const k of Object.keys(result.items)) if (k !== 'coins') { result.items[k] = Math.floor(result.items[k] / 2); if (!result.items[k]) delete result.items[k]; }
      result.events.push({ type: 'storm', text: 'She limped home barely afloat and dumped half the hold to stay up.' });
    }
    result.hullLost = before - ship.hp;
    // Bulk goods beyond the warehouse limit spoil on the quay.
    const cap = storageCap(state);
    result.spoiled = {};
    for (const k of BULK) {
      const n = result.items[k];
      if (!n) continue;
      const room = Math.max(0, cap - state.resources[k]);
      if (n > room) { result.spoiled[k] = n - room; result.items[k] = room; if (!room) delete result.items[k]; }
    }
    const sp = Object.entries(result.spoiled);
    if (sp.length) result.events.push({ type: 'full', text: `Storage full (${cap}): ${sp.map(([k, n]) => `${n} ${RESOURCES[k].name.toLowerCase()}`).join(', ')} spoiled on the quay. A bigger Warehouse holds more.` });
    addItems(state, result.items);
    // curses, discoveries, legends
    if (ship.curse) { ship.curse.trips--; if (ship.curse.trips <= 0) { ship.curse = null; result.events.push({ type: 'win', text: 'The curse on her has worn off.' }); } }
    if (result.curse) ship.curse = { trips: 3 };
    if (result.landmark && !state.landmarks.includes(result.landmark)) { state.landmarks.push(result.landmark); result.newLandmark = result.landmark; }
    else result.landmark = null;
    if ((result.witch || result.newLandmark === 'outer') && !state.flags.witchFound) { state.flags.witchFound = true; result.foundWitch = true; }
    if (result.lore === 'kraken') { result.krakenHint = KRAKEN_HINTS[Math.min(state.lore.kraken, KRAKEN_HINTS.length - 1)]; result.krakenRepeat = state.lore.kraken >= KRAKEN_HINTS.length; state.lore.kraken++; }
    if (result.trophy) { state.trophies[result.trophy] = (state.trophies[result.trophy] || 0) + 1; }
    if (result.monster) state.stats.monstersFought++;
    result.report = tripReport(result, exp);
    if (result.report.length) { state.reports.unshift({ at: now, ship: ship.name, region: exp.region || 'home', lines: result.report }); if (state.reports.length > 25) state.reports.length = 25; }
    state.stats.expeditions++;
    state.stats.fishCaught += (result.items.fish || 0) + (result.items.shellfish || 0) + (result.items.rareFish || 0);
    state.stats.coinsEarned += result.items.coins || 0;
    state.stats.piratesBeaten += result.wins;
    state.log.unshift({ at: now, shipId: ship.id, type: exp.type, hours: exp.hours, items: result.items });
    if (state.log.length > 30) state.log.length = 30;
    return { ok: true, exp, ship, result };
  }

  // A short ship's log of anything out of the ordinary.
  const LOG_NAMES = { rareFish: ['rare catch', 'rare catches'], pearls: ['pearl', 'pearls'], relics: ['relic', 'relics'], charts: ['sea chart', 'sea charts'],
    sunkenKey: ['sunken key', 'sunken keys'], pirateKey: ['pirate key', 'pirate keys'], lostKey: ['lost key', 'lost keys'], moonfish: ['moonfish', 'moonfish'],
    salvage: ['spectral salvage', 'spectral salvage'], essence: ['enchanted essence', 'enchanted essence'] };
  function tripReport(r, exp) {
    const lines = [];
    const finds = [];
    for (const [k, [one, many]] of Object.entries(LOG_NAMES)) { const n = r.items[k]; if (n) finds.push(`${n} ${n === 1 ? one : many}`); }
    for (const id of Object.keys(CHESTS)) { const n = r.items[id]; if (n) finds.push(`${n > 1 ? n + ' ' : 'a '}${CHESTS[id].name.toLowerCase()}${n > 1 ? 's' : ''}`); }
    if (finds.length) lines.push({ kind: 'find', text: `Found ${finds.join(', ')}.` });
    if (r.trophy) lines.push({ kind: 'trophy', text: `Brought home the ${TROPHIES[r.trophy].name}!` });
    if (r.monster) lines.push({ kind: r.monster.won ? 'win' : 'danger', text: r.monster.won ? `Fought off ${r.monster.name}.` : `Fled from ${r.monster.name}.` });
    if (r.ghostWins) lines.push({ kind: 'win', text: `Beat ${r.ghostWins} ghost ship${r.ghostWins > 1 ? 's' : ''}.` });
    if (r.newLandmark) lines.push({ kind: 'landmark', text: `Discovered ${REGIONS[r.newLandmark].landmark}.` });
    if (r.foundWitch) lines.push({ kind: 'witch', text: 'A hut on stilts glowed beyond the reef. The Sea Witch will see you now.' });
    if (r.curse) lines.push({ kind: 'danger', text: 'Cursed for the next 3 trips.' });
    if (r.krakenHint) lines.push({ kind: 'kraken', text: r.krakenRepeat ? 'The kraken was seen again, its eight yellow eyes watching from the dark.' : r.krakenHint });
    if (r.oddity) lines.push({ kind: 'odd', text: r.oddity });
    return lines;
  }

  function claimAll(state, now) {
    const ready = state.expeditions.filter(e => now >= e.endAt).map(e => e.id);
    return ready.map(id => claim(state, id, now)).filter(r => r.ok);
  }

  function finishAllNow(state, now) {
    let n = 0;
    for (const e of state.expeditions) if (e.endAt > now) { e.endAt = now; n++; }
    for (const b of state.buildings) {
      if (b.pending && b.pending.endAt > now) { b.pending.endAt = now; n++; }
      if (b.job && b.job.done < b.job.qty) { b.job.startAt = now - b.job.qty * b.job.unitMs; n++; }
    }
    return n;
  }

  // ---------- repairs ----------
  function repairCost(ship, state) {
    const missing = shipStats(ship).hull - ship.hp;
    if (missing <= 0) return 0;
    const disc = state ? 1 - 0.2 * Math.max(0, buildingLevel(state, 'shipwright') - 1) : 1;
    return Math.ceil(missing * tierFactor(ship.cls) * disc);
  }
  function repairPlanks(ship) {
    const missing = shipStats(ship).hull - ship.hp;
    return missing <= 0 ? 0 : Math.ceil(missing / 10);
  }
  function repair(state, shipId, now) {
    const ship = getShip(state, shipId);
    if (!ship) return { ok: false, reason: 'No such ship.' };
    if (expeditionForShip(state, shipId)) return { ok: false, reason: `${ship.name} is at sea.` };
    const cost = repairCost(ship, state), planks = repairPlanks(ship);
    if (!cost) return { ok: false, reason: 'Hull is already sound.' };
    if (state.resources.coins < cost || state.resources.planks < planks) return { ok: false, reason: `Repairs need ${cost} coins and ${planks} planks.` };
    state.resources.coins -= cost;
    state.resources.planks -= planks;
    ship.hp = shipStats(ship).hull;
    return { ok: true, cost, planks };
  }

  // ---------- market ----------
  function sell(state, res, qty) {
    if (!SELLABLE.includes(res)) return { ok: false, reason: 'That can’t be sold.' };
    const have = state.resources[res];
    const n = Math.min(have, Math.max(0, Math.floor(qty)));
    if (n <= 0) return { ok: false, reason: `No ${RESOURCES[res].name.toLowerCase()} to sell.` };
    const coins = n * sellPrice(state, res);
    state.resources[res] -= n;
    state.resources.coins += coins;
    state.stats.coinsEarned += coins;
    return { ok: true, sold: n, coins };
  }

  // Bulk sale of the everyday catch. Rare catch, pearls and relics feed upgrades, so they are kept.
  function sellAll(state) {
    let coins = 0, sold = 0;
    for (const r of ['fish', 'shellfish']) {
      if (state.resources[r] > 0) { const s = sell(state, r, state.resources[r]); coins += s.coins; sold += s.sold; }
    }
    return { ok: sold > 0, coins, sold, reason: sold ? '' : 'Nothing to sell.' };
  }

  // ---------- upgrades ----------
  function canAfford(state, cost) { return Object.entries(cost).every(([k, v]) => (state.resources[k] || 0) >= v); }
  function spend(state, cost) { for (const [k, v] of Object.entries(cost)) state.resources[k] -= v; }

  function upgradeCost(ship, key) {
    const u = UPGRADES[key];
    const lvl = ship.upgrades[key] || 0;
    if (lvl >= u.maxLevel) return null;
    const f = tierFactor(ship.cls);
    return Object.fromEntries(Object.entries(u.costs[lvl]).map(([k, v]) => [k, k === 'coins' ? Math.round(v * f) : v]));
  }

  function buyUpgrade(state, shipId, key) {
    const ship = getShip(state, shipId);
    if (!ship || !UPGRADES[key]) return { ok: false, reason: 'Unknown upgrade.' };
    if (expeditionForShip(state, shipId)) return { ok: false, reason: `${ship.name} is at sea. Upgrade her when she’s back.` };
    const cost = upgradeCost(ship, key);
    if (!cost) return { ok: false, reason: 'Already at max level.' };
    const gate = upgradeGate(state, ship, key);
    if (gate) return { ok: false, reason: gate };
    if (!canAfford(state, cost)) return { ok: false, reason: 'Not enough resources.' };
    const oldMax = shipStats(ship).hull;
    spend(state, cost);
    ship.upgrades[key] = (ship.upgrades[key] || 0) + 1;
    if (key === 'reinforcedHull') ship.hp += shipStats(ship).hull - oldMax;
    return { ok: true, level: ship.upgrades[key] };
  }

  function upgradeGate(state, ship, key) {
    const g = UPGRADES[key].gate;
    if (!g || (ship.upgrades[key] || 0) < 1) return null;
    return buildingLevel(state, g) >= 1 ? null : `Levels 2 and 3 need a ${BUILDINGS[g].name}.`;
  }

  // ---------- village ----------
  function getBuilding(state, id) { return state.buildings.find(b => b.id === id) || null; }
  function buildingOfType(state, type) { return state.buildings.find(b => b.type === type) || null; }
  function buildingLevel(state, type) { const b = buildingOfType(state, type); return b ? b.level : 0; }
  function buildersBusy(state) { return state.buildings.filter(b => b.pending).length; }
  function storageCap(state) { return 300 + 250 * buildingLevel(state, 'warehouse'); }
  function sellPrice(state, res) { return Math.round(RESOURCES[res].price * (1 + 0.15 * Math.max(0, buildingLevel(state, 'market') - 1))); }
  function tradePrice(state, side, res) {
    const lvl = Math.max(1, buildingLevel(state, 'tradingPost'));
    const base = TRADE[side][res];
    return side === 'buy' ? Math.max(1, Math.round(base * (1 - 0.05 * (lvl - 1)))) : Math.round(base * (1 + 0.05 * (lvl - 1)));
  }
  function buildCost(type, toLevel) { return BUILDINGS[type].costs[toLevel - 1]; }
  function buildHours(toLevel) { return BUILD_HOURS[toLevel - 1]; }

  function footprint(type, gx, gy) { const [fw, fd] = BUILDINGS[type].size; return { gx, gy, fw, fd }; }
  function overlaps(a, b) { return a.gx < b.gx + b.fw && b.gx < a.gx + a.fw && a.gy < b.gy + b.fd && b.gy < a.gy + a.fd; }

  function buildLock(state, type) {
    const d = BUILDINGS[type];
    if (!d) return 'Unknown building.';
    if (d.locked) return d.locked;
    if (d.secret && !(state.flags && state.flags.witchFound)) return 'Something strange lives past the Outer Reef. Find her first.';
    if (buildingOfType(state, type)) return 'Already built.';
    if (d.requires && buildingLevel(state, d.requires) < 1) return `Needs a ${BUILDINGS[d.requires].name} first.`;
    return null;
  }

  // terrain(type, gx, gy, fw, fd) -> null | reason. Supplied by the world (it knows the map).
  function placeCheck(state, type, gx, gy, terrain) {
    const lock = buildLock(state, type);
    if (lock) return lock;
    const f = footprint(type, gx, gy);
    for (const b of state.buildings) if (overlaps(f, footprint(b.type, b.gx, b.gy))) return `Too close to the ${BUILDINGS[b.type].name}.`;
    const t = terrain ? terrain(type, f.gx, f.gy, f.fw, f.fd) : null;
    if (t) return t;
    return null;
  }

  function placeBuilding(state, type, gx, gy, now, terrain) {
    const why = placeCheck(state, type, gx, gy, terrain);
    if (why) return { ok: false, reason: why };
    if (buildersBusy(state) >= MAX_BUILDERS) return { ok: false, reason: 'Both builders are busy.' };
    const cost = buildCost(type, 1);
    if (!canAfford(state, cost)) return { ok: false, reason: 'Not enough resources.' };
    spend(state, cost);
    const b = { id: 'b-' + state.nextBuildingId++, type, gx, gy, level: 0, pending: { toLevel: 1, startAt: now, endAt: now + Math.round(buildHours(1) * hourMs(state)) }, job: null };
    state.buildings.push(b);
    return { ok: true, building: b };
  }

  function upgradeBlock(state, b) {
    if (b.pending) return 'Builders are already at work here.';
    if (b.level >= BUILDING_MAX_LEVEL) return 'Fully upgraded.';
    if (buildersBusy(state) >= MAX_BUILDERS) return 'Both builders are busy.';
    return null;
  }
  function upgradeBuilding(state, id, now) {
    const b = getBuilding(state, id);
    if (!b) return { ok: false, reason: 'No such building.' };
    const block = upgradeBlock(state, b);
    if (block) return { ok: false, reason: block };
    const cost = buildCost(b.type, b.level + 1);
    if (!canAfford(state, cost)) return { ok: false, reason: 'Not enough resources.' };
    spend(state, cost);
    b.pending = { toLevel: b.level + 1, startAt: now, endAt: now + Math.round(buildHours(b.level + 1) * hourMs(state)) };
    return { ok: true, building: b };
  }

  // ---------- production ----------
  function recipeSpeed(level) { return 1 + 0.5 * (level - 1); }
  function maxBatch(b) { return 10 * Math.max(1, b.level); }

  function queueJob(state, id, qty, now) {
    const b = getBuilding(state, id);
    if (!b) return { ok: false, reason: 'No such building.' };
    const rc = BUILDINGS[b.type].recipe;
    if (!rc) return { ok: false, reason: 'This building doesn’t make anything.' };
    if (b.level < 1) return { ok: false, reason: 'Still under construction.' };
    settleProduction(state, now);
    if (b.job) return { ok: false, reason: 'Already working on a batch.' };
    let n = Math.floor(qty);
    for (const [k, v] of Object.entries(rc.in)) n = Math.min(n, Math.floor(state.resources[k] / v));
    n = Math.min(n, maxBatch(b));
    if (n < 1) return { ok: false, reason: `Not enough ${Object.keys(rc.in).map(k => RESOURCES[k].name.toLowerCase()).join(' or ')}.` };
    for (const [k, v] of Object.entries(rc.in)) state.resources[k] -= v * n;
    b.job = { out: rc.out, per: { ...rc.in }, qty: n, done: 0, startAt: now, unitMs: Math.max(1, Math.round(rc.hours * hourMs(state) / recipeSpeed(b.level))) };
    return { ok: true, qty: n };
  }

  function cancelJob(state, id, now) {
    const b = getBuilding(state, id);
    if (!b || !b.job) return { ok: false, reason: 'Nothing to cancel.' };
    settleProduction(state, now);
    if (!b.job) return { ok: false, reason: 'That batch just finished.' };
    const left = b.job.qty - b.job.done;
    for (const [k, v] of Object.entries(b.job.per)) state.resources[k] += v * left;
    b.job = null;
    return { ok: true, refunded: left };
  }

  // Credits finished units since last time. Safe to call any number of times.
  function settleProduction(state, now) {
    const out = [];
    for (const b of state.buildings) {
      const j = b.job;
      if (!j) continue;
      const made = Math.min(j.qty, Math.max(0, Math.floor((now - j.startAt) / j.unitMs)));
      const fresh = made - j.done;
      if (fresh > 0) {
        state.resources[j.out] += fresh;
        if (!state.discovered.includes(j.out)) state.discovered.push(j.out);
        j.done = made;
      }
      if (j.done >= j.qty) { out.push({ building: b, out: j.out, qty: j.qty }); b.job = null; }
    }
    return out;
  }

  function settleBuildings(state, now) {
    const done = [];
    for (const b of state.buildings) {
      if (b.pending && now >= b.pending.endAt) {
        b.level = b.pending.toLevel;
        b.pending = null;
        done.push(b);
      }
    }
    return done;
  }

  function settle(state, now) {
    return { built: settleBuildings(state, now), produced: settleProduction(state, now) };
  }

  // ---------- trading post ----------
  function trade(state, side, res, qty) {
    if (buildingLevel(state, 'tradingPost') < 1) return { ok: false, reason: 'Build a Trading Post first.' };
    if (!TRADE[side] || !TRADE[side][res]) return { ok: false, reason: 'Not traded here.' };
    const price = tradePrice(state, side, res);
    let n = Math.floor(qty);
    if (side === 'buy') {
      n = Math.min(n, Math.floor(state.resources.coins / price), Math.max(0, storageCap(state) - state.resources[res]));
      if (n < 1) return { ok: false, reason: state.resources[res] >= storageCap(state) ? 'Storage is full.' : 'Not enough coins.' };
      state.resources.coins -= n * price; state.resources[res] += n;
      if (!state.discovered.includes(res)) state.discovered.push(res);
      return { ok: true, qty: n, coins: n * price };
    }
    n = Math.min(n, state.resources[res]);
    if (n < 1) return { ok: false, reason: `No ${RESOURCES[res].name.toLowerCase()} to sell.` };
    state.resources[res] -= n; state.resources.coins += n * price; state.stats.coinsEarned += n * price;
    return { ok: true, qty: n, coins: n * price };
  }

  // ---------- tavern rumors ----------
  const RUMORS = {
    fishing: 'Mackerel are running thick off the north reef.',
    treasure: 'A merchant swears a wreck surfaced in last night’s storm.',
    combat: 'A pirate crew was seen drunk and careless in the next cove.',
    exploration: 'An old sailor sketched an island nobody has charted.',
  };
  function rumorFor(state, now) {
    const lvl = buildingLevel(state, 'tavern');
    if (lvl < 1) return null;
    const day = Math.floor(now / 86400000);
    const types = Object.keys(TYPES);
    const type = types[mulberry32(day * 2654435761)() * types.length | 0];
    const kr = state.lore && state.lore.kraken >= 2 && day % 3 === 0;
    const text = kr ? 'Nobody will sail past the Deep at night. They say something red down there has eyes like eight yellow lanterns.' : RUMORS[type];
    return { type, bonus: round3(1.2 + 0.1 * (lvl - 1)), text, day, kraken: kr };
  }

  // ---------- saving ----------
  const MIGRATIONS = {
    // v0: the hypothetical pre-release format {coins, fish, boat:{cargoLevel}}.
    0: s => ({
      version: 1,
      createdAt: s.createdAt,
      resources: { coins: s.coins, fish: s.fish, shellfish: 0, rareFish: 0 },
      ships: [{ id: 'ship-1', cls: 'skiff', name: 'Little Gull', upgrades: { cargoHold: (s.boat && s.boat.cargoLevel) || 0 }, berth: 0 }],
      expeditions: [], claimed: [], log: [], stats: {}, settings: {}, nextId: 1,
    }),
    // v1 → v2: new resources, full upgrade set, hull points, typed expeditions with stat snapshots.
    1: s => {
      const out = JSON.parse(JSON.stringify(s));
      out.version = 2;
      out.resources = { pearls: 0, relics: 0, charts: 0, ...(s.resources || {}) };
      out.discovered = [...ALWAYS_SHOWN];
      out.ships = (s.ships || []).map((sh, i) => {
        const ship = { ...sh, upgrades: { ...emptyUpgrades(), ...(sh.upgrades || {}) }, berth: Number.isInteger(sh.berth) ? sh.berth : i, lastTrip: { type: 'fishing', hours: 1 } };
        if (SHIP_CLASSES[ship.cls]) ship.hp = shipStats(ship).hull;
        return ship;
      });
      const byId = Object.fromEntries(out.ships.map(x => [x.id, x]));
      out.expeditions = (s.expeditions || []).map(e => ({ ...e, type: 'fishing', stats: byId[e.shipId] && SHIP_CLASSES[byId[e.shipId].cls] ? snapshot(shipStats(byId[e.shipId])) : undefined }));
      out.nextShipId = out.ships.length + 1;
      return out;
    },
    // v2 → v3: village buildings, new goods, trip modifiers. Existing players get the market,
    // the shipwright and a pile of timber to start building with.
    2: s => {
      const out = JSON.parse(JSON.stringify(s));
      out.version = 3;
      out.resources = { timber: 0, hemp: 0, ironOre: 0, planks: 0, rope: 0, iron: 0, food: 0, ...(s.resources || {}) };
      out.resources.timber += 30;
      out.buildings = START_BUILDINGS.map((b, i) => ({ id: 'b-' + (i + 1), type: b.type, gx: b.gx, gy: b.gy, level: 1, pending: null, job: null }));
      out.nextBuildingId = out.buildings.length + 1;
      out.expeditions = (s.expeditions || []).map(e => ({ ...e, mods: { ...NO_MODS }, supplies: false }));
      return out;
    },
    // v3 → v4: the wider sea. Everyone starts with home waters charted.
    3: s => {
      const out = JSON.parse(JSON.stringify(s));
      out.version = 4;
      out.regions = ['home']; out.landmarks = []; out.lore = { kraken: 0 }; out.trophies = {}; out.flags = { witchFound: false }; out.reports = [];
      out.expeditions = (s.expeditions || []).map(e => ({ ...e, region: 'home', mods: { ...(e.mods || NO_MODS), region: 'home' } }));
      return out;
    },
  };

  function migrate(s) {
    if (!s || typeof s !== 'object') throw new Error('Save is not an object.');
    let v = s.version;
    if (v === undefined && 'coins' in s) v = 0;
    if (!Number.isInteger(v)) throw new Error('Save has no version.');
    if (v > SAVE_VERSION) throw new Error(`Save is from a newer version (${v}).`);
    while (v < SAVE_VERSION) {
      const m = MIGRATIONS[v];
      if (!m) throw new Error(`No migration from version ${v}.`);
      s = m(s); v = s.version;
    }
    return s;
  }

  function validMods(m) {
    return m && ['power', 'yield', 'damage'].every(k => Number.isFinite(m[k]) && m[k] > 0 && m[k] < 5);
  }
  function validStats(x) {
    return x && typeof x === 'object' && ['speed', 'hull', 'combat', 'cargo', 'fishing', 'exploration', 'magic'].every(k => Number.isFinite(x[k]))
      && x.aff && typeof x.aff === 'object' && Number.isFinite(x.dmg);
  }

  function sanitize(raw, now) {
    const s = newGame(now);
    s.ships = [];
    s.createdAt = Number.isFinite(raw.createdAt) ? raw.createdAt : now;
    s.updatedAt = Number.isFinite(raw.updatedAt) ? raw.updatedAt : now;
    for (const k of Object.keys(RESOURCES)) {
      const v = Number(raw.resources && raw.resources[k]);
      s.resources[k] = Number.isFinite(v) && v >= 0 ? Math.floor(v) : 0;
    }
    s.discovered = [...new Set([...ALWAYS_SHOWN, ...(Array.isArray(raw.discovered) ? raw.discovered.filter(k => k in RESOURCES) : []),
      ...Object.keys(RESOURCES).filter(k => s.resources[k] > 0)])];
    if (!Array.isArray(raw.ships)) throw new Error('Save has no ships.');
    const usedBerths = new Set(), usedIds = new Set();
    for (const sh of raw.ships) {
      if (!sh || typeof sh.id !== 'string' || !SHIP_CLASSES[sh.cls] || usedIds.has(sh.id) || s.ships.length >= MAX_SHIPS) continue;
      usedIds.add(sh.id);
      const up = emptyUpgrades();
      for (const k of UPGRADE_KEYS) up[k] = clampInt(sh.upgrades && sh.upgrades[k], 0, UPGRADES[k].maxLevel);
      const ship = { id: sh.id, cls: sh.cls, name: String(sh.name || SHIP_CLASSES[sh.cls].name).slice(0, 24), upgrades: up, berth: clampInt(sh.berth, 0, MAX_SHIPS - 1), hp: 0, lastTrip: { type: SHIP_CLASSES[sh.cls].role, hours: 1 } };
      if (usedBerths.has(ship.berth)) { for (let i = 0; i < MAX_SHIPS; i++) if (!usedBerths.has(i)) { ship.berth = i; break; } }
      usedBerths.add(ship.berth);
      const max = shipStats(ship).hull;
      ship.hp = sh.hp === undefined ? max : clampInt(sh.hp, 1, max);
      if (sh.lastTrip && TYPES[sh.lastTrip.type] && DURATIONS.includes(sh.lastTrip.hours)) ship.lastTrip = { type: sh.lastTrip.type, hours: sh.lastTrip.hours, region: REGIONS[sh.lastTrip.region] ? sh.lastTrip.region : 'home' };
      if (sh.curse && Number.isFinite(sh.curse.trips) && sh.curse.trips > 0) ship.curse = { trips: clampInt(sh.curse.trips, 1, 9) };
      s.ships.push(ship);
    }
    if (!s.ships.length) throw new Error('Save has no valid ships.');
    const shipById = Object.fromEntries(s.ships.map(x => [x.id, x]));
    s.claimed = Array.isArray(raw.claimed) ? raw.claimed.filter(x => typeof x === 'string').slice(-200) : [];
    const claimedSet = new Set(s.claimed);
    const seenShip = new Set();
    s.expeditions = (Array.isArray(raw.expeditions) ? raw.expeditions : [])
      .filter(e => e && typeof e.id === 'string' && shipById[e.shipId] && DURATIONS.includes(e.hours)
        && Number.isFinite(e.startAt) && Number.isFinite(e.endAt) && !claimedSet.has(e.id))
      .filter(e => (seenShip.has(e.shipId) ? false : (seenShip.add(e.shipId), true)))
      .map(e => ({
        id: e.id, shipId: e.shipId, type: TYPES[e.type] ? e.type : 'fishing', hours: e.hours, startAt: e.startAt, endAt: e.endAt,
        seed: (Number(e.seed) >>> 0), dev: !!e.dev,
        stats: validStats(e.stats) ? snapshot({ ...e.stats, aff: { fishing: 1, treasure: 1, combat: 1, exploration: 1, ...e.stats.aff } }) : snapshot(shipStats(shipById[e.shipId])),
        mods: validMods(e.mods) ? { power: e.mods.power, yield: e.mods.yield, damage: e.mods.damage, region: REGIONS[e.mods.region] ? e.mods.region : 'home',
          ...(e.mods.charm ? { charm: true } : {}), ...(Number.isFinite(e.mods.chestMult) ? { chestMult: e.mods.chestMult } : {}) } : { ...NO_MODS, region: 'home' },
        supplies: !!e.supplies, region: REGIONS[e.region] ? e.region : 'home',
      }));
    s.log = Array.isArray(raw.log) ? raw.log.filter(x => x && typeof x === 'object').slice(0, 30) : [];
    s.regions = ['home', ...new Set((Array.isArray(raw.regions) ? raw.regions : []).filter(k => REGIONS[k] && k !== 'home'))];
    s.landmarks = [...new Set((Array.isArray(raw.landmarks) ? raw.landmarks : []).filter(k => REGIONS[k] && REGIONS[k].landmark))];
    s.lore = { kraken: clampInt(raw.lore && raw.lore.kraken, 0, 999) };
    s.trophies = {};
    for (const k of Object.keys(TROPHIES)) { const n = clampInt(raw.trophies && raw.trophies[k], 0, 999); if (n) s.trophies[k] = n; }
    s.flags = { witchFound: !!(raw.flags && raw.flags.witchFound) };
    s.reports = Array.isArray(raw.reports) ? raw.reports.filter(x => x && Array.isArray(x.lines)).slice(0, 25) : [];
    // buildings
    s.buildings = [];
    const seenType = new Set(), seenBid = new Set();
    for (const b of (Array.isArray(raw.buildings) ? raw.buildings : [])) {
      if (!b || typeof b.id !== 'string' || !BUILDINGS[b.type] || BUILDINGS[b.type].locked || seenType.has(b.type) || seenBid.has(b.id)) continue;
      if (b.type === 'seaWitch' && !(raw.flags && raw.flags.witchFound)) continue;
      const nb = { id: b.id, type: b.type, gx: clampInt(b.gx, 0, MAP_SIZE - 1), gy: clampInt(b.gy, 0, MAP_SIZE - 1), level: clampInt(b.level, 0, BUILDING_MAX_LEVEL), pending: null, job: null };
      const f = footprint(nb.type, nb.gx, nb.gy);
      if (s.buildings.some(o => overlaps(f, footprint(o.type, o.gx, o.gy)))) continue;
      const p = b.pending;
      if (p && Number.isFinite(p.endAt) && Number.isInteger(p.toLevel) && p.toLevel === nb.level + 1 && p.toLevel <= BUILDING_MAX_LEVEL)
        nb.pending = { toLevel: p.toLevel, startAt: Number.isFinite(p.startAt) ? p.startAt : p.endAt, endAt: p.endAt };
      if (nb.level === 0 && !nb.pending) continue; // an unfinished site with no work order is dropped
      const j = b.job, rc = BUILDINGS[nb.type].recipe;
      if (j && rc && j.out === rc.out && Number.isFinite(j.startAt) && Number.isFinite(j.unitMs) && j.unitMs > 0) {
        const qty = clampInt(j.qty, 1, 1000);
        nb.job = { out: rc.out, per: { ...rc.in }, qty, done: clampInt(j.done, 0, qty), startAt: j.startAt, unitMs: j.unitMs };
      }
      seenType.add(nb.type); seenBid.add(nb.id);
      s.buildings.push(nb);
    }
    for (const sb of START_BUILDINGS) if (!seenType.has(sb.type)) {
      const f = footprint(sb.type, sb.gx, sb.gy);
      if (!s.buildings.some(o => overlaps(f, footprint(o.type, o.gx, o.gy)))) s.buildings.push({ id: 'b-x' + sb.type, type: sb.type, gx: sb.gx, gy: sb.gy, level: 1, pending: null, job: null });
    }
    let maxB = 0;
    for (const b of s.buildings) { const n = parseInt(b.id.replace('b-', ''), 10); if (Number.isFinite(n)) maxB = Math.max(maxB, n); }
    s.nextBuildingId = Math.max(clampInt(raw.nextBuildingId, 1, 1e9), maxB + 1);
    for (const k of Object.keys(s.stats)) {
      const v = Number(raw.stats && raw.stats[k]);
      s.stats[k] = Number.isFinite(v) && v >= 0 ? Math.floor(v) : 0;
    }
    s.settings.devMode = !!(raw.settings && raw.settings.devMode);
    const sp = raw.settings && raw.settings.devSecondsPerHour;
    s.settings.devSecondsPerHour = DEV_SPEEDS.includes(sp) ? sp : 2;
    const au = (raw.settings && raw.settings.audio) || {};
    const vol = (v, d) => (Number.isFinite(v) ? Math.min(1, Math.max(0, v)) : d);
    s.settings.audio = { music: vol(au.music, 0.45), sfx: vol(au.sfx, 0.8), ambience: vol(au.ambience, 0.5) };
    s.settings.batterySaver = !!(raw.settings && raw.settings.batterySaver);
    const sk = (raw.settings && raw.settings.sky) || {};
    const pl = sk.place;
    s.settings.sky = {
      time: SKY_TIMES.includes(sk.time) ? sk.time : 'live',
      weather: SKY_WEATHER.includes(sk.weather) ? sk.weather : 'live',
      place: pl && Number.isFinite(pl.lat) && Number.isFinite(pl.lon) && Math.abs(pl.lat) <= 90 && Math.abs(pl.lon) <= 180
        ? { lat: pl.lat, lon: pl.lon, name: String(pl.name || '').slice(0, 60) } : null,
    };
    let maxId = 0;
    for (const id of [...s.claimed, ...s.expeditions.map(e => e.id)]) {
      const n = parseInt(String(id).replace('exp-', ''), 10);
      if (Number.isFinite(n)) maxId = Math.max(maxId, n);
    }
    s.nextId = Math.max(clampInt(raw.nextId, 1, 1e12), maxId + 1);
    let maxShip = 0;
    for (const sh of s.ships) { const n = parseInt(sh.id.replace('ship-', ''), 10); if (Number.isFinite(n)) maxShip = Math.max(maxShip, n); }
    s.nextShipId = Math.max(clampInt(raw.nextShipId, 1, 1e9), maxShip + 1);
    return s;
  }

  function loadGame(storage, now) {
    const errors = [];
    for (const key of [SAVE_KEY, BACKUP_KEY]) {
      let raw;
      try { raw = storage.getItem(key); } catch (e) { errors.push(`${key}: ${e.message}`); continue; }
      if (!raw) continue;
      try {
        const parsed = JSON.parse(raw);
        const inner = parsed && parsed.format === 'tof' ? parsed.state : parsed;
        const state = sanitize(migrate(inner), now);
        return { state, source: key === SAVE_KEY ? 'save' : 'backup', errors };
      } catch (e) {
        errors.push(`${key}: ${e.message}`);
      }
    }
    return { state: newGame(now), source: 'new', errors };
  }

  function saveGame(storage, state, now) {
    try {
      state.updatedAt = now;
      const raw = JSON.stringify({ format: 'tof', savedAt: now, state });
      const prev = storage.getItem(SAVE_KEY);
      if (prev && prev !== raw) storage.setItem(BACKUP_KEY, prev);
      storage.setItem(SAVE_KEY, raw);
      return true;
    } catch (e) {
      return false;
    }
  }

  // ---------- backup codes ----------
  // A save as one copy-pasteable line: "TOF-SAVE:" + base64 of the JSON.
  const CODE_PREFIX = 'TOF-SAVE:';
  function b64encode(str) {
    if (typeof TextEncoder !== 'undefined' && typeof btoa === 'function') { let bin = ''; for (const b of new TextEncoder().encode(str)) bin += String.fromCharCode(b); return btoa(bin); }
    return Buffer.from(str, 'utf8').toString('base64');
  }
  function b64decode(b64) {
    if (typeof TextDecoder !== 'undefined' && typeof atob === 'function') { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }
    return Buffer.from(b64, 'base64').toString('utf8');
  }
  function exportSave(state, now) { return CODE_PREFIX + b64encode(JSON.stringify({ format: 'tof', savedAt: now, state })); }
  function importSave(code, now) {
    try {
      let txt = String(code || '').trim();
      if (txt.startsWith(CODE_PREFIX)) txt = b64decode(txt.slice(CODE_PREFIX.length).replace(/\s+/g, ''));
      const parsed = JSON.parse(txt);
      const inner = parsed && parsed.format === 'tof' ? parsed.state : parsed;
      return { ok: true, state: sanitize(migrate(inner), now) };
    } catch (e) {
      return { ok: false, reason: 'That doesn’t look like a Tides of Fortune save.' };
    }
  }

  function resetSave(storage) {
    try { storage.removeItem(SAVE_KEY); storage.removeItem(BACKUP_KEY); } catch (e) { /* ignore */ }
  }

  return {
    SAVE_VERSION, SAVE_KEY, BACKUP_KEY, HOUR_MS, DURATIONS, DEV_SPEEDS, MAX_SHIPS, MIN_SAIL_HULL,
    RESOURCES, SELLABLE, ALWAYS_SHOWN, BULK, TYPES, SHIP_CLASSES, CLASS_ORDER, UPGRADES, UPGRADE_KEYS,
    BUILDINGS, BUILDING_ORDER, BUILD_HOURS, MAX_BUILDERS, MAP_SIZE, SKY_TIMES, SKY_WEATHER, BUILDING_MAX_LEVEL, TRADE, START_BUILDINGS,
    getBuilding, buildingOfType, buildingLevel, buildersBusy, storageCap, sellPrice, tradePrice, buildCost, buildHours, footprint,
    buildLock, placeCheck, placeBuilding, upgradeBlock, upgradeBuilding, recipeSpeed, maxBatch, queueJob, cancelJob,
    settleProduction, settleBuildings, settle, trade, rumorFor, tripMods, foodFor, upgradeGate, repairPlanks,
    NON_CARGO, FAMILIES, SIZES, CHESTS, KEY_OF, CHEST_SIZES, TROPHIES, MONSTERS, KRAKEN_HINTS, REGIONS, REGION_ORDER,
    regionLock, revealRegion, regionSailBlock, openChest, craftCharm, cleanse, trophyBonus, tripReport,
    newGame, getShip, shipStats, typePower, durationMult, shipStatus, expeditionForShip,
    classLock, buildShip, renameShip, addShip,
    rollExpedition, rollFishing, estimate, estimateFishing, hourMs, sailBlock, dispatch, claim, claimAll, finishAllNow,
    repairCost, repair, sell, sellAll, canAfford, upgradeCost, buyUpgrade,
    migrate, sanitize, loadGame, saveGame, resetSave, mulberry32, exportSave, importSave,
  };
})();
if (typeof module !== 'undefined') module.exports = TOF;
/*CORE-END*/

</script>
<script data-module="tests.js">
/*TESTS-START*/
// ============================================================
// tests.js — runs in Node (node run-tests.js) and in the game
// (Settings → Developer mode → Run tests).
// ============================================================
function runTofTests(TOF) {
  const results = [];
  const test = (name, fn) => {
    try { fn(); results.push({ name, ok: true }); }
    catch (e) { results.push({ name, ok: false, err: e.message }); }
  };
  const eq = (a, b, msg) => { if (a !== b) throw new Error(`${msg}: expected ${b}, got ${a}`); };
  const ok = (c, msg) => { if (!c) throw new Error(msg); };
  const memStorage = () => {
    const m = new Map();
    return { getItem: k => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, String(v)), removeItem: k => m.delete(k), _m: m };
  };
  const T0 = 1700000000000, H = TOF.HOUR_MS;

  test('new game starts with one idle skiff', () => {
    const s = TOF.newGame(T0);
    eq(s.ships.length, 1, 'ships');
    eq(TOF.shipStatus(s, 'ship-1', T0), 'idle', 'status');
  });

  test('dispatch uses absolute timestamps and blocks double sailing', () => {

    } else {
      p.rect(cx - 1, 17, 3, 8, '#6b4428'); p.rect(cx + 1, 17, 1, 8, '#55351f');
      const big = kind === 'oak';
      const r = big ? 8 : 6.5, cy = big ? 10 : 12;
      p.circle(cx, cy + 1, r, '#2f6a35');
      p.circle(cx - 1, cy, r - 1, (x, y) => (hash(x, y, seed) < 0.18 ? '#3a7b3c' : '#4a9445'));
      p.circle(cx - 3, cy - 3, r * 0.45, (x, y) => (hash(x, y, seed + 1) < 0.25 ? '#4a9445' : '#69b356'));
      if (hash(seed, 1, 2) < 0.3) { p.set(cx + 2, cy - 1, '#d9483b'); p.set(cx - 4, cy + 2, '#d9483b'); }
    }
    p.outline(PAL.ink);
    p.ellipse(cx, 25, 6, 2, '#1d3a1a', 60);
    return sprite(p, cx, 25);
  }

  function lighthouse() {
    const p = new Pix(26, 60);
    const cx = 13, base = 52;
    p.rect(cx - 9, base - 2, 18, 6, '#8d8f8c'); p.rect(cx - 9, base - 2, 18, 1, '#b4b6b0'); p.rect(cx + 2, base - 1, 7, 5, '#767876');
    for (let y = base - 3; y >= 18; y--) {
      const t = (base - 3 - y) / (base - 21);
      const hw = 6.5 - t * 2;
      const band = Math.floor((base - 3 - y) / 7) % 2;
      for (let x = Math.round(cx - hw); x < Math.round(cx + hw); x++) {
        const k = x < cx - hw * 0.3 ? 1.08 : x > cx + hw * 0.35 ? 0.78 : 0.95;
        p.set(x, y, shade(band ? '#efe9df' : '#c8463c', k));
      }
    }
    p.rect(cx - 2, base - 9, 3, 6, '#4a2f1c');
    p.rect(cx - 6, 16, 12, 2, '#3b3d40'); p.rect(cx - 6, 15, 12, 1, '#5a5d61');
    p.rect(cx - 4, 9, 8, 6, '#ffe48a'); p.rect(cx - 4, 9, 1, 6, '#3b3d40'); p.rect(cx + 3, 9, 1, 6, '#3b3d40'); p.rect(cx - 1, 9, 1, 6, '#c9a64a');
    p.poly([[cx, 2], [cx + 5.5, 9], [cx - 5.5, 9]], (x) => (x < cx ? '#d0504a' : '#a83b35'));
    p.rect(cx, 0, 1, 3, '#3b3d40');
    p.outline(PAL.ink);
    return sprite(p, cx, base + 2);
  }

  const SHIP_ART = {

  function ship(dir, o, seed = 1) {
    const L = o.L, B = o.B, hullH = o.hullH || 4;
    const maxH = Math.max(...o.masts.map(m => m.h)) + 5;
    const W = Math.ceil(2 * (L + B)) + 16, H = Math.ceil(maxH + (L + B) + 14);
    const p = new Pix(W, H);
    const cx = Math.floor(W / 2), cy = Math.floor(maxH + (L + B) / 2 + 6);
    const pr = (a, b, h) => [cx + dir * (a - b), cy + dir * (a + b) / 2 - h];
    const tpl = o.shape === 'flat' ? HULL_FLAT : HULL_POINTED;
    const hullAt = (sa, sb, h) => tpl.map(([a, b]) => pr(a * L * sa, b * B * sb, h));
    // hull, stacked from the waterline up
    for (let h = 0; h < hullH; h++) {
      const k = 0.86 + h * (0.14 / Math.max(1, hullH - 1));
      p.poly(hullAt(k, k, h), h === 0 ? o.hull[0] : h <= hullH / 2 ? o.hull[1] : o.hull[2]);
    }
    p.poly(hullAt(1, 1, hullH), o.rim);
    p.poly(hullAt(0.84, 0.72, hullH), (x, y) => (y % 2 ? '#c8925a' : '#bb8550'));
    const bvis = B * dir; // the side facing the viewer
    if (o.cannons) for (let i = 0; i < o.cannons; i++) {
      const a = L * (-0.55 + 1.1 * (i + 0.5) / o.cannons);
      const q = pr(a, bvis * 0.97, hullH - 2);
      p.rect(q[0], q[1], 2, 1, '#14100c'); p.set(q[0] - 1, q[1], '#e0b44a');
    }
    const box = (a0, a1, bw, h0, h1, side, top) => {
      for (let h = h0; h < h1; h++) p.poly([pr(a0, -bw, h), pr(a1, -bw, h), pr(a1, bw, h), pr(a0, bw, h)], side);
      p.poly([pr(a0, -bw, h1), pr(a1, -bw, h1), pr(a1, bw, h1), pr(a0, bw, h1)], top);
    };
    if (o.castle) box(o.castle.from * L * 0.88, o.castle.to * L, B * 0.82, hullH, hullH + o.castle.h, o.hull[2], o.rim);
    if (o.cabin) {
      box(o.cabin.a0, o.cabin.a1, B * 0.5, hullH, hullH + o.cabin.h, '#e8e2d5', '#c8463c');
      const w = pr((o.cabin.a0 + o.cabin.a1) / 2, bvis * 0.5, hullH + o.cabin.h - 3);
      p.rect(w[0] - 1, w[1], 3, 2, '#3b4b5e');
    }
    if (o.crates) for (let i = 0; i < o.crates; i++) {
      const q = pr(-L * 0.45 + i * 3.2, (i % 2 ? 1 : -1) * B * 0.25, hullH + 1);
      p.rect(q[0] - 2, q[1] - 2, 4, 3, '#7c5131'); p.rect(q[0] - 1, q[1] - 3, 2, 1, i % 2 ? '#e0b44a' : '#9cc3d6');
    }
    if (o.nets) for (let a = -L * 0.85; a < -L * 0.35; a += 1) for (let b = -B * 0.6; b < B * 0.6; b += 1) {
      if ((Math.round(a) + Math.round(b)) % 2 === 0) { const q = pr(a, b, hullH + 1); p.set(q[0], q[1], '#4f8f5a'); }
    }
    // masts and sails, far to near
    const masts = [...o.masts].sort((m1, m2) => dir * (m1.a - m2.a));
    const sc = o.sailC || ['#f6efdc', '#ece2c8', '#d8ccb0'];
    for (const m of masts) {
      const base = pr(m.a, 0, hullH), top = pr(m.a, 0, m.h);
      p.rect(base[0], top[1], 2, base[1] - top[1], '#5e3b22');
      if (m.rig === 'gaff') {
        p.poly([pr(m.a - 0.5, 0, m.h - 3), pr(m.a + m.boom * 0.8, 0, m.h - 8), pr(m.a + m.boom, 0, hullH + 4), pr(m.a - 0.5, 0, hullH + 4)],
          (x, y) => (y % 4 === 0 ? sc[2] : (dir * (x - base[0]) < -5 ? sc[0] : sc[1])));
      } else if (m.rig === 'square') {
        const lo = hullH + 6, hi = m.h - 2, n = m.sails, band = (hi - lo) / n;
        for (let k = 0; k < n; k++) {
          const b0 = lo + k * band + 1, b1 = lo + (k + 1) * band - 1, w = m.w * (1 - k * 0.12);
          p.poly([pr(m.a, -w, b1), pr(m.a, w, b1), pr(m.a, w, b0), pr(m.a, -w, b0)], (x, y) => {
            const t = (x - (base[0] - w)) / (2 * w);
            if (m.stripe && Math.floor(t * 6) % 2 === 1) return m.stripe;
            return y % 3 === 0 ? sc[2] : t < 0.45 ? sc[0] : sc[1];
          });
          const y0 = pr(m.a, -w, b1), y1 = pr(m.a, w, b1);
          p.line(y0[0], y0[1], y1[0], y1[1], '#5e3b22');
        }
      } else if (m.rig === 'lateen') {
        p.poly([pr(m.a + 7, 0, hullH + 5), pr(m.a - 9, 0, m.h), pr(m.a - 6, 0, hullH + 5)], (x, y) => {
          if (o.cross && Math.abs(y - (pr(m.a, 0, (hullH + m.h) / 2)[1])) < 1.5) return o.cross;
          return y % 4 === 0 ? sc[2] : sc[0];
        });
        const y0 = pr(m.a + 8, 0, hullH + 4), y1 = pr(m.a - 10, 0, m.h + 1);
        p.line(y0[0], y0[1], y1[0], y1[1], '#5e3b22');
      }
    }
    if (o.jib) {
      const fm = o.masts.reduce((x, y) => (y.a > x.a ? y : x));
      p.poly([pr(fm.a + 0.8, 0, fm.h - 2), pr(L * 0.95, 0, hullH + 2), pr(fm.a + 1.5, 0, hullH + 3)], (x, y) => (y % 4 === 0 ? sc[2] : sc[1]));
    }
    if (o.crane) {
      const b0 = pr(L * 0.45, 0, hullH), b1 = pr(L * 0.45, 0, hullH + 16), tip = pr(L * 0.95, 0, hullH + 18);
      p.rect(b0[0], b1[1], 2, b0[1] - b1[1], '#e0b44a');
      p.line(b1[0], b1[1], tip[0], tip[1], '#e0b44a');
      p.line(tip[0], tip[1], tip[0], tip[1] + 9, '#3b3d40');
      p.rect(tip[0] - 1, tip[1] + 9, 3, 2, '#3b3d40');
    }
    const tallest = o.masts.reduce((x, y) => (y.h > x.h ? y : x));
    const fq = pr(tallest.a, 0, tallest.h);
    p.rect(dir > 0 ? fq[0] - 3 : fq[0] + 2, fq[1], 3, 2, o.flag);
    if (o.glow) for (let i = 0; i < 26; i++) {
      const x = Math.floor(hash(i, seed, 41) * W), y = Math.floor(hash(i, seed, 42) * (cy - 4));
      if (p.a(x, y)) p.set(x, y, '#e8f8ff');
    }
    p.outline(PAL.ink);
    const s = sprite(p, cx, cy);
    s.top = maxH; s.len = L + B;
    return s;
  }

  function cropURL(s) {
    let x0 = s.w, y0 = s.h, x1 = 0, y1 = 0;
    for (let y = 0; y < s.h; y++) for (let x = 0; x < s.w; x++) if (s.hit[y * s.w + x]) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    const c = document.createElement('canvas'); c.width = x1 - x0 + 3; c.height = y1 - y0 + 3;
    c.getContext('2d').drawImage(s.canvas, x0 - 1, y0 - 1, c.width, c.height, 0, 0, c.width, c.height);
    return c.toDataURL();
  }

  function ripple(frame, len = 18) {
    const W = Math.ceil(len * 2.2) + 6, p = new Pix(W, 16);
    const r = len + frame, ry = len * 0.38 + frame * 0.4;
    for (let a = 0; a < Math.PI * 2; a += 0.03) {
      const x = W / 2 + Math.cos(a) * r, y = 8 + Math.sin(a) * ry;
      if (Math.sin(a) > -0.2) p.set(x, y, '#cdeefc', 200);
    }
    return sprite(p, Math.floor(W / 2), 8);
  }

  function yardColor(kind, x, y) {
    const n = hash(x, y, 33);
    if (kind === 'cobble') { const row = (y / 3) | 0, off = (row & 1) * 3; if (y % 3 === 0 || (x + off) % 6 === 0) return '#7a756d'; return hash((x + off) / 6 | 0, row, 3) < 0.5 ? '#aaa69e' : '#9b968e'; }
    if (kind === 'planks') return (x + 2 * y) % 7 === 0 ? '#6e4627' : n < 0.5 ? '#a8774a' : '#9a6a40';
    if (kind === 'sawdust') return n < 0.3 ? '#c9a46a' : n < 0.6 ? '#b8935c' : '#9a7048';
    if (kind === 'grass') return null;
    return n < 0.25 ? '#8a6640' : n < 0.7 ? '#9a7450' : '#a8825c';
  }

  function composeBuilding(type, level) {
    const spec = COMP[type](level);
    const [fw, fd] = { tavern: [3, 3], dockyard: [3, 2], warehouse: [3, 2], ropemaker: [3, 2], shipwright: [2, 3] }[type] || [2, 2];
    let maxH = 0;
    for (const it of spec.items) if (!it.prop) maxH = Math.max(maxH, (it.z0 || 0) + it.wall + it.roof + (it.flag ? 16 : 0) + (it.chimney ? 14 : 0));
    maxH = Math.max(maxH + 8, 40);
    const W = (fw + fd) * HW + 20, H = (fw + fd) * HH + maxH + 8;
    const p = new Pix(W, H);
    const tx = 6 + fd * HW, ty = maxH;
    const pt = (u, v) => [tx + (u - v) * HW, ty + (u + v) * HH];
    const items = spec.items.map(it => ({ ...it, depth: it.prop ? it.u + it.v : it.late ? 99 : it.u + it.fw * 0.5 + it.v + it.fd * 0.5 + 0.5 }));
    items.sort((a, b) => a.depth - b.depth);
    const smoke = [];
    for (const it of items) {
      if (it.prop) PROPS[it.prop](p, pt(it.u, it.v), it.o);
      else { const r = drawBlock(p, ...pt(it.u, it.v), it); smoke.push(...r.smoke); }
    }
    p.outline(PAL.ink);
    const G = { t: pt(0, 0), r: pt(fw, 0), b: pt(fw, fd), l: pt(0, fd) };
    const inset = (q, c) => [q[0] + (c[0] - q[0]) * 0.04, q[1] + (c[1] - q[1]) * 0.04];
    const ctr = pt(fw / 2, fd / 2);
    p.poly([inset(G.t, ctr), inset(G.r, ctr), inset(G.b, ctr), inset(G.l, ctr)], (x, y) => (p.a(x, y) ? null : yardColor(spec.yard, x, y)));
    const s = sprite(p, G.b[0], G.b[1]);
    s.smoke = smoke.map(([x, y]) => [x - G.b[0], y - G.b[1]]);
    s.emit = emissive(p);
    return s;
  }

  // --- the lighthouse on its rocky islet ---
  function lighthouseIslet() {
    const W = 118, H = 140, p = new Pix(W, H);
    const cx = 58, gy = 104; // islet top surface centre
    // islet: irregular iso blob, extruded downwards as rock
    const R = (a) => 1 + 0.18 * Math.sin(a * 3 + 1) + 0.1 * Math.sin(a * 5 + 2);
    const blob = (rx, ry, dy) => { const pts = []; for (let a = 0; a < Math.PI * 2; a += 0.15) pts.push([cx + Math.cos(a) * rx * R(a), gy + dy + Math.sin(a) * ry * R(a)]); return pts; };
    for (let h = 12; h >= 1; h--) p.poly(blob(46 - h * 0.6, 21 - h * 0.25, h), (x, y) => { const n = hash(x >> 1, y >> 1, 21); return h > 8 ? '#3f4245' : n < 0.3 ? '#5b5e60' : n < 0.7 ? '#6b6e70' : '#7b7e7f'; });
    p.poly(blob(46, 21, 0), (x, y) => { const n = hash(x >> 1, y >> 1, 22); const d = Math.hypot((x - cx) / 46, (y - gy) / 21); if (d > 0.82) return n < 0.5 ? '#8d8f8c' : '#9fa19c'; return n < 0.06 ? '#93cc63' : n < 0.5 ? '#6aad4a' : '#5fa043'; });
    // boulders round the rim
    const boulders = [[-40, 4, 7], [-30, 13, 6], [-12, 19, 7], [10, 19, 6], [30, 13, 7], [41, 3, 6], [36, -9, 5], [-38, -8, 5]];
    for (const [dx, dy, r] of boulders) { p.ellipse(cx + dx, gy + dy, r, r * 0.6, '#6b6e70'); p.ellipse(cx + dx - 1, gy + dy - 1.5, r * 0.7, r * 0.4, '#8d8f8c'); p.set(cx + dx - 2, gy + dy - 2, '#b9bbb5'); }
    // keeper's pier (lower left) and crates
    p.poly([[cx - 30, gy + 6], [cx - 52, gy + 17], [cx - 46, gy + 20], [cx - 24, gy + 9]], (x, y) => ((x + y * 2) % 5 === 0 ? '#5c3a22' : '#b07a47'));
    for (const [px_, py_] of [[-50, 18], [-44, 21], [-36, 13]]) p.rect(cx + px_, gy + py_, 2, 5, '#5e3b22');
    PROPS.crates(p, [cx - 27, gy + 6], { n: 2 });
    PROPS.barrels(p, [cx + 22, gy + 4], { n: 2 });
    // stone plinth (octagonal-ish)
    p.ellipse(cx, gy - 2, 15, 7.5, '#6a665f');
    for (let h = 0; h < 7; h++) p.ellipse(cx, gy - 2 - h, 14, 7, h < 6 ? (h % 3 === 0 ? '#8a857c' : '#a9a397') : '#c4bfb3');
    for (let x = -13; x <= 13; x += 4) p.set(cx + x, gy - 2 + Math.sqrt(Math.max(0, 1 - (x / 14) ** 2)) * 7 - 3, '#77736c');
    // tower body: curved bands, cylinder shading, taper
    const base = gy - 8, Ht = 64, r0 = 10.5, r1 = 7.5;
    for (let y = base - Ht - 6; y <= base + 6; y++) for (let x = cx - 12; x <= cx + 12; x++) {
      const dx = x + 0.5 - cx;
      const zApprox = base - y;
      const r = r0 - (r0 - r1) * Math.max(0, Math.min(1, zApprox / Ht));
      if (Math.abs(dx) > r) continue;
      const curve = Math.sqrt(1 - (dx / r) ** 2) * r * 0.5;
      const z = base + curve - (y + 0.5);
      if (z < 0 || z > Ht) continue;
      const band = Math.floor(z / 9) % 2;
      const lightK = 0.62 + 0.5 * Math.max(0, Math.cos(Math.atan2(dx / r, Math.sqrt(Math.max(0, 1 - (dx / r) ** 2))) + 0.6));
      let col = band ? '#f1ebe0' : '#cc4a3f';
      if ((z % 9) < 0.9) col = shade(col, 0.8);
      p.set(x, y, shade(col, Math.min(1.12, lightK)));
    }
    const at = (dx, z, rr) => [cx + dx, base + Math.sqrt(Math.max(0, 1 - (dx / rr) ** 2)) * rr * 0.5 - z];
    // door and windows
    const d0 = at(-2, 0, r0); p.rect(d0[0], d0[1] - 9, 5, 9, '#4a2f1c'); p.rect(d0[0] + 1, d0[1] - 8, 3, 8, '#6b4428'); p.set(d0[0] + 3, d0[1] - 4, '#e0b44a'); p.rect(d0[0] - 1, d0[1] - 10, 7, 1, '#c4bfb3');
    for (const z of [24, 42]) { const w = at(-1, z, r0 - 1.5); p.rect(w[0], w[1] - 4, 3, 4, '#2a3a4e'); p.rect(w[0], w[1] - 4, 3, 1, '#c4bfb3'); p.set(w[0] + 1, w[1] - 2, '#f2c75c'); }
    // gallery deck + railing
    const gz = base - Ht;
    p.ellipse(cx, gz + 1, 12.5, 5.5, '#3b3d40'); p.ellipse(cx, gz, 12, 5, '#5a5d61'); p.ellipse(cx, gz - 1, 11, 4.4, '#6e7177');
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 9) { const x = cx + Math.cos(a) * 11.5, y = gz - 1 + Math.sin(a) * 4.8; if (Math.sin(a) > -0.2) p.rect(x, y - 5, 1, 5, '#2f3236'); }
    for (let a = 0; a < Math.PI; a += 0.05) p.set(cx + Math.cos(a) * 11.5, gz - 6 + Math.sin(a) * 4.8, '#2f3236');
    // lantern room: glass panes with mullions
    for (let y = gz - 15; y <= gz - 2; y++) for (let x = cx - 6; x <= cx + 6; x++) {
      const dx = x + 0.5 - cx; if (Math.abs(dx) > 6.2) continue;
      const mull = Math.abs(dx) < 0.6 || Math.abs(Math.abs(dx) - 4) < 0.6;
      p.set(x, y, mull ? '#3b3d40' : (y < gz - 11 ? '#fff6c8' : '#ffe48a'));
    }

<script data-module="sky.js">
// ============================================================
// sky.js — time of day from the device clock, and weather.
// Live weather comes from Open-Meteo (free, no key) wherever the page

// ============================================================
const Sky = (() => {
  'use strict';
  const CACHE_KEY = 'tidesOfFortune.weather';
  const CACHE_MS = 30 * 60 * 1000;
  const KINDS = ['sunny', 'rainy', 'snowy', 'foggy'];
  let settings = { time: 'live', weather: 'live', place: null };
  let live = null;            // { kind, intensity, storm, cloudy, code, temp, sunrise, sunset, place, at }
  let status = { state: 'idle', text: '' };
  let listeners = [];

  const clamp01 = x => Math.max(0, Math.min(1, x));
  const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
