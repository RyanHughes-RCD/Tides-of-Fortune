  const DOCK_LEN = 5;
  const DOCKS = [11, 15, 23, 27, 31].map((row, i) => ({ i, row, x0: coastAt(row), x1: coastAt(row) + DOCK_LEN - 1 }));
  const BERTHS = [];
  for (const d of DOCKS) for (const side of [-1, 1]) BERTHS.push({ gx: d.x0 + 3, gy: d.row + side, lane: d.row + side, dock: d.i });
  const ISLET = { gx: 36, gy: 19 }; // far out in the bay (1.4), between the shipping lanes of rows 16 and 22
  // Decorative homes. Working buildings live in the save and are drawn by syncBuildings().
  const BUILDINGS = [
    { key: 'chapel', gx: 3, gy: 1, fw: 3, fd: 2, name: 'Chapel' },
    { key: 'houseRed', gx: 6, gy: 2, fw: 2, fd: 2, name: 'Cottage' },
    { key: 'houseBlue', gx: 11, gy: 2, fw: 2, fd: 2, name: 'Cottage' },
    { key: 'housePurple', gx: 14, gy: 1, fw: 2, fd: 2, name: 'Cottage' },
    { key: 'houseGreen', gx: 10, gy: 8, fw: 2, fd: 2, name: 'Cottage' },
    { key: 'houseOrange', gx: 2, gy: 14, fw: 2, fd: 2, name: 'Cottage' },
    { key: 'houseTeal', gx: 10, gy: 14, fw: 2, fd: 2, name: 'Cottage' },
    { key: 'houseRed', gx: 5, gy: 19, fw: 2, fd: 2, name: 'Cottage' },
    { key: 'houseBlue', gx: 10, gy: 19, fw: 2, fd: 2, name: 'Cottage' },
  ];

  const map = [];
  let blocked = [];
  function buildMap() {
    for (let gy = 0; gy < N; gy++) { map[gy] = []; for (let gx = 0; gx < N; gx++) map[gy][gx] = isWater(gx, gy) ? T.WATER : T.GRASS; }

      if (map[gy][gx] !== T.GRASS) continue;
      const nearWater = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => { const x = gx + dx, y = gy + dy; return x >= 0 && y >= 0 && x < N && y < N && map[y][x] === T.WATER; });
      if (nearWater) map[gy][gx] = T.SAND;
    }
    // roads
    for (let gx = 1; gx <= 19; gx++) if (land(gx, 6)) set(gx, 6, T.ROAD);
    for (let gy = 1; gy <= 25; gy++) set(9, gy, T.ROAD);
    for (let gx = 9; gx <= 15; gx++) set(gx, 11, T.ROAD);
    for (let gx = 2; gx <= 9; gx++) set(gx, 17, T.ROAD);
    for (let gx = 9; gx <= 13; gx++) set(gx, 22, T.ROAD);
    for (let gy = 5; gy <= 7; gy++) for (let gx = 8; gx <= 10; gx++) set(gx, gy, T.ROAD);
    for (let gy = 12; gy <= 15; gy++) set(14, gy, T.ROAD);
    set(15, 15, T.ROAD);
    // newer roads only go where no player building already stands
    const free = (gx, gy) => !blocked.some(f => gx >= f.gx && gy >= f.gy && gx < f.gx + f.fw && gy < f.gy + f.fd);
    const opt = (gx, gy) => { if (land(gx, gy) && free(gx, gy)) set(gx, gy, T.ROAD); };
    for (let gy = 26; gy <= N - 4; gy++) opt(9, gy);
    // roads into the southern peninsula (1.4)
    for (let gx = 3; gx < coastAt(38) - 1; gx++) opt(gx, 38);
    for (let gx = 9; gx < coastAt(43) - 1; gx++) opt(gx, 43);
    for (let gy = 38; gy <= 43; gy++) opt(15, gy);
    for (let gx = 3; gx <= 13; gx++) opt(gx, 30);
    for (const row of [27, 31]) for (let gx = 10; gx < coastAt(row); gx++) opt(gx, row);
    // jetties
    for (const d of DOCKS) for (let gx = d.x0; gx <= d.x1; gx++) set(gx, d.row, T.DOCK);
    // field
    for (let gy = 1; gy <= 4; gy++) for (let gx = 17; gx <= 20; gx++) set(gx, gy, T.FIELD);
  }

  // ---------- the land and sea beyond the map ----------
  // The terrain image covers a rectangle as wide as the map and PAD taller at the top and bottom, so a
  // tall phone screen never shows an empty void: the coast, forest and open sea simply carry on.
  // Tiles outside the 40x40 map are scenery only (nothing can be built there).
  const PAD = 260, M = 40, EN = N + 2 * M;
  const ext = [];  // ext[gy + M][gx + M] -> tile type, for every tile in or near the picture
  let wd = [], ld = []; // water: tiles to the nearest land; land: tiles to the nearest water
  const inMap = (gx, gy) => gx >= 0 && gy >= 0 && gx < N && gy < N;
  function typeAt(gx, gy) {
    if (inMap(gx, gy)) return map[gy][gx];
    const r = ext[gy + M];
    return r && r[gx + M] !== undefined ? r[gx + M] : (isWater(gx, gy) ? T.WATER : T.GRASS);
  }
  const wet = t => t === T.WATER || t === T.DOCK;
  function buildExt() {
    for (let y = 0; y < EN; y++) { ext[y] = []; for (let x = 0; x < EN; x++) { const gx = x - M, gy = y - M; ext[y][x] = inMap(gx, gy) ? map[gy][gx] : (isWater(gx, gy) ? T.WATER : T.GRASS); } }
    for (let y = 0; y < EN; y++) for (let x = 0; x < EN; x++) {
      if (inMap(x - M, y - M) || ext[y][x] !== T.GRASS) continue;
      if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => ext[y + dy] && ext[y + dy][x + dx] === T.WATER)) ext[y][x] = T.SAND;
    }
    const bfs = (isSrc) => {
      const d = ext.map(r => r.map(t => (isSrc(t) ? 0 : 999))), q = [];
      for (let y = 0; y < EN; y++) for (let x = 0; x < EN; x++) if (!d[y][x]) q.push(x, y);
      for (let i = 0; i < q.length; i += 2) {
        const x = q[i], y = q[i + 1];
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const a = x + dx, b = y + dy;
          if (a < 0 || b < 0 || a >= EN || b >= EN || d[b][a] <= d[y][x] + 1) continue;
          d[b][a] = d[y][x] + 1; q.push(a, b);
        }
      }
      return d;
    };
    wd = bfs(t => !wet(t));
    ld = bfs(t => t === T.WATER);
  }
  const wDist = (gx, gy) => { const r = wd[gy + M]; return r && r[gx + M] !== undefined ? r[gx + M] : 99; };
  const lDist = (gx, gy) => { const r = ld[gy + M]; return r && r[gx + M] !== undefined ? r[gx + M] : 99; };

  // ---------- terrain pixels ----------
  const OX = N * HW, OY = PAD; // ground image offset (world x = px - OX, world y = py - OY)
  const GW = N * HW * 2, GH = N * HH * 2 + 2 * PAD;
  const halfW = y => (y < 8 ? 2 * (y + 1) : 2 * (15 - y));
  function forTilePixels(gx, gy, fn) {
    const t = isoTop(gx, gy);
    for (let ly = 0; ly < 16; ly++) {
      const hw = halfW(ly);
      for (let lx = 16 - hw; lx < 16 + hw; lx++) {
        const X = t.x - 16 + lx + OX, Y = t.y + ly + OY;
        const u = (ly / HH + (lx - 16) / HW) / 2, v = (ly / HH - (lx - 16) / HW) / 2;
        fn(X, Y, u, v);
      }
    }
  }
  function landColor(t, X, Y, gx, gy, u, v) {
    switch (t) {
      case T.GRASS: case T.SAND: {
        if (t === T.SAND) { const n = hash(X, Y, 4); return n < 0.15 ? PAL.sand2 : n < 0.9 ? PAL.sand1 : PAL.sand3; }
        const n = hash(X, Y, 1);
        if (n < 0.012) return [PAL.flower1, PAL.flower2, PAL.flower3][(hash(X, Y, 9) * 3) | 0];
        if (n < 0.06) return PAL.grassHi;
        if (n < 0.1) return PAL.grassDk;
        const m = hash(X >> 3, Y >> 2, 2);
        return m < 0.35 ? PAL.grassA : m < 0.8 ? PAL.grassB : PAL.grassC;
      }
      case T.ROAD: {
        const row = (Y / 3) | 0, off = (row & 1) * 3, col = ((X + off) / 6) | 0;
        if (Y % 3 === 0 || (X + off) % 6 === 0) return PAL.mortar;
        if (Y % 3 === 1 && (X + off) % 6 === 1) return PAL.cobHi;
        const n = hash(col, row, 3);
        return n < 0.33 ? PAL.cob1 : n < 0.66 ? PAL.cob2 : PAL.cob3;
      }
      case T.FIELD: {

        return hash(X, Y, 7) < 0.35 ? PAL.crop2 : PAL.crop1;
      }
      case T.ROCK: { const n = hash(X >> 1, Y >> 1, 8); return n < 0.3 ? PAL.rock2 : n < 0.8 ? PAL.rock1 : PAL.rock3; }
      case T.DOCK: {
        const P = (gx + u) * 6, p = Math.floor(P);
        if (P - p < 0.17) return PAL.plankGap;
        if (gx !== 20 && (v < 0.06 || v > 0.94)) return '#7c5131';
        if (gx === 20 && (u < 0.06 || u > 0.94)) return '#7c5131';
        const n = hash(p, gy, 5);
        return hash(X, Y, 10) < 0.05 ? '#8d5f38' : (n < 0.33 ? PAL.plank1 : n < 0.66 ? PAL.plank2 : PAL.plank3);
      }
    }
    return PAL.grassA;
  }

      } else ctx.drawImage(t.canvas, dx, dy);
      // Halloween dressing goes over the building, never into it, and only while the event runs
      if (eventOn && o.kind === 'building' && o.haunt != null && !o.squash) { const ov = Art.hauntOverlay(t, o.haunt); if (ov) ctx.drawImage(ov.canvas, dx, dy); }

      if (o.lighthouse && snowCover > 0.01) { const sn = TEX[o.tex + 'Snow']; ctx.globalAlpha = (o.alpha ?? 1) * snowCover; ctx.drawImage(sn.canvas, dx, dy); }

      const k = p.life / p.max, r = 1.5 + k * 3;

    for (const o of bObjs.values()) {
      const t = TEX[o.tex]; if (!t) continue;
      const top = o.y - t.ay + 4;
      const bar = (frac, col, dy) => {
        const w = 22, x = Math.round(o.x - (o.fw - o.fd) * 4 - w / 2), y = Math.round(top + dy);

    for (const o of ships.values()) {

  // ---------- sky: light, glow and weather ----------
  let sky = Sky.current(Date.now());
  let snowCover = 0, flash = 0, nextFlash = 5, lowPower = false, cropT = 0, cropRipe = false;
  const rings = [], drops = [], flakes = [], fogBlobs = [], clouds = [];
  for (let i = 0; i < 6; i++) clouds.push({ x: -N * HW + i * 230, y: 60 + (i * 137) % (N * HH * 2), rx: 60 + (i % 3) * 30, v: 6 + (i % 3) * 2 });
  for (let i = 0; i < 7; i++) fogBlobs.push({ x: Math.random(), y: Math.random(), r: 0.35 + Math.random() * 0.3, v: 0.004 + Math.random() * 0.006 });

  function updateSky(dt) {
    sky = krakenSky(Sky.current(Date.now()), krMood);
    const w = sky.weather;
    snowCover += ((w.kind === 'snowy' ? 1 : 0) - snowCover) * Math.min(1, dt * 0.6);
    for (const c of clouds) { c.x += c.v * dt; if (c.x > N * HW + 120) c.x = -N * HW - 120; }
    for (const f of fogBlobs) { f.x += f.v * dt; if (f.x > 1.4) f.x = -0.4; }
    const W = canvas.width, H = canvas.height;
    // rain
    const wantDrops = w.kind === 'rainy' ? Math.floor(w.intensity * W * H / (lowPower ? 16000 : 7000)) : 0;
    while (drops.length < wantDrops) drops.push({ x: Math.random() * W, y: Math.random() * H, l: (8 + Math.random() * 8) * dpr, v: (900 + Math.random() * 500) * dpr });
    if (drops.length > wantDrops) drops.length = wantDrops;
    for (const d of drops) { d.y += d.v * dt; d.x -= d.v * 0.18 * dt; if (d.y > H) { d.y = -d.l; d.x = Math.random() * (W + 200); } }
    if (w.kind === 'rainy') {
      for (let i = 0; i < w.intensity * 40 * dt * 10; i++) {
        const p = toWorld(Math.random() * W / dpr, Math.random() * H / dpr);
        const gx = Math.floor((p.y / HH + p.x / HW) / 2), gy = Math.floor((p.y / HH - p.x / HW) / 2);
        if (typeAt(gx, gy) === T.WATER) rings.push({ x: p.x, y: p.y, t: 0 });
      }
    }
    for (let i = rings.length - 1; i >= 0; i--) { rings[i].t += dt; if (rings[i].t > 0.7) rings.splice(i, 1); }
    if (rings.length > 400) rings.splice(0, rings.length - 400);
    // snow
    const wantFlakes = w.kind === 'snowy' ? Math.floor(w.intensity * W * H / (lowPower ? 20000 : 9000)) : 0;
    while (flakes.length < wantFlakes) flakes.push({ x: Math.random() * W, y: Math.random() * H, r: (1 + Math.random() * 1.6) * dpr, v: (40 + Math.random() * 60) * dpr, ph: Math.random() * 6 });
    if (flakes.length > wantFlakes) flakes.length = wantFlakes;
    for (const f of flakes) { f.y += f.v * dt; f.x += Math.sin(time * 1.3 + f.ph) * 18 * dpr * dt; if (f.y > H) { f.y = -4; f.x = Math.random() * W; } }

    if (typeof Sound !== 'undefined') Sound.update(sky, time);
    // fewer villagers out after dark or in heavy weather
    // (1.7) as the kraken draws near the town goes indoors, a few at a time, fading out at their doors; the witch stays
    const kh = krView ? (krView.phase === 'rising' ? krView.hours : krView.phase === 'emerged' ? 10 : krView.phase === 'dead' ? (Date.now() - krView.deadAt > 3600000 ? -1 : 10) : -1) : -1;
    const keep = kh < 2 ? 99 : kh >= 6 ? 0 : Math.round(villagers.length * (1 - (kh - 2) / 4));
    villagers.forEach((v, i) => {
      const off = v.look !== 'witch' && ((i >= 3 && (sky.dark > 0.6 || (w.kind !== 'sunny' && w.intensity > 0.6))) || i >= keep);
      v.alpha = Math.max(0, Math.min(1, (v.alpha ?? 1) + (off ? -dt : dt) * 0.8)); v.hidden = v.alpha <= 0.01;

    if (cropT <= 0 && getState()) {

      const on = TOF.halloweenActive(getState(), Date.now());
      if (on !== eventOn) { eventOn = on; syncGhostShip(getState()); }
      const c = TOF.cropState(getState(), Date.now());
      const stage = c.ripe ? 3 : c.progress < 0.15 ? 0 : c.progress < 0.55 ? 1 : 2;

    }
  }

  function renderSky(W, H, s, tx, ty) {
    const w = sky.weather;
    // 1) light: multiply the whole frame by the sky tint
    const [r, g, b] = sky.tint;
    if (r < 254 || g < 254 || b < 254) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = `rgb(${r},${g},${b})`; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'source-over';
    }
    // 2) glow: windows, lamps, forges and the lighthouse shine through the dark
    if (sky.lights > 0.02) {
      ctx.setTransform(s, 0, 0, s, tx, ty);
      ctx.globalAlpha = sky.lights;
      for (const o of objects) {
        if (o.hidden || !o.tex) continue;
        const t = TEX[o.tex]; if (!t) continue;
        if (t.emit) ctx.drawImage(t.emit, Math.round(o.x - t.ax), Math.round(o.y - t.ay));
        if (eventOn && o.kind === 'building' && o.haunt != null) { const ov = Art.hauntOverlay(t, o.haunt); if (ov && ov.emit) ctx.drawImage(ov.emit, Math.round(o.x - t.ax), Math.round(o.y - t.ay)); }
      }
      ctx.globalCompositeOperation = 'lighter';

        gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`);
        ctx.fillStyle = gr; ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
      };
      for (const o of objects) {
        if (o.hidden) continue;
        if (o.tex === 'lamp') halo(o.x, o.y - 15, 26, 0.35 * sky.lights, '255,200,120');
        else if (o.decorType === 'harborLantern') { for (const sx of [-8, 8]) halo(o.x + sx, o.y - 33, 26, 0.4 * sky.lights, '255,214,130'); }
        else if (o.decorType === 'festoon') halo(o.x, o.y - 24, 30, 0.3 * sky.lights, '255,170,120');
        else if (o.decorType === 'hwLantern' || o.decorType === 'hwCauldron' || o.decorType === 'hwJackSpooky') halo(o.x, o.y - (o.decorType === 'hwLantern' ? 20 : 10), 22, 0.4 * sky.lights, '150,255,110');
        else if (o.decorType === 'hwJackClassic' || o.decorType === 'hwJackSilly') halo(o.x, o.y - 6, 18, 0.4 * sky.lights, '255,170,80');
        else if (o === cauldronObj) { halo(o.x, o.y - 42, 62, 0.5 * sky.lights, '150,255,110'); halo(o.x, o.y, 36, 0.55 * sky.lights, '255,150,60'); }
        else if (o.kind === 'ghostship') halo(o.x, o.y - 20, 60, 0.45 * sky.lights * (o.alpha || 0), '140,255,190');
        else if (eventOn && o.kind === 'building' && o.haunt === 2) halo(o.x - (o.fw - o.fd) * 4, o.y - 18, 34, 0.25 * sky.lights, ['255,140,60', '200,120,255', '150,255,110'][(Math.floor(time / 2 + Math.abs(o.x)) % 3 + 3) % 3]);
        else if (o.kind === 'ship' && o.alpha > 0.5) halo(o.x - 6, o.y - 8, 12, 0.3 * sky.lights, '255,190,110');
        else if (o.kind === 'building' && o.tex && o.tex.startsWith('bld_')) halo(o.x - (o.fw - o.fd) * 4, o.y - 10, 30, 0.12 * sky.lights, '255,190,120');
        else if (o.lighthouse && TEX[o.tex].lamp) {
          const t = TEX[o.tex], lx = o.x + t.lamp[0], ly = o.y + t.lamp[1], fl = KZ.lampFlicker();
          halo(lx, ly, 46, 0.55 * sky.lights * fl, '255,236,170');
          // sweeping beam
          for (const off of [0, Math.PI]) {
            const a = time * 0.55 + off, L = 260;
            const ex = lx + Math.cos(a) * L, ey = ly + Math.sin(a) * L * 0.5;
            const px = -Math.sin(a) * 26, py = Math.cos(a) * 13;
            const gr = ctx.createLinearGradient(lx, ly, ex, ey);
            gr.addColorStop(0, `rgba(255,236,170,${0.32 * sky.lights * fl})`); gr.addColorStop(1, 'rgba(255,236,170,0)');

      }
      if (krP) { ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; KZ.drawLights(ctx, krP); ctx.globalCompositeOperation = 'lighter'; }

      const lore = (getState() && getState().lore && getState().lore.kraken) || 0;
      if (lore >= 3 && sky.dark > 0.6) {

          ctx.globalAlpha = 0.35 * open; ctx.fillStyle = '#5a0c14';

            ctx.globalAlpha = open; ctx.fillStyle = '#ffe25a'; ctx.fillRect(Math.round(x - 1), Math.round(y - Math.max(0.5, open * 1.5)), 2, Math.max(1, Math.round(open * 3)));

  }

  // ---------- camera & input ----------
  const pointers = new Map();
  let gesture = null;
  // Never zoom out past the edge of the terrain picture, so the screen is always filled.
  const minScale = () => Math.max(1, Math.ceil(Math.max(canvas.width / GW, canvas.height / GH) * 100) / 100);
  const maxScale = () => 5 * dpr;
  function clampCam() {
    cam.scale = Math.min(maxScale(), Math.max(minScale(), cam.scale));
    // The view may roam anywhere inside the terrain picture: the village's top and bottom rows can be
    // panned right to the screen edges (and past them), and the scenery beyond keeps the screen full.
    const halfW = canvas.width / 2 / cam.scale, halfH = canvas.height / 2 / cam.scale;
    const lim = (v, lo, hi) => (lo > hi ? (lo + hi) / 2 : Math.min(hi, Math.max(lo, v)));

  const toWorld = (sx, sy) => ({ x: cam.x + (sx * dpr - canvas.width / 2) / cam.scale, y: cam.y + (sy * dpr - canvas.height / 2) / cam.scale });
  function zoomAt(sx, sy, newScale) {
    const before = toWorld(sx, sy);

    const after = toWorld(sx, sy);

    const target = Math.max(1, Math.round(cam.scale));

  }

  function onDown(e) {
    try { canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety; dragging works without it */ }

    } else if (pointers.size === 2) {

      gesture.dist = Math.hypot(a.x - b.x, a.y - b.y) || 1; gesture.scale = cam.scale;

  }

    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId), p = rel(e);
    pointers.set(e.pointerId, p);
    if (pointers.size >= 2 && gesture && gesture.type === 'pinch') {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      zoomAt(mx, my, gesture.scale * d / gesture.dist);
      // pan with the midpoint too
      const pm = { x: mx - (p.x - prev.x) / 2, y: my - (p.y - prev.y) / 2 };
      cam.x -= (mx - pm.x) * dpr / cam.scale; cam.y -= (my - pm.y) * dpr / cam.scale;

      const dx = p.x - prev.x, dy = p.y - prev.y;
      gesture.moved += Math.abs(dx) + Math.abs(dy);

    const p = rel(e);

    if (pointers.size === 0) {
      if (!gesture.pinched && gesture.moved < 10) tapAt(p.x, p.y);
      if (gesture.pinched) snapZoom(p.x, p.y);

  function onWheel(e) {
    e.preventDefault();
    const p = rel(e);
    const step = e.deltaY > 0 ? -1 : 1;
    zoomAt(p.x, p.y, Math.max(1, Math.round(cam.scale) + step));
  }

  function hitTest(wx, wy) {
    const sorted = objects.filter(o => o.tap && !o.hidden).sort((a, b) => b.depth - a.depth);
    for (const o of sorted) {
      const t = TEX[o.tex];
      const lx = Math.floor(wx - (o.x - t.ax)), ly = Math.floor(wy - (o.y - t.ay));
      if (o.kind === 'ship') {
        const tol = 4;
        for (let dy = -tol; dy <= tol; dy += 2) for (let dx = -tol; dx <= tol; dx += 2) {
          const x = lx + dx, y = ly + dy;

        }

    }

  }
  function tapAt(sx, sy) {
    const w = toWorld(sx, sy);

  function statGrid(st, compact) {
    return `<dl class="stats ${compact ? 'strip' : 'seven'}">${STAT_LABELS.map(([k, l]) => `<div><dt>${l}</dt><dd>${st[k]}</dd></div>`).join('')}</dl>`;
  }
  function hullBar(ship, st) {
    const f = ship.hp / st.hull, cls = f < TOF.MIN_SAIL_HULL ? 'bad' : f < 0.6 ? 'mid' : '';
    return `<div class="hull ${cls}"><span>Hull ${ship.hp} / ${st.hull}</span><i style="width:${(f * 100).toFixed(0)}%"></i></div>`;
  }

  function renderFleet(state, now) {
    if (ui.fleetShip && TOF.getShip(state, ui.fleetShip)) return renderShipDetail(state, now, TOF.getShip(state, ui.fleetShip));
    ui.fleetShip = null;
    const ready = state.expeditions.filter(e => now >= e.endAt);
    const idle = state.ships.filter(s => TOF.shipStatus(state, s.id, now) === 'idle' && !TOF.sailBlock(state, s, s.lastTrip.type, now));
    let html = '';
    if (ready.length) html += `<button class="btn primary glow" data-act="claimall">${ready.length > 1 ? `Collect from ${ready.length} ships` : 'Collect the catch'}</button>`;
    if (idle.length > 1) html += `<button class="btn" data-act="repeatall">Send ${idle.length} idle ships on their last trips</button>`;
    html += `<ul class="fleet-list">`;
    for (const ship of state.ships) {
      const st = TOF.shipStats(ship), status = TOF.shipStatus(state, ship.id, now), exp = TOF.expeditionForShip(state, ship.id);
      const right = status === 'away'
        ? `<span class="fl-status stack"><small>Travelling</small><span>${icon(TYPE_ICON[exp.type], 'tiny')} <b data-timer="${exp.id}"></b></span></span>`
        : status === 'returned' ? `<span class="fl-status ready" aria-label="Ready to collect">Ready!</span>`
          : ship.hp < st.hull * TOF.MIN_SAIL_HULL ? `<span class="fl-status stack bad"><small>In harbor</small><span>Needs repair</span></span>` : `<span class="fl-status stack"><small>In harbor</small><span>Available</span></span>`;
      const f = ship.hp / st.hull;
      html += `<li><button class="fl-row" data-act="openship" data-ship="${ship.id}">
        <span class="fl-img">${shipImg(ship.cls)}</span>
        <span class="fl-main"><b>${esc(ship.name)}</b><small>${exp ? `${TOF.TYPES[exp.type].name} trip` : st.name}</small><span class="mini-hull ${f < TOF.MIN_SAIL_HULL ? 'bad' : f < 0.6 ? 'mid' : ''}"><i style="width:${(f * 100).toFixed(0)}%"></i></span></span>
        ${right}</button></li>`;
    }
    html += `</ul>${state.ships.length ? '' : '<p class="empty-state">No ships in the harbor yet. The Shipwright builds new hulls.</p>'}
      <p class="note">${state.ships.length} of ${TOF.MAX_SHIPS} berths in use${state.expeditions.length ? `, ${state.expeditions.length} at sea or back` : ', all in harbor'}. New hulls are built at the Shipwright.</p>`;
    return html;
  }

  function estimateText(est, type) {
    const a = est.avg;
    const list = (keys) => keys.filter(k => a[k] >= 0.05).map(k => `<b>${num(a[k])}</b> ${resName(k)}`).join(', ');
    let line;
    if (type === 'fishing') line = `Typical haul: ${list(['fish', 'shellfish']) || 'very little'}. A rare catch on <b>${pct(est.chance.rareFish || 0)}</b> of trips.`;
    else if (type === 'treasure') line = `Typical haul: ${list(['coins', 'pearls']) || 'very little'}. A relic on <b>${pct(est.chance.relics || 0)}</b> of trips.`;
    else if (type === 'combat') line = `Typical bounty: <b>${num(a.coins || 0)}</b> coins. Wins <b>${pct(est.winRate)}</b> of fights.`;
    else line = `Typical haul: ${list(['charts', 'coins']) || 'very little'}.`;
    const risk = est.damageChance > 0
      ? `Hull damage on <b>${pct(est.damageChance)}</b> of trips, about <b>${num(est.damage / Math.max(est.damageChance, 0.01))}</b> hull when it happens.`
      : 'No real danger.';
    const ch = est.chestChance || 0;
    const finds = [];
    if (ch > 0.01) finds.push(`a chest on <b>${pct(Math.min(0.99, ch))}</b>`);
    for (const k of ['sunkenKey', 'pirateKey', 'lostKey', 'moonfish', 'salvage']) if ((est.chance[k] || 0) > 0.01) finds.push(`${resName(k)} on <b>${pct(est.chance[k])}</b>`);
    if ((est.chance.candy || 0) > 0.005) finds.unshift(`candy on <b>${pct(est.chance.candy)}</b> (about ${num(est.avg.candy || 0)})`);
    const extra = finds.length ? `<p class="estimate risk">Rare finds: ${finds.join(', ')} of trips.</p>` : '';
    return `<p class="estimate">${line}</p>${extra}<p class="estimate risk">${risk}</p>`;
  }

  function renderShipDetail(state, now, ship) {
    const st = TOF.shipStats(ship), status = TOF.shipStatus(state, ship.id, now), exp = TOF.expeditionForShip(state, ship.id);
    const pill = { idle: 'In harbor', away: TOF.TYPES[exp ? exp.type : 'fishing'].name, returned: 'Back with a haul' }[status];
    let html = `<button class="back" data-act="back">‹ All ships</button>
      <article class="card ship">
        <header class="ship-head">${shipImg(ship.cls, 'big')}<div><h3>${esc(ship.name)}</h3><p>${st.name}. ${st.blurb}</p></div><span class="pill pill-${status}">${pill}</span></header>
        ${hullBar(ship, st)}
        ${ship.curse ? `<p class="warn">Cursed: weaker for ${ship.curse.trips} more trip${ship.curse.trips > 1 ? 's' : ''}. ${TOF.buildingLevel(state, 'seaWitch') ? `<button class="btn small" data-act="cleanse" data-ship="${ship.id}">Lift it (1 essence)</button>` : 'The Sea Witch could lift it.'}</p>` : ''}
        ${statGrid(st)}`;
    const repairCost = TOF.repairCost(ship, state);
    if (status === 'idle') {
      if (repairCost) {
        const rc = TOF.repairCost(ship, state), rp = TOF.repairPlanks(ship);
        const can = state.resources.coins >= rc && state.resources.planks >= rp;
        html += `<button class="btn" data-act="repair" data-ship="${ship.id}" ${can ? '' : 'disabled'}>${icon('wrench', 'tiny')} Repair: ${rc} coins + ${rp} ${unit('planks', rp)}</button>`;
        if (!can && state.resources.planks < rp) html += `<p class="note">Repairs need planks: build a Sawmill, or buy timber at a Trading Post.</p>`;
      }
      const plan = planFor(ship);
      if (TOF.sailBlock(state, ship, plan.type, now) && plan.type === 'combat' && TOF.typePower(st, 'combat') < 2) plan.type = 'fishing';
      const rumor = TOF.rumorFor(state, now);
      html += `<p class="label">Expedition</p><div class="types">${Object.entries(TOF.TYPES).map(([k, t]) => {
        const blocked = k === 'combat' && TOF.typePower(st, 'combat') < 2;
        const hot = rumor && rumor.type === k;
        return `<button class="type ${hot ? 'hot' : ''}" role="radio" aria-checked="${plan.type === k}" data-act="type" data-ship="${ship.id}" data-type="${k}" ${blocked ? 'disabled' : ''}>${icon(TYPE_ICON[k], 'mid')}<span>${t.name}${blocked ? '<small>Needs cannons</small>' : hot ? `<small>Rumor +${Math.round((rumor.bonus - 1) * 100)}%</small>` : ''}</span></button>`;
      }).join('')}</div>
      <p class="desc type-desc">${TOF.TYPES[plan.type].desc}</p>
      <p class="label">Where</p><div class="regions">${state.regions.map(id => {
        const Rg = TOF.REGIONS[id], lock = TOF.regionSailBlock(state, ship, id);
        return `<button class="chip region" role="radio" aria-checked="${plan.region === id}" data-act="region" data-ship="${ship.id}" data-r="${id}" ${lock ? 'disabled' : ''}>${esc(Rg.name)}${lock ? `<small>Needs ${Rg.minExplore} explore</small>` : ''}</button>`;
      }).join('')}</div>
      ${state.regions.length < 2 ? `<p class="note">Chart new waters on the Sea chart tab with sea charts.</p>` : ''}
      <div class="chips" role="radiogroup">${TOF.DURATIONS.map(d => `<button class="chip" role="radio" aria-checked="${d === plan.hours}" data-act="hours" data-ship="${ship.id}" data-h="${d}">${durShort(d)}</button>`).join('')}</div>`;
      const need = TOF.foodFor(plan.hours), haveFood = state.resources.food >= need;
      if (!haveFood) ui.supplies[ship.id] = false;
      const sup = !!ui.supplies[ship.id];
      html += `<label class="supplies ${haveFood ? '' : 'off'}"><input type="checkbox" data-act="supplies" data-ship="${ship.id}" ${sup ? 'checked' : ''} ${haveFood ? '' : 'disabled'}>
        <span class="track"><span class="knob"></span></span><span>${icon('food', 'tiny')} <b>Pack supplies</b> (${need} preserved food, you have ${state.resources.food})<br><small>${haveFood ? '+20% haul, 30% less hull damage.' : 'A Fishmonger turns fish into preserved food.'}</small></span></label>`;
      const charms = state.resources.charm || 0;
      if (!charms) ui.charm[ship.id] = false;
      const chm = !!ui.charm[ship.id];
      if (charms || state.discovered.includes('charm')) html += `<label class="supplies ${charms ? '' : 'off'}"><input type="checkbox" data-act="charm" data-ship="${ship.id}" ${chm ? 'checked' : ''} ${charms ? '' : 'disabled'}>
        <span class="track"><span class="knob"></span></span><span>${icon('charm', 'tiny')} <b>Carry a warding charm</b> (you have ${charms})<br><small>Half the hull damage, no curses, +30% against ghosts and monsters.</small></span></label>`;
      const est = TOF.estimate(ship, plan.type, plan.hours, TOF.tripMods(state, plan.type, now, sup, plan.region, chm));
      est.durationMult *= TOF.REGIONS[plan.region].dist * (TOF.trophyBonus(state, 'starChart') ? 0.9 : 1);
      html += estimateText(est, plan.type);
      if (est.overflowChance > 0.3) html += `<p class="warn">The hold (${est.capacity}) fills up on ${pct(est.overflowChance)} of these trips. Try a shorter trip or a bigger hold.</p>`;
      const block = TOF.sailBlock(state, ship, plan.type, now);
      const startedTrips = TOF.Stats.get(state, 'tripsStarted'), tide = TOF.BEGINNER_TRIPS - startedTrips;
      const ms = startedTrips === 0 ? 60000 : plan.hours * TOF.hourMs(state) * est.durationMult;
      if (tide > 0) html += `<p class="tide">${icon('chest', 'tiny')} <b>Beginner’s tide:</b> this trip pays double${startedTrips === 0 ? ' and is back in a minute' : ''}. ${tide} doubled trip${tide > 1 ? 's' : ''} left.</p>`;
      html += block ? `<p class="warn">${esc(block)}</p>` : `<button class="btn primary" data-act="sail" data-ship="${ship.id}">Set sail, back in ${span(ms)}</button>`;
    } else if (status === 'away') {
      html += `<div class="progress"><i data-bar="${exp.id}"></i></div>
        <p class="eta">${icon(TYPE_ICON[exp.type], 'tiny')} ${durLong(exp.hours)} ${TOF.TYPES[exp.type].name.toLowerCase()} trip in ${esc(TOF.REGIONS[exp.region || 'home'].name)}. Back in <b data-timer="${exp.id}"></b>${exp.dev ? ' (developer trip)' : `, around ${clock(exp.endAt)}`}.</p>
        ${state.settings.devMode ? `<button class="btn dev" data-act="finish">Finish all trips now (developer)</button>` : ''}`;
    } else {
      html += `<button class="btn primary glow" data-act="claim" data-exp="${exp.id}">Collect the haul</button>`;
    }
    html += `</article>
      ${ui.renaming === ship.id
        ? `<div class="rename"><label for="renameInput">New name</label><input id="renameInput" maxlength="24" value="${esc(ship.name)}" autocomplete="off"><div class="btn-row"><button class="btn primary" data-act="dorename" data-ship="${ship.id}">Save name</button><button class="btn" data-act="cancelrename">Cancel</button></div></div>`
        : `<div class="btn-row"><button class="btn" data-act="goupgrade" data-ship="${ship.id}">Upgrades</button><button class="btn" data-act="rename" data-ship="${ship.id}">Rename</button></div>`}`;
    return html;
  }

  // ---------- stores ----------
  const GROUPS = [['Halloween', ['candy']], ['Catch', ['fish', 'shellfish', 'rareFish']], ['Treasure', ['pearls', 'relics', 'charts']], ['Raw materials', ['timber', 'hemp', 'ironOre']], ['Goods', ['planks', 'rope', 'iron', 'food']], ['Magic', ['moonfish', 'essence', 'salvage', 'charm']], ['Keys', ['sunkenKey', 'pirateKey', 'lostKey']]];
  function renderMarket(state) {
    const cap = TOF.storageCap(state), mkt = TOF.buildingLevel(state, 'market');
    let html = `<p class="note">Bulk goods hold up to <b>${cap}</b> each. ${TOF.buildingLevel(state, 'warehouse') ? '' : 'A Warehouse raises the limit. '}Coins, rare catch, pearls, relics and charts have no limit.</p>`;
    for (const [title, keys] of GROUPS) {
      const shown = keys.filter(k => state.discovered.includes(k));
      if (!shown.length) continue;
      html += `<h3 class="group">${title}</h3><div class="card">` + shown.map(r => {
        const n = state.resources[r], bulk = TOF.BULK.includes(r), sellable = TOF.SELLABLE.includes(r);
        const full = bulk && n >= cap;
        const refined = TOF.REFINED.includes(r), act = refined ? 'sellref' : 'sell';
        const btns = sellable || refined ? `<div class="m-btns"><button class="btn small" data-act="${act}" data-res="${r}" data-q="10" ${n ? '' : 'disabled'}>Sell 10</button><button class="btn small" data-act="${act}" data-res="${r}" data-q="${n}" ${n ? '' : 'disabled'}>Sell all${refined && n ? ` (${n * TOF.REFINED_PRICE})` : ''}</button></div>` : '';
        const sub = sellable ? `${TOF.sellPrice(state, r)} coins each` : refined ? `${TOF.REFINED_PRICE} coins each at any shop` : TOF.TRADE.sell[r] ? 'Trading Post buys' : TOF.TRADE.buy[r] ? 'Trading Post sells' : 'Not for sale';
        return `<div class="mrow">${icon(r, 'mid')}<div class="m-info"><b>${TOF.RESOURCES[r].name} <span class="amt ${full ? 'full' : ''}">${n}${bulk ? `<small>/${cap}</small>` : ''}</span></b><span>${sub}</span></div>${btns}</div>`;
      }).join('') + `</div>`;
    }
    const chests = Object.keys(TOF.CHESTS).filter(k => state.resources[k] > 0);
    if (chests.length) {
      html += `<h3 class="group">Chests</h3><div class="card">` + chests.map(k => {
        const c = TOF.CHESTS[k], z = TOF.CHEST_SIZES[c.size], key = TOF.KEY_OF[c.family], have = state.resources[key];
        return `<div class="mrow">${icon(k, 'chest')}<div class="m-info"><b>${c.name} <span class="amt">${state.resources[k]}</span></b><span>Opens with ${z.keys} ${resName(key)}${z.keys > 1 ? 's' : ''} (you have ${have})</span></div>
          <div class="m-btns"><button class="btn small ${have >= z.keys ? 'primary' : ''}" data-act="chest" data-c="${k}">Open</button></div></div>`;
      }).join('') + `</div>`;
    }
    const tro = Object.keys(TOF.TROPHIES).filter(k => state.trophies[k]);
    if (tro.length) html += `<h3 class="group">Trophies</h3><div class="card">` + tro.map(k => `<div class="mrow">${icon(k, 'mid')}<div class="m-info"><b>${TOF.TROPHIES[k].name}${state.trophies[k] > 1 ? ` <span class="amt">×${state.trophies[k]}</span>` : ''}</b><span>${TOF.TROPHIES[k].bonus}</span></div></div>`).join('') + `</div>`;
    const total = ['fish', 'shellfish'].reduce((a, r) => a + state.resources[r] * TOF.sellPrice(state, r), 0);
    html += `<button class="btn primary" data-act="sellall" ${total ? '' : 'disabled'}>Sell fish and shellfish for ${total} coins</button>
      <p class="note">Fish Market level ${mkt}${mkt > 1 ? `: prices +${Math.round((mkt - 1) * 15)}%` : ''}. The bulk sale skips rare catch, pearls and relics; upgrades need them.</p>`;
    return html;
  }

  // ---------- village ----------
  function buildTime(state, level) { return span(TOF.buildMs(state, level)); }
  function bStatus(b, now) {
    if (b.pending) return `<span class="fl-status">${icon('hammer', 'tiny')} <b data-btimer="${b.id}">${fmt(b.pending.endAt - now)}</b></span>`;
    if (b.job) return `<span class="fl-status">${icon(b.job.out, 'tiny')} ${b.job.done}/${b.job.qty}</span>`;
    return '';
  }
  function harvestField() {
    const r = App.harvest();
    if (r.ok) { Sound.play('coins'); toast(r.spoiled ? `Harvested ${r.food} food (${r.spoiled} spoiled: storage is full).` : `Harvested ${r.food} preserved food. The field is replanted.`, 'good'); }
    else toast(`The crops are still growing: ripe in ${fmt(r.readyAt - App.now())}.`);
  }
  function fieldCard(state, now) {
    const c = TOF.cropState(state, now);
    return `<article class="card field"><header class="ship-head">${icon('food', 'mid')}<div><h3>The field</h3><p>Grows ${TOF.cropYield(state)} food every ${span(TOF.cropHours(state) * TOF.hourMs(state))}, free, and replants itself.</p></div></header>
      ${c.ripe ? `<button class="btn primary glow" data-act="harvest">Harvest ${TOF.cropYield(state)} food</button>`
        : `<div class="progress"><i style="width:${(c.progress * 100).toFixed(1)}%"></i></div><p class="eta">Ripe in <b data-crop="1">${fmt(c.readyAt - now)}</b>.</p>`}</article>`;
  }
  function renderVillage(state, now) {
    if (ui.building && TOF.getBuilding(state, ui.building)) return renderBuildingDetail(state, now, TOF.getBuilding(state, ui.building));
    ui.building = null;
    const tabs = `<div class="seg" role="tablist"><button role="tab" aria-selected="${ui.vTab !== 'decor'}" data-act="vtab" data-tab="build">Buildings</button><button role="tab" aria-selected="${ui.vTab === 'decor'}" data-act="vtab" data-tab="decor">Decorations</button></div>`;
    if (ui.vTab === 'decor') return tabs + renderDecor(state);
    const busy = TOF.buildersBusy(state);
    let html = tabs + fieldCard(state, now) + `<p class="note builders">${icon('hammer', 'tiny')} Builders: <b>${TOF.MAX_BUILDERS - busy} of ${TOF.MAX_BUILDERS}</b> free</p><ul class="fleet-list">`;
    for (const b of state.buildings) {
      html += `<li><button class="fl-row" data-act="openb" data-b="${b.id}"><span class="fl-img">${bImg(b.type, b.level)}</span>
        <span class="fl-main"><b>${bName(b.type)}</b><small>${b.level ? `Level ${b.level}` : 'Under construction'}${b.pending && b.level ? `, upgrading to ${b.pending.toLevel}` : ''}</small></span>${bStatus(b, now)}</button></li>`;
    }
    html += `</ul><h3 class="group">Construct</h3>`;
    for (const type of TOF.BUILDING_ORDER) {
      const d = TOF.BUILDINGS[type];
      if (d.prebuilt || TOF.buildingOfType(state, type)) continue;
      const lock = TOF.buildLock(state, type);
      const cost = d.costs[0];
      const afford = cost && TOF.canAfford(state, cost);
      let btn;
      if (lock) btn = `<p class="lock">${esc(lock)}</p>`;
      else if (busy >= TOF.MAX_BUILDERS) btn = `<p class="lock">Both builders are busy.</p>`;
      else btn = `<button class="btn ${afford ? 'primary' : ''}" data-act="place" data-type="${type}" ${afford ? '' : 'disabled'}>${afford ? 'Choose a spot' : `Need ${missingText(state, cost)}`}</button>`;
      html += `<article class="card build ${lock ? 'locked' : ''}"><header class="ship-head">${bImg(type, 1, 'big')}<div><h3>${d.name}</h3><p>${d.desc}</p></div></header>
        ${cost ? `<p class="cost">Cost: ${costText(state, cost)} <span class="bt">${icon('hammer', 'tiny')} ${buildTime(state, 1)}</span></p>` : ''}${btn}${lock ? '' : hints(state, cost)}</article>`;
    }
    return html;
  }

  // ---------- decorations ----------
  const DECOR_GROUPS = [['buildings', 'Village buildings'], ['square', 'Village square'], ['farm', 'The field and garden'], ['seaside', 'Seaside and harbor'], ['light', 'Lights'], ['flowers', 'Flower beds'], ['prestige', 'Prestige']];
  const pc = x => `${Math.round(x * 100)}%`;
  function decorSummary(state) {
    const b = TOF.decorBonus(state), out = [];
    for (const [t, v] of Object.entries(b.yield)) if (v) out.push(`+${pc(v)} ${TOF.TYPES[t].name.toLowerCase()} hauls`);
    for (const [t, v] of Object.entries(b.power)) if (v) out.push(`+${pc(v)} ${TOF.TYPES[t].name.toLowerCase()} power`);
    if (b.coins) out.push(`+${pc(b.coins)} coins from trips`);
    if (b.chest) out.push(`chests ${pc(b.chest)} more often`);
    if (b.trip) out.push(`trips ${pc(b.trip)} shorter`);
    if (b.damage) out.push(`${pc(b.damage)} less hull damage`);
    if (b.build) out.push(`builders ${pc(b.build)} faster`);
    if (b.storage) out.push(`+${b.storage} storage`);
    if (b.cropFood) out.push(`+${b.cropFood} food per harvest`);
    if (b.cropSpeed) out.push(`field ${pc(b.cropSpeed)} faster`);
    if (b.candy) out.push(`+${pc(b.candy)} candy (Halloween)`);
    return out;
  }
  function renderDecor(state) {
    const have = new Set((state.decor || []).map(d => d.type)), sum = decorSummary(state);
    const regular = TOF.DECOR_ORDER.filter(t => !TOF.DECOR[t].hw);
    let html = '';
    // a decoration tapped in the village: move it, repaint it, find it
    const sel = ui.decorSel && state.decor.find(x => x.id === ui.decorSel && !TOF.DECOR[x.type].hw);
    if (sel) {
      const d = TOF.DECOR[sel.type];
      html += `<article class="card" data-dcard="sel"><header class="ship-head"><img class="px b-img big" src="${Art.decorURL(sel.type)}" alt=""><div><h3>${d.name}</h3><p>${d.effect}${d.multi ? ' (the first one earns it)' : ''}</p></div></header>
        <div class="btn-row">${d.fixed ? '' : `<button class="btn small" data-act="dmove" data-d="${sel.id}">Move it</button>`}${d.variants ? `<button class="btn small primary" data-act="drepaint" data-d="${sel.id}">Repaint (${(sel.v || 0) + 1}/${d.variants})</button>` : ''}</div></article>`;
    }
    html += `<article class="card"><h3>Village charm</h3><p class="desc">Every decoration gives a small, lasting bonus (${regular.filter(t => have.has(t)).length} of ${regular.length} kinds so far), and the combined bonus is capped, so the village still has to grow. Village buildings and square pieces can be built again and again to make the place your own: only the first of each earns its bonus. Tap any decoration in the village to move or repaint it.</p>
      ${sum.length ? `<ul class="perks">${sum.map(t => `<li>${t}</li>`).join('')}</ul>` : '<p class="note">No decorations yet. Scarecrows and fences are a cheap start.</p>'}</article>`;
    for (const [g, title] of DECOR_GROUPS) {
      html += `<h3 class="group">${title}</h3>`;
      for (const type of TOF.DECOR_ORDER.filter(t => TOF.DECOR[t].group === g)) {
        const d = TOF.DECOR[type], owned = state.decor.find(x => x.type === type), afford = TOF.canAfford(state, d.cost);
        let btn;
        const copies = state.decor.filter(x => x.type === type).length;
        if (d.multi) btn = copies >= TOF.DECOR_COPIES ? `<p class="ok-text">${copies} built, as many as the village can fit.</p>`
          : `<button class="btn ${afford ? 'primary' : ''}" data-act="dplace" data-type="${type}" ${afford ? '' : 'disabled'}>${afford ? (copies ? `Build another (${copies} built)` : 'Choose a spot') : `Need ${missingText(state, d.cost)}`}</button>`;
        else if (owned) btn = d.fixed ? `<p class="ok-text">Built${d.fixed === 'field' ? ' at the field' : ' beside the lighthouse'}.</p>`
          : `<div class="btn-row"><button class="btn small" data-act="dmove" data-d="${owned.id}">Move it</button><button class="btn small" data-act="dshow" data-d="${owned.id}">Show me</button></div>`;
        else if (d.fixed) btn = `<button class="btn ${afford ? 'primary' : ''}" data-act="dbuy" data-type="${type}" ${afford ? '' : 'disabled'}>${afford ? 'Build it' : `Need ${missingText(state, d.cost)}`}</button>`;
        else btn = `<button class="btn ${afford ? 'primary' : ''}" data-act="dplace" data-type="${type}" ${afford ? '' : 'disabled'}>${afford ? 'Choose a spot' : `Need ${missingText(state, d.cost)}`}</button>`;
        html += `<article class="card build decor ${owned ? 'owned' : ''} ${g === 'prestige' ? 'prestige' : ''}" data-dcard="${type}"><header class="ship-head"><img class="px b-img big" src="${Art.decorURL(type)}" alt=""><div><h3>${d.name}</h3><p>${d.desc}</p></div></header>
          <p class="desc perk">${d.effect}${d.variants ? ` <small>${d.variants} looks to choose from.</small>` : ''}</p>${owned && !d.multi ? '' : `<p class="cost">Cost: ${costText(state, d.cost)}</p>`}${btn}${owned && !d.multi ? '' : hints(state, d.cost)}</article>`;
      }
    }
    return html;
  }

  // ---------- Halloween ----------
  const RAR_ORDER = ['common', 'uncommon', 'rare', 'veryRare', 'legendary'];
  const rarBadge = r => `<span class="rar rar-${r}">${TOF.RARITY[r]}</span>`;
  function eventDays(now) {
    const d = new Date(now), end = new Date(d.getFullYear(), TOF.HALLOWEEN.end[0] - 1, TOF.HALLOWEEN.end[1], 23, 59, 59);
    return Math.max(0, Math.ceil((end - d) / 86400000));
  }
  function renderHalloween(state, now) {
    const on = TOF.halloweenActive(state, now), candy = state.resources.candy, H = state.halloween;
    const placed = state.decor.filter(d => TOF.DECOR[d.type].hw), bonus = TOF.decorBonus(state).candy, days = eventDays(now);
    let html = `<article class="card hw"><div class="hw-head">${icon('candy', 'big')}<div><span class="big-n">${candy}</span> candy<br><small>${on ? `Halloween runs October 1 to November 12.${state.settings.eventOverride === 'on' ? ' (Forced on in developer mode.)' : ` <b>${days} day${days === 1 ? '' : 's'}</b> left.`}` : 'Halloween is over for this year. Your candy and decorations keep until next October.'}</small></div></div>
      <p class="desc">${on ? 'Every trip can bring home candy, short ones too. Friendly ghosts drift through the village, day and night: tap one to pop it for a little candy.' : 'The cauldron has gone cold, and no more candy turns up until next Halloween.'}</p>
      <p class="desc perk">Candy bonus: +${Math.round(bonus * 100)}% from ${placed.length} placed decoration${placed.length === 1 ? '' : 's'} (the most is +${Math.round(TOF.HALLOWEEN.candyCap * 100)}%).</p></article>`;
    // 1.6: what the tombstones and graveyards are doing for the ghosts
    const gb = TOF.ghostBoost(state), finalNow = TOF.ghostFinalHour(state, now), endsAt = TOF.halloweenEndsAt(state, now);
    if (on) html += `<article class="card" data-hw="ghosts"><h3>Ghosts</h3><p class="desc">Tombstones and graveyards draw the ghosts: each placed copy adds up, to a limit. A Big Ghost pays ${TOF.HALLOWEEN.ghostDecor.bigCandy.join('–')} candy instead of ${TOF.HALLOWEEN.ghost.candy.join('–')}, and still counts as one of the ${TOF.HALLOWEEN.ghost.maxPerHour} ghosts that pay each hour.</p>
      <ul class="perks"><li>Ghosts appear ${pc(gb.spawn)} more often (most ${pc(TOF.HALLOWEEN.ghostDecor.spawnCap)})</li><li>${pc(gb.big)} of ghosts are Big Ghosts (most ${pc(TOF.HALLOWEEN.ghostDecor.bigCap)})</li>
      <li>In the final hour before Halloween ends${endsAt ? ` (${new Date(endsAt - TOF.HOUR_MS).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })})` : ''}, ghost candy +${pc(gb.finalHour)} (most +${pc(TOF.HALLOWEEN.ghostDecor.finalHourCap)})${finalNow ? ' <b>: happening now!</b>' : ''}</li></ul></article>`;
    const pk = TOF.pumpkinStatus(state, now);
    if (pk.placed) html += `<article class="card" data-hw="pumpkins"><header class="ship-head"><img class="px b-img big" src="${Art.decorURL('hwPumpkinPatch')}" alt=""><div><h3>Pumpkin Patch</h3><p>${pk.ready ? 'Ripe! Tap the patch in the village, or pick them here.' : pk.readyAt ? `Ripe in <b>${span(pk.readyAt - now)}</b>.` : 'Just planted.'} Each harvest gives ${TOF.HALLOWEEN.pumpkin.food.join(' or ')} preserved food, once every ${TOF.HALLOWEEN.pumpkin.hours} hours however many patches you have.</p></div></header>
      ${pk.ready ? '<button class="btn primary" data-act="pumpkins">Harvest the pumpkins</button>' : ''}</article>`;
    // a decoration tapped in the village
    const sel = ui.hwDecor && state.decor.find(d => d.id === ui.hwDecor);
    if (sel) {
      const d = TOF.DECOR[sel.type];
      html += `<article class="card" data-hw="sel"><header class="ship-head"><img class="px b-img big" src="${Art.decorURL(sel.type)}" alt=""><div><h3>${d.name}</h3><p>${d.effect}</p></div>${rarBadge(d.rarity)}</header>
        <div class="btn-row"><button class="btn small" data-act="dmove" data-d="${sel.id}">Move it</button><button class="btn small" data-act="dstow" data-d="${sel.id}">Pack away</button></div></article>`;
    }
    // the cauldron
    html += `<article class="card" data-hw="cauldron"><header class="ship-head"><img class="px b-img big" src="${Art.cauldronURL()}" alt=""><div><h3>The West Woods cauldron</h3><p>Drop in candy and see what bubbles up. Halloween decorations come from here: they can’t be bought.</p></div></header>
      ${H.lastBrew && !H.lastBrew.seen ? `<button class="btn primary glow" data-act="brewshow">See what the cauldron brewed</button>` : ''}
      <div class="tiers">${Object.entries(TOF.CAULDRON.tiers).map(([k, t]) => `<div class="tier"><b>${t.name}</b>
        <button class="btn ${on && candy >= t.cost ? 'primary' : ''}" data-act="brew" data-tier="${k}" ${on && candy >= t.cost ? '' : 'disabled'}>Deposit ${t.cost} ${icon('candy', 'tiny')}</button>
        <small>${RAR_ORDER.map(r => `${TOF.RARITY[r]} ${t.odds[r]}%`).join(' · ')}${t.qty > 1 ? `. Coin and goods prizes ×${t.qty}.` : '.'}</small></div>`).join('')}</div>
      <button class="btn" data-act="gocauldron">Show me the cauldron</button></article>`;
    // the ghost ship
    const sh = on && H.ship && now < H.ship.leaveAt ? H.ship : null;
    if (sh) {
      html += `<article class="card hw" data-hw="ship"><h3>The ghost ship is in!</h3><p class="desc">Her crewless deck creaks with cargo. She trades for candy, each offer once, and sails in <b>${span(sh.leaveAt - now)}</b>.</p>` +
        sh.offers.map(o => { const t = TOF.GHOST_TRADES.find(x => x.id === o.id), can = !o.done && candy >= t.candy;
          return `<div class="mrow offer"><div class="m-info"><b>${t.name}${t.big ? ' <span class="rar rar-rare">Big offer</span>' : ''}</b><span>${Object.entries(t.get).map(([k, v]) => `${icon(k, 'tiny')} ${v} ${resName(k)}`).join(', ')}</span></div>
            <div class="m-btns">${o.done ? '<span class="ok-text">Traded</span>' : `<button class="btn small ${can ? 'primary' : ''}" data-act="gtrade" data-o="${o.id}" ${can ? '' : 'disabled'}>${t.candy} ${icon('candy', 'tiny')}</button>`}</div></div>`; }).join('') +
        `<button class="btn" data-act="goship">Show me the ship</button></article>`;
    } else if (on) html += `<p class="note">A ghost ship drifts into the harbor now and then, ready to trade timber, stone, food and more for candy.</p>`;
    // the collection
    const owned = t => (state.decorInv[t] || 0) + state.decor.filter(d => d.type === t).length;
    html += `<h3 class="group" data-hw="collection">Halloween decorations (${TOF.HW_DECOR.filter(t => owned(t)).length} of ${TOF.HW_DECOR.length})</h3><div class="hw-grid">` +
      [...TOF.HW_DECOR].sort((a, b) => RAR_ORDER.indexOf(TOF.DECOR[a].rarity) - RAR_ORDER.indexOf(TOF.DECOR[b].rarity)).map(t => {
        const d = TOF.DECOR[t], inv = state.decorInv[t] || 0, out = state.decor.filter(x => x.type === t).length;
        return `<div class="hw-item ${owned(t) ? '' : 'missing'}"><img class="px" src="${Art.decorURL(t)}" alt=""><b>${owned(t) ? d.name : '???'}</b>${rarBadge(d.rarity)}
          <small>${owned(t) ? `${out} placed${inv ? `, ${inv} to place` : ''}` : 'Not found yet'}</small>
          ${inv ? `<button class="btn primary" data-act="dplace" data-type="${t}">Place</button>` : ''}</div>`;
      }).join('') + `</div><p class="note">Each placed decoration adds a little candy to future trips (+${Math.round(TOF.DECOR.hwPumpkinFlag.candy * 100)}% to +${Math.round(TOF.DECOR.hwBatRoost.candy * 100)}% each; every jack-o’-lantern gives +${Math.round(TOF.DECOR.hwJackClassic.candy * 100)}%). Copies stack. Some do more: tombstones and graveyards call the ghosts, the Bat Cave lets bats out at night, the Pumpkin Patch grows preserved food. Tap a placed one in the village to move it or pack it away.</p>`;
    return html;
  }
  // Brewing: candy and prize were settled before this plays, so the animation is only for show.
  function brewIt(tier) {
    const r = App.brew(tier);
    if (!r.ok) { toast(r.reason, 'bad'); return; }
    closePanel();
    $('#modalBody').innerHTML = `<div class="brewbox brewing"><img src="${Art.cauldronURL()}" alt=""></div><h2>Bubble, bubble…</h2><p class="sub">The cauldron churns your candy.</p>`;
    $('#modalOk').disabled = true; $('#modalOk').textContent = 'Brewing…';
    $('#modal').hidden = false;
    Sound.play('chestShake');
    setTimeout(() => showBrew(r.brew), 1600);
  }
  function showBrew(b) {
    const name = b.decor ? TOF.DECOR[b.decor].name : Object.entries(b.items).map(([k, v]) => `${v} ${resName(k)}`).join(' and ');
    const img = b.decor ? `<img class="prize" src="${Art.decorURL(b.decor)}" alt="">` : `<div class="brewbox">${Object.keys(b.items).map(k => icon(k, 'big')).join(' ')}</div>`;
    $('#modalBody').innerHTML = `<div class="reveal">${rarBadge(b.rarity)}${img}<h2>${esc(name)}</h2>
      <p class="sub">${b.decor ? `Quantity 1. ${TOF.DECOR[b.decor].effect} Place it from the Halloween panel.` : `From the ${TOF.CAULDRON.tiers[b.tier].name.toLowerCase()}.`}</p></div>`;
    $('#modalOk').disabled = false; $('#modalOk').textContent = b.rarity === 'legendary' ? 'Legendary!' : b.rarity === 'veryRare' ? 'Spooktacular!' : b.rarity === 'rare' ? 'Wicked!' : 'Nice!';
    ui.brewToSee = b.id;
    Sound.play(b.rarity === 'rare' || b.rarity === 'veryRare' || b.rarity === 'legendary' ? 'trophy' : 'chestOpen');
  }

  function effectText(state, b, lvl) {
    switch (b.type) {
      case 'market': return lvl > 1 ? `Sale prices +${(lvl - 1) * 15}%.` : 'Standard prices.';
      case 'shipwright': return lvl > 1 ? `Repairs cost ${(lvl - 1) * 20}% fewer coins.` : 'Standard repair costs.';
      case 'dockyard': return ['', 'Builds tier 2 hulls (cog, trawler).', 'Builds tier 3 hulls (schooner, brigantine, barge).', 'Builds every hull, including the galleon, caravel and frigate.'][lvl];
      case 'warehouse': return `Storage limit ${300 + 250 * lvl} per good.`;
      case 'weaponsmith': return `+${lvl * 10}% pirate-hunting power for every ship.`;
      case 'cartographer': return `+${lvl * 15}% exploration power for every ship.`;
      case 'tavern': return `Rumored trips pay +${Math.round((0.2 + 0.1 * (lvl - 1)) * 100)}%.`;
      case 'tradingPost': return 'Buy 5% cheaper and sell 5% dearer per level above 1.';
      default: {
        const rc = TOF.BUILDINGS[b.type].recipe;
        if (rc) return `${Object.entries(rc.in).map(([k, v]) => `${v} ${resName(k)}`).join(' + ')} make 1 ${unit(rc.out, 1)}, ${span(rc.hours * TOF.hourMs(state) / TOF.recipeSpeed(lvl))} each, up to ${TOF.BATCH_PER_LEVEL * lvl} per batch.`;
        return '';
      }
    }
  }
  const GATE_OF = Object.fromEntries(Object.entries(TOF.UPGRADES).filter(([, u]) => u.gate).map(([k, u]) => [u.gate, u.name.toLowerCase()]));

  function renderBuildingDetail(state, now, b) {
    const d = TOF.BUILDINGS[b.type];
    let html = `<button class="back" data-act="bback">‹ Village</button>
      <article class="card"><header class="ship-head">${bImg(b.type, b.level, 'big')}<div><h3>${d.name}</h3><p>${d.desc}</p></div></header>
      <div class="pips">${Array.from({ length: TOF.BUILDING_MAX_LEVEL }, (_, i) => `<i class="${i < b.level ? 'on' : ''}"></i>`).join('')}</div>
      ${b.level ? `<p class="desc"><b>Level ${b.level}:</b> ${effectText(state, b, b.level)}${GATE_OF[b.type] ? ` Allows ${GATE_OF[b.type]} levels 2 and 3.` : ''}</p>` : ''}`;
    if (b.pending) {
      html += `<div class="progress"><i data-bbar="${b.id}"></i></div><p class="eta">${b.level ? `Upgrading to level ${b.pending.toLevel}` : 'Under construction'}. Done in <b data-btimer="${b.id}"></b>.</p>
        ${state.settings.devMode ? `<button class="btn dev" data-act="finish">Finish now (developer)</button>` : ''}`;
    }
    html += `</article>`;
    if (b.level >= 1) {
      const rc = d.recipe;
      if (rc) {
        html += `<article class="card"><h3>Production</h3><p class="desc">${effectText(state, b, b.level)}</p>`;
        if (b.job) {
          const j = b.job;
          html += `<div class="progress"><i data-jbar="${b.id}"></i></div><p class="eta">${icon(j.out, 'tiny')} <b data-jcount="${b.id}">${j.done}</b> of ${j.qty} ${resName(j.out)} made. Batch done in <b data-jtimer="${b.id}"></b>.</p>
            <button class="btn" data-act="canceljob" data-b="${b.id}">Stop and refund the rest</button>`;
        } else {
          // batch choices: 1, 5, 10 and the most this batch can make (inputs, batch size and storage room all count)
          const can = TOF.batchLimit(state, b), refined = TOF.REFINED.includes(rc.out);
          const have = Object.entries(rc.in).map(([k]) => `${state.resources[k]} ${resName(k)}`).join(', ');
          const unitMs = Math.max(1, Math.round(rc.hours * TOF.hourMs(state) / TOF.recipeSpeed(b.level)));
          const opt = (n, label) => `<button class="btn small ${label ? 'primary' : ''}" data-act="job" data-b="${b.id}" data-q="${n}" ${n >= 1 && n <= can ? '' : 'disabled'}>${label || n}</button>`;
          html += `<p class="desc">You have ${have}. Up to <b>${TOF.maxBatch(b)}</b> per batch at level ${b.level}${TOF.BULK.includes(rc.out) ? `, while storage has room (${state.resources[rc.out]}/${TOF.storageCap(state)})` : ''}.</p>
            <div class="batch">${opt(1)}${opt(5)}${opt(10)}${opt(can, `Max${can ? ` ${can}` : ''}`)}</div>
            ${can ? `<p class="note">A batch of ${can} takes ${span(can * unitMs)}${refined ? ` and sells for <b>${can} × ${TOF.REFINED_PRICE} = ${can * TOF.REFINED_PRICE} coins</b> at any shop` : ''}.</p>` : `<p class="note">${Object.entries(rc.in).map(([k, v]) => `${v} ${resName(k)}`).join(' + ')} make 1 ${unit(rc.out, 1)}.</p>`}`;
        }
        html += `</article>`;
        const n = state.resources[rc.out];
        if (TOF.REFINED.includes(rc.out) && n > 0) html += `<button class="btn" data-act="sellref" data-res="${rc.out}" data-q="${n}">Sell all ${n} ${resName(rc.out)}: ${n} × ${TOF.REFINED_PRICE} = ${n * TOF.REFINED_PRICE} coins</button>`;
      }
      if (b.type === 'tradingPost') {
        html += `<article class="card"><h3>Buy</h3>${Object.keys(TOF.TRADE.buy).map(r => `<div class="mrow">${icon(r, 'mid')}<div class="m-info"><b>${TOF.RESOURCES[r].name}</b><span>${TOF.tradePrice(state, 'buy', r)} coins each, you have ${state.resources[r]}</span></div>
          <div class="m-btns"><button class="btn small" data-act="trade" data-side="buy" data-res="${r}" data-q="10">Buy 10</button><button class="btn small" data-act="trade" data-side="buy" data-res="${r}" data-q="50">Buy 50</button></div></div>`).join('')}</article>
          <article class="card"><h3>Sell</h3>${Object.keys(TOF.TRADE.sell).filter(r => state.discovered.includes(r)).map(r => `<div class="mrow">${icon(r, 'mid')}<div class="m-info"><b>${TOF.RESOURCES[r].name}</b><span>${TOF.tradePrice(state, 'sell', r)} coins each, you have ${state.resources[r]}</span></div>
          <div class="m-btns"><button class="btn small" data-act="trade" data-side="sell" data-res="${r}" data-q="10" ${state.resources[r] ? '' : 'disabled'}>Sell 10</button><button class="btn small" data-act="trade" data-side="sell" data-res="${r}" data-q="${state.resources[r]}" ${state.resources[r] ? '' : 'disabled'}>Sell all</button></div></div>`).join('') || '<p class="note">Make planks, rope, iron or food to sell them here.</p>'}</article>`;
      }
      if (b.type === 'seaWitch') {
        const cursed = state.ships.filter(x => x.curse);
        html += `<article class="card"><h3>${icon('charm', 'mid')} Warding charms</h3><p class="desc">A charm halves hull damage on one trip, wards off curses, and gives +30% against ghosts and monsters. Costs 2 enchanted essence and 1 relic. You have ${state.resources.charm}.</p>
          <button class="btn ${TOF.canAfford(state, { essence: 2, relics: 1 }) ? 'primary' : ''}" data-act="charmcraft" ${TOF.canAfford(state, { essence: 2, relics: 1 }) ? '' : 'disabled'}>Make a charm</button>
          ${cursed.length ? `<h3 style="margin-top:12px">Cursed ships</h3>${cursed.map(x => `<div class="mrow"><span class="fl-img">${shipImg(x.cls)}</span><div class="m-info"><b>${esc(x.name)}</b><span>${x.curse.trips} trip${x.curse.trips > 1 ? 's' : ''} left</span></div><div class="m-btns"><button class="btn small" data-act="cleanse" data-ship="${x.id}" ${state.resources.essence ? '' : 'disabled'}>Lift (1 essence)</button></div></div>`).join('')}` : ''}</article>`;
      }
      if (b.type === 'tavern') {
        const rm = TOF.rumorFor(state, now);
        html += `<article class="card rumor"><h3>${icon(TYPE_ICON[rm.type], 'mid')} Today’s rumor</h3><p class="desc">“${esc(rm.text)}”</p><p class="desc"><b>${TOF.TYPES[rm.type].name}</b> trips that set out today pay <b>+${Math.round((rm.bonus - 1) * 100)}%</b>. A new rumor goes round tomorrow.</p></article>`;
      }
      if (b.type === 'market') html += `<button class="btn" data-act="gostores">Open the stores</button>`;
      if (b.type === 'shipwright') html += `<button class="btn" data-act="goshipwright">Open the Shipwright</button>`;
    }
    if (b.level >= 1 && !b.pending) {
      if (b.level >= TOF.BUILDING_MAX_LEVEL) html += `<p class="ok-text">Fully upgraded.</p>`;
      else {
        const cost = TOF.buildCost(b.type, b.level + 1), block = TOF.upgradeBlock(state, b), afford = TOF.canAfford(state, cost);
        html += `<article class="card"><h3>Upgrade to level ${b.level + 1}</h3><p class="desc">${effectText(state, b, b.level + 1)}</p>
          <p class="cost">Cost: ${costText(state, cost)} <span class="bt">${icon('hammer', 'tiny')} ${buildTime(state, b.level + 1)}</span></p>
          ${block ? `<p class="lock">${esc(block)}</p>` : `<button class="btn ${afford ? 'primary' : ''}" data-act="bupgrade" data-b="${b.id}" ${afford ? '' : 'disabled'}>${afford ? `Upgrade to level ${b.level + 1}` : `Need ${missingText(state, cost)}`}</button>`}${hints(state, cost)}</article>`;
      }
    }
    html += `<div class="btn-row"><button class="btn" data-act="moveb" data-b="${b.id}">Move it</button><button class="btn" data-act="showb" data-b="${b.id}">Show in the village</button></div>`;
    return html;
  }

  // ---------- placement bar ----------
  function beginPlacing(type, movingId) {
    closePanel();
    document.body.classList.add('placing');
    const nm = TOF.DECOR[type] ? TOF.DECOR[type].name : bName(type);
    $('#placeTitle').textContent = movingId ? `Move the ${nm}` : `Place the ${nm}`;
    $('#placeOk').textContent = movingId ? 'Move here' : TOF.DECOR[type] ? 'Put it here' : 'Build here';
    World.startPlacing(type, movingId);
  }
  function onPlaceChange(p) {
    $('#placeHint').textContent = p.reason || 'Looks good. Tap elsewhere to move it.';
    $('#placeHint').classList.toggle('bad', !!p.reason);
    $('#placeOk').disabled = !!p.reason;
  }
  function endPlacing() { World.stopPlacing(); document.body.classList.remove('placing'); }

  // ---------- shipwright ----------
  function costText(state, cost) {
    return Object.entries(cost).map(([k, v]) => `<span class="cost-item ${state.resources[k] >= v ? '' : 'short'}">${icon(k, 'tiny')} ${v}</span>`).join(' ');
  }
  // "Where do I get that?" for anything a card is short of.
  function hints(state, cost) {
    if (!cost) return '';
    const short = Object.entries(cost).filter(([k, v]) => (state.resources[k] || 0) < v && TOF.SOURCES[k] && k !== 'coins');
    return short.length ? `<ul class="hints">${short.map(([k]) => `<li>${icon(k, 'tiny')} <b>${TOF.RESOURCES[k].name}:</b> ${esc(TOF.SOURCES[k])}</li>`).join('')}</ul>` : '';
  }
  function missingText(state, cost) {
    return Object.entries(cost).filter(([k, v]) => state.resources[k] < v).map(([k, v]) => `${v - state.resources[k]} more ${k === 'coins' ? 'coins' : resName(k)}`).join(' and ');
  }
  function renderShipwright(state, now) {
    const tabs = `<div class="seg" role="tablist"><button role="tab" aria-selected="${ui.swTab === 'build'}" data-act="swtab" data-tab="build">Build ships</button><button role="tab" aria-selected="${ui.swTab === 'upgrade'}" data-act="swtab" data-tab="upgrade">Upgrades</button></div>`;
    return tabs + (ui.swTab === 'build' ? renderBuild(state) : renderUpgrades(state, now));
  }
  // "Best at X" for specialists; all-rounders list every trip type they're nearly as good at.
  function roleLine(cls) {
    const c = TOF.SHIP_CLASSES[cls], st = TOF.shipStats({ cls, upgrades: {} }), main = TOF.typePower(st, c.role);
    const also = Object.keys(TOF.TYPES).filter(t => t !== c.role && TOF.typePower(st, t) >= main * 0.7);

    return `${icon(TYPE_ICON[c.role], 'tiny')} ${also.length ? `Good at ${[c.role, ...also].map(nm).join(also.length > 1 ? ', ' : ' and ').replace(/, ([^,]*)$/, ' and $1')}` : `Best at ${nm(c.role)}`}`;
  }
  function renderBuild(state) {

        <p class="role">${roleLine(cls)}</p>

  function renderUpgrades(state, now) {
    if (!ui.swShip || !TOF.getShip(state, ui.swShip)) ui.swShip = state.ships[0].id;

    let html = `<div class="ship-pick" data-keep-scroll="swships">${state.ships.map(s => `<button data-act="swship" data-ship="${s.id}" aria-pressed="${s.id === ship.id}">${shipImg(s.cls)}<span>${esc(s.name)}</span></button>`).join('')}</div>
      <article class="card"><header class="ship-head">${shipImg(ship.cls, 'big')}<div><h3>${esc(ship.name)}</h3><p>${st.name}</p></div></header>${statGrid(st)}</article>`;
    if (atSea) html += `<p class="warn">${esc(ship.name)} is at sea. Upgrades are fitted when she’s back in harbor.</p>`;
    for (const key of TOF.UPGRADE_KEYS) {
      const u = TOF.UPGRADES[key], lvl = ship.upgrades[key], cost = TOF.upgradeCost(ship, key);

          <button class="btn small ${afford && !atSea ? 'primary' : ''}" data-act="upgrade" data-ship="${ship.id}" data-key="${key}" ${afford && !atSea ? '' : 'disabled'}>Fit level ${lvl + 1}</button></div>${afford ? '' : hints(state, cost)}`}</div>`;

    return html;
  }

  // ---------- sea chart ----------
  function regionPerks(Rg) {
    const out = [];
    for (const [k, v] of Object.entries(Rg.yield || {})) out.push(k === 'all' ? `everything pays +${Math.round((v - 1) * 100)}%` : `${TOF.TYPES[k].name.toLowerCase()} pays +${Math.round((v - 1) * 100)}%`);
    if (Rg.raw) out.push('double timber and hemp');
    if (Rg.ore) out.push('far more iron ore');
    if (Rg.chest) out.push(`chests turn up ${Rg.chest}× as often`);
    if (Rg.moonfish) out.push('moonfish in the nets');
    if (Rg.ghosts) out.push('ghost ships (magic beats cannons)');
    if (Rg.monsters) out.push('sea monsters');
    if (Rg.curse) out.push('cursed wrecks');
    return out;
  }
  function renderMap(state) {
    const sel = TOF.REGIONS[ui.mapSel] ? ui.mapSel : 'home', Rg = TOF.REGIONS[sel], known = state.regions.includes(sel);
    let html = `<div class="chartwrap"><canvas id="chart" aria-label="Sea chart. Tap a region."></canvas></div>
      <div class="legend"><span><i class="z-near"></i>Near waters</span><span><i class="z-outer"></i>Outer waters</span><span><i class="z-far"></i>Far seas</span></div>`;
    const perks = regionPerks(Rg);
    const lock = known ? null : TOF.regionLock(state, sel);
    html += `<article class="card"><header class="ship-head"><div><h3>${known ? esc(Rg.name) : 'Uncharted waters'}</h3><p><i class="zdot z-${RING_CLASS[Rg.ring]}"></i>${RING[Rg.ring]}${Rg.ring ? `, trips take ${Math.round((Rg.dist - 1) * 100)}% longer, ${Rg.danger >= 1.6 ? 'very dangerous' : Rg.danger > 1.1 ? 'risky' : 'calm'}` : ''}</p></div></header>
      <p class="desc">${known ? esc(Rg.desc) : `Sailors talk about ${esc(Rg.name)}: ${esc(Rg.desc.toLowerCase())}`}</p>
      ${perks.length ? `<p class="desc"><b>Out here:</b> ${perks.join(', ')}.</p>` : ''}
      ${Rg.minExplore ? `<p class="desc">Ships need <b>${Rg.minExplore}</b> exploration to sail here.</p>` : ''}
      ${Rg.landmark ? `<p class="desc">${state.landmarks.includes(sel) ? `${icon('compass', 'tiny')} <b>${esc(Rg.landmark)}</b> found: trips here pay +20%.` : known ? 'Something worth finding is out here. Exploring may reveal it.' : ''}</p>` : ''}
      ${known ? (sel === 'home' ? '' : `<button class="btn primary" data-act="planhere" data-r="${sel}">Send a ship here</button>`)
        : lock ? `<p class="lock">${esc(lock)}</p>` : `<button class="btn ${state.resources.charts >= Rg.cost.charts ? 'primary' : ''}" data-act="reveal" data-r="${sel}" ${state.resources.charts >= Rg.cost.charts ? '' : 'disabled'}>Chart it for ${Rg.cost.charts} sea charts (you have ${state.resources.charts})</button>`}
    </article>`;
    if (state.reports.length) html += `<h3 class="group">Ship’s log</h3><div class="card logbook">${state.reports.slice(0, 8).map(r => `<p><b>${esc(r.ship)}</b>, ${esc(TOF.REGIONS[r.region] ? TOF.REGIONS[r.region].name : '')}: ${r.lines.map(l => esc(l.text)).join(' ')}</p>`).join('')}</div>`;
    const lore = state.lore.kraken;
    if (lore) html += `<h3 class="group">Sightings in the deep</h3><div class="card logbook kraken">${TOF.KRAKEN_HINTS.slice(0, Math.min(lore, TOF.KRAKEN_HINTS.length)).map((h, i) => `<p><b>${i + 1}.</b> ${esc(h)}</p>`).join('')}${lore < TOF.KRAKEN_HINTS.length ? '<p class="note">The farther you sail, the more you’ll hear.</p>' : ''}</div>`;
